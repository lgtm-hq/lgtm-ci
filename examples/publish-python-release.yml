# SPDX-License-Identifier: MIT
# Canonical caller layout for Python tag releases using lgtm-ci reusables.
# Replace every <sha> with a full lgtm-ci commit SHA (not a branch or tag) so
# builds stay reproducible.
# Copy into your repository as .github/workflows/publish-pypi-on-tag.yml (or similar).
# PyPI trusted publishing must reference THIS workflow filename and the upload job.
# Nothing egress-related needs vendoring — reusables carry their allowlist presets
# and harden directly. See examples/README.md and docs/reusable-workflows.md.
# See docs/python-release-publish.md and docs/workflow-contract.md.
---
name: Publish - PyPI Production

"on":
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pypi-build:
    name: Build Python distribution
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml@<sha> # vX.Y.Z
    permissions:
      contents: read
      id-token: write # GitHub build-provenance attestation of dist/*
      attestations: write
    with:
      python-version: "3.12"
      artifact-name: python-dist
      egress-policy: block
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        release-assets.githubusercontent.com:443
        objects.githubusercontent.com:443
        github-releases.githubusercontent.com:443
        raw.githubusercontent.com:443
        astral.sh:443
        releases.astral.sh:443
        pypi.org:443
        files.pythonhosted.org:443

  pypi-upload:
    name: Upload to PyPI
    needs: [pypi-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
