      - name: Verify harden-runner agent
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        # Generated from lgtm-ci's scripts/ci/bootstrap/verify-harden-runner-agent.sh;
        # copy it unchanged (this job has no lgtm-ci tooling checkout).
        shell: bash
        env:
          EGRESS_POLICY: block
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          if [[ -e "$annotations" ]] && grep -q 'subscription is required' "$annotations"; then
            echo "::error title=StepSecurity subscription required::private repository" \
              "without a StepSecurity subscription: the agent downgraded block to audit." \
              "Resolve the repository's StepSecurity subscription or enrollment;" \
              "another runner will not help"
            exit 1
          fi
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Stage packages from release assets
        run: |
          echo "Build/stage one subdirectory per package under ./npm-dist"
          echo '(platform packages first in `order`, meta package last)'
          echo "and the build's SHA256SUMS manifest at ./npm-dist/SHA256SUMS"
      # Jobs have isolated filesystems: hand the staged set to the reusable as
      # a workflow artifact (it downloads `artifact-name` into `packages-dir`).
      - name: Upload staged package set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: npm-dist/
          if-no-files-found: error
          overwrite: true

  # The publish job. It calls a reusable, so it cannot carry `environment:`
  # (GitHub rejects the key on `uses:` jobs); the `environment` input below
  # binds the reusable's job instead.
  npm-release:
    name: Release npm package set
    needs: [npm-publish-set]
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-npm-set.yml@<sha> # vX.Y.Z
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      packages-dir: npm-dist
      artifact-name: npm-dist
      # Platform packages first, meta package last: the meta package's
      # optionalDependencies must exist on the registry first.
      order: '["darwin-arm64", "darwin-x64", "linux-arm64", "linux-x64", "meta"]'
      dist-tag: latest
      dry-run: false
      provenance: true
      access: public
      max-attempts: 3
      # Live publishes require entry-workflows, checksums-file, signer-repo
      # and signer-workflow; the job fails before publishing without them.
      entry-workflows: .github/workflows/publish-npm-set.yml
      # Workspace-relative path to the manifest that shipped inside the
      # artifact; the entries inside it are relative to packages-dir.
      checksums-file: npm-dist/SHA256SUMS
      # Empty ("[]", the default) verifies every file the manifest lists.
      files-to-verify: '["*/package.json", "*/bin/*"]'
      signer-repo: <owner>/<repo>
      signer-workflow: .github/workflows/build-binaries.yml
      post-publish-verify: true
      # Optional approval gate; the trusted publisher must then name it.
      environment: npm

  # Release-mode failure notifier (#964): files or updates ONE deduplicated
  # issue per tag when a publish channel fails after automatic retries, and
  # closes it when every channel succeeds.
  release-failure-notifier:
    name: Report release failure
    needs: [npm-publish-set, npm-release]
    if: always()
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-failure-notifier.yml@<sha> # vX.Y.Z
    with:
      workflow-key: publish-npm-set
      tag: ${{ github.ref_name }}
      channels: ${{ toJson(needs) }}
      max-reruns: 3
    permissions:
      actions: read
      contents: read
      issues: write
