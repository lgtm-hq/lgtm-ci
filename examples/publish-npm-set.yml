          # GitHub plus its results storage for upload-artifact: the
          # productionresultssa<N> hosts are listed exactly, as in
          # publish-python-release.yml (workflow-contract.md § PyPI upload,
          # #1495). Add the hosts your staging step downloads from.
          allowed-endpoints: >
