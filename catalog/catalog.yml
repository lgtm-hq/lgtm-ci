# SPDX-License-Identifier: MIT
# Support-tier catalog of every public reusable workflow and composite action (#1079).
#
# One entry per .github/workflows/reusable-*.yml and .github/actions/*/action.yml.
# Checked by scripts/ci/catalog/validate.py (CI job "Support Catalog"); docs/catalog.md
# and the README index are generated from it: scripts/ci/catalog/render.py --write.
#
# Field rules (enforced by the validator):
#   tier         stable | preview | internal | deprecated
#   reason       one line; required for non-stable tiers, rejected on stable
#   evidence     required for stable: fixture workflow file, the lgtm-ci commit the
#                run was pinned to (an ancestor of this commit) and the green run URL
#   permissions  workflows: exactly the caller-facing union printed by
#                scripts/ci/docs/validate-caller-permissions.py --union <file>;
#                actions: the calling job's GITHUB_TOKEN scopes (a superset of any
#                requirement that validator derives, e.g. detect-changes)
#   runners      workflows: includes every default runner the jobs resolve to
#   check-names  workflows: callee job names with input defaults applied, in job
#                order; GitHub prefixes the caller job name and appends matrix values
#   replacement  deprecated only: id of the entry to migrate to
#   results      optional: the results.v1 document the entry uploads (#1080)
#
# `deprecations` (after the entries, #1082) lists every deprecated input, output
# and entry point; docs/governance.md describes the lifecycle. Each record has:
#   id           kebab-case slug, unique; records sorted by id
#   kind         input | output | entry
#   name         the input or output retired (not on `entry`)
#   entries      sorted catalog ids that still expose it; drop an id in the PR
#                that removes the item, which is what the removal gate checks
#   since        X.Y.Z release that first marked it deprecated
#   issue        lgtm-ci issue tracking the deprecation
#   replacement  one-line migration instruction
# The validator requires the item's description to say it is deprecated, and
# every input or output whose description says "deprecated" or "inert" (and
# every `deprecated`-tier entry) to be covered by a record.
---
