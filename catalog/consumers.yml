# SPDX-License-Identifier: MIT
# Known-consumer registry (#1082, docs/governance.md#known-consumers).
#
# Every repository outside lgtm-ci that calls its reusable workflows or
# composite actions and that lgtm-ci commits to keeping working. The removal
# gate reads this file: an input, output or entry point leaves lgtm-ci only
# once no consumer listed here uses it (or an exception in
# deprecation-exceptions.yml approves it).
#
# Rows are refreshed from each repository's default branch, never edited by
# hand except to add or drop a repository or a tracking issue:
#   scripts/ci/catalog/check-deprecations.sh scan --write
#
#   repository         owner/name
#   tracking-issues    open lgtm-ci issues migrating this consumer (may be empty)
#   last-verified      date of the scan that produced the row
#   pins               lgtm-ci refs the default branch uses; anything but a
#                      40-character SHA is a floating ref and gets a NOTICE
#   uses               catalog entry ids it calls
#   deprecated-in-use  removal keys (<entry>:input:<name>, <entry>:output:<name>,
#                      <entry>:entry) of deprecated items it still uses
---
