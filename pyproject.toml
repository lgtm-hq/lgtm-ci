[project]
name = "lgtm-ci"
# Dev-manifest placeholder — release version is tracked in CHANGELOG.md and git tags.
version = "0.0.0"
description = "Reusable CI/CD components for GitHub Actions - composite actions, reusable workflows, and shell utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LGTM HQ", email = "lgtm-hq@users.noreply.github.com" }]
keywords = ["ci", "cd", "github-actions", "automation", "devops"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/lgtm-hq/lgtm-ci"
Repository = "https://github.com/lgtm-hq/lgtm-ci"
Issues = "https://github.com/lgtm-hq/lgtm-ci/issues"

[project.optional-dependencies]
dev = [
  # Keep in sync with LINTRO_IMAGE digest in reusable-quality-lint.yml / reusable-security-audit.yml / run-quality action
  "lintro==0.180.14",
  "ruff>=0.14.0",
  "black>=25.0.0",
  "tomli-w>=1.0.0",
  # Invoked by lintro from the project venv, so they must be locked here.
  "yamllint>=1.37.1",
  "bandit>=1.9.4",
  "mypy>=1.19.1",
]
# pytest suite for the standalone scripts under scripts/ci (tests/python).
# Separate from `dev` so CI installs only this; locally use
# `uv sync --extra dev --extra test`.
test = [
  "pytest>=8.4.0",
  # Locked so ci.yml's python-tests coverage floor is reproducible; the
  # subprocess patch in [tool.coverage.run] needs coverage>=7.10.
  "pytest-cov>=7.0.0",
  "assertpy>=1.1",
  "pyyaml>=6.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.coverage.run]
# Measure the scripts under test, not the tests (#1450). conftest.py loads the
# hyphenated scripts by path through importlib; coverage matches on the file
# path, so those count. Unimported scripts outside a package are not listed.
source = ["scripts/ci"]
branch = true
# Several tests run a script as a child process; measure those runs too.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

[tool.lintro]
config_file = ".lintro-config.yaml"

[tool.pylint.main]
# Lintro's Docker image runs Pylint outside /app/.venv, where its application
# dependencies (including pytest) live. Expose only that existing, same-minor
# directory to Pylint analysis in Docker; do not process .pth files or alter PATH.
init-hook = '''
import sys
from pathlib import Path
packages = Path(f"/app/.venv/lib/python{sys.version_info.major}.{sys.version_info.minor}/site-packages")
if Path("/.dockerenv").is_file() and packages.is_dir():
    sys.path.append(str(packages))
'''

[tool.pylint.typecheck]
# assertpy lives only in the `test` extra; the quality job lints inside the
# pinned py-lintro container without syncing project extras.
ignored-modules = ["assertpy"]

[tool.lintro.dotenv_linter]
# scripts/ci/versions.env is a bash-sourced pin file with a Renovate-facing
# grammar (#1096); dotenv-linter's key-ordering and quoting fixes would rewrite
# it into something neither bash nor Renovate can read.
exclude = ["scripts/ci/versions.env"]

[tool.lintro.pylint]
# Ratchet for pylint's duplicate-code checker (R0801). The baseline is zero:
# shared code among the standalone scripts under scripts/ci must live in
# scripts/ci/lib/ instead of being cloned. If a new clone appears, extract it.
duplicate_code_baseline = 0

[tool.ruff]
line-length = 88
target-version = "py311"
unsafe-fixes = false
exclude = [".venv", "venv", "env", "build", "dist", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.bandit]
exclude_dirs = [".venv", "venv", "env", "build", "dist", "tests"]
skips = [
  "B101", # assert_used - assertions expected in tests
  "B404", # import_subprocess - needed to test shell scripts
  "B603", # subprocess_without_shell_equals_true - testing controlled input
  "B607", # start_process_with_partial_path - using standard executables
  "B108", # hardcoded_tmp_directory - mocking GitHub env vars
]
