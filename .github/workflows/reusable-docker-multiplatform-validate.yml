---
name: Reusable Docker Build (multi-platform, validate)

# Read-only entry point of the split multi-arch path (#1081): per-platform
# native builds on runner-map runners without pushing, optional local smoke
# test, health check and Trivy scan, and the validation summary. The caller
# grants contents: read only; nothing is pushed, signed, attested or uploaded
# to code scanning. The Trivy SARIF is kept as the artifact
# trivy-sarif-<slug>.
#
# reusable-docker-multiplatform.yml calls this file when push is false and
# uploads that SARIF to code scanning from a separate job. The push path,
# with its packages, id-token, attestations and security-events write scopes,
# lives in reusable-docker-multiplatform-publish.yml. Callers pass the
# classify matrix from reusable-docker.yml, or their own, in `matrix`.

on:
  workflow_call:
    inputs:
      matrix:
        description: >-
          Per-platform build matrix (JSON array) produced by the classify job
          in the orchestrator. Each entry carries platform, slug, runner, qemu.
        required: true
        type: string
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      file:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        description: "Target platforms (comma-separated, for the summary)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      registry:
        description: "Container registry URL"
        required: false
        type: string
        default: "ghcr.io"
      image-name:
        description: "Image name (default: github.repository)"
        required: false
        type: string
        default: ""
      version:
        description: "Version for the image's OCI labels (nothing is tagged or pushed)"
        required: false
        type: string
        default: ""
      source-ref:
        description: >-
          Git ref to check out for the build context (app source), independent
          of tooling-ref. Empty uses the triggering ref.
        required: false
        type: string
        default: ""
      tag-latest:
        description: >-
          Also apply the 'latest' tag when version is set. Set false for
          historical backfills so republishing an old version does not move
          'latest' backward.
        required: false
        type: boolean
        default: true
      exact-tags:
        description: >-
          Publish ONLY the pinned version tag (and its immutable by-digest
          sha), suppressing major/minor/latest/branch/sha-<ref> floating tags.
        required: false
        type: boolean
        default: false
      scan:
        description: "Run vulnerability scan"
        required: false
        type: boolean
        default: false
      build-args:
        description: "Build arguments (comma-separated key=value)"
        required: false
        type: string
        default: ""
      target:
        description: "Docker build target stage (e.g. 'full', 'base')"
        required: false
        type: string
        default: ""
      smoke-test:
        description: >-
          Shorthand command + args to run inside each per-platform image
          (with validate-on-pr). Word-split; values with spaces need
          smoke-test-script.
          Mutually exclusive with smoke-test-script.
        required: false
        type: string
        default: ""
      smoke-test-script:
        description: >-
          Path (relative to checkout root) to a caller-owned smoke-test script.
          Mutually exclusive with smoke-test.
        required: false
        type: string
        default: ""
      health-check-cmd:
        description: >-
          Optional command run on the runner against each per-platform
          image's published localhost port (with validate-on-pr). Requires
          health-check-port.
        required: false
        type: string
        default: ""
      health-check-port:
        description: "Container port to publish for the health check."
        required: false
        type: string
        default: ""
      health-check-timeout:
        description: "Max wait for health-check-port to accept connections."
        required: false
        type: string
        default: "30s"
      validate-on-pr:
        description: >-
          Load each per-platform image locally, run the smoke test and
          health check against it and write the validation summary. False
          builds only (no load unless scan or health-check-cmd is set).
        required: false
        type: boolean
        default: false
      scan-exit-code:
        description: >-
          Exit code for Trivy when findings match severity filter. "1" fails on
          CRITICAL/HIGH; "0" is advisory-only SARIF upload.
        required: false
        type: string
        default: "0"
      cache-registry-ref:
        description: >-
          Registry reference for cache fallback. Per-platform scope is appended
          automatically (-amd64, -arm64). GHA cache remains primary.
        required: false
        type: string
        default: ""
      no-cache:
        description: >-
          Disable build cache entirely. When true, cache-from and cache-to are
          omitted.
        required: false
        type: boolean
        default: false
      free-disk-space:
        description: >-
          Reclaim unused ubuntu-24.04 amd64 toolchains before the build
          (dotnet, Android SDK, ghc, PowerShell, unused toolcache). No-op
          when those paths are absent (e.g. ubuntu-24.04-arm). Runs only
          on github-hosted runners.
        required: false
        type: boolean
        default: false
      resource-monitor:
        description: >-
          Background a 30s memory/disk sampler that tees [resource-monitor]
          lines into the live job log and $RUNNER_TEMP. Dump the tail at
          job end when the runner survives. Start is best-effort and does
          not fail the build.
        required: false
        type: boolean
        default: false
      tooling-ref:
        # yamllint disable-line rule:line-length
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default docker). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "docker"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 60


