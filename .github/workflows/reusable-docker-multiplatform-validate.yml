  # lgtm-ci-egress-presets:end

jobs:
  # Per-platform native build leg. One matrix entry per platform; runner and
  # QEMU config resolved by the orchestrator's classify job.
  build-per-platform:
    name: Docker build per platform
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # source-ref = build-context (app source); tooling-ref stays separate
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Free disk space
        if: inputs.free-disk-space && runner.environment == 'github-hosted'
        shell: bash
        run: .lgtm-ci-tooling/scripts/ci/docker/free-disk-space.sh
      - name: Start resource monitor
        if: inputs.resource-monitor
        continue-on-error: true
        shell: bash
        run: .lgtm-ci-tooling/scripts/ci/actions/resource-monitor.sh start
      - name: Setup QEMU
        if: ${{ matrix.qemu }}
        # Pinned to SHA for supply chain security
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Setup Docker Buildx
        # Pinned to SHA for supply chain security
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Extract metadata
        id: meta
        # Pinned to SHA for supply chain security
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ inputs.registry }}/${{ inputs.image-name || github.repository }}
          # Disable metadata-action's auto 'latest': the tag is controlled only
          # by the gated raw entry below, so backfills never move latest.
          flavor: |
            latest=false
          # exact-tags (backfill): suppress every floating tag (sha-<ref>,
          # branch, pr, major, minor, latest); publish only the pinned version
          # tag (its immutable by-digest sha is inherent to the pushed image).
          # yamllint disable rule:line-length
          tags: |
            type=sha,prefix=sha-,enable=${{ !inputs.exact-tags }}
            type=ref,event=branch,enable=${{ !inputs.exact-tags }}
            type=ref,event=pr,enable=${{ !inputs.exact-tags }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !inputs.exact-tags }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !inputs.exact-tags }}
            type=raw,value=latest,enable=${{ inputs.version != '' && inputs.tag-latest && !inputs.exact-tags }}
          # yamllint enable rule:line-length
      - name: Build and push (${{ matrix.platform }})
        id: build
        # Pinned to SHA for supply chain security
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ matrix.platform }}
          push: false
          load: >-
            ${{ inputs.health-check-cmd != '' || inputs.validate-on-pr || inputs.scan }}
          # yamllint disable rule:line-length
          tags: >-
            ${{ format('{0}/{1}:validate-{2}', inputs.registry, inputs.image-name || github.repository, matrix.slug) }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          target: ${{ inputs.target }}
          cache-from: |
            ${{ inputs.no-cache == false && format('type=gha,scope={0}', matrix.slug) || '' }}
            ${{ inputs.no-cache == false && inputs.cache-registry-ref != '' && format('type=registry,ref={0}-{1}', inputs.cache-registry-ref, matrix.slug) || '' }}
          cache-to: |
            ${{ inputs.no-cache == false && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.slug) || '' }}
          # yamllint enable rule:line-length
          # Nothing is pushed, so there is no provenance or SBOM to attach.
          provenance: false
          sbom: false
      - name: Summarize blocked egress
        if: ${{ failure() }}
        shell: bash
        env:
          STEP: summarize-blocked-egress
          BUILD_LOG: ${{ runner.temp }}/docker-build.log
        run: .lgtm-ci-tooling/scripts/ci/actions/build-docker.sh
      - name: Smoke test (${{ matrix.platform }})
        if: >-
          inputs.validate-on-pr &&
          (inputs.smoke-test != '' || inputs.smoke-test-script != '')
        shell: bash
        env:
          STEP: smoke-test-local
          REGISTRY: ${{ inputs.registry }}
          IMAGE: >-
            ${{ inputs.registry }}/${{ inputs.image-name || github.repository }}:validate-${{
            matrix.slug }}
          PLATFORM: ${{ matrix.platform }}
          SMOKE_TEST: ${{ inputs.smoke-test }}
          SMOKE_TEST_SCRIPT: ${{ inputs.smoke-test-script }}
        run: .lgtm-ci-tooling/scripts/ci/actions/build-docker.sh
      - name: Health check (${{ matrix.platform }})
        if: >-
          inputs.validate-on-pr &&
          inputs.health-check-cmd != ''
        shell: bash
        env:
          STEP: health-check-local
          IMAGE: >-
            ${{ inputs.registry }}/${{ inputs.image-name || github.repository }}:validate-${{
            matrix.slug }}
          PLATFORM: ${{ matrix.platform }}
          HEALTH_CHECK_CMD: ${{ inputs.health-check-cmd }}
          HEALTH_CHECK_PORT: ${{ inputs.health-check-port }}
          HEALTH_CHECK_TIMEOUT: ${{ inputs.health-check-timeout }}
        run: .lgtm-ci-tooling/scripts/ci/actions/build-docker.sh
      - name: Run Trivy vulnerability scanner (${{ matrix.platform }})
        id: trivy
        if: inputs.scan
        # Pinned to SHA for supply chain security
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: >-
            ${{ inputs.registry }}/${{ inputs.image-name || github.repository }}:validate-${{
            matrix.slug }}
          format: "sarif"
          output: "trivy-results-${{ matrix.slug }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: ${{ inputs.scan-exit-code }}
      # Code-scanning upload needs security-events: write, so the SARIF
      # leaves this read-only job as an artifact. reusable-docker-multiplatform.yml
      # uploads it to code scanning from its own job; a direct caller may do
      # the same or just keep the artifact.
      - name: Upload Trivy SARIF artifact (${{ matrix.platform }})
        if: always() && inputs.scan && steps.trivy.outcome != 'skipped'
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sarif-${{ matrix.slug }}
          path: trivy-results-${{ matrix.slug }}.sarif
          if-no-files-found: warn
          retention-days: 1
          overwrite: true
      - name: Dump resource monitor
        if: always() && inputs.resource-monitor
        shell: bash
        run: .lgtm-ci-tooling/scripts/ci/actions/resource-monitor.sh dump
  summary-validate:
    name: Validation Summary
    needs: build-per-platform
    if: >-
      always() &&
      inputs.validate-on-pr
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # source-ref = build-context (app source); tooling-ref stays separate
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Build summary
        if: always()
        shell: bash
        env:
          STEP: summary
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name || github.repository }}
          PLATFORMS: ${{ inputs.platforms }}
          PUSH: false
          SCAN_ENABLED: ${{ inputs.scan }}
          VALIDATE_ON_PR: true
          HEALTH_CHECK_ENABLED: ${{ inputs.health-check-cmd != '' }}
          MATRIX: ${{ inputs.matrix }}
        run: .lgtm-ci-tooling/scripts/ci/actions/build-docker.sh
