---
name: Reusable Node.js Test Publish Workflow

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory for published results"
        required: false
        type: string
        default: "."
      coverage-percent:
        description: "Coverage percentage for badge generation"
        required: false
        type: string
        default: "0"
      upload-coverage:
        description: "Whether coverage artifacts were uploaded by the test workflow"
        required: false
        type: boolean
        default: true
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-pages). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-pages"
      job-name:
        description: "GitHub check name for the publish job"
        required: false
        type: string
        default: "Publish Results"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 30

# Shared Pages concurrency serializes deploys per repository/ref.
# WARNING: Do not invoke this workflow alongside reusable-test-python-publish
# on the same event unless subtrees are combined in one publish job or each job
# uses publish-test-results merge-existing-site: true (Model A fallback, #225).
# Without merge, each deploy replaces the entire site and the last queued job
# wins. Monorepos needing a site plus multiple report subtrees on one Pages
# origin should prefer reusable-deploy-site-with-reports (Model B, #226).
# See docs/pages-publishing.md.
concurrency:
  group: pages-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

