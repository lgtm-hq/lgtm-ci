---
name: Reusable Link Check

on:
  workflow_call:
    inputs:
      paths:
        description: "Comma-separated files or directories to scan"
        required: false
        type: string
        default: "."
      file-extensions:
        description: "File extensions to scan, comma-separated"
        required: false
        type: string
        default: "md,html"
      exclude-patterns:
        description: "Comma-separated path or URL patterns to exclude"
        required: false
        type: string
        default: ""
      check-external:
        description: >-
          Check external HTTP(S) links. With egress-policy block, set
          allowed-endpoints for target sites (egress-preset github-tooling is
          GitHub-only).
        required: false
        type: boolean
        default: true
      timeout:
        description: "HTTP timeout in seconds"
        required: false
        type: string
        default: "10"
      fail-on-error:
        description: "Fail workflow if broken links are found"
        required: false
        type: boolean
        default: true
      publish-link-check-report:
        description: "Publish broken-link report on the pull request"
        required: false
        type: boolean
        default: false
      link-report-artifact-name:
        description: >-
          Artifact name for the uploaded lychee report. Override when a caller
          runs this workflow more than once in a single run, so the sibling
          calls do not collide on one artifact name.
        required: false
        type: string
        default: "lychee-report"
      working-directory:
        description: "Working directory for link checking"
        required: false
        type: string
        default: "."
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"
      job-name:
        description: "GitHub check name for the link check job"
        required: false
        type: string
        default: "Link Check"
      comment-marker:
        description: "Upsert marker for the link-check report comment"
        required: false
        type: string
        default: "lychee-report"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 15

