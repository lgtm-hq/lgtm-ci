  # lgtm-ci-egress-presets:end

jobs:
  link-check:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Build Lychee arguments
        id: args
        shell: bash
        env:
          PATHS: ${{ inputs.paths }}
          FILE_EXTENSIONS: ${{ inputs.file-extensions }}
          EXCLUDE_PATTERNS: ${{ inputs.exclude-patterns }}
          CHECK_EXTERNAL: ${{ inputs.check-external }}
          TIMEOUT: ${{ inputs.timeout }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/build-lychee-args.sh
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ steps.args.outputs.args }}
          # lychee-action v2.9+ errors if --output is also in args.
          output: lychee-report.md
          token: ${{ github.token }}
          fail: ${{ inputs.fail-on-error }}
      # The report is a convenience payload for the PR comment, never the
      # link-check verdict — `fail-on-error` on the lychee step owns that. The
      # publisher already treats a missing artifact as a warning, so a storage
      # hiccup must not redden a job whose links are fine.
      - name: Upload link report
        id: upload-report
        if: >-
          always()
          && inputs.publish-link-check-report
          && hashFiles('lychee-report.md') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.link-report-artifact-name }}
          path: lychee-report.md
          retention-days: 1
          if-no-files-found: ignore
          # A caller may run this workflow twice in one run; without overwrite
          # the second upload 409s and the publisher resolves the first
          # attempt's report. The latest attempt is authoritative.
          overwrite: true
      - name: Warn on failed report upload
        if: always() && steps.upload-report.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Link report upload failed; the link-check result is unaffected."
  publish-link-check-report:
    name: Publish link-check report
    needs: link-check
    if: >-
      always()
      && inputs.publish-link-check-report
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-publish-artifact-report.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      artifact-name: ${{ inputs.link-report-artifact-name }}
      report-file: lychee-report.md
      marker: ${{ inputs.comment-marker }}
      job-name: Publish link-check report
      missing-artifact-warning: >-
        ${{ format('{0} artifact not found — link check may not have produced
        output', inputs.link-report-artifact-name) }}
      tooling-ref: ${{ inputs.tooling-ref }}
