---
name: PR - Semantic Title

'on':
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

# No concurrency group: every event gets its own run that is never cancelled.
# A bot that pushes and then edits the PR body fires synchronize and edited
# back to back; cancel-in-progress cancelled the first run, and even
# cancel-in-progress: false cancels a superseded pending run. Either way a
# cancelled check stayed on the head commit. Overlapping runs are safe here:
# the semantic step reads the current title from the API, not the event.

jobs:
  semantic-title:
    uses: ./.github/workflows/reusable-semantic-pr-title.yml
    with:
      job-name: "📝 Validate PR Title"
      egress-preset: github-minimal
    permissions:
      contents: read
      # reusable posts/clears marker-based failure comments on the pull request
      pull-requests: write
