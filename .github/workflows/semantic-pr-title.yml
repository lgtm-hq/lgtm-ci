---
name: PR - Semantic Title

'on':
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

# No concurrency group, so no event can cancel or replace another event's
# run. A bot that pushes and then edits the PR body fires synchronize and
# edited back to back; with cancel-in-progress the edited run cancelled the
# synchronize run and left a cancelled check on the head commit, and
# cancel-in-progress: false would still cancel a superseded pending run.
# Overlapping runs validate the title current when each one fetches it from
# the API. A run that fetched an older invalid title can still finish last
# and leave its failure check and comment until the next event. Keep
# max-length unset: the length step reads the possibly stale event payload.

jobs:
  semantic-title:
    uses: ./.github/workflows/reusable-semantic-pr-title.yml
    with:
      job-name: "📝 Validate PR Title"
      egress-preset: github-minimal
    permissions:
      contents: read
      # reusable posts/clears marker-based failure comments on the pull request
      pull-requests: write
