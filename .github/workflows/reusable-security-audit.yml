---
name: Reusable Security Audit Workflow

on:
  workflow_call:
    inputs:
      job-name:
        description: "GitHub check run name for the audit job"
        required: false
        type: string
        default: "Security Audit"
      lintro-image:
        description: "Pinned ghcr.io/lgtm-hq/py-lintro image (digest strongly recommended)"
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: "ghcr.io/lgtm-hq/py-lintro@sha256:f7c3b4a5f9447ce12879c4b92f3ec7097aa480c925a44a04bc5358dfd70237ed"
      audit-script:
        description: >-
          Path to security audit script (repo checkout or tooling checkout).
          Defaults to tooling run-lintro-audit.sh.
        required: false
        type: string
        default: ".lgtm-ci-tooling/scripts/ci/security/run-lintro-audit.sh"
      fail-script:
        description: "Path to explicit fail step script after continue-on-error audit"
        required: false
        type: string
        default: ".lgtm-ci-tooling/scripts/ci/security/fail-audit.sh"
      working-directory:
        description: "Working directory for the audit scan"
        required: false
        type: string
        default: "."
      comment-file:
        description: "PR comment artifact path relative to working-directory"
        required: false
        type: string
        default: "security-audit-comment.txt"
      artifact-name:
        description: "Uploaded artifact name for the PR comment file"
        required: false
        type: string
        default: "security-audit-comment"
      upload-comment-artifact:
        description: "Upload comment artifact on pull_request for downstream publish job"
        required: false
        type: boolean
        default: true
      results-artifact-name:
        description: >-
          Artifact name for the results.v1 document (#1080) the audit writes
          (findings under counts.failed). Override when a caller runs this
          workflow more than once in a single run.
        required: false
        type: string
        default: "security-audit-results"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default quality). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "quality"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes for the audit job"
        required: false
        type: number
        default: 15

    outputs:
      exit-code:
        description: "Exit code from the security audit script"
        value: ${{ jobs.security-audit.outputs.exit-code }}
      has-vulns:
        description: "Whether vulnerabilities were found"
        value: ${{ jobs.security-audit.outputs.has-vulns }}
      audit-failed:
        description: "Whether the audit tool/scan failed"
        value: ${{ jobs.security-audit.outputs.audit-failed }}
      status:
        description: "passed or failed"
        value: ${{ jobs.security-audit.outputs.status }}

