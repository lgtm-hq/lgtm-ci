  # lgtm-ci-egress-presets:end

jobs:
  security-audit:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read
    outputs:
      exit-code: ${{ steps.audit.outputs.exit-code }}
      has-vulns: ${{ steps.audit.outputs.has-vulns }}
      audit-failed: ${{ steps.audit.outputs.audit-failed }}
      status: ${{ steps.audit.outputs.status }}

    env:
      LINTRO_IMAGE: ${{ inputs.lintro-image }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run security audit
        id: audit
        continue-on-error: true
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          WORKSPACE: ${{ github.workspace }}/${{ inputs.working-directory }}
          COMMENT_FILE: ${{ inputs.comment-file }}
          AUDIT_SCRIPT: ${{ inputs.audit-script }}
          RESULTS_SOURCE_VERSION: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
        run: bash "$GITHUB_WORKSPACE/$AUDIT_SCRIPT"
      # results/security-audit/default/results.json (results.v1, #1080):
      # the audit verdict in the same shape every test runner uses.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.results-artifact-name }}
          path: ${{ inputs.working-directory }}/results/security-audit/default/results.json
          retention-days: 7
          # Absent only when the audit script stopped before scanning (image
          # pull failure); the explicit fail step below owns that verdict.
          if-no-files-found: warn
          overwrite: true
      # Convenience payload for the PR comment, never the audit verdict — the
      # "Fail on vulnerabilities" step below owns that, and the publisher
      # already warns instead of failing when the artifact is missing.
      - name: Upload comment artifact
        id: upload-comment
        if: >-
          always()
          && inputs.upload-comment-artifact
          && github.event_name == 'pull_request'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.comment-file }}
          if-no-files-found: warn
          # A caller may run this workflow twice in one run; the later
          # attempt's report is authoritative.
          overwrite: true
      - name: Warn on failed comment upload
        if: always() && steps.upload-comment.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Audit comment upload failed; the audit result is unaffected."
      - name: Fail on vulnerabilities
        if: steps.audit.outcome == 'failure'
        shell: bash
        env:
          FAIL_SCRIPT: ${{ inputs.fail-script }}
        run: bash "$GITHUB_WORKSPACE/$FAIL_SCRIPT"
