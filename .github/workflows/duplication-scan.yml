name: Maintenance - Cross-repository Duplication Scan

'on':
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report candidates without changing issues
        type: boolean
        default: true

permissions: {}

concurrency:
  group: duplication-scan
  cancel-in-progress: false

