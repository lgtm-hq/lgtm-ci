---
# Compares GitHub's Actions results storage hosts in GET /meta
# (.domains.actions) with egress_github_results_storage_endpoints in
# scripts/ci/lib/egress/presets.sh, which the github-results, npm-publish and
# release-recover presets allow by exact host (#1495). A difference opens or
# updates one tracking issue and fails the run; a match closes that issue.
# The logic lives in scripts/ci/maintenance/results-hosts-drift.sh (#1498).
name: Maintenance - Results Storage Hosts Drift

'on':
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: results-hosts-drift
  cancel-in-progress: false

env:
  # Dedicated preset: checkout over github.com, /meta and the tracking issue
  # over api.github.com. None of the results storage hosts it compares.
  # Generated from scripts/ci/lib/egress/presets.sh.
  # lgtm-ci-egress-presets:begin
