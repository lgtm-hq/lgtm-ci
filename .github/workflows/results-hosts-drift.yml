  # lgtm-ci-egress-presets:end

jobs:
  results-hosts-drift:
    name: Compare results storage hosts with /meta
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      # Check out the comparison script and the egress presets
      contents: read
      # Open, update or close the tracking issue
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: ${{ fromJSON(env.LGTM_CI_EGRESS_PRESETS)['results-hosts-drift'] }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare hosts and reconcile the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/maintenance/results-hosts-drift.sh
