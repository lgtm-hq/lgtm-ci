---
name: Reusable Release Recovery

# Resume a partially published release against the ORIGINAL immutable tag and
# the ORIGINAL attested artifacts (#966). Never rebuilds: every resume job
# consumes artifacts downloaded from the source run, verified against their
# checksums manifest and provenance attestations before use, and only
# publishes channels the detection stage proved missing.
#
# The recovery runs the DEFAULT-BRANCH workflow code, never the tagged
# commit's: the consumer dispatches it from its default branch and pins the
# lgtm-ci tooling with the required `tooling-ref` (the same SHA as its
# `uses:` line) — nothing here checks out `inputs.tag`. That is what lets a
# workflow defect fixed on main repair a release that was cut before the
# fix. (github.workflow_sha is deliberately not used: inside a called
# workflow it names the caller's commit, which lgtm-hq/lgtm-ci cannot
# check out. Other reusables now fall back to job.workflow_sha (#995);
# recovery keeps the explicit pin so an operator can run newer tooling
# against an older release deliberately.)
#
# Since #1081 this file is a facade over two stages with their own permission
# blocks: reusable-release-recover-plan.yml (read-only; callable directly for a
# dry run) and the internal reusable-release-recover-resume.yml. Nesting adds
# `Plan / ` or `Resume / ` to the check names.
#
# Stage layout (see docs/release-recovery.md for the runbook):
#   plan     — tag gate (prerelease refusal; the source run must be this
#              repository's publish workflow and must have built the tag's
#              commit — read from the API, never trusted from inputs), artifact
#              download + verification (manifest, attestation, and equality
#              with any already-published GitHub Release asset), channel
#              detection, summary table. `dry-run: true` (default) stops here.
#   resume-* — one job per channel, gated on membership in the missing set;
#              channels that are already complete are skipped, not re-run.
#              npm resumes through the SAME scripts reusable-publish-npm-set.yml
#              (#965) runs, under the same live preconditions; the GitHub
#              Release resume goes through create-github-release.sh with
#              IMMUTABLE_ASSETS so already-published assets are skipped.
#   record   — always(): records the outcome on the release-failure issue the
#              notifier (#964) opened; closes it only when the run was live
#              and every detected-missing channel was resumed (a dry run or
#              an unresumable channel — PyPI, Docker — keeps it open).
#
# Consumers wrap this in a `workflow_dispatch` entry workflow (see
# examples/release-recover.yml); the entry file is what npm trusted
# publishing validates, so the consumer's trusted-publisher registration must
# include it and `npm-entry-workflows` must name it.

"on":
  workflow_call:
    inputs:
      tag:
        description: The release tag to recover (e.g. v1.2.3)
        required: true
        type: string
      source-run-id:
        description: Original publish run whose artifacts are the recovery source
        required: true
        type: string
      source-workflow:
        description: >-
          Path of the publish workflow the source run must belong to (e.g.
          .github/workflows/publish-pypi-on-tag.yml). The run's repository,
          workflow path and head SHA are read from the API and must match
          this repository, this path, and the tag's commit.
        required: true
        type: string
      channels:
        description: >-
          Restrict probing/resume to these channels (JSON array or comma
          list); default auto = every configured channel
        required: false
        type: string
        default: "auto"
      dry-run:
        description: Detect and summarize only; resume nothing
        required: false
        type: boolean
        default: true
      # --- channel configuration (a channel without config is not applicable)
      pypi-package:
        description: PyPI project name for the detection probe (detect only; PyPI cannot be resumed)
        required: false
        type: string
        default: ""
      npm-package:
        description: npm meta package name for the detection probe
        required: false
        type: string
        default: ""
      npm-artifact-name:
        description: >-
          Source-run artifact holding the staged npm package set (the
          artifact publish-npm-set uploaded from its packages directory)
        required: false
        type: string
        default: ""
      npm-packages-dir:
        description: >-
          Directory INSIDE the artifact containing one subdirectory per
          package. "." when the artifact was uploaded from the packages
          directory itself (the examples/publish-npm-set.yml layout).
        required: false
        type: string
        default: "."
      npm-order:
        description: Package order for the npm resume (meta last), as publish-npm-set takes it
        required: false
        type: string
        default: ""
      npm-dist-tag:
        description: Dist-tag for the npm resume
        required: false
        type: string
        default: latest
      npm-checksums-file:
        description: >-
          SHA256SUMS manifest for the npm artifacts, relative to the npm
          packages directory; entries inside it are relative to that
          directory too
        required: false
        type: string
        default: SHA256SUMS
      npm-files-to-verify:
        description: >-
          Additional artifact globs (relative to the packages directory) to
          verify on top of every file npm would pack
        required: false
        type: string
        default: "[]"
      npm-entry-workflows:
        description: >-
          Allowlisted entry workflow path(s) for npm trusted publishing —
          the consumer's recovery dispatch workflow (e.g.
          .github/workflows/release-recover.yml). Required for a live npm
          resume; the guard fails closed without it.
        required: false
        type: string
        default: ""
      npm-access:
        description: >-
          npm access level; must stay public (provenance and post-publish
          verification need a public package)
        required: false
        type: string
        default: public
      npm-provenance:
        description: Pass --provenance on the npm resume (also automatic under OIDC)
        required: false
        type: boolean
        default: true
      release-artifact-name:
        description: Source-run artifact for the GitHub Release resume
        required: false
        type: string
        default: ""
      release-checksums-file:
        description: >-
          SHA256SUMS manifest inside the release artifact (written by
          reusable-build-python-dist.yml); used to verify the downloaded
          assets and to compare them with any already-published asset
        required: false
        type: string
        default: SHA256SUMS
      docker-image:
        description: Fully-qualified image reference for the Docker probe/promote
        required: false
        type: string
        default: ""
      homebrew-tap-repo:
        description: Tap repository (owner/repo) for the Homebrew probe
        required: false
        type: string
        default: ""
      homebrew-tap-formula:
        description: Formula name in the tap
        required: false
        type: string
        default: ""
      homebrew-dispatch-repo:
        description: Repository whose release workflow is re-dispatched when the tap lacks the version
        required: false
        type: string
        default: ""
      homebrew-dispatch-workflow:
        description: Workflow file name (e.g. dispatch-homebrew.yml) to re-dispatch
        required: false
        type: string
        default: ""
      homebrew-dispatch-ref:
        description: Git ref for the re-dispatch (usually the default branch)
        required: false
        type: string
        default: main
      signer-repo:
        description: Repository the artifact attestations must come from (owner/repo)
        required: false
        type: string
        default: ""
      signer-workflow:
        description: >-
          Workflow the artifact attestations must come from: a path inside
          signer-repo (e.g. .github/workflows/build.yml) or fully qualified
        required: false
        type: string
        default: ""
      recovery-issue-workflow-key:
        description: >-
          The notifier workflow-key the release-failure issue was filed
          under, so the recovery outcome lands on that issue
        required: false
        type: string
        default: release-publish
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
          npm trusted publishing and provenance require a GitHub-hosted runner;
          pin runner-image when the org variable selects a self-hosted runner.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: Timeout for the resolve job (the resume jobs keep their own caps)
        required: false
        type: number
        default: 15
      egress-policy:
        description: harden-runner egress policy (block only; audit rejected)
        required: false
        type: string
        default: block
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh.
          Accepted presets: release-recover. Any other name fails (#1623)
          (default release-recover). Selected at job start inside every harden-runner
          step, so it is enforced (#913), except the Homebrew re-dispatch
          and record jobs, which always use github-minimal (#1644).
        required: false
        type: string
        default: "release-recover"
      tooling-ref:
        description: >-
          lgtm-ci commit SHA for the tooling checkout; pin it to the same SHA
          as the `uses:` reference. Kept required here so the tooling an
          operator runs against an older release is an explicit choice
          (other reusables default to job.workflow_sha, #995). Never the
          release tag.
        required: true
        type: string

    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false
      LGTM_CI_TOOLING_APP_CLIENT_ID:
        description: >-
          Optional client ID of a GitHub App installed on the lgtm-ci tooling
          repository only, with contents: read. Together with the App's
          private key, each job mints a short-lived token used only by the
          tooling checkouts, in place of the stored tooling token. Pass both
          App secrets or neither (#1622).
        required: false
      LGTM_CI_TOOLING_APP_PRIVATE_KEY:
        description: >-
          Optional private key of the tooling GitHub App. Pass it together
          with the App's client ID (#1622).
        required: false
      homebrew-dispatch-token:
        description: >-
          Token with `actions: write` on homebrew-dispatch-repo (a GitHub App
          token or fine-grained PAT) for the cross-repository Homebrew
          re-dispatch; github.token cannot dispatch workflows in another
          repository. Required when homebrew-dispatch-repo is set.
        required: false

permissions:
  contents: read


env:
  # Egress presets rendered from scripts/ci/lib/egress/presets.sh by
  # scripts/ci/egress/sync-workflow-presets.sh — do not edit by hand. Every
  # harden-runner step below indexes this map by expression: the
  # step-security pre hook installs the agent before any step runs, so the
  # allowlist must be composed from literals and inputs only (#412/#420/#913).
  # lgtm-ci-egress-accepts: release-recover
  # lgtm-ci-egress-presets:begin
  LGTM_CI_EGRESS_PRESETS: >-
    {"release-recover":"github.com:443 api.github.com:443 uploads.github.com:443
    tmaproduction.blob.core.windows.net:443 token.actions.githubusercontent.com:443
    codeload.github.com:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443
    release-assets.githubusercontent.com:443 pipelines.actions.githubusercontent.com:443 pypi.org:443
    registry.npmjs.org:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
    oauth2.sigstore.dev:443 ghcr.io:443 pkg-containers.githubusercontent.com:443"}
  # lgtm-ci-egress-presets:end

jobs:
  # Stage 1, read-only: tag gate, artifact download and verification, channel
  # detection. `dry-run: true` (default) stops after it: the resume stage's
  # channel jobs skip and only the record job runs.
  plan:
    name: Plan
    uses: ./.github/workflows/reusable-release-recover-plan.yml
    secrets:
      LGTM_CI_TOOLING_TOKEN: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
      LGTM_CI_TOOLING_APP_CLIENT_ID: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
      LGTM_CI_TOOLING_APP_PRIVATE_KEY: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
    permissions:
      actions: read
      contents: read
    with:
      tag: ${{ inputs.tag }}
      source-run-id: ${{ inputs.source-run-id }}
      source-workflow: ${{ inputs.source-workflow }}
      channels: ${{ inputs.channels }}
      pypi-package: ${{ inputs.pypi-package }}
      npm-package: ${{ inputs.npm-package }}
      npm-artifact-name: ${{ inputs.npm-artifact-name }}
      npm-packages-dir: ${{ inputs.npm-packages-dir }}
      npm-checksums-file: ${{ inputs.npm-checksums-file }}
      release-artifact-name: ${{ inputs.release-artifact-name }}
      release-checksums-file: ${{ inputs.release-checksums-file }}
      docker-image: ${{ inputs.docker-image }}
      homebrew-tap-repo: ${{ inputs.homebrew-tap-repo }}
      homebrew-tap-formula: ${{ inputs.homebrew-tap-formula }}
      signer-repo: ${{ inputs.signer-repo }}
      signer-workflow: ${{ inputs.signer-workflow }}
      runner-image: ${{ inputs.runner-image }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
      egress-preset: ${{ inputs.egress-preset }}
      tooling-ref: ${{ inputs.tooling-ref }}

  # Stage 2: per-channel resume jobs (gated inside on a live run, a
  # successful plan and the missing set) and the always() record job, which
  # must also run after a failed plan so the issue shows the hand-off.
  resume:
    name: Resume
    needs: [plan]
    if: always()
    uses: ./.github/workflows/reusable-release-recover-resume.yml
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      issues: write
    with:
      missing: ${{ needs.plan.outputs.missing || '[]' }}
      unresumable: ${{ needs.plan.outputs.unresumable || '[]' }}
      resolve-result: ${{ needs.plan.result }}
      tag: ${{ inputs.tag }}
      source-run-id: ${{ inputs.source-run-id }}
      dry-run: ${{ inputs.dry-run }}
      npm-artifact-name: ${{ inputs.npm-artifact-name }}
      npm-packages-dir: ${{ inputs.npm-packages-dir }}
      npm-order: ${{ inputs.npm-order }}
      npm-dist-tag: ${{ inputs.npm-dist-tag }}
      npm-checksums-file: ${{ inputs.npm-checksums-file }}
      npm-files-to-verify: ${{ inputs.npm-files-to-verify }}
      npm-entry-workflows: ${{ inputs.npm-entry-workflows }}
      npm-access: ${{ inputs.npm-access }}
      npm-provenance: ${{ inputs.npm-provenance }}
      release-artifact-name: ${{ inputs.release-artifact-name }}
      release-checksums-file: ${{ inputs.release-checksums-file }}
      homebrew-dispatch-repo: ${{ inputs.homebrew-dispatch-repo }}
      homebrew-dispatch-workflow: ${{ inputs.homebrew-dispatch-workflow }}
      homebrew-dispatch-ref: ${{ inputs.homebrew-dispatch-ref }}
      signer-repo: ${{ inputs.signer-repo }}
      signer-workflow: ${{ inputs.signer-workflow }}
      recovery-issue-workflow-key: ${{ inputs.recovery-issue-workflow-key }}
      runner-image: ${{ inputs.runner-image }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
      egress-preset: ${{ inputs.egress-preset }}
      tooling-ref: ${{ inputs.tooling-ref }}
    secrets:
      LGTM_CI_TOOLING_TOKEN: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
      LGTM_CI_TOOLING_APP_CLIENT_ID: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
      LGTM_CI_TOOLING_APP_PRIVATE_KEY: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
      homebrew-dispatch-token: ${{ secrets.homebrew-dispatch-token }}
