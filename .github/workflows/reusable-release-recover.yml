jobs:
  # Stage 1, read-only: tag gate, artifact download and verification, channel
  # detection. `dry-run: true` (default) stops after it: the resume stage's
  # channel jobs skip and only the record job runs.
  plan:
    name: Plan
    uses: ./.github/workflows/reusable-release-recover-plan.yml
    permissions:
      actions: read
      contents: read
    with:
      tag: ${{ inputs.tag }}
      source-run-id: ${{ inputs.source-run-id }}
      source-workflow: ${{ inputs.source-workflow }}
      channels: ${{ inputs.channels }}
      pypi-package: ${{ inputs.pypi-package }}
      npm-package: ${{ inputs.npm-package }}
      npm-artifact-name: ${{ inputs.npm-artifact-name }}
      npm-packages-dir: ${{ inputs.npm-packages-dir }}
      npm-checksums-file: ${{ inputs.npm-checksums-file }}
      release-artifact-name: ${{ inputs.release-artifact-name }}
      release-checksums-file: ${{ inputs.release-checksums-file }}
      docker-image: ${{ inputs.docker-image }}
      homebrew-tap-repo: ${{ inputs.homebrew-tap-repo }}
      homebrew-tap-formula: ${{ inputs.homebrew-tap-formula }}
      signer-repo: ${{ inputs.signer-repo }}
      signer-workflow: ${{ inputs.signer-workflow }}
      runner-image: ${{ inputs.runner-image }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
      egress-preset: ${{ inputs.egress-preset }}
      tooling-ref: ${{ inputs.tooling-ref }}

  # Stage 2: per-channel resume jobs (gated inside on a live run, a
  # successful plan and the missing set) and the always() record job, which
  # must also run after a failed plan so the issue shows the hand-off.
  resume:
    name: Resume
    needs: [plan]
    if: always()
    uses: ./.github/workflows/reusable-release-recover-resume.yml
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      issues: write
    with:
      missing: ${{ needs.plan.outputs.missing || '[]' }}
      unresumable: ${{ needs.plan.outputs.unresumable || '[]' }}
      resolve-result: ${{ needs.plan.result }}
      tag: ${{ inputs.tag }}
      source-run-id: ${{ inputs.source-run-id }}
      dry-run: ${{ inputs.dry-run }}
      npm-artifact-name: ${{ inputs.npm-artifact-name }}
      npm-packages-dir: ${{ inputs.npm-packages-dir }}
      npm-order: ${{ inputs.npm-order }}
      npm-dist-tag: ${{ inputs.npm-dist-tag }}
      npm-checksums-file: ${{ inputs.npm-checksums-file }}
      npm-files-to-verify: ${{ inputs.npm-files-to-verify }}
      npm-entry-workflows: ${{ inputs.npm-entry-workflows }}
      npm-access: ${{ inputs.npm-access }}
      npm-provenance: ${{ inputs.npm-provenance }}
      release-artifact-name: ${{ inputs.release-artifact-name }}
      release-checksums-file: ${{ inputs.release-checksums-file }}
      homebrew-dispatch-repo: ${{ inputs.homebrew-dispatch-repo }}
      homebrew-dispatch-workflow: ${{ inputs.homebrew-dispatch-workflow }}
      homebrew-dispatch-ref: ${{ inputs.homebrew-dispatch-ref }}
      signer-repo: ${{ inputs.signer-repo }}
      signer-workflow: ${{ inputs.signer-workflow }}
      recovery-issue-workflow-key: ${{ inputs.recovery-issue-workflow-key }}
      runner-image: ${{ inputs.runner-image }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
      egress-preset: ${{ inputs.egress-preset }}
      tooling-ref: ${{ inputs.tooling-ref }}
    secrets:
      homebrew-dispatch-token: ${{ secrets.homebrew-dispatch-token }}
