  # lgtm-ci-egress-presets:end

jobs:
  # Trust split (#849): caller code (version-update-script) runs only in
  # version-update-hook, a job with no secrets and no token. The jobs that
  # mint the App installation token (prepare, version-pr) run lgtm-ci code
  # only. prepare computes the version and fetches, with the token, the
  # release metadata the hook may read; the hook's edits travel to version-pr
  # as a diff artifact that is scope-checked and `git apply`'d there. Callers
  # without a hook skip both extra jobs.
  prepare:
    name: Prepare version update hook
    if: inputs.version-update-script != ''
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Single gate for the hook job: mirrors the step conditions version-pr
      # evaluates again for itself.
      # yamllint disable-line rule:line-length
      hook-needed: ${{ steps.guard.outputs.is-release-commit == 'false' && steps.check-pr.outputs.pr-exists == 'false' && steps.version.outputs.release-needed == 'true' }}
      next-version: ${{ steps.version.outputs.next-version }}
      # Pinned once so the hook job and version-pr render the same
      # CHANGELOG heading even across midnight.
      release-date: ${{ steps.release-date.outputs.date }}
      # Per-invocation artifact key derived from tag-prefix (which may hold
      # characters artifact names reject, e.g. cli/v).
      artifact-key: ${{ steps.artifact-key.outputs.key }}
      # SHA-256 of the tooling tarball the hook job extracts (#1451).
      tooling-digest: ${{ steps.pack-tooling.outputs.digest }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-version-pr'],
            inputs.allowed-endpoints) }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # No exemption for GitHub Enterprise Server (owner decision): a public
              # repository there must be made internal or private to run.
              if [[ "${REPOSITORY_PRIVATE:-}" == false ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input), or make the" \
                  "repository internal or private"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet. grep exit 2 (unreadable log) fails closed.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        if: >-
          (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-version-pr'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Select GitHub App credential
        id: app-cred
        shell: bash
        # At least one of RELEASE_APP_CLIENT_ID / RELEASE_APP_ID must be set;
        # the client ID wins when both are (e.g. `secrets: inherit` callers).
        # The choice is written to step outputs so the mint step never needs
        # `secrets.*` in an `if:`. The action treats an empty sibling input as
        # absent (`client-id || app-id`).
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
        run: |
          # lgtm-ci-inline:begin select-app-credential
          if [[ -z "${APP_ID}" && -z "${APP_CLIENT_ID}" ]]; then
            echo "::error title=missing App credential::set RELEASE_APP_CLIENT_ID or RELEASE_APP_ID"
            exit 1
          fi
          if [[ -n "${APP_CLIENT_ID}" ]]; then
            if [[ -n "${APP_ID}" ]]; then
              echo "::notice title=RELEASE_APP_ID ignored::both are set; using RELEASE_APP_CLIENT_ID"
            fi
            APP_ID=""
          fi
          {
            echo "app-id=${APP_ID}"
            echo "client-id=${APP_CLIENT_ID}"
          } >> "${GITHUB_OUTPUT}"
          # lgtm-ci-inline:end select-app-credential
      - name: Create GitHub App installation token
        id: app-token
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.app-cred.outputs.app-id }}
          client-id: ${{ steps.app-cred.outputs.client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to the calling repository; an installation covering the
          # whole org must not be reachable from a release job (#849).
          repositories: ${{ github.event.repository.name }}
          # This job only reads. Packages is requested only when the caller
          # asks for the container digest: create-github-app-token errors
          # when asked for a permission the installation lacks, and it
          # ignores an empty value.
          permission-contents: read
          permission-pull-requests: read
          # yamllint disable-line rule:line-length
          permission-packages: ${{ inputs.release-metadata-container-package != '' && 'read' || '' }}
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          # yamllint disable-line rule:line-length
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
      - name: Refuse a diverging tooling-ref
        # Workflow-owned: generated from check-tooling-ref-divergence.sh by
        # sync_inline_blocks.py, so the override tree never judges itself (#1450).
        # GHES (empty job.workflow_sha) skips with a notice.
        if: inputs.tooling-ref != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ALLOW_DIVERGENCE: ${{ inputs.tooling-ref-allow-divergence }}
        run: |
          # lgtm-ci-inline:begin refuse-diverging-tooling-ref
          # Workflow-owned: the tooling tree under judgment never supplies this guard.
          set -euo pipefail

          override="${TOOLING_REF_OVERRIDE:-}"
          if [[ -z "${override}" ]]; then
            exit 0
          fi

          workflow_sha="${WORKFLOW_SHA:-}"
          if [[ -z "${workflow_sha}" ]]; then
            notice="job.workflow_sha is unavailable on this platform;"
            notice+=" skipping the divergence check for tooling-ref ${override}"
            echo "::notice title=tooling-ref divergence::${notice}"
            exit 0
          fi

          tooling_dir="${TOOLING_DIR:-.lgtm-ci-tooling}"
          if ! tooling_sha="$(git -C "${tooling_dir}" rev-parse HEAD 2> /dev/null)"; then
            echo "::error title=tooling-ref divergence::could not resolve HEAD" \
              "of the tooling checkout at ${tooling_dir}"
            exit 1
          fi

          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          if [[ "$(lower "${tooling_sha}")" == "$(lower "${workflow_sha}")" ]]; then
            exit 0
          fi

          detail="tooling-ref ${override} resolved to ${tooling_sha},"
          detail+=" but this workflow runs at ${workflow_sha} (job.workflow_sha)"
          if [[ "${ALLOW_DIVERGENCE:-}" == "true" ]]; then
            echo "::warning title=tooling-ref divergence::${detail};" \
              "continuing because tooling-ref-allow-divergence is true (GHES/mirror escape hatch)"
            exit 0
          fi

          echo "::error title=tooling-ref divergence::${detail}." \
            "Workflow YAML at one commit would run scripts from another." \
            "tooling-ref is deprecated (#995): remove tooling-ref so tooling follows the workflow pin." \
            "GHES or mirror callers that must diverge can set tooling-ref-allow-divergence: true."
          exit 1
          # lgtm-ci-inline:end refuse-diverging-tooling-ref
      - name: Pack tooling for the version update hook
        id: pack-tooling
        shell: bash
        run: .lgtm-ci-tooling/scripts/ci/release/pack-hook-tooling.sh
      - name: Guard release commit
        id: guard
        shell: bash
        env:
          SKIP_PATTERNS: ${{ inputs.skip-patterns }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/guard-release-commit.sh
      - name: Check existing version PR
        if: steps.guard.outputs.is-release-commit == 'false'
        id: check-pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/check-existing-version-pr.sh
      - name: Calculate next version
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
        id: version
        shell: bash
        env:
          MAX_BUMP: ${{ inputs.max-bump }}
          BUMP_MODE: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          PRERELEASE_TAG: ${{ inputs.prerelease-tag }}
          # calculate-version.sh by default (it ignores the three above);
          # the resolver, which wraps it, only for bump/prerelease-tag.
          # yamllint disable-line rule:line-length
          VERSION_SCRIPT: ${{ (inputs.bump != 'auto-from-commits' || inputs.prerelease-tag != '') && 'resolve-multi-ecosystem-version.sh' || 'calculate-version.sh' }}
        run: >-
          ".lgtm-ci-tooling/scripts/ci/release/${VERSION_SCRIPT}"
      - name: Pin release date
        id: release-date
        shell: bash
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Derive artifact key
        id: artifact-key
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: .lgtm-ci-tooling/scripts/ci/release/derive-artifact-key.sh
      - name: Write release metadata
        # Fixed lgtm-ci code fetches what the hook may need; the hook itself
        # never holds a token.
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          NEXT_VERSION: ${{ steps.version.outputs.next-version }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          CONTAINER_PACKAGE: ${{ inputs.release-metadata-container-package }}
          OUTPUT_PATH: ${{ runner.temp }}/release-metadata/release-metadata.json
        run: .lgtm-ci-tooling/scripts/ci/release/write-release-metadata.sh
      - name: Upload release metadata
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-version-pr-metadata-${{ steps.artifact-key.outputs.key }}
          path: ${{ runner.temp }}/release-metadata/release-metadata.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Upload tooling for the version update hook
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-version-pr-tooling-${{ steps.artifact-key.outputs.key }}
          path: ${{ steps.pack-tooling.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Second snapshot of the harden-runner agent at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS at job end"
          # lgtm-ci-inline:end recheck-harden-runner-agent

  version-update-hook:
    name: Run version update hook
    needs: [prepare]
    if: needs.prepare.outputs.hook-needed == 'true'
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # The only job that executes caller code. No secrets are referenced, no
    # App token is minted, and no step exports the workflow token.
    permissions:
      contents: read

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-version-pr'],
            inputs.allowed-endpoints) }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # No exemption for GitHub Enterprise Server (owner decision): a public
              # repository there must be made internal or private to run.
              if [[ "${REPOSITORY_PRIVATE:-}" == false ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input), or make the" \
                  "repository internal or private"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet. grep exit 2 (unreadable log) fails closed.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        if: >-
          (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-version-pr'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The tooling arrives from prepare, which checked it out with the
      # tooling credential and ran the divergence guard on it: this job holds
      # no credential to fetch it (#1451). Download, verify and extract run
      # before any step that reads or runs the caller's code.
      - name: Download lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-version-pr-tooling-${{ needs.prepare.outputs.artifact-key }}
          path: ${{ runner.temp }}/hook-tooling
      - name: Verify and extract lgtm-ci tooling
        # Inline: the tooling does not exist yet. mkdir fails if the caller's
        # checkout already holds the directory.
        shell: bash
        env:
          TARBALL: ${{ runner.temp }}/hook-tooling/hook-tooling.tar.gz
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.tooling-digest }}
        run: |
          # lgtm-ci-inline:begin verify-extract-hook-tooling
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::no tooling digest"
            exit 1
          }
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$TARBALL" | shasum -a 256 -c -
          mkdir .lgtm-ci-tooling
          tar -xzf "$TARBALL" --no-same-owner -C .lgtm-ci-tooling
          # lgtm-ci-inline:end verify-extract-hook-tooling
      - name: Download release metadata
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-version-pr-metadata-${{ needs.prepare.outputs.artifact-key }}
          path: ${{ runner.temp }}/release-metadata
      # Reproduce the prepared workspace the hook has always seen (changelog
      # and ecosystem updates) with trusted code, before the hook runs.
      - name: Generate changelog
        if: inputs.changelog
        id: changelog
        shell: bash
        env:
          FORMAT: full
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          CATALOG_RELEASE_NOTES: ${{ inputs.catalog-release-notes }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/generate-changelog.sh
      - name: Update CHANGELOG.md
        if: inputs.changelog
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.next-version }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.changelog }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          RELEASE_DATE: ${{ needs.prepare.outputs.release-date }}
          PUSH: "false"
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/update-changelog.sh
      - name: Setup Rust toolchain
        if: contains(format(',{0},', inputs.ecosystems), ',rust,')
        # yamllint disable-line rule:line-length
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Run ecosystem version updaters
        if: inputs.ecosystems != ''
        shell: bash
        env:
          NEXT_VERSION: ${{ needs.prepare.outputs.next-version }}
          ECOSYSTEMS: ${{ inputs.ecosystems }}
          ECOSYSTEM_CONFIG: ${{ inputs.ecosystem-config }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/ecosystems/_runner.sh
      - name: Run manifest version updaters
        if: inputs.manifests != ''
        shell: bash
        env:
          NEXT_VERSION: ${{ needs.prepare.outputs.next-version }}
          MANIFESTS: ${{ inputs.manifests }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/ecosystems/_manifests_runner.sh
      - name: Validate version update script
        id: validate-script
        shell: bash
        env:
          RAW_SCRIPT_PATH: ${{ inputs.version-update-script }}
        run: .lgtm-ci-tooling/scripts/ci/release/validate-version-update-script.sh
      - name: Run repo-specific version update script
        shell: bash
        env:
          NEXT_VERSION: ${{ needs.prepare.outputs.next-version }}
          SCRIPT_PATH: ${{ steps.validate-script.outputs.resolved }}
          RELEASE_METADATA_PATH: ${{ runner.temp }}/release-metadata/release-metadata.json
          OUTPUT_DIR: ${{ runner.temp }}/version-update-changes
        run: .lgtm-ci-tooling/scripts/ci/release/run-version-update-hook.sh
      - name: Upload version update changes
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-version-pr-hook-changes-${{ needs.prepare.outputs.artifact-key }}
          path: ${{ runner.temp }}/version-update-changes/version-update.diff
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Second snapshot of the harden-runner agent at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS at job end"
          # lgtm-ci-inline:end recheck-harden-runner-agent

  version-pr:
    name: Create Version PR
    needs: [prepare, version-update-hook]
    # Runs when the hook path is not configured (both skipped) or ran clean;
    # a failed or cancelled hook must not reach the token-holding job.
    if: >-
      !cancelled()
      && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
      && (needs.version-update-hook.result == 'success' || needs.version-update-hook.result == 'skipped')
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      # Distinct from the caller's workflow-level group to avoid
      # a self-deadlock when a same-repo caller also serializes on
      # "release-version-pr-${repo}".
      group: reusable-release-version-pr-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-version-pr'],
            inputs.allowed-endpoints) }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # No exemption for GitHub Enterprise Server (owner decision): a public
              # repository there must be made internal or private to run.
              if [[ "${REPOSITORY_PRIVATE:-}" == false ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input), or make the" \
                  "repository internal or private"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet. grep exit 2 (unreadable log) fails closed.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-version-pr'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select GitHub App credential
        id: app-cred
        shell: bash
        # At least one of RELEASE_APP_CLIENT_ID / RELEASE_APP_ID must be set;
        # the client ID wins when both are (e.g. `secrets: inherit` callers).
        # The choice is written to step outputs so the mint step never needs
        # `secrets.*` in an `if:`. The action treats an empty sibling input as
        # absent (`client-id || app-id`).
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
        run: |
          # lgtm-ci-inline:begin select-app-credential
          if [[ -z "${APP_ID}" && -z "${APP_CLIENT_ID}" ]]; then
            echo "::error title=missing App credential::set RELEASE_APP_CLIENT_ID or RELEASE_APP_ID"
            exit 1
          fi
          if [[ -n "${APP_CLIENT_ID}" ]]; then
            if [[ -n "${APP_ID}" ]]; then
              echo "::notice title=RELEASE_APP_ID ignored::both are set; using RELEASE_APP_CLIENT_ID"
            fi
            APP_ID=""
          fi
          {
            echo "app-id=${APP_ID}"
            echo "client-id=${APP_CLIENT_ID}"
          } >> "${GITHUB_OUTPUT}"
          # lgtm-ci-inline:end select-app-credential
      - name: Create GitHub App installation token
        id: app-token
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.app-cred.outputs.app-id }}
          client-id: ${{ steps.app-cred.outputs.client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to the calling repository (#849). No lgtm-ci reusable
          # writes to a second repository; one that does must take it as an
          # explicit input rather than widen this default.
          repositories: ${{ github.event.repository.name }}
          # Signed commits/branches and PR metadata, reviews and auto-merge.
          # Keep both literal: the action skips an empty permission value,
          # and with none left the token inherits everything the App holds.
          permission-contents: write
          permission-pull-requests: write
          # GitHub refuses a push that changes .github/workflows/** without
          # this, and the updaters can edit such a file (#1449). A caller
          # whose App lacks the scope opts out; "Refuse workflow file
          # changes" below then guards the push.
          # yamllint disable-line rule:line-length
          permission-workflows: ${{ inputs.request-workflows-permission && 'write' || '' }}
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the triggering commit — same guard race as
          # reusable-release-auto-tag.yml (see comment there).
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          # yamllint disable-line rule:line-length
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
      - name: Warn on explicit tooling-ref override
        # hashFiles guards callers that pin a tooling-ref predating the script.
        if: >-
          inputs.tooling-ref != ''
          && hashFiles('.lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh') != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh
      - name: Refuse a diverging tooling-ref
        # Workflow-owned: generated from check-tooling-ref-divergence.sh by
        # sync_inline_blocks.py, so the override tree never judges itself (#1450).
        # GHES (empty job.workflow_sha) skips with a notice.
        if: inputs.tooling-ref != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ALLOW_DIVERGENCE: ${{ inputs.tooling-ref-allow-divergence }}
        run: |
          # lgtm-ci-inline:begin refuse-diverging-tooling-ref
          # Workflow-owned: the tooling tree under judgment never supplies this guard.
          set -euo pipefail

          override="${TOOLING_REF_OVERRIDE:-}"
          if [[ -z "${override}" ]]; then
            exit 0
          fi

          workflow_sha="${WORKFLOW_SHA:-}"
          if [[ -z "${workflow_sha}" ]]; then
            notice="job.workflow_sha is unavailable on this platform;"
            notice+=" skipping the divergence check for tooling-ref ${override}"
            echo "::notice title=tooling-ref divergence::${notice}"
            exit 0
          fi

          tooling_dir="${TOOLING_DIR:-.lgtm-ci-tooling}"
          if ! tooling_sha="$(git -C "${tooling_dir}" rev-parse HEAD 2> /dev/null)"; then
            echo "::error title=tooling-ref divergence::could not resolve HEAD" \
              "of the tooling checkout at ${tooling_dir}"
            exit 1
          fi

          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          if [[ "$(lower "${tooling_sha}")" == "$(lower "${workflow_sha}")" ]]; then
            exit 0
          fi

          detail="tooling-ref ${override} resolved to ${tooling_sha},"
          detail+=" but this workflow runs at ${workflow_sha} (job.workflow_sha)"
          if [[ "${ALLOW_DIVERGENCE:-}" == "true" ]]; then
            echo "::warning title=tooling-ref divergence::${detail};" \
              "continuing because tooling-ref-allow-divergence is true (GHES/mirror escape hatch)"
            exit 0
          fi

          echo "::error title=tooling-ref divergence::${detail}." \
            "Workflow YAML at one commit would run scripts from another." \
            "tooling-ref is deprecated (#995): remove tooling-ref so tooling follows the workflow pin." \
            "GHES or mirror callers that must diverge can set tooling-ref-allow-divergence: true."
          exit 1
          # lgtm-ci-inline:end refuse-diverging-tooling-ref
      - name: Guard release commit
        id: guard
        shell: bash
        env:
          SKIP_PATTERNS: ${{ inputs.skip-patterns }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/guard-release-commit.sh
      - name: Check existing version PR
        if: steps.guard.outputs.is-release-commit == 'false'
        id: check-pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/check-existing-version-pr.sh
      - name: Calculate next version
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
        id: version
        shell: bash
        env:
          MAX_BUMP: ${{ inputs.max-bump }}
          BUMP_MODE: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          PRERELEASE_TAG: ${{ inputs.prerelease-tag }}
          # calculate-version.sh by default (it ignores the three above);
          # the resolver, which wraps it, only for bump/prerelease-tag.
          # yamllint disable-line rule:line-length
          VERSION_SCRIPT: ${{ (inputs.bump != 'auto-from-commits' || inputs.prerelease-tag != '') && 'resolve-multi-ecosystem-version.sh' || 'calculate-version.sh' }}
        run: >-
          ".lgtm-ci-tooling/scripts/ci/release/${VERSION_SCRIPT}"
      - name: Generate changelog
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && inputs.changelog
        id: changelog
        shell: bash
        env:
          FORMAT: full
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          CATALOG_RELEASE_NOTES: ${{ inputs.catalog-release-notes }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/generate-changelog.sh
      - name: Update CHANGELOG.md
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && inputs.changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.next-version }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.changelog }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          # Empty (today) unless the hook path ran prepare.
          RELEASE_DATE: ${{ needs.prepare.outputs.release-date }}
          PUSH: "false"
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/update-changelog.sh
      - name: Setup Rust toolchain
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && contains(format(',{0},', inputs.ecosystems), ',rust,')
        # yamllint disable-line rule:line-length
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Run ecosystem version updaters
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && inputs.ecosystems != ''
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next-version }}
          ECOSYSTEMS: ${{ inputs.ecosystems }}
          ECOSYSTEM_CONFIG: ${{ inputs.ecosystem-config }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/ecosystems/_runner.sh
      - name: Run manifest version updaters
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && inputs.manifests != ''
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next-version }}
          MANIFESTS: ${{ inputs.manifests }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/ecosystems/_manifests_runner.sh
      # The caller's version-update-script ran in the version-update-hook job
      # (no token); only its diff enters this job. The download fails loudly
      # if that job did not run for a release this job still deems needed.
      - name: Download version update changes
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && inputs.version-update-script != ''
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-version-pr-hook-changes-${{ needs.prepare.outputs.artifact-key }}
          path: ${{ runner.temp }}/version-update-changes
      - name: Apply version update changes
        # Scope check (no .github/workflows/**, no repository escape), then
        # `git apply --check`, then `git apply`. Nothing from the artifact runs.
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && inputs.version-update-script != ''
        shell: bash
        env:
          DIFF_PATH: ${{ runner.temp }}/version-update-changes/version-update.diff
          # Refuse a diff the hook built for another version (tag landed
          # between the jobs).
          NEXT_VERSION: ${{ steps.version.outputs.next-version }}
          EXPECTED_NEXT_VERSION: ${{ needs.prepare.outputs.next-version }}
        run: .lgtm-ci-tooling/scripts/ci/release/apply-version-update-changes.sh
      - name: Refuse workflow file changes
        # Without workflows: write the push would be rejected late and
        # without naming a file. Runs after every updater and the hook
        # diff, before anything is published (#1449).
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && !inputs.request-workflows-permission
        shell: bash
        run: python3 .lgtm-ci-tooling/scripts/ci/release/check_workflow_file_changes.py
      - name: Check for version file changes
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
        id: changes
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          EXPECT_VERSION_FILES: ${{ (inputs.ecosystems != '' || inputs.manifests != '' || inputs.version-update-script != '') && 'true' || 'false' }}
        # yamllint disable-line rule:line-length
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/check-version-files-changed.sh
      - name: Check version PR merge queue
        # Skip branch updates when the target version PR is already queued.
        # Queued branches cannot be updated by create-pull-request (#528).
        # Runs before tooling removal so the detection script is still present.
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && steps.changes.outputs.has-pr-changes == 'true'
        id: mq-check
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.check-pr.outputs.pr-number }}
          # yamllint disable-line rule:line-length
          BRANCH: ${{ inputs.release-branch-prefix }}${{ inputs.tag-prefix }}${{ steps.version.outputs.next-version }}
          REPO: ${{ github.repository }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/check-version-pr-merge-queue.sh
      - name: Notice skipped queued version PR update
        # yamllint disable-line rule:line-length
        if: >-
          steps.mq-check.outputs.skip-branch-update == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.mq-check.outputs.pr-number }}
          REASON: ${{ steps.mq-check.outputs.reason }}
        run: |
          echo "::notice::Skipping version PR branch update (reason=${REASON}, pr=${PR_NUMBER:-none})"
      - name: Remove tooling checkout before PR creation
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && steps.changes.outputs.has-pr-changes == 'true'
          && steps.mq-check.outputs.skip-branch-update != 'true'
        shell: bash
        run: .lgtm-ci-tooling/scripts/ci/release/remove-tooling-checkout.sh
      - name: Create or update version PR
        # yamllint disable-line rule:line-length
        if: >-
          steps.guard.outputs.is-release-commit == 'false'
          && steps.check-pr.outputs.pr-exists == 'false'
          && steps.version.outputs.release-needed == 'true'
          && steps.changes.outputs.has-pr-changes == 'true'
          && steps.mq-check.outputs.skip-branch-update != 'true'
        id: create-pr
        # yamllint disable-line rule:line-length
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: >-
            ${{ inputs.release-branch-prefix }}${{ inputs.tag-prefix }}${{
            steps.version.outputs.next-version }}
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          # yamllint disable-line rule:line-length
          title: >-
            chore(release): version ${{
            steps.version.outputs.next-version }}
          body: |
            ## Release ${{ inputs.tag-prefix }}${{ steps.version.outputs.next-version }}

            This PR was automatically created by the release workflow.

            **Version bump:** `${{ steps.version.outputs.bump-type }}`
            **New version:** `${{ steps.version.outputs.next-version }}`

            ### Changelog

            ${{ steps.changelog.outputs.changelog || (!inputs.changelog && '_No changelog entries._' || '') }}

            ### What happens when this PR is merged?

            1. An annotated tag `${{ inputs.tag-prefix }}${{ steps.version.outputs.next-version }}` will be created
            2. A GitHub release will be published with the changelog
            3. The floating major version tag will be updated

            ---

            > **Note**: Do not modify this PR manually. If changes are needed,
            > close it and let the workflow create a new one after those changes
            > land on the default branch.
          # yamllint disable-line rule:line-length
          commit-message: >-
            chore(release): version ${{
            steps.version.outputs.next-version }}
          labels: ${{ inputs.pr-labels }}
      - name: Restore tooling for post-PR steps
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          # yamllint disable-line rule:line-length
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
      - name: Get PR author
        # yamllint disable-line rule:line-length
        if: >-
          steps.create-pr.outputs.pull-request-number != ''
          && !cancelled()
        id: pr-author
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          author=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')
          echo "author=${author}" >> "${GITHUB_OUTPUT}"
      - name: Request CODEOWNER review
        # yamllint disable-line rule:line-length
        if: >-
          steps.create-pr.outputs.pull-request-number != ''
          && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          PR_AUTHOR: ${{ steps.pr-author.outputs.author }}
          PR_AUTHOR_TYPE: Bot
          CODEOWNERS_PATH: ${{ inputs.codeowners-path }}
          REQUEST_CODEOWNER_REVIEW: "true"
        run: .lgtm-ci-tooling/scripts/ci/actions/assign-codeowner.sh
      - name: Enable auto-merge
        # yamllint disable-line rule:line-length
        if: >-
          inputs.auto-merge
          && steps.create-pr.outputs.pull-request-number
          && (
            !inputs.auto-merge-patch-only
            || steps.version.outputs.bump-type == 'patch'
          )
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        # yamllint disable-line rule:line-length
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/enable-auto-merge.sh
      - name: Write summary
        if: always()
        shell: bash
        env:
          IS_RELEASE: ${{ steps.guard.outputs.is-release-commit }}
          PR_EXISTS: ${{ steps.check-pr.outputs.pr-exists }}
          RELEASE_NEEDED: ${{ steps.version.outputs.release-needed }}
          NEXT_VERSION: ${{ steps.version.outputs.next-version }}
          BUMP_TYPE: ${{ steps.version.outputs.bump-type }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          PR_OP: ${{ steps.create-pr.outputs.pull-request-operation }}
          ECOSYSTEMS: ${{ inputs.ecosystems || inputs.manifests }}
        # yamllint disable-line rule:line-length
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/write-version-pr-summary.sh
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Second snapshot of the harden-runner agent at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS at job end"
          # lgtm-ci-inline:end recheck-harden-runner-agent
  report-release-failure:
    name: Report release automation failure
    needs: [prepare, version-update-hook, version-pr]
    if: >-
      always() &&
      inputs.report-failures &&
      (needs.prepare.result == 'failure'
      || needs.version-update-hook.result == 'failure'
      || needs.version-pr.result == 'failure')
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    # Keep an independent short cap: the caller's timeout-minutes bounds the
    # main version-pr job, and lowering it must not cancel failure reporting.
    timeout-minutes: 10
    permissions:
      # Read workflow/job metadata to generate failure context
      actions: read
      # Read repository context for issue body
      contents: read
      # Create or update failure notification issues
      issues: write

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Fixed preset from the literal map in env (not caller-selectable).
          allowed-endpoints: ${{ fromJSON(env.LGTM_CI_EGRESS_PRESETS)['github-minimal'] }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # No exemption for GitHub Enterprise Server (owner decision): a public
              # repository there must be made internal or private to run.
              if [[ "${REPOSITORY_PRIVATE:-}" == false ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input), or make the" \
                  "repository internal or private"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet. grep exit 2 (unreadable log) fails closed.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
            scripts/ci/
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Refuse a diverging tooling-ref
        # Workflow-owned: generated from check-tooling-ref-divergence.sh by
        # sync_inline_blocks.py, so the override tree never judges itself (#1450).
        # GHES (empty job.workflow_sha) skips with a notice.
        if: inputs.tooling-ref != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ALLOW_DIVERGENCE: ${{ inputs.tooling-ref-allow-divergence }}
        run: |
          # lgtm-ci-inline:begin refuse-diverging-tooling-ref
          # Workflow-owned: the tooling tree under judgment never supplies this guard.
          set -euo pipefail

          override="${TOOLING_REF_OVERRIDE:-}"
          if [[ -z "${override}" ]]; then
            exit 0
          fi

          workflow_sha="${WORKFLOW_SHA:-}"
          if [[ -z "${workflow_sha}" ]]; then
            notice="job.workflow_sha is unavailable on this platform;"
            notice+=" skipping the divergence check for tooling-ref ${override}"
            echo "::notice title=tooling-ref divergence::${notice}"
            exit 0
          fi

          tooling_dir="${TOOLING_DIR:-.lgtm-ci-tooling}"
          if ! tooling_sha="$(git -C "${tooling_dir}" rev-parse HEAD 2> /dev/null)"; then
            echo "::error title=tooling-ref divergence::could not resolve HEAD" \
              "of the tooling checkout at ${tooling_dir}"
            exit 1
          fi

          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          if [[ "$(lower "${tooling_sha}")" == "$(lower "${workflow_sha}")" ]]; then
            exit 0
          fi

          detail="tooling-ref ${override} resolved to ${tooling_sha},"
          detail+=" but this workflow runs at ${workflow_sha} (job.workflow_sha)"
          if [[ "${ALLOW_DIVERGENCE:-}" == "true" ]]; then
            echo "::warning title=tooling-ref divergence::${detail};" \
              "continuing because tooling-ref-allow-divergence is true (GHES/mirror escape hatch)"
            exit 0
          fi

          echo "::error title=tooling-ref divergence::${detail}." \
            "Workflow YAML at one commit would run scripts from another." \
            "tooling-ref is deprecated (#995): remove tooling-ref so tooling follows the workflow pin." \
            "GHES or mirror callers that must diverge can set tooling-ref-allow-divergence: true."
          exit 1
          # lgtm-ci-inline:end refuse-diverging-tooling-ref
      - name: Write failure trigger summary
        shell: bash
        env:
          RELEASE_WORKFLOW_KEY: release-version-pr
          PRIMARY_JOB_FAILED: "true"
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/report-release-failure.sh
          write_trigger_summary
      - name: Notify release failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW_KEY: release-version-pr
          FAILURE_ISSUE_LABELS: ${{ inputs.failure-issue-labels }}
          FAILURE_TARGET_BRANCH: ${{ inputs.failure-target-branch }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/report-release-failure.sh
          notify_failure
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Second snapshot of the harden-runner agent at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS at job end"
          # lgtm-ci-inline:end recheck-harden-runner-agent
