---
name: "Reusable: Release Version PR"

"on":
  workflow_call:
    inputs:
      ecosystems:
        description: >-
          Comma-separated ecosystem identifiers for version file updates:
          node, rust, python, ruby, swift, dart, kotlin
        required: false
        type: string
        default: ""
      ecosystem-config:
        # yamllint disable-line rule:line-length
        description: >-
          JSON object with path overrides for non-standard layouts.
          Example: {"python": {"pyproject": "python/pyproject.toml",
          "init": "python/src/pkg/__init__.py"}, "ruby": {"gem": "my-gem"}}
        required: false
        type: string
        default: "{}"
      manifests:
        # yamllint disable-line rule:line-length
        description: >-
          Optional JSON object mapping file path → kind (npm|raw|gemspec|pep621),
          updated after the ecosystems updaters. Example: {"package.json":"npm",
          "VERSION":"raw","python/pyproject.toml":"pep621","my.gemspec":"gemspec"}.
          Kind pep621 installs tomlkit from PyPI when missing; the default
          egress-preset allows it (#1093). Empty (default) skips the step.
        required: false
        type: string
        default: ""
      bump:
        description: >-
          Version resolution: auto-from-commits (conventional commits) or
          explicit (use version input)
        required: false
        type: string
        default: "auto-from-commits"
      version:
        description: >-
          Explicit semver when bump=explicit (optional v prefix). Ignored for
          auto-from-commits.
        required: false
        type: string
        default: ""
      prerelease-tag:
        description: >-
          Optional prerelease identifier appended as -<tag> (e.g. rc.1 →
          1.2.3-rc.1). Empty skips.
        required: false
        type: string
        default: ""
      changelog:
        description: "Generate and update CHANGELOG.md in the version PR"
        required: false
        type: boolean
        default: true
      max-bump:
        description: >-
          Maximum semver bump (major, minor, patch) when
          bump=auto-from-commits
        required: false
        type: string
        default: "minor"
      tag-prefix:
        description: "Prefix for version tags"
        required: false
        type: string
        default: "v"
      pr-labels:
        description: "Comma-separated labels for the version PR"
        required: false
        type: string
        default: "release-bump"
      codeowners-path:
        description: "Path to CODEOWNERS file"
        required: false
        type: string
        default: ".github/CODEOWNERS"
      auto-merge:
        description: "Enable auto-merge (squash) on the created PR"
        required: false
        type: boolean
        default: false
      auto-merge-patch-only:
        description: >-
          When auto-merge is true, only enable auto-merge for patch bumps
        required: false
        type: boolean
        default: false
      release-branch-prefix:
        description: "Prefix for the release PR branch (e.g. release/)"
        required: false
        type: string
        default: "release/"
      request-workflows-permission:
        description: >-
          Request workflows: write on the version-PR App token (default).
          GitHub needs it to push a change under .github/workflows/. Set
          false for an App without "Workflows: Read and write"; the job then
          fails before publishing if any workflow file changed (#1449).
        required: false
        type: boolean
        default: true
      version-update-script:
        # yamllint disable-line rule:line-length
        description: >-
          Path to a repo-specific script for additional version file updates
          beyond ecosystem defaults. Runs in its own job with no token or
          secrets (#849), after ecosystem updaters, before PR creation.
          Receives NEXT_VERSION and RELEASE_METADATA_PATH (read-only JSON:
          latest release, container digest). Only changes to this
          repository's files outside .github/workflows/ are carried into
          the version PR.
        required: false
        type: string
        default: ""
      release-metadata-container-package:
        # yamllint disable-line rule:line-length
        description: >-
          GitHub Packages container (same owner) whose newest release-tagged
          digest is recorded in release-metadata.json for the
          version-update-script. Needs Packages: read on the release App.
          Empty skips the lookup.
        required: false
        type: string
        default: ""
      catalog-release-notes:
        description: >-
          Merge the catalog/catalog.yml diff since the previous release (tier
          changes, deprecations, removals) into the generated CHANGELOG
          section (#1082). Only for repositories that keep an lgtm-ci support
          catalog; lgtm-ci itself sets it.
        required: false
        type: boolean
        default: false
      skip-patterns:
        description: >-
          Comma-separated commit title patterns that skip version PR creation.
        required: false
        type: string
        default: "^chore\\(release\\):"
      tooling-ref:
        # yamllint disable-line rule:line-length
        description: >-
          Optional override for the lgtm-ci tooling checkout. Unset tracks
          the workflow pin automatically (job.workflow_sha); setting it emits
          a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false
      egress-policy:
        description: "harden-runner egress policy (block only; audit rejected)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default release-version-pr: github-tooling plus PyPI for the
          python/pep621 tomlkit install and the rustup/crates.io hosts for
          the rust lockfile regeneration, #1093). Selected at job start
          inside every harden-runner step, so it is enforced (#913).
        required: false
        type: string
        default: "release-version-pr"
      report-failures:
        description: >-
          When true, open or update a deduplicated GitHub issue when the release
          job fails on the target branch
        required: false
        type: boolean
        default: true
      failure-issue-labels:
        description: Comma-separated labels for auto-opened release failure issues
        required: false
        type: string
        default: "bug,ci,release,automation,infrastructure"
      failure-target-branch:
        description: >-
          Branch name for failure notifications. Empty uses the repository default
          branch.
        required: false
        type: string
        default: ""

      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 20

    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkouts of the jobs that do
          not run caller code. Needed when this workflow is called from a
          private mirror; unset uses github.token (#1451). The
          version-update-hook job never receives it: it gets the tooling as
          a digest-checked artifact from prepare.
        required: false
      RELEASE_APP_ID:
        description: >-
          GitHub App ID for creating release tokens. Set RELEASE_APP_CLIENT_ID
          or RELEASE_APP_ID; the client ID is preferred when both are set.
        required: false
      RELEASE_APP_CLIENT_ID:
        description: >-
          GitHub App client ID (preferred over RELEASE_APP_ID when both are
          set).
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: "GitHub App private key for creating release tokens"
        required: true

