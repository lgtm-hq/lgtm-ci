---
name: Security - Dependency Review

'on':
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

# Replace only superseded PR work. Each non-PR run/attempt needs its own group:
# cancel-in-progress: false alone still allows pending runs to be replaced
# (same shape as ci.yml; see docs/workflows/testing.md#caller-concurrency).
concurrency:
  group: >-
    dependency-review-caller-${{ github.workflow_ref }}-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-${{
    github.event_name == 'pull_request' && 'pr' || github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    uses: ./.github/workflows/reusable-dependency-review.yml
    with:
      fail-on-severity: high
      egress-policy: block
      egress-preset: scorecard
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        gcr.io:443
        api.osv.dev:443
        api.scorecard.dev:443
        api.securityscorecards.dev:443
        api.deps.dev:443
        release-assets.githubusercontent.com:443
    permissions:
      # Read repository contents for dependency-review-action
      contents: read
      # Read PR metadata for review comments
      pull-requests: read
