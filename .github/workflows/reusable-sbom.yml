    docker.io:443 registry-1.docker.io:443 auth.docker.io:443 production.cloudflare.docker.com:443
    production.cloudfront.docker.com:443 archive.ubuntu.com:80 azure.archive.ubuntu.com:80
    security.ubuntu.com:80 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 timestamp.sigstore.dev:443
    tuf-repo-cdn.sigstore.dev:443 sigstore-tuf-root.storage.googleapis.com:443",
    "release-recover":"github.com:443 api.github.com:443 uploads.github.com:443
    actions.githubusercontent.com:443 token.actions.githubusercontent.com:443 codeload.github.com:443
    objects.githubusercontent.com:443 raw.githubusercontent.com:443
