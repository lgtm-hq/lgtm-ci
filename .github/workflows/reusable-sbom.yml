    objects.githubusercontent.com:443 raw.githubusercontent.com:443
    release-assets.githubusercontent.com:443 uploads.github.com:443
    pipelines.actions.githubusercontent.com:443 pypi.org:443 files.pythonhosted.org:443 astral.sh:443
    releases.astral.sh:443",
    "rust-release":"github.com:443 api.github.com:443 codeload.github.com:443
    objects.githubusercontent.com:443 pipelines.actions.githubusercontent.com:443
    raw.githubusercontent.com:443 static.rust-lang.org:443 sh.rustup.rs:443 crates.io:443
