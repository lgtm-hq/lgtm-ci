    pipelines.actions.githubusercontent.com:443 archive.ubuntu.com:80 azure.archive.ubuntu.com:80
    security.ubuntu.com:80 security.ubuntu.com:443",
    "sbom":"github.com:443 api.github.com:443 codeload.github.com:443
    release-assets.githubusercontent.com:443 objects.githubusercontent.com:443
    raw.githubusercontent.com:443 uploads.github.com:443 anchore.io:443 get.anchore.io:443
    toolbox-data.anchore.io:443 grype.anchore.io:443 pipelines.actions.githubusercontent.com:443
    fulcio.sigstore.dev:443 rekor.sigstore.dev:443 timestamp.sigstore.dev:443
    tuf-repo-cdn.sigstore.dev:443 sigstore-tuf-root.storage.googleapis.com:443 oauth2.sigstore.dev:443",
