---
name: Reusable SBOM Workflow

on:
  workflow_call:
    inputs:
      mode:
        description: >-
          report: generate/scan/attest (default). release-assets: multi-format
          SBOM + optional cosign sign + upload to the GitHub Release.
        required: false
        type: string
        default: "report"
      target:
        description: "Target to generate SBOM for"
        required: false
        type: string
        default: "."
      target-type:
        description: "Type of target: dir, image, file"
        required: false
        type: string
        default: "dir"
      sbom-format:
        description: "SBOM output format for report mode: cyclonedx-json, spdx-json"
        required: false
        type: string
        default: "cyclonedx-json"
      formats:
        description: >-
          Comma-separated Syft formats for release-assets mode
          (default: spdx-json,cyclonedx-json)
        required: false
        type: string
        default: "spdx-json,cyclonedx-json"
      sign:
        description: >-
          Cosign keyless (OIDC) sign SBOM files in release-assets mode
        required: false
        type: boolean
        default: true
      scan-vulnerabilities:
        description: "Scan SBOM for vulnerabilities (report mode)"
        required: false
        type: boolean
        default: true
      fail-on-severity:
        description: >-
          Fail on vulnerability severity: critical, high, medium, low, none.
          Empty string disables the gate (advisory-only).
        required: false
        type: string
        default: "critical"
      upload-sarif:
        description: "Upload vulnerability SARIF to GitHub Security"
        required: false
        type: boolean
        default: false
      create-attestation:
        description: "Create attestation for the SBOM"
        required: false
        type: boolean
        default: false
      artifact-name:
        description: "Name for uploaded SBOM artifact"
        required: false
        type: string
        default: "sbom"
      upload-release-assets:
        description: >-
          DEPRECATED (#770), accepted but inert. The contents:write upload job
          moved to reusable-sbom-release-upload.yml, which the caller invokes
          in its own job; keeping it here forced contents:write onto every
          caller, scan-only ones included. Setting this to true warns and does
          nothing. Removal is planned a release or two out.
        required: false
        type: boolean
        default: false
      release-tag:
        description: >-
          Ref to check out and generate the SBOM from in release-assets mode;
          required in that mode. Attaching the result to the release is
          reusable-sbom-release-upload.yml's job since #770, and that workflow
          takes its own release-tag.
        required: false
        type: string
        default: ""

      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default sbom). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "sbom"
      job-name:
        description: "GitHub check name for the SBOM job"
        required: false
        type: string
        default: "SBOM & Supply Chain"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 20

    outputs:
      sbom-file:
        description: "Path to the generated SBOM file, or 'none' if not generated"
        value: ${{ jobs.sbom.outputs.sbom-file || 'none' }}
      vulnerabilities-found:
        description:
          "Whether vulnerabilities were found (true/false), or 'not-run' if scan was
          skipped"
        value: ${{ jobs.sbom.outputs.vulnerabilities-found || 'not-run' }}
      attestation-url:
        description: "URL of the attestation, or 'not-run' if attestation was skipped"
        value: ${{ jobs.sbom.outputs.attestation-url || 'not-run' }}

env:
  # Egress presets rendered from scripts/ci/lib/egress/presets.sh by
