---
name: Reusable Docker Build and Push

# Supported Docker entry-point orchestrator (#381). The classify job resolves
# the build strategy, then delegates to the focused reusables:
#   - reusable-docker-build.yml          (use-split=false: single-platform or
#                                         QEMU multi-platform build+scan)
#   - reusable-docker-multiplatform.yml  (use-split=true: runner-map matrix,
#                                         manifest merge, signing)
# Callers may use this workflow, or call the focused reusables directly —
# see docs/workflow-contract.md (runner-map section). reusable-docker-smoke-test.yml
# is a standalone image-validation reusable and is not called from here.
#
# Caller repos only need to pin this workflow; all shared shell scripts are
# resolved from lgtm-ci via a cross-repo checkout (same pattern as
# reusable-release-auto-tag.yml). No vendored scripts/ci tree is required
# in the caller repository.

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: >-
          Namespace for the split path's validate-time Trivy SARIF artifacts
          (<prefix>-trivy-sarif-<slug>); give a second call in the same run
          its own prefix so the two calls' reports never overwrite each other
          (#1081). Must match [A-Za-z0-9_.]+ ('-' separates prefix from the
          rest of the name)
        required: false
        type: string
        default: "docker"
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      file:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        description: "Target platforms (comma-separated)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      registry:
        description: "Container registry URL"
        required: false
        type: string
        default: "ghcr.io"
      image-name:
        description: "Image name (default: github.repository)"
        required: false
        type: string
        default: ""
      tags:
        description: "Additional tags (comma-separated)"
        required: false
        type: string
        default: ""
      version:
        description: "Version for semver tags"
        required: false
        type: string
        default: ""
      source-ref:
        description: >-
          Git ref to check out for the build context (app source), independent
          of tooling-ref. Empty uses the triggering ref. Set for historical
          backfills (e.g. build an old tag's source from a main dispatch).
        required: false
        type: string
        default: ""
      tag-latest:
        description: >-
          Also apply the 'latest' tag when version is set. Set false for
          historical backfills so republishing an old version does not move
          'latest' backward.
        required: false
        type: boolean
        default: true
      exact-tags:
        description: >-
          Publish ONLY the pinned version tag (and its immutable by-digest
          sha), suppressing major/minor/latest/branch/sha-<ref> floating tags.
          For historical backfills so republishing an old version never drags
          shared floating tags backward.
        required: false
        type: boolean
        default: false
      push:
        description: "Push image to registry"
        required: false
        type: boolean
        default: false
      provenance:
        description: >-
          Generate provenance attestation. Honoured only when push is false:
          a pushed image always carries provenance (release-security policy,
          section 1); an opt-out on a push is overridden with a warning.
        required: false
        type: boolean
        default: true
      sbom:
        description: >-
          Generate SBOM attestation. Honoured only when push is false: a
          pushed image always carries an SBOM (release-security policy,
          section 1); an opt-out on a push is overridden with a warning.
        required: false
        type: boolean
        default: true
      scan:
        description: "Run vulnerability scan"
        required: false
        type: boolean
        default: false
      build-args:
        description: "Build arguments (comma-separated key=value)"
        required: false
        type: string
        default: ""
      target:
        description: "Docker build target stage (e.g. 'full', 'base')"
        required: false
        type: string
        default: ""
      runner-map:
        description: >-
          JSON object mapping platform to runner label.
          Unmapped split platforms use ubuntu-26.04; non-amd64 platforms use QEMU.
          Example: {"linux/arm64":"ubuntu-24.04-arm"}
        required: false
        type: string
        default: "{}"
      smoke-test:
        description: >-
          Shorthand command + args to run inside each per-platform staging
          image. Executed as `docker run --rm --platform <p> <image> <smoke-test>`.
          Good for trivial checks like `--version`. Word-split; values with
          spaces or shell metacharacters need `smoke-test-script` instead.
          Mutually exclusive with `smoke-test-script`. Skipped when both empty.
          Only applies to the split per-platform path (multi-arch push).
        required: false
        type: string
        default: ""
      smoke-test-script:
        description: >-
          Path (relative to checkout root) to a caller-owned script. Executed
          on the runner with env `IMAGE`, `PLATFORM`, `REGISTRY`. The script
          owns the `docker run` invocation — full control over flags, env,
          network, tmpfs, etc. Preferred over `smoke-test` for anything
          beyond a bare command. Mutually exclusive with `smoke-test`.
          Any failing platform blocks the entire manifest merge.
        required: false
        type: string
        default: ""
      health-check-cmd:
        description: >-
          Optional command run on the runner against the published localhost
          port before publish, e.g. `curl -f http://127.0.0.1:8080/health`.
          Starts a detached container, waits for `health-check-port`, runs the
          command on the runner (not inside the image), then tears down. Requires
          `health-check-port`. When set with `push: true`, publish is gated on
          success. Skipped when empty (preserves current behavior).
        required: false
        type: string
        default: ""
      health-check-port:
        description: >-
          Container port to publish on 127.0.0.1 and wait for before running
          `health-check-cmd` on the runner. Required when `health-check-cmd`
          is set.
        required: false
        type: string
        default: ""
      health-check-timeout:
        description: >-
          Max wait time for `health-check-port` to accept connections before
          running `health-check-cmd` (e.g. 30s).
        required: false
        type: string
        default: "30s"
      validate-on-pr:
        description: >-
          When true AND push is false, use the split per-platform path (native
          runners) without pushing staging images. Enables full Dockerfile
          validation on PRs without QEMU overhead.
        required: false
        type: boolean
        default: false
      scan-exit-code:
        description: >-
          Exit code for Trivy when findings match severity filter. Set to "1"
          to fail the workflow on CRITICAL/HIGH CVEs. Set to "0" for
          advisory-only SARIF upload.
        required: false
        type: string
        default: "0"
      cache-registry-ref:
        description: >-
          Registry reference for cache fallback (e.g. ghcr.io/org/repo:cache).
          When set, adds type=registry as a secondary cache-from source and
          writes to it on push events. GHA cache remains primary. Per-platform
          scope is appended automatically (-amd64, -arm64).
        required: false
        type: string
        default: ""
      cosign-sign:
        description: >-
          Sign the final image manifest with Sigstore Cosign (keyless OIDC).
          Requires id-token: write permission in caller. Only runs when push
          is true and a digest is available.
        required: false
        type: boolean
        default: false
      no-cache:
        description: >-
          Disable build cache entirely. Use for release builds to ensure fully
          reproducible images. When true, cache-from and cache-to are omitted.
        required: false
        type: boolean
        default: false
      free-disk-space:
        description: >-
          Reclaim unused ubuntu-24.04 amd64 toolchains before the build
          (dotnet, Android SDK, ghc, PowerShell, unused toolcache). No-op
          when those paths are absent (e.g. ubuntu-24.04-arm). Runs only
          on github-hosted runners.
        required: false
        type: boolean
        default: false
      resource-monitor:
        description: >-
          Background a 30s memory/disk sampler that tees [resource-monitor]
          lines into the live job log and $RUNNER_TEMP. Dump the tail at
          job end when the runner survives. Start is best-effort and does
          not fail the build.
        required: false
        type: boolean
        default: false
      tooling-ref:
        # yamllint disable-line rule:line-length
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false

      egress-policy:
        description: "harden-runner egress policy (block only; audit rejected)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh.
          Accepted presets: docker. Any other name fails (#1623)
          (default docker). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "docker"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 60

    outputs:
      tags:
        description: "Generated image tags"
        value: ${{ jobs.build.outputs.tags || jobs.multiplatform.outputs.tags }}
      digest:
        description: "Image digest"
        value: ${{ jobs.build.outputs.digest || jobs.multiplatform.outputs.digest }}

    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false
      LGTM_CI_TOOLING_APP_CLIENT_ID:
        description: >-
          Optional client ID of a GitHub App installed on the lgtm-ci tooling
          repository only, with contents: read. Together with the App's
          private key, each job mints a short-lived token used only by the
          tooling checkouts, in place of the stored tooling token. Pass both
          App secrets or neither (#1622).
        required: false
      LGTM_CI_TOOLING_APP_PRIVATE_KEY:
        description: >-
          Optional private key of the tooling GitHub App. Pass it together
          with the App's client ID (#1622).
        required: false
      DOCKERHUB_USERNAME:
        required: false
        description: "Docker Hub username (for docker.io registry)"
      DOCKERHUB_TOKEN:
        required: false
        description: "Docker Hub token (for docker.io registry)"

env:
  # Egress presets rendered from scripts/ci/lib/egress/presets.sh by
  # scripts/ci/egress/sync-workflow-presets.sh — do not edit by hand. Every
  # harden-runner step below indexes this map by expression: the
  # step-security pre hook installs the agent before any step runs, so the
  # allowlist must be composed from literals and inputs only (#412/#420/#913).
  # lgtm-ci-egress-accepts: docker
  # lgtm-ci-egress-presets:begin
  LGTM_CI_EGRESS_PRESETS: >-
    {"docker":"github.com:443 api.github.com:443 codeload.github.com:443
    objects.githubusercontent.com:443 raw.githubusercontent.com:443
    release-assets.githubusercontent.com:443 github-releases.githubusercontent.com:443
    pipelines.actions.githubusercontent.com:443 token.actions.githubusercontent.com:443 ghcr.io:443
    pkg-containers.githubusercontent.com:443 docker.io:443 registry-1.docker.io:443 auth.docker.io:443
    production.cloudflare.docker.com:443 production.cloudfront.docker.com:443
    docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443 mirror.gcr.io:443
    fulcio.sigstore.dev:443 rekor.sigstore.dev:443 timestamp.sigstore.dev:443
    tuf-repo-cdn.sigstore.dev:443 fulcio.githubapp.com:443 timestamp.githubapp.com:443"}
  # lgtm-ci-egress-presets:end

jobs:
  # Classify platforms and determine build strategy.
  # Outputs use-split=true and a per-platform matrix when push or validate-on-pr
  # is enabled and two or more platforms are requested; otherwise use-split=false.
  classify:
    name: Classify Platforms
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      use-split: ${{ steps.classify.outputs.use-split }}
      matrix: ${{ steps.classify.outputs.matrix }}
      # Policy-enforced evidence flags: equal to the inputs unless push is
      # true and an input opted out, in which case classify warns and forces
      # true (release-security policy, section 1).
      effective-provenance: ${{ steps.classify.outputs.effective-provenance }}
      effective-sbom: ${{ steps.classify.outputs.effective-sbom }}

    env:
      # lgtm-ci-inline:begin tooling-app-flags
      # Tooling App secrets present? A step `if:` cannot read secrets (#1622).
      LGTM_CI_TOOLING_APP_ID_SET: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' }}
      LGTM_CI_TOOLING_APP_KEY_SET: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '' }}
      # lgtm-ci-inline:end tooling-app-flags

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'],
            inputs.allowed-endpoints) }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # No exemption for GitHub Enterprise Server (owner decision): a public
              # repository there must be made internal or private to run.
              if [[ "${REPOSITORY_PRIVATE:-}" == false ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input), or make the" \
                  "repository internal or private"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet. grep exit 2 (unreadable log) fails closed.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # source-ref = build-context (app source); tooling-ref stays separate
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || github.sha }}
          persist-credentials: false
      # lgtm-ci-inline:begin tooling-app-mint
      - name: Check tooling App credential
        id: tooling-app-target
        # Only when a tooling consumer will run and an App secret is set (#1622).
        if: >-
          env.LGTM_CI_TOOLING_APP_NEEDED != 'false'
          && (env.LGTM_CI_TOOLING_APP_ID_SET == 'true' || env.LGTM_CI_TOOLING_APP_KEY_SET == 'true')
        shell: bash
        env:
          TOOLING_REPOSITORY: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          SHAPE: ^([A-Za-z0-9][A-Za-z0-9_-]*)/([A-Za-z0-9._-]+)$
          INCOMPLETE: >-
            ::error title=incomplete tooling App credential::pass both
            LGTM_CI_TOOLING_APP_CLIENT_ID and LGTM_CI_TOOLING_APP_PRIVATE_KEY, or neither
          UNREADABLE: >-
            ::error title=unreadable tooling repository::cannot split the tooling
            repository into an owner and a name
        run: |
          [[ "${LGTM_CI_TOOLING_APP_ID_SET}" == "${LGTM_CI_TOOLING_APP_KEY_SET}" ]] || { echo "${INCOMPLETE}"; exit 1; }
          [[ "${TOOLING_REPOSITORY}" =~ ${SHAPE} ]] || { echo "${UNREADABLE}"; exit 1; }
          printf 'owner=%s\nrepository=%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" >> "${GITHUB_OUTPUT}"
      - name: Mint tooling App token
        id: tooling-app-token
        # Tooling repository only, asks for contents: read only (#1622).
        if: steps.tooling-app-target.outputs.repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
          private-key: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
          owner: ${{ steps.tooling-app-target.outputs.owner }}
          repositories: ${{ steps.tooling-app-target.outputs.repository }}
          permission-contents: read
      # lgtm-ci-inline:end tooling-app-mint
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          # App requested: the minted token or a sentinel that cannot
          # authenticate, never a weaker fallback (#1622).
          token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Classify platforms
        id: classify
        shell: bash
        env:
          STEP: classify
          PLATFORMS: ${{ inputs.platforms }}
          PUSH: ${{ inputs.push }}
          VALIDATE_ON_PR: ${{ inputs.validate-on-pr }}
          PROVENANCE: ${{ inputs.provenance }}
          SBOM: ${{ inputs.sbom }}
          RUNNER_MAP: ${{ inputs.runner-map }}
          SMOKE_TEST: ${{ inputs.smoke-test }}
          SMOKE_TEST_SCRIPT: ${{ inputs.smoke-test-script }}
          HEALTH_CHECK_CMD: ${{ inputs.health-check-cmd }}
          HEALTH_CHECK_PORT: ${{ inputs.health-check-port }}
          HEALTH_CHECK_TIMEOUT: ${{ inputs.health-check-timeout }}
        run: .lgtm-ci-tooling/scripts/ci/actions/build-docker.sh
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Recheck of the harden-runner agent, before each irreversible publish
          # step (#1551) and at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS"
          # lgtm-ci-inline:end recheck-harden-runner-agent
  # Single-platform builds, or multi-platform when push is disabled (QEMU
  # fallback). Delegated to the focused build reusable.
  build:
    name: Docker build
    needs: classify
    if: ${{ needs.classify.outputs.use-split == 'false' }}
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      platforms: ${{ inputs.platforms }}
      registry: ${{ inputs.registry }}
      image-name: ${{ inputs.image-name }}
      tags: ${{ inputs.tags }}
      version: ${{ inputs.version }}
      source-ref: ${{ inputs.source-ref }}
      tag-latest: ${{ inputs.tag-latest }}
      exact-tags: ${{ inputs.exact-tags }}
      push: ${{ inputs.push }}
      provenance: ${{ fromJSON(needs.classify.outputs.effective-provenance) }}
      sbom: ${{ fromJSON(needs.classify.outputs.effective-sbom) }}
      scan: ${{ inputs.scan }}
      build-args: ${{ inputs.build-args }}
      target: ${{ inputs.target }}
      health-check-cmd: ${{ inputs.health-check-cmd }}
      health-check-port: ${{ inputs.health-check-port }}
      health-check-timeout: ${{ inputs.health-check-timeout }}
      validate-on-pr: ${{ inputs.validate-on-pr }}
      scan-exit-code: ${{ inputs.scan-exit-code }}
      cache-registry-ref: ${{ inputs.cache-registry-ref }}
      cosign-sign: ${{ inputs.cosign-sign }}
      no-cache: ${{ inputs.no-cache }}
      free-disk-space: ${{ inputs.free-disk-space }}
      resource-monitor: ${{ inputs.resource-monitor }}
      tooling-ref: ${{ inputs.tooling-ref }}
      tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
      egress-preset: ${{ inputs.egress-preset }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
    secrets:
      LGTM_CI_TOOLING_TOKEN: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
      LGTM_CI_TOOLING_APP_CLIENT_ID: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
      LGTM_CI_TOOLING_APP_PRIVATE_KEY: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Split per-platform path: runner-map matrix builds, optional smoke-test and
  # health-check gates, manifest merge + verification, provenance, signing.
  multiplatform:
    name: Docker multi-platform
    needs: classify
    if: ${{ needs.classify.outputs.use-split == 'true' }}
    uses: ./.github/workflows/reusable-docker-multiplatform.yml
    with:
      matrix: ${{ needs.classify.outputs.matrix }}
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      platforms: ${{ inputs.platforms }}
      registry: ${{ inputs.registry }}
      image-name: ${{ inputs.image-name }}
      tags: ${{ inputs.tags }}
      version: ${{ inputs.version }}
      source-ref: ${{ inputs.source-ref }}
      tag-latest: ${{ inputs.tag-latest }}
      exact-tags: ${{ inputs.exact-tags }}
      push: ${{ inputs.push }}
      provenance: ${{ fromJSON(needs.classify.outputs.effective-provenance) }}
      sbom: ${{ fromJSON(needs.classify.outputs.effective-sbom) }}
      scan: ${{ inputs.scan }}
      build-args: ${{ inputs.build-args }}
      target: ${{ inputs.target }}
      smoke-test: ${{ inputs.smoke-test }}
      smoke-test-script: ${{ inputs.smoke-test-script }}
      health-check-cmd: ${{ inputs.health-check-cmd }}
      health-check-port: ${{ inputs.health-check-port }}
      health-check-timeout: ${{ inputs.health-check-timeout }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      validate-on-pr: ${{ inputs.validate-on-pr }}
      scan-exit-code: ${{ inputs.scan-exit-code }}
      cache-registry-ref: ${{ inputs.cache-registry-ref }}
      cosign-sign: ${{ inputs.cosign-sign }}
      no-cache: ${{ inputs.no-cache }}
      free-disk-space: ${{ inputs.free-disk-space }}
      resource-monitor: ${{ inputs.resource-monitor }}
      tooling-ref: ${{ inputs.tooling-ref }}
      tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
      egress-preset: ${{ inputs.egress-preset }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
    secrets:
      LGTM_CI_TOOLING_TOKEN: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
      LGTM_CI_TOOLING_APP_CLIENT_ID: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
      LGTM_CI_TOOLING_APP_PRIVATE_KEY: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
