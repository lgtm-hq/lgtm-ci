jobs:
  # Classify platforms and determine build strategy.
  # Outputs use-split=true and a per-platform matrix when push or validate-on-pr
  # is enabled and two or more platforms are requested; otherwise use-split=false.
  classify:
    name: Classify Platforms
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      use-split: ${{ steps.classify.outputs.use-split }}
      matrix: ${{ steps.classify.outputs.matrix }}
      # Policy-enforced evidence flags: equal to the inputs unless push is
      # true and an input opted out, in which case classify warns and forces
      # true (release-security policy, section 1).
      effective-provenance: ${{ steps.classify.outputs.effective-provenance }}
      effective-sbom: ${{ steps.classify.outputs.effective-sbom }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # source-ref = build-context (app source); tooling-ref stays separate
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Classify platforms
        id: classify
        shell: bash
        env:
          STEP: classify
          PLATFORMS: ${{ inputs.platforms }}
          PUSH: ${{ inputs.push }}
          VALIDATE_ON_PR: ${{ inputs.validate-on-pr }}
          PROVENANCE: ${{ inputs.provenance }}
          SBOM: ${{ inputs.sbom }}
          RUNNER_MAP: ${{ inputs.runner-map }}
          SMOKE_TEST: ${{ inputs.smoke-test }}
          SMOKE_TEST_SCRIPT: ${{ inputs.smoke-test-script }}
          HEALTH_CHECK_CMD: ${{ inputs.health-check-cmd }}
          HEALTH_CHECK_PORT: ${{ inputs.health-check-port }}
          HEALTH_CHECK_TIMEOUT: ${{ inputs.health-check-timeout }}
        run: .lgtm-ci-tooling/scripts/ci/actions/build-docker.sh
  # Single-platform builds, or multi-platform when push is disabled (QEMU
  # fallback). Delegated to the focused build reusable.
  build:
    name: Docker build
    needs: classify
    if: ${{ needs.classify.outputs.use-split == 'false' }}
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      platforms: ${{ inputs.platforms }}
      registry: ${{ inputs.registry }}
      image-name: ${{ inputs.image-name }}
      tags: ${{ inputs.tags }}
      version: ${{ inputs.version }}
      source-ref: ${{ inputs.source-ref }}
      tag-latest: ${{ inputs.tag-latest }}
      exact-tags: ${{ inputs.exact-tags }}
      push: ${{ inputs.push }}
      provenance: ${{ fromJSON(needs.classify.outputs.effective-provenance) }}
      sbom: ${{ fromJSON(needs.classify.outputs.effective-sbom) }}
      scan: ${{ inputs.scan }}
      build-args: ${{ inputs.build-args }}
      target: ${{ inputs.target }}
      health-check-cmd: ${{ inputs.health-check-cmd }}
      health-check-port: ${{ inputs.health-check-port }}
      health-check-timeout: ${{ inputs.health-check-timeout }}
      validate-on-pr: ${{ inputs.validate-on-pr }}
      scan-exit-code: ${{ inputs.scan-exit-code }}
      cache-registry-ref: ${{ inputs.cache-registry-ref }}
      cosign-sign: ${{ inputs.cosign-sign }}
      no-cache: ${{ inputs.no-cache }}
      free-disk-space: ${{ inputs.free-disk-space }}
      resource-monitor: ${{ inputs.resource-monitor }}
      tooling-ref: ${{ inputs.tooling-ref }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
      egress-preset: ${{ inputs.egress-preset }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Split per-platform path: runner-map matrix builds, optional smoke-test and
  # health-check gates, manifest merge + verification, provenance, signing.
  multiplatform:
    name: Docker multi-platform
    needs: classify
    if: ${{ needs.classify.outputs.use-split == 'true' }}
    uses: ./.github/workflows/reusable-docker-multiplatform.yml
    with:
      matrix: ${{ needs.classify.outputs.matrix }}
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      platforms: ${{ inputs.platforms }}
      registry: ${{ inputs.registry }}
      image-name: ${{ inputs.image-name }}
      tags: ${{ inputs.tags }}
      version: ${{ inputs.version }}
      source-ref: ${{ inputs.source-ref }}
      tag-latest: ${{ inputs.tag-latest }}
      exact-tags: ${{ inputs.exact-tags }}
      push: ${{ inputs.push }}
      provenance: ${{ fromJSON(needs.classify.outputs.effective-provenance) }}
      sbom: ${{ fromJSON(needs.classify.outputs.effective-sbom) }}
      scan: ${{ inputs.scan }}
      build-args: ${{ inputs.build-args }}
      target: ${{ inputs.target }}
      smoke-test: ${{ inputs.smoke-test }}
      smoke-test-script: ${{ inputs.smoke-test-script }}
      health-check-cmd: ${{ inputs.health-check-cmd }}
      health-check-port: ${{ inputs.health-check-port }}
      health-check-timeout: ${{ inputs.health-check-timeout }}
      validate-on-pr: ${{ inputs.validate-on-pr }}
      scan-exit-code: ${{ inputs.scan-exit-code }}
      cache-registry-ref: ${{ inputs.cache-registry-ref }}
      cosign-sign: ${{ inputs.cosign-sign }}
      no-cache: ${{ inputs.no-cache }}
      free-disk-space: ${{ inputs.free-disk-space }}
      resource-monitor: ${{ inputs.resource-monitor }}
      tooling-ref: ${{ inputs.tooling-ref }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
      egress-preset: ${{ inputs.egress-preset }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
