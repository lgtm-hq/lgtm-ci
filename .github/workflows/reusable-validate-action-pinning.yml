---
name: Reusable Validate Action Pinning

on:
  workflow_call:
    secrets:
      gh-token:
        description: >-
          GitHub token forwarded to the composite action for verify-tags /
          audit-transitive API resolution (e.g. a PAT able to resolve private
          or cross-org actions). Optional — falls back to GH_TOKEN env var,
          then the workflow token.
        required: false
    inputs:
      job-name:
        description: "GitHub check name for the validation job"
        required: false
        type: string
        default: "Validate Action Pinning"
      fail-on-error:
        description: "Fail if non-pinned actions are found"
        required: false
        type: boolean
        default: true
      allow-tag-exceptions:
        description: >-
          Comma-separated full action names allowed to use tag refs when no SHA
          is available (narrow escape hatch; SHA + version comment is required
          otherwise)
        required: false
        type: string
        default: ""
      scan-paths:
        description: "Space-separated paths to scan"
        required: false
        type: string
        default: ".github/workflows .github/actions"
      verify-tags:
        description: >-
          Verify Renovate version comments resolve to the pinned SHA via GitHub
          API. Defaults to true so a lying `sha # vX.Y.Z` comment fails
          validation. Offline/air-gapped or token-restricted callers can set
          this to false to opt out of API tag resolution.
        required: false
        type: boolean
        default: true
      audit-transitive:
        description: >-
          Warn when pinned composite actions reference nested actions by mutable tag
        required: false
        type: boolean
        default: false
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

