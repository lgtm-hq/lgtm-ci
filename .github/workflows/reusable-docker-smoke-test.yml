---
name: Reusable Docker Smoke Test

# Focused, independently callable image-validation reusable: pull a published
# image by immutable digest and run a smoke test (a bare command inside the
# image or a caller-owned script) and/or a detached-container health check
# against it. Shares the same docker/smoke-test.sh and docker/health-check.sh
# helpers the multi-platform verify gate uses. All shared shell scripts resolve
# from lgtm-ci via a cross-repo checkout into .lgtm-ci-tooling.

on:
  workflow_call:
    inputs:
      registry:
        description: "Container registry URL"
        required: false
        type: string
        default: "ghcr.io"
      image-name:
        description: "Image name (default: github.repository)"
        required: false
        type: string
        default: ""
      digest:
        description: >-
          Immutable image digest to validate (sha256:...). The image is pulled
          by digest to avoid TOCTOU against floating tags.
        required: true
        type: string
      platform:
        description: "Target platform to validate (e.g. linux/amd64)"
        required: false
        type: string
        default: "linux/amd64"
      smoke-test:
        description: >-
          Shorthand command + args run as `docker run --rm --platform <p>
          <image@digest> <smoke-test>`. Word-split. Mutually exclusive with
          smoke-test-script.
        required: false
        type: string
        default: ""
      smoke-test-script:
        description: >-
          Path (relative to checkout root) to a caller-owned script executed on
          the runner with env IMAGE, PLATFORM, REGISTRY. Mutually exclusive with
          smoke-test.
        required: false
        type: string
        default: ""
      health-check-cmd:
        description: >-
          Optional command run on the runner against the image's published
          localhost port. Requires health-check-port. Skipped when empty.
        required: false
        type: string
        default: ""
      health-check-port:
        description: "Container port to publish for the health check."
        required: false
        type: string
        default: ""
      health-check-timeout:
        description: "Max wait for health-check-port to accept connections."
        required: false
        type: string
        default: "30s"
      source-ref:
        description: >-
          Git ref to check out for smoke-test-script resolution, independent of
          tooling-ref. Empty uses the triggering ref.
        required: false
        type: string
        default: ""
      runner-image:
        description: "Runner image for the validation job"
        required: false
        type: string
        default: "ubuntu-24.04"
      tooling-ref:
        # yamllint disable-line rule:line-length
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default docker). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "docker"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 30

    secrets:
      DOCKERHUB_USERNAME:
        required: false
        description: "Docker Hub username (for docker.io registry)"
      DOCKERHUB_TOKEN:
        required: false
        description: "Docker Hub token (for docker.io registry)"

