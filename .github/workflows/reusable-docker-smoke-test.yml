jobs:
  smoke-test:
    name: Docker Smoke Test
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository (for smoke-test-script)
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # source-ref = build-context (app source); tooling-ref stays separate
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            scripts/ci/
            .github/actions/docker-auth
      - name: Setup QEMU
        # Default runner is amd64; skip QEMU for the native linux/amd64 default.
        if: ${{ inputs.platform != 'linux/amd64' }}
        # Pinned to SHA for supply chain security
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Docker registry auth
        uses: ./.lgtm-ci-tooling/.github/actions/docker-auth
        with:
          registry: ${{ inputs.registry }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record digest
        shell: bash
        env:
          STEP: record-digest
          DIGEST: ${{ inputs.digest }}
          DIGEST_FILE: ${{ runner.temp }}/staging-digest/digest.txt
        run: .lgtm-ci-tooling/scripts/ci/actions/build-docker.sh
      - name: Smoke test (${{ inputs.platform }})
        if: inputs.smoke-test != '' || inputs.smoke-test-script != ''
        shell: bash
        env:
          STEP: smoke-test
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name || github.repository }}
          DIGEST_FILE: ${{ runner.temp }}/staging-digest/digest.txt
          PLATFORM: ${{ inputs.platform }}
          SMOKE_TEST: ${{ inputs.smoke-test }}
          SMOKE_TEST_SCRIPT: ${{ inputs.smoke-test-script }}
        run: .lgtm-ci-tooling/scripts/ci/actions/build-docker.sh
      - name: Health check (${{ inputs.platform }})
        if: inputs.health-check-cmd != ''
        shell: bash
        env:
          STEP: health-check
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name || github.repository }}
          DIGEST_FILE: ${{ runner.temp }}/staging-digest/digest.txt
          PLATFORM: ${{ inputs.platform }}
          HEALTH_CHECK_CMD: ${{ inputs.health-check-cmd }}
          HEALTH_CHECK_PORT: ${{ inputs.health-check-port }}
          HEALTH_CHECK_TIMEOUT: ${{ inputs.health-check-timeout }}
        run: .lgtm-ci-tooling/scripts/ci/actions/build-docker.sh
