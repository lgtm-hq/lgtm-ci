jobs:
  prepare:
    name: Prepare Rust Matrix
    runs-on: ${{ inputs.runner-image }}
    # Independent short cap: the caller's timeout-minutes bounds the main
    # test job; this coordinator leg keeps its own fixed cap.
    timeout-minutes: 10
    if: >-
      !inputs.draft-pr-skip ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      matrix-count: ${{ steps.matrix.outputs.matrix-count }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      - name: Validate compat/coverage contract
        shell: bash
        env:
          MULTI_VERSIONS: ${{ inputs.rust-toolchains }}
          COVERAGE: ${{ inputs.coverage }}
          PUBLISH_TEST_SUMMARY: ${{ inputs.publish-test-summary }}
          PLATFORM: Rust
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/validate-test-compat-coverage-contract.sh
      # Every job below depends on prepare, so an invalid prefix fails before
      # any upload or download glob uses it (#1091).
      - name: Validate artifact prefix
        shell: bash
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/validate-artifact-prefix.sh
      - name: Generate Rust toolchain matrix
        id: matrix
        shell: bash
        env:
          MATRIX_KEY: rust-toolchain
          MATRIX_LABEL: Rust toolchain
          DEFAULT_VERSION: >-
            ${{ inputs.rust-toolchain != '' && inputs.rust-toolchain ||
            'stable' }}
          VERSIONS_INPUT: ${{ inputs.rust-toolchains }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/generate-version-matrix.sh
  test:
    name: ${{ inputs.job-name }}
    needs: prepare
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: >-
      !inputs.draft-pr-skip ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    outputs:
      tests-passed: ${{ steps.parse.outputs.tests-passed }}
      tests-failed: ${{ steps.parse.outputs.tests-failed }}
      tests-total: ${{ steps.parse.outputs.tests-total }}
      coverage-percent: ${{ steps.parse.outputs.coverage-percent }}
      passed: ${{ steps.record-passed.outputs.passed }}
      pages-coverage-artifact-name: ${{ inputs.pages-coverage-artifact-name }}
      pages-coverage-uploaded: ${{ steps.record-pages-upload.outputs.uploaded }}
    # `github` inside a called workflow is the caller's context, so the group
    # is namespaced by callee, caller repository and caller workflow as well
    # as the ref (#1076); never github.job.
    # yamllint disable rule:line-length
    concurrency:
      group: >-
        lgtm-ci-rust-test-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ inputs.job-name }}-${{ matrix.rust-toolchain }}-${{ inputs.concurrency-scope || 'default' }}
      cancel-in-progress: true
    # yamllint enable rule:line-length

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            .github/actions/
            schemas/
            scripts/ci/
      - name: Setup Rust
        uses: ./.lgtm-ci-tooling/.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.rust-toolchain }}
      - name: Setup nextest toolchain
        shell: bash
        env:
          RAW_SCRIPT_PATH: ${{ inputs.setup-script }}
          DEFAULT_SCRIPT_PATH: .lgtm-ci-tooling/scripts/ci/testing/rust/setup-rust-nextest.sh
          INSTALL_COVERAGE_TOOLS: ${{ inputs.coverage }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-caller-script.sh
      - name: Run Rust tests (nextest)
        id: run-nextest
        if: ${{ !inputs.coverage }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          RAW_SCRIPT_PATH: ${{ inputs.test-script }}
          DEFAULT_SCRIPT_PATH: .lgtm-ci-tooling/scripts/ci/testing/rust/run-rust-nextest.sh
          WORKSPACE: ${{ inputs.workspace }}
          FEATURES: ${{ inputs.features }}
          EXTRA_ARGS: ${{ inputs.extra-args }}
        run: bash "$GITHUB_WORKSPACE/.lgtm-ci-tooling/scripts/ci/actions/run-caller-script.sh"
        continue-on-error: true
      - name: Run Rust tests with coverage (llvm-cov nextest)
        id: run-coverage
        if: inputs.coverage
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          RAW_SCRIPT_PATH: ${{ inputs.test-script }}
          DEFAULT_SCRIPT_PATH: >-
            .lgtm-ci-tooling/scripts/ci/testing/rust/run-rust-nextest-coverage.sh
          WORKSPACE: ${{ inputs.workspace }}
          FEATURES: ${{ inputs.features }}
          EXTRA_ARGS: ${{ inputs.extra-args }}
        run: bash "$GITHUB_WORKSPACE/.lgtm-ci-tooling/scripts/ci/actions/run-caller-script.sh"
        continue-on-error: true
      # JUnit (+ LCOV) -> results/nextest/<toolchain>/results.json (results.v1,
      # #1080); every tests-* / coverage-percent output is read back from it.
      - name: Parse test results
        id: parse
        if: always()
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          JUNIT_FILE: target/nextest/ci/junit.xml
          LCOV_FILE: rust-coverage.lcov
          COVERAGE_ENABLED: ${{ inputs.coverage }}
          # Parenthesised as a whole: && binds tighter than ||, so without
          # the outer group the nextest path would yield `true`, not '0'.
          EXIT_CODE: >-
            ${{ (
              (!inputs.coverage && steps.run-nextest.outcome == 'success')
              || (inputs.coverage && steps.run-coverage.outcome == 'success')
            ) && '0' || '1' }}
          MATRIX_KEY: rust-toolchain
          MATRIX_VALUE: ${{ matrix.rust-toolchain }}
          RESULTS_SOURCE_VERSION: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
        run: >-
          bash "$GITHUB_WORKSPACE/.lgtm-ci-tooling/scripts/ci/testing/rust/parse-rust-test-results.sh"
      # Convenience payload for the test-summary comment, never the test
      # verdict — the publisher downloads it with continue-on-error and skips
      # the rich comment when it is absent. The coverage gate below is the
      # verdict and is unaffected.
      - name: Upload LCOV for test summary
        id: upload-summary-lcov
        if: >-
          always()
          && inputs.coverage
          && inputs.publish-test-summary
          && inputs.rust-toolchains == ''
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Namespaced by artifact-prefix so two calls in one run keep their
          # own LCOV (#1091); the publish job downloads this same name.
          name: ${{ inputs.artifact-prefix }}-coverage-lcov
          path: ${{ inputs.working-directory }}/rust-coverage.lcov
          if-no-files-found: ignore
          # overwrite only covers a rerun of this same call replacing its
          # earlier attempt. Isolation between calls comes from
          # artifact-prefix, never from overwrite (#728/#752).
          overwrite: true
      - name: Warn on failed summary LCOV upload
        if: always() && steps.upload-summary-lcov.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Summary LCOV upload failed; the test result is unaffected."
      - name: Check coverage threshold
        id: coverage-gate
        if: inputs.coverage && inputs.coverage-threshold > 0
        continue-on-error: true
        uses: ./.lgtm-ci-tooling/.github/actions/check-coverage-threshold
        with:
          coverage-percent: ${{ steps.parse.outputs.coverage-percent }}
          threshold: ${{ inputs.coverage-threshold }}
      # A gate that fails after the parser wrote the document must reach the
      # document too, or the uploaded artifact would carry a false "passed".
      - name: Record gate verdict in results
        if: always() && (steps.coverage-gate.outcome == 'failure')
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          RESULTS_FILE: ${{ steps.parse.outputs.results-json }}
          STATUS: failed
        run: bash "$GITHUB_WORKSPACE"/.lgtm-ci-tooling/scripts/ci/actions/results-update.sh
      - name: Upload matrix test summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Namespaced by artifact-prefix so two calls in one run keep their
          # own summaries (#1091); the toolchain suffix separates matrix legs.
          name: ${{ inputs.artifact-prefix }}-results-${{ matrix.rust-toolchain }}
          path: ${{ inputs.working-directory }}/results/nextest/${{ matrix.rust-toolchain }}/results.json
          retention-days: 7
          if-no-files-found: error
          # The aggregate job's verdict reads this summary, so no
          # continue-on-error — overwrite only, so a rerun of this same
          # call's leg replaces its earlier attempt. Isolation between calls
          # comes from artifact-prefix, never from overwrite (#728/#752).
          overwrite: true
      - name: Generate Rust coverage HTML
        if: >-
          inputs.coverage
          && inputs.upload-pages-coverage-html
          && steps.run-coverage.outcome == 'success'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          RUST_COVERAGE_HTML_DIR: ${{ inputs.pages-coverage-artifact-name }}
        run: >-
          bash "$GITHUB_WORKSPACE/.lgtm-ci-tooling/scripts/ci/testing/rust/run-rust-coverage-html.sh"
      - name: Evaluate pages coverage upload gate
        id: pages-upload-gate
        if: inputs.coverage && inputs.upload-pages-coverage-html
        shell: bash
        env:
          PAGES_COVERAGE_UPLOAD_ON: ${{ inputs.pages-coverage-upload-on }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/pages-coverage-upload-gate.sh
      - name: Upload pages coverage HTML artifact
        id: pages-upload
        if: >-
          inputs.coverage
          && inputs.upload-pages-coverage-html
          && steps.run-coverage.outcome == 'success'
          && steps.pages-upload-gate.outputs.should-upload == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.pages-coverage-artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.pages-coverage-artifact-name }}/
          retention-days: 7
          if-no-files-found: error
          # This upload's outcome is recorded and gates the Pages bundle, so it
          # keeps its own failure semantics — overwrite only.
          overwrite: true
      - name: Fail on test errors
        if: >-
          (!inputs.coverage && steps.run-nextest.outcome == 'failure')
          || (inputs.coverage && steps.run-coverage.outcome == 'failure')
        shell: bash
        run: exit 1
      - name: Fail on coverage threshold
        if: steps.coverage-gate.outcome == 'failure'
        shell: bash
        run: exit 1
      - name: Record pages coverage upload result
        if: always()
        id: record-pages-upload
        shell: bash
        env:
          OUTPUT_NAME: uploaded
          CONDITION_VALUE: ${{ steps.pages-upload.outcome }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/set-conditional-output.sh
      - name: Record job passed output
        if: always()
        id: record-passed
        shell: bash
        env:
          OUTPUT_NAME: passed
          CONDITION_VALUE: ${{ job.status }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/set-conditional-output.sh
  aggregate:
    name: Aggregate Rust Results
    needs:
      - prepare
      - test
    if: >-
      always()
      && (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ${{ inputs.runner-image }}
    # Independent short cap: the caller's timeout-minutes bounds the main
    # test job; this coordinator leg keeps its own fixed cap.
    timeout-minutes: 10
    permissions:
      # `actions: read` is the one scope the REST artifact listing accepts
      # from GITHUB_TOKEN. The pre-aggregation availability wait (#803) polls
      # `GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts` so a leg
      # whose upload succeeded but is not yet listed does not fail the
      # aggregate. A reusable workflow's request is validated statically, so
      # every caller must grant `actions: read` on this call (documented in
      # docs/reusable-workflows.md); it was deliberately absent before #803
      # (#730), when the job only used the runtime-token download action.
      actions: read
      contents: read
    outputs:
      tests-passed: ${{ steps.aggregate.outputs.tests-passed }}
      tests-failed: ${{ steps.aggregate.outputs.tests-failed }}
      tests-total: ${{ steps.aggregate.outputs.tests-total }}
      coverage-percent: ${{ steps.aggregate.outputs.coverage-percent }}
      passed: ${{ needs.test.result == 'success' && steps.aggregate.outputs.passed == 'true' }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Fail if matrix preparation did not succeed
        # A failed or cancelled prepare skips the matrix; failing here keeps
        # the required check from reporting a skip, which rulesets treat as a pass.
        if: needs.prepare.result != 'success'
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          echo "::error::Matrix preparation concluded '${PREPARE_RESULT}'; failing the check."
          exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      # Single-version calls (empty `rust-toolchains`) gate on the test job
      # result alone and skip the download: a cost optimisation only, since
      # the glob below is namespaced by artifact-prefix (#1091). That isolates
      # calls that were given distinct prefixes; two calls that both keep the
      # default still share names, and the availability wait keeps the newest
      # artifact per name, so it cannot detect that case.
      # Bounded availability wait, then download (#803): the artifact listing
      # is eventually consistent, so a one-shot download can miss a leg whose
      # upload already succeeded. Only under-counts and 404s on a listed id are
      # retried; an over-count fails at once as sibling contamination (#752).
      - name: Wait for and download matrix results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_DIR: rust-results
          # By-name matrix check only for a multi-version call; a single
          # version downloads its exact artifact name (#752).
          MATRIX_JSON: ${{ inputs.rust-toolchains != '' && needs.prepare.outputs.matrix || '' }}
          MATRIX_KEY: ${{ inputs.rust-toolchains != '' && 'rust-toolchain' || '' }}
          EXPECTED_COUNT: ${{ needs.prepare.outputs.matrix-count }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          RESULTS_PATTERN: >-
            ${{ inputs.rust-toolchains != '' && format('{0}-results-*', inputs.artifact-prefix)
            || format('{0}-results-{1}', inputs.artifact-prefix, inputs.rust-toolchain || 'stable') }}
          # A leg that was cancelled or crashed before uploading never shows
          # up; the aggregate still fails closed, so do not spend the full
          # budget waiting for it.
          WAIT_BUDGET_SECONDS: ${{ needs.test.result == 'success' && '90' || '10' }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/wait-for-artifacts.sh
          "$EXPECTED_COUNT" "$RESULTS_PATTERN"
      - name: Aggregate matrix results
        id: aggregate
        shell: bash
        env:
          RESULTS_DIR: rust-results
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          # The public tests-total output has always been passed + failed
          # for Rust (skipped excluded from the pass rate); counts.total in
          # the document stays inclusive.
          TESTS_TOTAL_EXCLUDES_SKIPPED: "true"
        run: bash .lgtm-ci-tooling/scripts/ci/actions/aggregate-results.sh
      - name: Fail if any matrix leg failed
        # Fail closed (#1058): rulesets require this context directly, so a
        # failing matrix leg must fail the job, not just set `passed=false`.
        if: >-
          always()
          && (needs.test.result != 'success' || steps.aggregate.outputs.passed != 'true')
        shell: bash
        run: |
          echo "::error::A matrix test leg failed or its results could not be aggregated; failing the check."
          exit 1
  publish-test-summary:
    needs:
      - prepare
      - test
      - aggregate
    if: >-
      always()
      && (
        needs.aggregate.result == 'success'
        || needs.aggregate.result == 'failure'
        || needs.aggregate.result == 'skipped'
      )
      && (
        needs.test.result == 'success'
        || needs.test.result == 'failure'
      )
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
      && inputs.publish-test-summary
      && (
        !inputs.draft-pr-skip ||
        github.event.pull_request.draft == false
      )
    uses: ./.github/workflows/reusable-publish-test-summary.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      test-suite-name: ${{ inputs.job-name }}
      comment-marker: ${{ inputs.comment-marker }}
      # The comment is rendered from this call's results.v1 artifacts, the
      # same ones the aggregate verdict read (#1080): single toolchain by
      # exact name, matrix by prefix glob.
      results-artifact-pattern: >-
        ${{ inputs.rust-toolchains != '' && format('{0}-results-*', inputs.artifact-prefix)
        || format('{0}-results-{1}', inputs.artifact-prefix, inputs.rust-toolchain || 'stable') }}
      results-expected-count: ${{ needs.prepare.outputs.matrix-count }}
      # Rust pass rates have always excluded skipped tests from the total.
      tests-total-excludes-skipped: true
      coverage-enabled: ${{ inputs.coverage }}
      coverage-threshold: ${{ inputs.coverage-threshold }}
      job-result: ${{ needs.aggregate.outputs.passed == 'true' && 'success' || 'failure' }}
      rich-coverage-comment: ${{ inputs.coverage }}
      # Same name the test job uploaded (#1091): the rich coverage comment
      # must read this call's LCOV, not a sibling call's.
      coverage-artifact-name: >-
        ${{ inputs.coverage && format('{0}-coverage-lcov', inputs.artifact-prefix) || '' }}
      coverage-file: rust-coverage.lcov
      coverage-format: lcov
      tooling-ref: ${{ inputs.tooling-ref }}
