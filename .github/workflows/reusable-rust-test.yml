# SPDX-License-Identifier: MIT
---
name: Reusable Rust Test Workflow

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: "Rust toolchain for single-version runs"
        required: false
        type: string
        default: ""
      rust-toolchains:
        description: "Comma-separated Rust toolchains for a compat test matrix"
        required: false
        type: string
        default: ""
      features:
        description: "Feature flags for cargo (e.g., --all-features)"
        required: false
        type: string
        default: "--all-features"
      workspace:
        description: >-
          Run tests with --workspace. Both paths run `cargo nextest run
          --profile ci` and read target/nextest/ci/junit.xml, so the
          repository needs .config/nextest.toml with a `ci` profile whose
          junit.path is "junit.xml" (relative to that store dir): copy
          examples/nextest-ci.toml (#1086).
        required: false
        type: boolean
        default: true
      extra-args:
        description: "Additional arguments passed to cargo nextest"
        required: false
        type: string
        default: ""
      coverage:
        description: >-
          When true, run cargo llvm-cov nextest once (tests + LCOV). When false,
          run cargo nextest only. Never runs both in the same workflow.
        required: false
        type: boolean
        default: false
      coverage-threshold:
        description: "Minimum line coverage percentage to pass (coverage mode only)"
        required: false
        type: number
        default: 0
      setup-script:
        description: "Optional override for nextest/coverage toolchain setup script"
        required: false
        type: string
        default: ""
      test-script:
        description: >-
          Optional override for the test run script. The default runs the
          nextest `ci` profile from the repository's .config/nextest.toml
          (prerequisite; see examples/nextest-ci.toml); an override must
          still leave JUnit at target/nextest/ci/junit.xml for the parser.
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory for Rust tests"
        required: false
        type: string
        default: "."
      upload-pages-coverage-html:
        description: "Upload flat HTML coverage artifact for Model B Pages bundling"
        required: false
        type: boolean
        default: false
      pages-coverage-artifact-name:
        description: "Artifact name for flat Rust HTML coverage upload"
        required: false
        type: string
        default: "rust-coverage-html"
      pages-coverage-upload-on:
        description: "When to upload flat Rust HTML coverage (v1: push-main only)"
        required: false
        type: string
        default: "push-main"
      publish-test-summary:
        description: >-
          Publish or update the test summary comment on the pull request for this workflow run (rich
          coverage table when coverage is enabled, otherwise test pass/fail totals)
        required: false
        type: boolean
        default: true
      comment-marker:
        description: "Upsert marker for the Rust test summary comment"
        required: false
        type: string
        default: "rust-test-results"
      artifact-prefix:
        description: >-
          Namespace for this call's artifacts (<prefix>-coverage-lcov,
          <prefix>-results-<toolchain>); give a second call in the same run
          its own prefix so the two calls' coverage and result summaries do
          not overwrite each other (#1091). Must match [A-Za-z0-9_.]+ ('-'
          separates prefix from the rest of the name)
        required: false
        type: string
        default: "rust"
      job-name:
        description: "GitHub check name for the Rust test job"
        required: false
        type: string
        default: "Rust Tests"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      draft-pr-skip:
        description: "Skip jobs on draft pull requests"
        required: false
        type: boolean
        default: true
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default quality). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "quality"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 45

      concurrency-scope:
        description: >-
          Optional suffix for the concurrency group. The group is namespaced
          by callee, caller repository, caller workflow and ref, so two caller
          workflows on one ref never cancel each other (#1076, #108 history);
          set this when one caller workflow invokes this reusable twice.
        required: false
        type: string
        default: ""

    outputs:
      # Every value below is read from this call's results.v1 documents by
      # the aggregate job (#1080): the same numbers the matrix legs wrote,
      # for a single toolchain and a matrix alike.
      tests-passed:
        description: "Number of tests passed"
        value: ${{ jobs.aggregate.outputs.tests-passed }}
      tests-failed:
        description: "Number of tests failed"
        value: ${{ jobs.aggregate.outputs.tests-failed }}
      tests-total:
        description: "Total number of tests"
        value: ${{ jobs.aggregate.outputs.tests-total }}
      coverage-percent:
        description: "Coverage percentage"
        value: ${{ jobs.aggregate.outputs.coverage-percent }}
      passed:
        description: "Whether all tests passed"
        value: ${{ jobs.aggregate.outputs.passed }}
      pages-coverage-artifact-name:
        description: "Resolved flat HTML coverage artifact name"
        value: ${{ jobs.test.outputs.pages-coverage-artifact-name }}
      pages-coverage-uploaded:
        description: "Whether flat HTML coverage artifact was uploaded this run"
        value: ${{ jobs.test.outputs.pages-coverage-uploaded }}

