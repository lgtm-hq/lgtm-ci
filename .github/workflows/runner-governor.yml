jobs:
  governor:
    # Scheduling is opt-in only after the documented acceptance evidence.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
      || vars.LGTM_CI_RUNNER_GOVERNOR_ENABLED == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Separate repository token for the status issue; the App owns org writes.
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Manual dry-runs audit the candidate allowlist before activation.
          egress-policy: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'audit' || 'block' }}
          allowed-endpoints: ${{ fromJSON(env.LGTM_CI_EGRESS_PRESETS)['runner-governor'] }}

      - name: Checkout governor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Install pinned Blacksmith CLI
        id: install
        run: bash scripts/ci/runners/install-blacksmith.sh

      - name: Create governor App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RUNNER_GOVERNOR_APP_ID }}
          private-key: ${{ secrets.RUNNER_GOVERNOR_APP_PRIVATE_KEY }}
          owner: lgtm-hq
          # This action has no organization Variables permission input. Omit
          # permission-* so that scope is retained from the App installation.
          # The App must have only Variables write, Administration read and
          # repository metadata read. See the runbook for visibility coverage.

      - name: Decide and apply runner value
        # Also summarize setup failures; all reads must succeed before a write.
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STATUS_TOKEN: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry-run) && github.token || '' }}
          BLACKSMITH_ORG_TOKEN: ${{ secrets.BLACKSMITH_ORG_TOKEN }}
          BLACKSMITH_ORG: ${{ vars.BLACKSMITH_ORG }}
          BLACKSMITH_DISABLE_AUTO_UPDATE: '1'
          LGTM_CI_RUNNER_GOVERNOR_ENABLED: ${{ vars.LGTM_CI_RUNNER_GOVERNOR_ENABLED }}
          LGTM_CI_RUNNER_MODE: ${{ vars.LGTM_CI_RUNNER_MODE }}
          LGTM_CI_RUNNER_BLACKSMITH_LABEL: ${{ vars.LGTM_CI_RUNNER_BLACKSMITH_LABEL }}
          LGTM_CI_RUNNER_BUDGET_MINUTES: ${{ vars.LGTM_CI_RUNNER_BUDGET_MINUTES }}
          LGTM_CI_RUNNER_GITHUB_INCLUDED_MINUTES: ${{ vars.LGTM_CI_RUNNER_GITHUB_INCLUDED_MINUTES }}
          LGTM_CI_RUNNER_OVERAGE: ${{ vars.LGTM_CI_RUNNER_OVERAGE }}
          LGTM_CI_RUNNER_CYCLE_DAY: ${{ vars.LGTM_CI_RUNNER_CYCLE_DAY }}
          SETUP_READY: >-
            ${{ steps.install.outcome == 'success' && steps.token.outcome == 'success' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
        run: python3 scripts/ci/runners/runner_governor.py --dry-run "$DRY_RUN"

  notify-failure:
    needs: [governor]
    if: >-
      failure() && github.ref == 'refs/heads/main'
      && !(github.event_name == 'workflow_dispatch' && inputs.dry-run)
    uses: ./.github/workflows/reusable-main-failure-notifier.yml
    with:
      workflow-key: runner-governor
      runner-image: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      issues: write
