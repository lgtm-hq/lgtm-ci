jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_prefix: >-
        ${{ inputs.artifact-prefix != '' && inputs.artifact-prefix ||
        github.event.repository.name }}
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # Fixed preset from the literal map in env (not caller-selectable).
          allowed-endpoints: ${{ fromJSON(env.LGTM_CI_EGRESS_PRESETS)['github-minimal'] }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: block
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # github.com only: on GHES every runner is self-hosted and "public" means
              # visible inside the instance, so there it keeps the warning below.
              if [[ "${REPOSITORY_PRIVATE:-}" == false &&
                "${GITHUB_SERVER_URL:-https://github.com}" == https://github.com ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input)"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet. grep exit 2 (unreadable log) fails closed.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
            .github/actions/
            scripts/ci/
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Warn on explicit tooling-ref override
        # hashFiles guards callers that pin a tooling-ref predating the script.
        if: >-
          inputs.tooling-ref != ''
          && hashFiles('.lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh') != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh
      - name: Refuse a diverging tooling-ref
        # Workflow-owned: generated from check-tooling-ref-divergence.sh by
        # sync_inline_blocks.py, so the override tree never judges itself (#1450).
        # GHES (empty job.workflow_sha) skips with a notice.
        if: inputs.tooling-ref != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ALLOW_DIVERGENCE: ${{ inputs.tooling-ref-allow-divergence }}
        run: |
          # lgtm-ci-inline:begin refuse-diverging-tooling-ref
          # Workflow-owned: the tooling tree under judgment never supplies this guard.
          set -euo pipefail

          override="${TOOLING_REF_OVERRIDE:-}"
          if [[ -z "${override}" ]]; then
            exit 0
          fi

          workflow_sha="${WORKFLOW_SHA:-}"
          if [[ -z "${workflow_sha}" ]]; then
            notice="job.workflow_sha is unavailable on this platform;"
            notice+=" skipping the divergence check for tooling-ref ${override}"
            echo "::notice title=tooling-ref divergence::${notice}"
            exit 0
          fi

          tooling_dir="${TOOLING_DIR:-.lgtm-ci-tooling}"
          if ! tooling_sha="$(git -C "${tooling_dir}" rev-parse HEAD 2> /dev/null)"; then
            echo "::error title=tooling-ref divergence::could not resolve HEAD" \
              "of the tooling checkout at ${tooling_dir}"
            exit 1
          fi

          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          if [[ "$(lower "${tooling_sha}")" == "$(lower "${workflow_sha}")" ]]; then
            exit 0
          fi

          detail="tooling-ref ${override} resolved to ${tooling_sha},"
          detail+=" but this workflow runs at ${workflow_sha} (job.workflow_sha)"
          if [[ "${ALLOW_DIVERGENCE:-}" == "true" ]]; then
            echo "::warning title=tooling-ref divergence::${detail};" \
              "continuing because tooling-ref-allow-divergence is true (GHES/mirror escape hatch)"
            exit 0
          fi

          echo "::error title=tooling-ref divergence::${detail}." \
            "Workflow YAML at one commit would run scripts from another." \
            "tooling-ref is deprecated (#995): remove tooling-ref so tooling follows the workflow pin." \
            "GHES or mirror callers that must diverge can set tooling-ref-allow-divergence: true."
          exit 1
          # lgtm-ci-inline:end refuse-diverging-tooling-ref
      - name: Validate runner policy
        id: policy
        uses: ./.lgtm-ci-tooling/.github/actions/validate-runner-policy
        with:
          tier: strict
          egress-policy: block
          runner-environment: ${{ runner.environment }}
          runner-os: ${{ runner.os }}
      - name: Read Cargo version
        id: version
        shell: bash
        env:
          VERSION_FILE: ${{ inputs.version-file }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/read-cargo-version.sh
      - name: Verify tag matches Cargo.toml
        shell: bash
        env:
          TAG: >-
            ${{ inputs.tag-name != '' && inputs.tag-name || github.ref_name }}
          VERSION_FILE: ${{ inputs.version-file }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/verify-rust-release-tag.sh
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Second snapshot of the harden-runner agent at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS at job end"
          # lgtm-ci-inline:end recheck-harden-runner-agent
  build-binaries:
    name: Build release binaries
    needs: verify-tag
    permissions:
      contents: read
      # OIDC token issuance for Sigstore authentication during attestation
      id-token: write
      # SLSA provenance attestations via nested reusable-build-rust-binaries.yml
      attestations: write
    uses: ./.github/workflows/reusable-build-rust-binaries.yml
    secrets:
      LGTM_CI_TOOLING_TOKEN: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
    with:
      egress-policy: ${{ inputs.egress-policy }}
      # The nested reusable resolves its own job.workflow_sha; `job` is not
      # available at jobs.<id>.with, so only the override is passed through.
      tooling-ref: ${{ inputs.tooling-ref }}
      tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
      packages: ${{ inputs.packages }}
      binary-names: ${{ inputs.binary-names }}
      targets: ${{ inputs.targets }}
      artifact-prefix: ${{ needs.verify-tag.outputs.artifact_prefix }}
      build-script: ${{ inputs.build-script }}
      package-script: ${{ inputs.package-script }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
      version-file: ${{ inputs.version-file }}

  github-release:
    name: Create GitHub release
    needs: [verify-tag, build-binaries]
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Create GitHub Release and upload release assets
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      release-url: ${{ steps.release.outputs.release-url }}
      release-id: ${{ steps.release.outputs.release-id }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # Fixed preset from the literal map in env (not caller-selectable).
          # GitHub artifact transfers use harden-runner's implicit endpoints.
          allowed-endpoints: ${{ fromJSON(env.LGTM_CI_EGRESS_PRESETS)['github-tooling'] }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: block
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # github.com only: on GHES every runner is self-hosted and "public" means
              # visible inside the instance, so there it keeps the warning below.
              if [[ "${REPOSITORY_PRIVATE:-}" == false &&
                "${GITHUB_SERVER_URL:-https://github.com}" == https://github.com ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input)"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet. grep exit 2 (unreadable log) fails closed.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
            .github/actions/validate-runner-policy
            scripts/ci/
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Refuse a diverging tooling-ref
        # Workflow-owned: generated from check-tooling-ref-divergence.sh by
        # sync_inline_blocks.py, so the override tree never judges itself (#1450).
        # GHES (empty job.workflow_sha) skips with a notice.
        if: inputs.tooling-ref != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ALLOW_DIVERGENCE: ${{ inputs.tooling-ref-allow-divergence }}
        run: |
          # lgtm-ci-inline:begin refuse-diverging-tooling-ref
          # Workflow-owned: the tooling tree under judgment never supplies this guard.
          set -euo pipefail

          override="${TOOLING_REF_OVERRIDE:-}"
          if [[ -z "${override}" ]]; then
            exit 0
          fi

          workflow_sha="${WORKFLOW_SHA:-}"
          if [[ -z "${workflow_sha}" ]]; then
            notice="job.workflow_sha is unavailable on this platform;"
            notice+=" skipping the divergence check for tooling-ref ${override}"
            echo "::notice title=tooling-ref divergence::${notice}"
            exit 0
          fi

          tooling_dir="${TOOLING_DIR:-.lgtm-ci-tooling}"
          if ! tooling_sha="$(git -C "${tooling_dir}" rev-parse HEAD 2> /dev/null)"; then
            echo "::error title=tooling-ref divergence::could not resolve HEAD" \
              "of the tooling checkout at ${tooling_dir}"
            exit 1
          fi

          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          if [[ "$(lower "${tooling_sha}")" == "$(lower "${workflow_sha}")" ]]; then
            exit 0
          fi

          detail="tooling-ref ${override} resolved to ${tooling_sha},"
          detail+=" but this workflow runs at ${workflow_sha} (job.workflow_sha)"
          if [[ "${ALLOW_DIVERGENCE:-}" == "true" ]]; then
            echo "::warning title=tooling-ref divergence::${detail};" \
              "continuing because tooling-ref-allow-divergence is true (GHES/mirror escape hatch)"
            exit 0
          fi

          echo "::error title=tooling-ref divergence::${detail}." \
            "Workflow YAML at one commit would run scripts from another." \
            "tooling-ref is deprecated (#995): remove tooling-ref so tooling follows the workflow pin." \
            "GHES or mirror callers that must diverge can set tooling-ref-allow-divergence: true."
          exit 1
          # lgtm-ci-inline:end refuse-diverging-tooling-ref
      - name: Validate runner policy
        id: policy
        uses: ./.lgtm-ci-tooling/.github/actions/validate-runner-policy
        with:
          tier: strict
          egress-policy: block
          runner-environment: ${{ runner.environment }}
          runner-os: ${{ runner.os }}
      - name: Download binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.verify-tag.outputs.artifact_prefix }}-*
          merge-multiple: true
          path: dist
      - name: Aggregate checksum manifests
        shell: bash
        env:
          ARTIFACT_PATH: dist
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/aggregate-rust-release-checksums.sh
      - name: Verify release assets exist
        shell: bash
        env:
          FILES: "dist/*"
          ARTIFACT_PATH: dist
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/verify-release-assets.sh
      - name: Create GitHub Release
        id: release
        shell: bash
        env:
          TAG: >-
            ${{ inputs.tag-name != '' && inputs.tag-name || github.ref_name }}
          TITLE: >-
            ${{ inputs.tag-name != '' && inputs.tag-name || github.ref_name }}
          GENERATE_NOTES: ${{ inputs.generate-release-notes }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          FILE_PATTERNS: "dist/*"
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/create-github-release.sh
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Second snapshot of the harden-runner agent at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS at job end"
          # lgtm-ci-inline:end recheck-harden-runner-agent
