# SPDX-License-Identifier: MIT
---
name: Reusable Rust Release Publish Workflow

on:
  workflow_call:
    inputs:
      egress-policy:
        description: "harden-runner egress policy (block only; audit rejected)"
        required: false
        type: string
        default: "block"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        default: ""
        type: string
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false
      packages:
        description: "Comma-separated Cargo package names to build"
        required: true
        type: string
      binary-names:
        description: >-
          Optional comma-separated binary names parallel to packages
        required: false
        type: string
        default: ""
      targets:
        description: "JSON matrix override for binary targets"
        required: false
        type: string
        default: ""
      artifact-prefix:
        description: "Artifact name prefix (defaults to repository name)"
        required: false
        type: string
        default: ""
      version-file:
        description: "Cargo.toml path for tag/version verification"
        required: false
        type: string
        default: "Cargo.toml"
      build-script:
        description: "Override path to build script"
        required: false
        type: string
        default: ""
      package-script:
        description: "Override path to packaging script"
        required: false
        type: string
        default: ""
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list for the nested build job only
          (reusable-build-rust-binaries, rust-release preset). The tag
          verification and GitHub release jobs keep fixed github-minimal /
          github-tooling presets. Composed at job start, so it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          append (default): rust-release preset plus allowed-endpoints in the
          build job; replace: non-empty allowed-endpoints is used instead
        required: false
        type: string
        default: "append"
      tag-name:
        description: "Release tag (defaults to github.ref_name)"
        required: false
        type: string
        default: ""
      generate-release-notes:
        description: "Use GitHub auto-generated release notes"
        required: false
        type: boolean
        default: true
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: "Timeout for verify and release jobs"
        required: false
        type: number
        default: 15

    outputs:
      release-url:
        description: "URL of the created GitHub release"
        value: ${{ jobs.github-release.outputs.release-url }}
      release-id:
        description: "ID of the created GitHub release"
        value: ${{ jobs.github-release.outputs.release-id }}
      version:
        description: "Verified Cargo workspace version"
        value: ${{ jobs.verify-tag.outputs.version }}
    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false

