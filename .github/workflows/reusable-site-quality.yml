  # lgtm-ci-egress-presets:end

jobs:
  site-build-link:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: >-
      !inputs.draft-pr-skip ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.record.outputs.passed }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'],
            inputs.allowed-endpoints) }}
      - name: Verify harden-runner agent
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          if [[ -e "$annotations" ]] && grep -q 'subscription is required' "$annotations"; then
            echo "::error title=StepSecurity subscription required::private repository" \
              "without a StepSecurity subscription: the agent downgraded block to audit." \
              "Resolve the repository's StepSecurity subscription or enrollment;" \
              "another runner will not help"
            exit 1
          fi
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.4"
      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: >-
            ${{ format('{0}/package.json', inputs.site-working-directory) }}
      - name: Get bun cache directory
        if: inputs.package-manager == 'bun'
        id: bun-cache
        shell: bash
        env:
          STEP: bun-cache
        run: bash .lgtm-ci-tooling/scripts/ci/actions/setup-node.sh
      - name: Cache bun dependencies
        if: inputs.package-manager == 'bun'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.bun-cache.outputs.dir }}
            ${{ inputs.site-working-directory }}/node_modules
          key: >-
            bun-${{ runner.os }}-${{ inputs.node-version }}-${{
            hashFiles(inputs.cache-dependency-path != '' && inputs.cache-dependency-path
            || format('{0}/bun.lock', inputs.site-working-directory)) }}
          restore-keys: |
            bun-${{ runner.os }}-${{ inputs.node-version }}-
            bun-${{ runner.os }}-
      - name: Install dependencies
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          WORKING_DIRECTORY: ${{ inputs.site-working-directory }}
          FROZEN_LOCKFILE: "true"
        run: bash .lgtm-ci-tooling/scripts/ci/actions/setup-package-manager.sh
      - name: Apply build environment
        if: inputs.build-env != ''
        shell: bash
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/apply-build-env.sh
      - name: Build site
        id: build
        shell: bash
        env:
          COMMAND: ${{ inputs.build-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-command.sh
      - name: Build Lychee arguments
        if: inputs.enable-lychee
        id: lychee-args
        shell: bash
        env:
          PATHS: ${{ inputs.lychee-paths }}
          FILE_EXTENSIONS: ${{ inputs.lychee-file-extensions }}
          EXCLUDE_PATTERNS: ${{ inputs.lychee-exclude-patterns }}
          CHECK_EXTERNAL: ${{ inputs.check-external }}
          TIMEOUT: ${{ inputs.lychee-timeout }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/build-lychee-args.sh
      - name: Prepare Lychee action inputs
        if: inputs.enable-lychee
        id: lychee-action
        shell: bash
        env:
          RAW_ARGS: ${{ steps.lychee-args.outputs.args }}
          LYCHEE_ROOT_DIR: >-
            ${{ inputs.lychee-root-dir != '' && inputs.lychee-root-dir
            || inputs.lychee-paths }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/prepare-lychee-action-args.sh
      - name: Check links
        if: inputs.enable-lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ steps.lychee-action.outputs.args }}
          format: markdown
          output: lychee-report.md
          token: ${{ github.token }}
          fail: true
      # Convenience payload only: the lychee step runs with fail: true and owns
      # the link verdict, and nothing downloads this artifact. A storage hiccup
      # must not flip the job (whose status this workflow reports as `passed`).
      - name: Upload lychee report
        id: upload-link-report
        if: >-
          always()
          && inputs.enable-lychee
          && hashFiles('lychee-report.md') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.link-report-artifact-name }}
          path: lychee-report.md
          retention-days: 1
          if-no-files-found: ignore
          # A caller may run this workflow twice in one run; the later attempt
          # is authoritative, so overwrite instead of 409ing.
          overwrite: true
      - name: Warn on failed lychee report upload
        if: always() && steps.upload-link-report.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Lychee report upload failed; the link result is unaffected."
      - name: Resolve site artifact path
        if: inputs.upload-site-artifact
        id: site-artifact
        shell: bash
        env:
          SITE_ARTIFACT_PATH: ${{ inputs.site-artifact-path }}
          LYCHEE_PATHS: ${{ inputs.lychee-paths }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/resolve-site-artifact-path.sh
      - name: Upload site artifact
        if: >-
          always()
          && inputs.upload-site-artifact
          && steps.build.outcome == 'success'
          && steps.site-artifact.outputs.path != ''
          && steps.site-artifact.outputs.path != '.'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.site-artifact-name }}
          path: ${{ steps.site-artifact.outputs.path }}
          retention-days: 1
          # Site dist is a job verdict input for downstream deploys, so no
          # continue-on-error here — only make a repeated call in one run
          # publish its latest build instead of 409ing.
          overwrite: true
      - name: Record build and link result
        if: always()
        id: record
        shell: bash
        env:
          OUTPUT_NAME: passed
          CONDITION_VALUE: ${{ job.status }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/set-conditional-output.sh
  site-test:
    name: ${{ inputs.test-job-name }}
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: >-
      !inputs.draft-pr-skip ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.record.outputs.passed }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          # The test job's explicit list is test-allowed-endpoints, falling back
          # to allowed-endpoints; its preset is test-egress-preset, falling back
          # to egress-preset.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append'
            && (inputs.test-allowed-endpoints != '' || inputs.allowed-endpoints != ''))
            && (inputs.test-allowed-endpoints != '' && inputs.test-allowed-endpoints || inputs.allowed-endpoints)
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.test-egress-preset || inputs.egress-preset || 'github-tooling'],
            (inputs.test-allowed-endpoints != '' && inputs.test-allowed-endpoints || inputs.allowed-endpoints)) }}
      - name: Verify harden-runner agent
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          if [[ -e "$annotations" ]] && grep -q 'subscription is required' "$annotations"; then
            echo "::error title=StepSecurity subscription required::private repository" \
              "without a StepSecurity subscription: the agent downgraded block to audit." \
              "Resolve the repository's StepSecurity subscription or enrollment;" \
              "another runner will not help"
            exit 1
          fi
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          (inputs.allowed-endpoints-mode == 'append'
          || (inputs.test-allowed-endpoints == '' && inputs.allowed-endpoints == ''))
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.test-egress-preset
          || inputs.egress-preset || 'github-tooling'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.test-egress-preset || inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
          # yamllint disable-line rule:line-length
          sparse-checkout-extra: |
            .github/actions/setup-python
            schemas/
            scripts/ci/
      - name: Setup Python and uv
        if: inputs.python-version != ''
        uses: ./.lgtm-ci-tooling/.github/actions/setup-python
        with:
          python-version: ${{ inputs.python-version }}
          install-dependencies: ${{ inputs.install-python-dependencies }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.4"
      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: >-
            ${{ format('{0}/package.json', inputs.site-working-directory) }}
      - name: Get bun cache directory
        if: inputs.package-manager == 'bun'
        id: bun-cache
        shell: bash
        env:
          STEP: bun-cache
        run: bash .lgtm-ci-tooling/scripts/ci/actions/setup-node.sh
      - name: Cache bun dependencies
        if: inputs.package-manager == 'bun'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.bun-cache.outputs.dir }}
            ${{ inputs.site-working-directory }}/node_modules
          key: >-
            bun-${{ runner.os }}-${{ inputs.node-version }}-${{
            hashFiles(inputs.cache-dependency-path != '' && inputs.cache-dependency-path
            || format('{0}/bun.lock', inputs.site-working-directory)) }}
          restore-keys: |
            bun-${{ runner.os }}-${{ inputs.node-version }}-
            bun-${{ runner.os }}-
      - name: Install dependencies
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          WORKING_DIRECTORY: ${{ inputs.site-working-directory }}
          FROZEN_LOCKFILE: "true"
        run: bash .lgtm-ci-tooling/scripts/ci/actions/setup-package-manager.sh
      - name: Run check command
        if: inputs.check-command != ''
        shell: bash
        env:
          COMMAND: ${{ inputs.check-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-command.sh
      - name: Run Python test hook
        if: inputs.python-version != '' && inputs.python-test-command != ''
        shell: bash
        env:
          COMMAND: ${{ inputs.python-test-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-command.sh
      - name: Run site tests
        id: test-run
        shell: bash
        env:
          COMMAND: ${{ inputs.test-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-command.sh
      - name: Parse Vitest JSON results
        if: always() && inputs.vitest-json-path != ''
        shell: bash
        env:
          STEP: parse
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          RESULTS_FILE: ${{ inputs.working-directory }}/${{ inputs.vitest-json-path }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-vitest.sh

      # Re-fail after always() Vitest parse so test-run failures are not masked.
      - name: Fail on site test errors
        if: steps.test-run.outcome == 'failure'
        run: exit 1
      - name: Record site test result
        if: always()
        id: record
        shell: bash
        env:
          OUTPUT_NAME: passed
          CONDITION_VALUE: ${{ job.status }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/set-conditional-output.sh
  publish-test-summary:
    needs: site-test
    if: >-
      always()
      && inputs.publish-test-summary
      && inputs.vitest-json-path != ''
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
      && (
        !inputs.draft-pr-skip ||
        github.event.pull_request.draft == false
      )
    uses: ./.github/workflows/reusable-publish-test-summary.yml
    secrets:
      LGTM_CI_TOOLING_TOKEN: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: ${{ inputs.egress-policy }}
      test-suite-name: ${{ inputs.test-job-name }}
      comment-marker: ${{ inputs.comment-marker }}
      comment-history: ${{ inputs.comment-history }}
      comment-history-limit: ${{ inputs.comment-history-limit }}
      job-result: ${{ needs.site-test.result }}
      coverage-enabled: false
      tooling-ref: ${{ inputs.tooling-ref }}
      tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
