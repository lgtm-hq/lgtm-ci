---
name: Reusable Documentation Site Quality Workflow

on:
  workflow_call:
    inputs:
      job-name:
        description: "GitHub check name for the build and link-check job"
        required: false
        type: string
        default: "Build and check documentation site"
      test-job-name:
        description: "GitHub check name for the site test job"
        required: false
        type: string
        default: "Test documentation site"
      build-command:
        description: >-
          Shell command to build the documentation site (e.g.
          ./scripts/ci/site/build.sh). Runs in working-directory.
        required: true
        type: string
      build-env:
        description: >-
          Multiline KEY=VALUE lines exported before build-command (e.g.
          ASTRO_BASE=/)
        required: false
        type: string
        default: ""
      check-command:
        description: >-
          Optional shell command before tests (e.g. ./scripts/ci/site/check.sh).
          Runs in working-directory.
        required: false
        type: string
        default: ""
      test-command:
        description: >-
          Shell command to run site tests (e.g. ./scripts/ci/site/test-all.sh).
          Runs in working-directory.
        required: true
        type: string
      python-test-command:
        description: >-
          Optional Python test hook run after check-command and before
          test-command when python-version is set
        required: false
        type: string
        default: ""
      site-working-directory:
        description: "Working directory for Node/Bun dependency install"
        required: false
        type: string
        default: "."
      working-directory:
        description: "Working directory for caller build/check/test commands"
        required: false
        type: string
        default: "."
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      package-manager:
        description: "Package manager for dependency install: npm, bun, pnpm"
        required: false
        type: string
        default: "bun"
      cache-dependency-path:
        description: "Lockfile path for Node/Bun cache key (relative to repo root)"
        required: false
        type: string
        default: ""
      python-version:
        description: >-
          Python version for optional site Python tests. Empty skips Python setup.
        required: false
        type: string
        default: ""
      install-python-dependencies:
        description: "Run uv sync when Python setup is enabled"
        required: false
        type: boolean
        default: false
      enable-lychee:
        description: "Run lychee link check after build-command"
        required: false
        type: boolean
        default: true
      lychee-paths:
        description: "Comma-separated files or directories to scan with lychee"
        required: false
        type: string
        default: "."
      lychee-file-extensions:
        description: "File extensions to scan with lychee, comma-separated"
        required: false
        type: string
        default: "md,html"
      lychee-exclude-patterns:
        description: "Comma-separated path or URL patterns to exclude from lychee"
        required: false
        type: string
        default: ""
      check-external:
        description: "Check external HTTP(S) links with lychee"
        required: false
        type: boolean
        default: false
      lychee-timeout:
        description: "HTTP timeout in seconds for lychee"
        required: false
        type: string
        default: "10"
      lychee-root-dir:
        description: >-
          Root directory passed to lychee --root-dir for built HTML (e.g.
          apps/site/dist)
        required: false
        type: string
        default: ""
      link-report-artifact-name:
        description: >-
          Artifact name for the uploaded lychee report. Defaults to
          site-lychee-report rather than lychee-report so a caller that also
          runs reusable-link-check.yml in the same run does not collide on one
          artifact name.
        required: false
        type: string
        default: "site-lychee-report"
      upload-site-artifact:
        description: >-
          Upload built site dist as a workflow artifact. Requires
          site-artifact-path or a non-default lychee-paths value.
        required: false
        type: boolean
        default: false
      site-artifact-name:
        description: "Artifact name for the built site upload"
        required: false
        type: string
        default: "site-dist"
      site-artifact-path:
        description: >-
          Path to built site output for artifact upload. Defaults to the first
          lychee-path when empty.
        required: false
        type: string
        default: ""
      vitest-json-path:
        description: >-
          Optional Vitest JSON results path relative to working-directory for
          non-default summary layouts
        required: false
        type: string
        default: ""
      publish-test-summary:
        description: >-
          Publish pass/fail test summary on pull requests when vitest-json-path
          is set
        required: false
        type: boolean
        default: false
      comment-marker:
        description: "Upsert marker for site test summary comments"
        required: false
        type: string
        default: "site-test-results"
      draft-pr-skip:
        description: "Skip jobs on draft pull requests"
        required: false
        type: boolean
        default: true
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner in both jobs. replace mode: a non-empty list is used
          alone; append mode: merged with egress-preset. Composed at job start,
          so it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"
      test-egress-preset:
        description: >-
          Egress preset override for the site-test job (enforced at job start).
          Falls back to egress-preset when empty.
        required: false
        type: string
        default: ""
      test-allowed-endpoints:
        description: >-
          allowed-endpoints override for the site-test job (enforced at job
          start, same replace/append semantics). Falls back to
          allowed-endpoints when empty.
        required: false
        type: string
        default: ""
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Timeout for site quality jobs in minutes"
        required: false
        type: number
        default: 15

    outputs:
      passed:
        description: "Whether both site build/link and test jobs succeeded"
        value: >-
          ${{ jobs.site-build-link.outputs.passed == 'true'
          && jobs.site-test.outputs.passed == 'true' }}
      build-passed:
        description: "Whether the build and link-check job succeeded"
        value: ${{ jobs.site-build-link.outputs.passed }}
      test-passed:
        description: "Whether the site test job succeeded"
        value: ${{ jobs.site-test.outputs.passed }}

