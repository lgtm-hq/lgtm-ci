jobs:
  resolve:
    name: Resolve tag, artifacts, and channels
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Read the source run and download its artifacts
      actions: read
      # Read repo context and release assets; `gh attestation verify` reads
      # the attestations API with this token (no OIDC token is minted)
      contents: read
    outputs:
      missing: ${{ steps.detect.outputs.missing }}
      missing-count: ${{ steps.detect.outputs.missing_count }}
      unresumable: ${{ steps.detect.outputs.unresumable }}
    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-recover'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-recover'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      # Gate 1: the tag must exist and not be a prerelease; the source run
      # must be this repository's publish workflow and must have built the
      # tag's commit (same commit = same version = the immutability check
      # the workflow can make). All read from the API, before any download.
      - name: Resolve tag and source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/recover/resolve-tag.sh
      # The original artifacts ARE the recovery source; download them here so
      # every later stage verifies the same bytes.
      - name: Download original run artifacts
        if: inputs.npm-artifact-name != '' || inputs.release-artifact-name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          NPM_ARTIFACT: ${{ inputs.npm-artifact-name }}
          RELEASE_ARTIFACT: ${{ inputs.release-artifact-name }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/recover/download-artifacts.sh
      # Gate 2: downloaded artifacts must match their manifest and their
      # attestations before any resume step may use them.
      - name: Verify the original npm artifacts
        if: inputs.npm-artifact-name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_DIR: recovery-artifacts/npm/${{ inputs.npm-packages-dir }}
          CHECKSUMS_FILE: ${{ inputs.npm-checksums-file }}
          SIGNER_REPO: ${{ inputs.signer-repo }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/recover/verify-recovery-artifacts.sh
      # Same gate for the release assets, plus equality with anything already
      # published under the tag: a published asset whose digest differs from
      # the attested artifact is tier three, refused before any resume write.
      - name: Verify the original release artifacts against published assets
        if: inputs.release-artifact-name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARTIFACTS_DIR: recovery-artifacts/release
          CHECKSUMS_FILE: ${{ inputs.release-checksums-file }}
          SIGNER_REPO: ${{ inputs.signer-repo }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/recover/verify-recovery-artifacts.sh
      # Gate 3: probe every configured channel; emit the missing and the
      # unresumable sets. The GitHub Release is complete only when every
      # manifest asset is published with the same digest.
      - name: Detect missing channels
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNELS: ${{ inputs.channels }}
          PYPI_PACKAGE: ${{ inputs.pypi-package }}
          NPM_PACKAGE: ${{ inputs.npm-package }}
          # yamllint disable-line rule:line-length
          RELEASE_MANIFEST: ${{ inputs.release-artifact-name != '' && format('recovery-artifacts/release/{0}', inputs.release-checksums-file) || '' }}
          DOCKER_IMAGE: ${{ inputs.docker-image }}
          TAP_REPO: ${{ inputs.homebrew-tap-repo }}
          TAP_FORMULA: ${{ inputs.homebrew-tap-formula }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/recover/detect-channels.sh
      - name: Plan boundary
        shell: bash
        run: |
          echo "Plan only: detection, nothing was resumed." >>"$GITHUB_STEP_SUMMARY"
          echo "::notice::Plan complete; resume through reusable-release-recover.yml with dry-run: false."
