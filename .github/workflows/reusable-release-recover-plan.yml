# Read-only plan stage of the release recovery (#1081): resolve the tag and
# source run, download and verify the original artifacts (checksums,
# provenance attestations, equality with already-published assets) and
# detect which channels are missing. Nothing is published and no issue is
# written, so the caller grants actions: read and contents: read only.
#
# reusable-release-recover.yml calls this file as its first stage (formerly
# its `resolve` job) and then the internal reusable-release-recover-resume.yml
# with the detected sets. Call this file directly for a dry run that needs no
# write scope; the outputs carry the missing and unresumable sets. See
# docs/release-recovery.md for the runbook.
---
name: Reusable Release Recovery (plan)

"on":
  workflow_call:
    inputs:
      tag:
        description: The release tag to recover (e.g. v1.2.3)
        required: true
        type: string
      source-run-id:
        description: Original publish run whose artifacts are the recovery source
        required: true
        type: string
      source-workflow:
        description: >-
          Path of the publish workflow the source run must belong to (e.g.
          .github/workflows/publish-pypi-on-tag.yml). The run's repository,
          workflow path and head SHA are read from the API and must match
          this repository, this path, and the tag's commit.
        required: true
        type: string
      channels:
        description: >-
          Restrict probing/resume to these channels (JSON array or comma
          list); default auto = every configured channel
        required: false
        type: string
        default: "auto"
      # --- channel configuration (a channel without config is not applicable)
      pypi-package:
        description: PyPI project name for the detection probe (detect only; PyPI cannot be resumed)
        required: false
        type: string
        default: ""
      npm-package:
        description: npm meta package name for the detection probe
        required: false
        type: string
        default: ""
      npm-artifact-name:
        description: >-
          Source-run artifact holding the staged npm package set (the
          artifact publish-npm-set uploaded from its packages directory)
        required: false
        type: string
        default: ""
      npm-packages-dir:
        description: >-
          Directory INSIDE the artifact containing one subdirectory per
          package. "." when the artifact was uploaded from the packages
          directory itself (the examples/publish-npm-set.yml layout).
        required: false
        type: string
        default: "."
      npm-checksums-file:
        description: >-
          SHA256SUMS manifest for the npm artifacts, relative to the npm
          packages directory; entries inside it are relative to that
          directory too
        required: false
        type: string
        default: SHA256SUMS
      release-artifact-name:
        description: Source-run artifact for the GitHub Release resume
        required: false
        type: string
        default: ""
      release-checksums-file:
        description: >-
          SHA256SUMS manifest inside the release artifact (written by
          reusable-build-python-dist.yml); used to verify the downloaded
          assets and to compare them with any already-published asset
        required: false
        type: string
        default: SHA256SUMS
      docker-image:
        description: Fully-qualified image reference for the Docker probe/promote
        required: false
        type: string
        default: ""
      homebrew-tap-repo:
        description: Tap repository (owner/repo) for the Homebrew probe
        required: false
        type: string
        default: ""
      homebrew-tap-formula:
        description: Formula name in the tap
        required: false
        type: string
        default: ""
      signer-repo:
        description: Repository the artifact attestations must come from (owner/repo)
        required: false
        type: string
        default: ""
      signer-workflow:
        description: >-
          Workflow the artifact attestations must come from: a path inside
          signer-repo (e.g. .github/workflows/build.yml) or fully qualified
        required: false
        type: string
        default: ""
      runner-image:
        description: >-
          GitHub-hosted runner image label for every job. Must stay
          GitHub-hosted: the npm resume needs trusted publishing/provenance.
        required: false
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: Timeout for the resolve job (the resume jobs keep their own caps)
        required: false
        type: number
        default: 15
      egress-policy:
        description: harden-runner egress policy (audit or block)
        required: false
        type: string
        default: audit
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default release-recover). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "release-recover"
      tooling-ref:
        description: >-
          lgtm-ci commit SHA for the tooling checkout; pin it to the same SHA
          as the `uses:` reference. Kept required here so the tooling an
          operator runs against an older release is an explicit choice
          (other reusables default to job.workflow_sha, #995). Never the
          release tag.
        required: true
        type: string

    outputs:
      missing:
        description: JSON array of resumable channels detected as missing
        value: ${{ jobs.resolve.outputs.missing }}
      missing-count:
        description: Number of channels detected as missing
        value: ${{ jobs.resolve.outputs.missing-count }}
      unresumable:
        description: JSON array of missing channels no resume job can repair
        value: ${{ jobs.resolve.outputs.unresumable }}

permissions:
  contents: read


