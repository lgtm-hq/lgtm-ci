---
name: Quality Check - Action Pinning Validation

'on':
  # No path filter: this is a required check, so it must always run and report.
  # A path-filtered required check never reports on PRs that miss the filter,
  # which deadlocks them (and merge-queue entries). The validation is cheap
  # (~1 min); the detect-changes early-exit pattern is reserved for the
  # expensive path-filtered workflows.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

# Replace only superseded PR work. Each non-PR run/attempt needs its own group:
# cancel-in-progress: false alone still allows pending runs to be replaced
# (same shape as ci.yml; see docs/workflows/testing.md#caller-concurrency).
concurrency:
  group: >-
    validate-action-pinning-caller-${{ github.workflow_ref }}-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-${{
    github.event_name == 'pull_request' && 'pr' || github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/reusable-validate-action-pinning.yml
    with:
      job-name: "📌 Validate Action Pinning"
      fail-on-error: true
      verify-tags: true
      audit-transitive: true
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
