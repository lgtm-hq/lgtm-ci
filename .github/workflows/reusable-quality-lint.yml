  # lgtm-ci-egress-presets:end

jobs:
  quality:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read
    outputs:
      exit-code: ${{ steps.quality.outputs.exit-code }}
      status: ${{ steps.quality.outputs.status }}
      timeout-flake: ${{ steps.classify-timeout.outputs.timeout-flake }}
      timed-out-tools: ${{ steps.classify-timeout.outputs.timed-out-tools }}
    env:
      LINTRO_IMAGE: ${{ inputs.lintro-image }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run lintro quality checks
        id: quality
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: check
          TOOLS: ${{ inputs.tools }}
          TOOL_OPTIONS: ${{ inputs.lintro-tool-options }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
          MAP_HOST_USER: "true"
          SEMGREP_ENABLE_VERSION_CHECK: ${{ inputs.semgrep-enable-version-check }}
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/quality/run-lintro-docker.sh"
      # Classify THIS run's own report. Runs on failure too (always()) because
      # a timeout is exactly the case where the lint step exited non-zero.
      # continue-on-error keeps the verdict strictly advisory: the outputs are
      # informational, so an unreadable report or an unexpected classifier
      # fault must never turn a lint run whose code passed red. Skipped or
      # failed, the outputs are then empty, which every consumer comparison
      # (== 'true') already treats as fail-closed.
      - name: Classify lint timeout
        id: classify-timeout
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          REPORT: .lintro/artifacts/json/results.json
          # yamllint disable-line rule:line-length
          CLASSIFIER: ${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/classify-lint-timeout.py
        run: python3 "$CLASSIFIER" --report "$REPORT"
      # Best-effort: the report is a convenience artifact, not part of the
      # lint verdict. reusable-publish-quality-summary already downloads it
      # with continue-on-error and warns when it is absent, so failing this
      # job over an unuploadable report would fail a build whose code passed.
      # upload-artifact retries transient errors internally; if it still
      # fails we warn and let the lint result stand on its own.
      - name: Upload linting report
        id: upload-report
        if: inputs.upload-report && always()
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linting-report
          path: |
            ${{ inputs.working-directory }}/.lintro/
            ${{ inputs.working-directory }}/chk-output.txt
          retention-days: 7
          if-no-files-found: ignore
          # A caller may run this workflow twice in one run (bounded lint
          # retry). Without overwrite, the retry's upload 409s, the
          # continue-on-error above swallows it, and the artifact keeps the
          # first (failed) attempt's report — so consumers download a stale,
          # non-authoritative result. The latest attempt is authoritative.
          overwrite: true
      # Published separately from linting-report so a consumer that only wants
      # machine-readable evidence can download a small JSON document instead of
      # the whole .lintro/ tree. Best-effort for the same reason as above: the
      # verdict outputs are already derived by this point, so an upload hiccup
      # must not fail a job whose code passed.
      - name: Upload lint JSON report
        id: upload-json-report
        if: inputs.upload-json-report && always()
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linting-json-report
          path: ${{ inputs.working-directory }}/.lintro/artifacts/json/results.json
          retention-days: 7
          if-no-files-found: ignore
          # Same bounded-retry rationale as the linting-report upload: the
          # latest attempt is the authoritative one.
          overwrite: true
      - name: Warn on failed report upload
        if: always() && steps.upload-report.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Linting report upload failed; the lint result is unaffected."
      - name: Warn on failed JSON report upload
        if: always() && steps.upload-json-report.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Lint JSON report upload failed; the lint result is unaffected."
