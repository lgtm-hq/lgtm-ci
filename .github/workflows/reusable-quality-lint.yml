---
name: Reusable Quality Lint Workflow

on:
  workflow_call:
    inputs:
      job-name:
        description: "GitHub check run name reported for this job"
        required: false
        type: string
        default: "🛠️ Lintro Code Quality"
      tools:
        description: "Comma-separated lintro --tools list (empty = all tools)"
        required: false
        type: string
        default: ""
      fail-on-error:
        description: "Fail workflow if linting errors found"
        required: false
        type: boolean
        default: true
      upload-report:
        description: "Upload linting report as artifact"
        required: false
        type: boolean
        default: true
      upload-json-report:
        description: >-
          Upload the structured lintro JSON report as its own artifact. Kept
          separate from upload-report so a caller can consume the
          timeout-flake / timed-out-tools outputs without paying for the
          artifact; the outputs are derived regardless of this input.
        required: false
        type: boolean
        default: true
      working-directory:
        description: "Working directory for linting"
        required: false
        type: string
        default: "."
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default quality). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "quality"
      lintro-tool-options:
        description: >-
          Comma-separated lintro --tool-options passed to the quality check
          (e.g. pydoclint:timeout=120,osv_scanner:check_suppressions=false)
        required: false
        type: string
        default: ""
      semgrep-enable-version-check:
        description: >-
          Value for SEMGREP_ENABLE_VERSION_CHECK inside the lintro container.
          Semgrep's update check turns `semgrep --version` into a network
          round trip that can hang past lintro's version-check timeout; set
          "0" to disable the check, which skips that request entirely.
        required: false
        type: string
        default: "1"
      lintro-image:
        description: "Pinned ghcr.io/lgtm-hq/py-lintro image (digest strongly recommended)"
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: "ghcr.io/lgtm-hq/py-lintro@sha256:5ec38eb12f081b875a9b65044d93eb129b6731fdc05bb98c502027ac4a5e4703"
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""

      timeout-minutes:
        description: "Job timeout in minutes for Docker lintro quality checks"
        required: false
        type: number
        default: 45

    outputs:
      exit-code:
        description: "Exit code from lintro"
        value: ${{ jobs.quality.outputs.exit-code }}
      status:
        description: "passed or failed"
        value: ${{ jobs.quality.outputs.status }}
      timeout-flake:
        description: >-
          'true' only when this run's own report shows >=1 tool timed out and
          zero genuine issues anywhere. Fails closed: a missing or malformed
          report, a non-timeout tool failure, or any issue yields 'false'.
          Describes THIS run only — never use it to excuse another job's
          failure.
        value: ${{ jobs.quality.outputs.timeout-flake }}
      timed-out-tools:
        description: >-
          Comma-separated names of tools that timed out, '' when none.
        value: ${{ jobs.quality.outputs.timed-out-tools }}
    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false

