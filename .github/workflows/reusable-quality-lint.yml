---
name: Reusable Quality Lint Workflow

on:
  workflow_call:
    inputs:
      job-name:
        description: "GitHub check run name reported for this job"
        required: false
        type: string
        default: "🛠️ Lintro Code Quality"
      tools:
        description: "Comma-separated lintro --tools list (empty = all tools)"
        required: false
        type: string
        default: ""
      fail-on-error:
        description: "Fail workflow if linting errors found"
        required: false
        type: boolean
        default: true
      upload-report:
        description: "Upload linting report as artifact"
        required: false
        type: boolean
        default: true
      upload-json-report:
        description: >-
          Upload the structured lintro JSON report as its own artifact. Kept
          separate from upload-report so a caller can consume the
          timeout-flake / timed-out-tools outputs without paying for the
          artifact; the outputs are derived regardless of this input.
        required: false
        type: boolean
        default: true
      working-directory:
        description: "Working directory for linting"
        required: false
        type: string
        default: "."
      tooling-ref:
        description: "Git ref to use when checking out lgtm-ci tooling scripts"
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: "Allowed endpoints when egress-policy is block"
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          release-assets.githubusercontent.com:443
          objects.githubusercontent.com:443
          raw.githubusercontent.com:443
          pipelines.actions.githubusercontent.com:443
          github-releases.githubusercontent.com:443
          ghcr.io:443
          pkg-containers.githubusercontent.com:443
          docker.io:443
          registry-1.docker.io:443
          auth.docker.io:443
          production.cloudflare.docker.com:443
          production.cloudfront.docker.com:443
          pypi.org:443
          files.pythonhosted.org:443
          static.rust-lang.org:443
          bun.sh:443
          astral.sh:443
          releases.astral.sh:443
          sh.rustup.rs:443
          deb.debian.org:80
          registry.npmjs.org:443
          crates.io:443
          static.crates.io:443
          index.crates.io:443
          semgrep.dev:443
          metrics.semgrep.dev:443
          api.osv.dev:443
          api.deps.dev:443
      allowed-endpoints-mode:
        description: >-
          replace: non-empty allowed-endpoints overrides egress-preset; append:
          merges preset with allowed-endpoints (deduped, first-seen wins)
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named allowlist when allowed-endpoints is empty and egress-policy is
          block (github-minimal, github-pages, github-tooling, docker, playwright, pypi,
          rubygems, npm-publish, quality, sbom, scorecard)
        required: false
        type: string
        default: "quality"
      lintro-tool-options:
        description: >-
          Comma-separated lintro --tool-options passed to the quality check
          (e.g. pydoclint:timeout=120,osv_scanner:check_suppressions=false)
        required: false
        type: string
        default: ""
      lintro-image:
        description: "Pinned ghcr.io/lgtm-hq/py-lintro image (digest strongly recommended)"
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: "ghcr.io/lgtm-hq/py-lintro@sha256:8868236b4a67f62b4208c10a875ae28994574a2f10fbad75189d0d119aeeb771"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"

      timeout-minutes:
        description: "Job timeout in minutes for Docker lintro quality checks"
        required: false
        type: number
        default: 45

    outputs:
      exit-code:
        description: "Exit code from lintro"
        value: ${{ jobs.quality.outputs.exit-code }}
      status:
        description: "passed or failed"
        value: ${{ jobs.quality.outputs.status }}
      timeout-flake:
        description: >-
          'true' only when this run's own report shows >=1 tool timed out and
          zero genuine issues anywhere. Fails closed: a missing or malformed
          report, a non-timeout tool failure, or any issue yields 'false'.
          Describes THIS run only — never use it to excuse another job's
          failure.
        value: ${{ jobs.quality.outputs.timeout-flake }}
      timed-out-tools:
        description: >-
          Comma-separated names of tools that timed out, '' when none.
        value: ${{ jobs.quality.outputs.timed-out-tools }}

jobs:
  quality:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read
    outputs:
      exit-code: ${{ steps.quality.outputs.exit-code }}
      status: ${{ steps.quality.outputs.status }}
      timeout-flake: ${{ steps.classify-timeout.outputs.timeout-flake }}
      timed-out-tools: ${{ steps.classify-timeout.outputs.timed-out-tools }}
    env:
      LINTRO_IMAGE: ${{ inputs.lintro-image }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lgtm-hq/lgtm-ci
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || github.workflow_sha }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref }}
          egress-policy: ${{ inputs.egress-policy }}
          egress-preset: ${{ inputs.egress-preset }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
          allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run lintro quality checks
        id: quality
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: check
          TOOLS: ${{ inputs.tools }}
          TOOL_OPTIONS: ${{ inputs.lintro-tool-options }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
          MAP_HOST_USER: "true"
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/quality/run-lintro-docker.sh"
      # Classify THIS run's own report. Runs on failure too (always()) because
      # a timeout is exactly the case where the lint step exited non-zero.
      # continue-on-error keeps the verdict strictly advisory: the outputs are
      # informational, so an unreadable report or an unexpected classifier
      # fault must never turn a lint run whose code passed red. Skipped or
      # failed, the outputs are then empty, which every consumer comparison
      # (== 'true') already treats as fail-closed.
      - name: Classify lint timeout
        id: classify-timeout
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          REPORT: .lintro/artifacts/json/results.json
          # yamllint disable-line rule:line-length
          CLASSIFIER: ${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/classify-lint-timeout.py
        run: python3 "$CLASSIFIER" --report "$REPORT"
      # Best-effort: the report is a convenience artifact, not part of the
      # lint verdict. reusable-publish-quality-summary already downloads it
      # with continue-on-error and warns when it is absent, so failing this
      # job over an unuploadable report would fail a build whose code passed.
      # upload-artifact retries transient errors internally; if it still
      # fails we warn and let the lint result stand on its own.
      - name: Upload linting report
        id: upload-report
        if: inputs.upload-report && always()
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linting-report
          path: |
            ${{ inputs.working-directory }}/.lintro/
            ${{ inputs.working-directory }}/chk-output.txt
          retention-days: 7
          if-no-files-found: ignore
          # A caller may run this workflow twice in one run (bounded lint
          # retry). Without overwrite, the retry's upload 409s, the
          # continue-on-error above swallows it, and the artifact keeps the
          # first (failed) attempt's report — so consumers download a stale,
          # non-authoritative result. The latest attempt is authoritative.
          overwrite: true
      # Published separately from linting-report so a consumer that only wants
      # machine-readable evidence can download a small JSON document instead of
      # the whole .lintro/ tree. Best-effort for the same reason as above: the
      # verdict outputs are already derived by this point, so an upload hiccup
      # must not fail a job whose code passed.
      - name: Upload lint JSON report
        id: upload-json-report
        if: inputs.upload-json-report && always()
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linting-json-report
          path: ${{ inputs.working-directory }}/.lintro/artifacts/json/results.json
          retention-days: 7
          if-no-files-found: ignore
          # Same bounded-retry rationale as the linting-report upload: the
          # latest attempt is the authoritative one.
          overwrite: true
      - name: Warn on failed report upload
        if: always() && steps.upload-report.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Linting report upload failed; the lint result is unaffected."
      - name: Warn on failed JSON report upload
        if: always() && steps.upload-json-report.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Lint JSON report upload failed; the lint result is unaffected."
