---
name: Reusable GHCR Cleanup

on:
  workflow_call:
    inputs:
      package-name:
        description: "GHCR package name to clean"
        required: true
        type: string
      min-age-days:
        description: "Minimum age in days before deletion"
        required: false
        type: number
        default: 7
      keep-latest:
        description: "Always keep N most recent untagged versions"
        required: false
        type: number
        default: 0
      build-cache-pr-age-days:
        description: >-
          Minimum age in days before deleting ephemeral pr-*/mq-*/dispatch-*
          build-cache tags
        required: false
        type: number
        default: 14
      protect-referenced:
        description: >-
          Collect digests referenced by tagged manifest indexes and skip prune
          when collection is incomplete
        required: false
        type: boolean
        default: true
      prune-buildcache:
        description: "Delete aged ephemeral build-cache tags (pr-*, mq-*, dispatch-*)"
        required: false
        type: boolean
        default: true
      prune-tagged:
        description: >-
          Opt in to tagged retention: delete aged main/sha-* and pre-release
          tagged versions. A version is deleted only when EVERY tag on it is
          deletable, so release manifests (latest + semver + sha-*) are kept.
        required: false
        type: boolean
        default: false
      main-retention-days:
        description: "Retention in days for main and sha-* tags (prune-tagged only)"
        required: false
        type: number
        default: 30
      prerelease-retention-days:
        description: >-
          Retention in days for alpha/beta/rc/pre/dev/snapshot tags
          (prune-tagged only)
        required: false
        type: number
        default: 90
      dry-run:
        description: "Log only, no deletions"
        required: false
        type: boolean
        default: false
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

    secrets:
      token:
        description: "GitHub token with packages:write scope"
        required: true

