# GENERATED by scripts/ci/workflows/sync-readonly-variants.sh from
# reusable-test-shell.yml — do not edit. Edit the facade, then re-run the script.
#
# Read-only variant (#1081): the facade's jobs without its mutation jobs, so
# the permission union a caller must grant holds no write scope. Job ids and
# names match the facade, so check names under the caller's job id do too.
# Results stay in this call's artifacts (results.v1, #1080); see
# docs/reusable-workflows.md "Read-only variants" to publish them separately.
---
name: Reusable Shell Test Workflow (read-only)

on:
  workflow_call:
    inputs:
      bats-version:
        description: >-
          BATS version to use. Empty uses the pin in scripts/ci/versions.env,
          whose committed tag commit the install verifies. A different version
          has no committed commit, so it is refused unless bats-commit carries
          the 40-hex commit of that version's tag (#1096).
        required: false
        type: string
        default: ""
      bats-commit:
        description: >-
          Commit the bats-version tag must resolve to (40 hex). Required when
          bats-version overrides the pin; ignored when bats-version is empty.
        required: false
        type: string
        default: ""
      test-path:
        description: "Path to test files or directory"
        required: false
        type: string
        default: "tests/bats"
      coverage:
        description: "Whether to collect coverage with kcov"
        required: false
        type: boolean
        default: false
      coverage-threshold:
        description: "Minimum coverage percentage to pass"
        required: false
        type: number
        default: 0
      coverage-shards:
        description: >-
          kcov v43 cannot merge bash coverage across invocations, so each shard
          is one kcov process over a cksum-partitioned .bats subset. Fan-in
          merges Cobertura XML (max per-line hits) and enforces the threshold.
          Default 1 is today's single-job path. Values > 1 require coverage:
          true; the non-coverage run-tests path never shards.
        required: false
        type: number
        default: 1
      upload-coverage:
        description: "Upload coverage report as artifact"
        required: false
        type: boolean
        default: false
      test-filter:
        description: "Filter tests by name pattern"
        required: false
        type: string
        default: ""
      parallel:
        description: "Number of parallel test jobs"
        required: false
        type: number
        default: 1
      working-directory:
        description: "Working directory for running tests"
        required: false
        type: string
        default: "."
      comment-marker:
        description: >-
          Leg suffix of the sharded artifact names; in reusable-test-shell.yml
          also the upsert marker of the shell test summary comment
        required: false
        type: string
        default: "shell-test-results"
      artifact-prefix:
        description: >-
          Namespace for this call's artifacts (<prefix>-results,
          <prefix>-test-results, <prefix>-coverage, and the sharded
          <prefix>-test-results-<comment-marker>-shard-N /
          <prefix>-coverage-<comment-marker>-shard-N); give a second call in
          the same run its own prefix so the two calls' TAP and coverage
          artifacts do not overwrite each other (#1091). Must match
          [A-Za-z0-9_.]+ ('-' separates prefix from the rest of the name)
        required: false
        type: string
        default: "shell"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      job-name:
        description: "GitHub check name for the test job"
        required: false
        type: string
        default: "Shell Tests"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      draft-pr-skip:
        description: "Skip jobs on draft pull requests"
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 60
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default shell-test). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "shell-test"

    outputs:
      tests-passed:
        description: "Number of tests passed"
        value: >-
          ${{ fromJson(format('["{0}","{1}"]',
            jobs.test.outputs.tests-passed,
            jobs.aggregate.outputs.tests-passed))[inputs.coverage && inputs.coverage-shards > 1 && 1 || 0] }}
      tests-failed:
        description: "Number of tests failed"
        value: >-
          ${{ fromJson(format('["{0}","{1}"]',
            jobs.test.outputs.tests-failed,
            jobs.aggregate.outputs.tests-failed))[inputs.coverage && inputs.coverage-shards > 1 && 1 || 0] }}
      tests-total:
        description: "Total number of tests"
        value: >-
          ${{ fromJson(format('["{0}","{1}"]',
            jobs.test.outputs.tests-total,
            jobs.aggregate.outputs.tests-total))[inputs.coverage && inputs.coverage-shards > 1 && 1 || 0] }}
      coverage-percent:
        description: "Coverage percentage"
        value: >-
          ${{ fromJson(format('["{0}","{1}"]',
            jobs.test.outputs.coverage-percent,
            jobs.aggregate.outputs.coverage-percent))[inputs.coverage && inputs.coverage-shards > 1 && 1 || 0] }}
      passed:
        description: "Whether all tests passed"
        value: >-
          ${{ fromJson(format('["{0}","{1}"]',
            jobs.test.outputs.passed,
            jobs.aggregate.outputs.passed))[inputs.coverage && inputs.coverage-shards > 1 && 1 || 0] }}

