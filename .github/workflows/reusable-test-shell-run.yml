jobs:
  test:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: >-
      (!inputs.coverage || inputs.coverage-shards <= 1)
      && (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    permissions:
      contents: read

    outputs:
      tests-passed: ${{ steps.results.outputs.tests-passed }}
      tests-failed: ${{ steps.results.outputs.tests-failed }}
      tests-total: ${{ steps.results.outputs.tests-total }}
      coverage-percent: ${{ steps.coverage.outputs.coverage-percent }}
      # yamllint disable-line rule:line-length
      passed: >-
        ${{ (steps.test.outcome == 'success' || steps.coverage-run.outcome == 'success')
        && steps.results.outputs.tests-ran == 'true' }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'shell-test'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'shell-test'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      # Runs before any upload in this job uses the prefix (#1091); the
      # uploads below are always()-gated, so they also require this step's
      # success rather than uploading under a rejected prefix.
      - name: Validate artifact prefix
        id: artifact-prefix
        shell: bash
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/validate-artifact-prefix.sh
      - name: Install BATS and helpers
        shell: bash
        env:
          STEP: install-bats
          BATS_VERSION: ${{ inputs.bats-version }}
          BATS_CORE_COMMIT: ${{ inputs.bats-commit }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      - name: Install kcov for coverage
        if: inputs.coverage
        shell: bash
        env:
          STEP: install-kcov
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      - name: Run BATS tests
        if: ${{ !inputs.coverage }}
        id: test
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: run-tests
          TEST_PATH: ${{ inputs.test-path }}
          TEST_FILTER: ${{ inputs.test-filter }}
          PARALLEL: ${{ inputs.parallel }}
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh"
      - name: Run BATS tests with coverage
        if: ${{ inputs.coverage }}
        id: coverage-run
        # Bound below the job timeout (default 60) so a hang fails this step
        # with logs instead of a bare job cancellation. See #556.
        timeout-minutes: 45
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: run-coverage
          TEST_PATH: ${{ inputs.test-path }}
          TEST_FILTER: ${{ inputs.test-filter }}
          PARALLEL: ${{ inputs.parallel }}
          COVERAGE_DIR: coverage-report
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh"
      # TAP -> results/bats/default/results.json (results.v1, #1080); every
      # tests-* output is read back from it.
      - name: Parse test results
        id: results
        if: always()
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: parse-results
          EXIT_CODE: ${{ steps.test.outputs.exit-code || steps.coverage-run.outputs.exit-code }}
          RESULTS_SOURCE_VERSION: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh"
      - name: Parse coverage results
        id: coverage
        if: inputs.coverage && always()
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: parse-coverage
          COVERAGE_DIR: coverage-report
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh"
      # kcov is parsed after the TAP, so the coverage joins the document here;
      # a non-numeric percent (N/A) leaves the document without coverage.
      - name: Attach coverage to results
        if: inputs.coverage && always() && steps.results.outcome == 'success'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          RESULTS_FILE: ${{ steps.results.outputs.results-json }}
          COVERAGE_LINES: ${{ steps.coverage.outputs.coverage-percent }}
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/results-update.sh"
      - name: Check coverage threshold
        id: coverage-gate
        if: inputs.coverage && inputs.coverage-threshold > 0
        shell: bash
        env:
          STEP: check-threshold
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.coverage-percent }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      # A failed threshold must reach the document before it is uploaded, or
      # the artifact would carry a false "passed".
      - name: Record gate verdict in results
        if: always() && steps.coverage-gate.outcome == 'failure'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          RESULTS_FILE: ${{ steps.results.outputs.results-json }}
          STATUS: failed
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/results-update.sh"
      # The results.v1 document the summary comment and required-check
      # verdicts read (#1080); same name on the sharded path, where the
      # aggregate job uploads it instead (the two paths never run in one call).
      - name: Upload results
        if: always() && steps.artifact-prefix.outcome == 'success' && steps.results.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-results
          path: ${{ inputs.working-directory }}/results/bats/default/results.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      # Debug convenience only: nothing downloads the TAP output (the summary
      # comment reads results.json), and the bats run plus the coverage
      # threshold step above own the job verdict.
      - name: Upload test results
        id: upload-results
        if: always() && steps.artifact-prefix.outcome == 'success'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Namespaced by artifact-prefix so two calls in one run keep their
          # own TAP output (#1091).
          name: ${{ inputs.artifact-prefix }}-test-results
          path: |
            ${{ inputs.working-directory }}/bats-output.tap
          retention-days: 7
          if-no-files-found: ignore
          # overwrite only covers a rerun of this same call replacing its
          # earlier attempt. Isolation between calls comes from
          # artifact-prefix, never from overwrite (#728/#752).
          overwrite: true
      - name: Warn on failed test results upload
        if: always() && steps.upload-results.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Test results upload failed; the test result is unaffected."
      # Debug convenience only, same reasoning as the TAP upload above.
      - name: Upload coverage report
        id: upload-coverage-report
        if: >-
          always() && inputs.upload-coverage && inputs.coverage
          && steps.artifact-prefix.outcome == 'success'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Namespaced by artifact-prefix so two calls in one run keep their
          # own coverage (#1091).
          name: ${{ inputs.artifact-prefix }}-coverage
          path: |
            ${{ inputs.working-directory }}/coverage-report
          retention-days: 7
          if-no-files-found: ignore
          # overwrite only covers a rerun of this same call replacing its
          # earlier attempt. Isolation between calls comes from
          # artifact-prefix, never from overwrite (#728/#752).
          overwrite: true
      - name: Warn on failed coverage report upload
        if: always() && steps.upload-coverage-report.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Coverage report upload failed; the test result is unaffected."

  shard-setup:
    name: Coverage shard matrix
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: 10
    if: >-
      inputs.coverage && inputs.coverage-shards > 1
      && (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'shell-test'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'shell-test'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      # The shard and aggregate jobs depend on this one, so an invalid
      # prefix fails before any upload or download glob uses it (#1091).
      - name: Validate artifact prefix
        shell: bash
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/validate-artifact-prefix.sh
      - name: Generate coverage shard matrix
        id: matrix
        shell: bash
        env:
          STEP: coverage-shards
          SHARD_TOTAL: ${{ inputs.coverage-shards }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/generate-matrix.sh

  test-sharded:
    name: ${{ inputs.job-name }} (shard ${{ matrix.shard }}/${{ inputs.coverage-shards }})
    needs: shard-setup
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: >-
      inputs.coverage && inputs.coverage-shards > 1
      && (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.shard-setup.outputs.matrix) }}
    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'shell-test'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'shell-test'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      - name: Start resource monitor
        continue-on-error: true
        shell: bash
        run: .lgtm-ci-tooling/scripts/ci/actions/resource-monitor.sh start
      - name: Install BATS and helpers
        shell: bash
        env:
          STEP: install-bats
          BATS_VERSION: ${{ inputs.bats-version }}
          BATS_CORE_COMMIT: ${{ inputs.bats-commit }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      - name: Install kcov for coverage
        shell: bash
        env:
          STEP: install-kcov
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      - name: Run BATS tests with coverage
        id: coverage-run
        timeout-minutes: 20
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: run-coverage
          TEST_PATH: ${{ inputs.test-path }}
          TEST_FILTER: ${{ inputs.test-filter }}
          PARALLEL: ${{ inputs.parallel }}
          COVERAGE_DIR: coverage-report
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ inputs.coverage-shards }}
          KCOV_SUITE_TIMEOUT_MINUTES: "15"
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh"
      - name: Upload test results
        id: upload-results
        if: always()
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # artifact-prefix replaces the language word (#1091); the
          # comment-marker and shard coordinates stay as the leg suffix.
          name: ${{ inputs.artifact-prefix }}-test-results-${{ inputs.comment-marker }}-shard-${{ matrix.shard }}
          path: |
            ${{ inputs.working-directory }}/bats-output.tap
          retention-days: 7
          if-no-files-found: ignore
          # overwrite only, for a rerun of this same shard (#728/#752).
          overwrite: true
      - name: Warn on failed test results upload
        if: always() && steps.upload-results.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Shard TAP upload failed; aggregate may miss this shard's tests."
      - name: Upload coverage report
        id: upload-coverage-report
        if: always()
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # artifact-prefix replaces the language word (#1091); the
          # comment-marker and shard coordinates stay as the leg suffix.
          name: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.comment-marker }}-shard-${{ matrix.shard }}
          path: |
            ${{ inputs.working-directory }}/coverage-report
          retention-days: 7
          if-no-files-found: ignore
          # overwrite only, for a rerun of this same shard (#728/#752).
          overwrite: true
      - name: Warn on failed coverage report upload
        if: always() && steps.upload-coverage-report.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Shard coverage upload failed; aggregate merge may miss this shard."
      - name: Dump resource monitor
        if: always()
        continue-on-error: true
        shell: bash
        run: .lgtm-ci-tooling/scripts/ci/actions/resource-monitor.sh dump
      - name: Stop resource monitor
        if: always()
        continue-on-error: true
        shell: bash
        run: .lgtm-ci-tooling/scripts/ci/actions/resource-monitor.sh stop

  aggregate:
    name: ${{ inputs.job-name }}
    # shard-setup is listed so a rejected artifact-prefix (#1091) blocks this
    # job: always() alone would run it after the validator failed and glob
    # with the very value it refused, like the E2E merge job before #739.
    # The test-sharded dependency stays loose so results still aggregate (and
    # the required check still fails closed) when a shard fails.
    needs: [shard-setup, test-sharded]
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: 10
    if: >-
      always()
      && needs.shard-setup.result == 'success'
      && inputs.coverage
      && inputs.coverage-shards > 1
      && (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    permissions:
      # `actions: read`: the pre-aggregation availability wait (#803) polls
      # `GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts` with
      # GITHUB_TOKEN so a shard whose upload succeeded but is not yet listed
      # does not make the TAP aggregate under-count. Validated statically, so
      # every caller must grant it on this call (docs/reusable-workflows.md).
      actions: read
      contents: read
    outputs:
      tests-passed: ${{ steps.results.outputs.tests-passed }}
      tests-failed: ${{ steps.results.outputs.tests-failed }}
      tests-total: ${{ steps.results.outputs.tests-total }}
      coverage-percent: ${{ steps.merge.outputs.coverage-percent }}
      passed: >-
        ${{ needs.test-sharded.result == 'success'
        && steps.results.outputs.tests-ran == 'true'
        && steps.results.outputs.tests-failed == '0' }}
    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'shell-test'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'shell-test'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      # Bounded availability wait (#803): the listing is eventually consistent,
      # so a one-shot download can miss a shard whose upload already
      # succeeded. Listing only — the downloads below stay the fetch path.
      # Best effort like them: the strict TAP count in run-bats-tests.sh is
      # still the verdict, so a permanent under-count fails there by shard.
      - name: Wait for shard TAP artifacts
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COUNT: ${{ inputs.coverage-shards }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          COMMENT_MARKER: ${{ inputs.comment-marker }}
          # A shard that never uploaded will not appear; do not spend the
          # full budget on it when the shard job already failed.
          WAIT_BUDGET_SECONDS: ${{ needs.test-sharded.result == 'success' && '90' || '10' }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/wait-for-artifacts.sh
          "$EXPECTED_COUNT" "${ARTIFACT_PREFIX}-test-results-${COMMENT_MARKER}-shard-*"
      - name: Download shard TAP artifacts
        if: always()
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-test-results-${{ inputs.comment-marker }}-shard-*
          path: ${{ runner.temp }}/shard-taps
          merge-multiple: false
      # The coverage artifacts upload after the TAP ones, so a complete TAP
      # listing says nothing about them; wait for them separately so the
      # Cobertura merge and the threshold check see every shard (#803).
      - name: Wait for shard coverage artifacts
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COUNT: ${{ inputs.coverage-shards }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          COMMENT_MARKER: ${{ inputs.comment-marker }}
          # A shard that never uploaded will not appear; do not spend the
          # full budget on it when the shard job already failed.
          WAIT_BUDGET_SECONDS: ${{ needs.test-sharded.result == 'success' && '90' || '10' }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/wait-for-artifacts.sh
          "$EXPECTED_COUNT" "${ARTIFACT_PREFIX}-coverage-${COMMENT_MARKER}-shard-*"
      - name: Download shard coverage artifacts
        if: always()
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.comment-marker }}-shard-*
          path: ${{ runner.temp }}/shard-coverage
          merge-multiple: false
      # Shard TAPs -> results/bats/default/results.json (results.v1, #1080);
      # every tests-* output is read back from it.
      - name: Aggregate shard TAP results
        id: results
        if: always()
        shell: bash
        env:
          STEP: aggregate-results
          SHARD_ARTIFACTS_DIR: ${{ runner.temp }}/shard-taps
          EXPECTED_SHARDS: ${{ inputs.coverage-shards }}
          EXIT_CODE: ${{ needs.test-sharded.result == 'success' && '0' || '1' }}
          RESULTS_SOURCE_VERSION: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      - name: Merge shard Cobertura reports
        id: merge
        if: always()
        shell: bash
        env:
          STEP: merge-coverage
          SHARD_COVERAGE_DIR: ${{ runner.temp }}/shard-coverage
          MERGED_COVERAGE_FILE: ${{ runner.temp }}/merged-cobertura.xml
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      - name: Attach coverage to results
        if: always() && steps.results.outcome == 'success' && steps.merge.outcome == 'success'
        shell: bash
        env:
          RESULTS_FILE: ${{ steps.results.outputs.results-json }}
          COVERAGE_LINES: ${{ steps.merge.outputs.coverage-percent }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/results-update.sh
      - name: Check coverage threshold
        id: coverage-gate
        if: always() && inputs.coverage-threshold > 0 && steps.merge.outcome == 'success'
        shell: bash
        env:
          STEP: check-threshold
          COVERAGE_PERCENT: ${{ steps.merge.outputs.coverage-percent }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      # A failed threshold must reach the document before it is uploaded, or
      # the artifact would carry a false "passed".
      - name: Record gate verdict in results
        if: always() && steps.coverage-gate.outcome == 'failure'
        shell: bash
        env:
          RESULTS_FILE: ${{ steps.results.outputs.results-json }}
          STATUS: failed
        run: bash .lgtm-ci-tooling/scripts/ci/actions/results-update.sh
      - name: Upload results
        if: always() && steps.results.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Same name the single-job path uploads (#1080); the two paths
          # never run in one call.
          name: ${{ inputs.artifact-prefix }}-results
          path: results/bats/default/results.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Upload merged coverage report
        id: upload-merged-coverage
        if: always() && inputs.upload-coverage && steps.merge.outcome == 'success'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Same name the single-job path uploads, namespaced by
          # artifact-prefix (#1091); the two paths never run in one call.
          name: ${{ inputs.artifact-prefix }}-coverage
          path: ${{ runner.temp }}/merged-cobertura.xml
          retention-days: 7
          if-no-files-found: ignore
          # overwrite only, for a rerun of this same call (#728/#752).
          overwrite: true
      - name: Warn on failed merged coverage upload
        if: always() && steps.upload-merged-coverage.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Merged coverage upload failed; the test result is unaffected."
      - name: Fail if TAP aggregation found no tests
        if: always() && steps.results.outputs.tests-ran != 'true'
        shell: bash
        run: |
          echo "::error::Coverage shard TAP aggregation found no tests (lost artifacts or empty shards)."
          exit 1
      - name: Fail if a coverage shard failed
        if: always() && needs.test-sharded.result != 'success'
        shell: bash
        run: |
          echo "::error::One or more coverage shards failed; the required check fails instead of skipping."
          exit 1
