---
name: Reusable - Auto Re-run on Infra Failure

# Re-runs the failed jobs of a completed workflow run when — and only when —
# the failed-job logs match a known transient-infrastructure signature
# (GitHub-side outages such as "Failed to resolve action download info").
# RUN_ATTEMPT gating caps automation at max-reruns re-run(s) per run so a
# persistent outage can never loop. Call from a workflow_run consumer gated
# on a failed conclusion (see examples/auto-rerun-on-infra-failure.yml):
#
#   rerun:
#     if: github.event.workflow_run.conclusion == 'failure'
#     uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-auto-rerun-on-infra-failure.yml@<sha>
#     permissions:
#       actions: write
#       contents: read
#     with:
#       run-id: ${{ github.event.workflow_run.id }}
#       run-attempt: ${{ github.event.workflow_run.run_attempt }}
#       tooling-ref: <sha>

"on":
  workflow_call:
    inputs:
      run-id:
        description: "Workflow run id to inspect and potentially re-run"
        required: true
        type: string
      run-attempt:
        description: "Attempt number of the failed run"
        required: true
        type: string
      max-reruns:
        description: "Maximum automatic re-runs per run"
        required: false
        type: string
        default: "1"
      signatures:
        description: >-
          Extra newline-separated failure-log signatures appended to the
          built-in transient-infra defaults
        required: false
        type: string
        default: ""
      tooling-ref:
        description: "Git ref to use when checking out lgtm-ci tooling scripts"
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: "Allowed endpoints when egress-policy is block"
        required: false
        type: string
        # The github-minimal set, plus the two results-storage hosts the #794
        # ingestion probe needs. `GET /actions/jobs/{id}/logs` answers 302 to
        # GitHub's results blob storage, so under a block policy without these
        # every probe would die at the network layer and the evidence table
        # would read "unavailable" for every job — a uniform failure that looks
        # exactly like "the raw endpoint has nothing", which is the one
        # conclusion the probe must not fake. Added here rather than to the
        # shared github-minimal preset: no other job needs blob egress.
        default: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          objects.githubusercontent.com:443
          pipelines.actions.githubusercontent.com:443
          productionresults.blob.core.windows.net:443
          results-receiver.actions.githubusercontent.com:443
      allowed-endpoints-mode:
        description: >-
          replace: non-empty allowed-endpoints overrides egress-preset; append:
          merges preset with allowed-endpoints (deduped, first-seen wins)
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named allowlist when allowed-endpoints is empty and egress-policy is
          block (github-minimal, github-pages, github-tooling, docker,
          playwright, pypi, rubygems, npm-publish, quality, sbom, scorecard)
        required: false
        type: string
        default: "github-minimal"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        # Kept at 10 deliberately (#743). The script now bounds itself:
        # LOG_FETCH_DEADLINE (180s) for the refetch loop, plus one in-flight
        # GH_CMD_TIMEOUT (60s) fetch, plus one bounded `gh run rerun` (60s),
        # is a ~5.5 min worst case, and the harden/checkout steps add well
        # under a minute. 10 leaves this job timeout as an outer backstop for
        # whatever the script cannot bound, rather than the binding constraint
        # it was when it silently killed the safety net mid-fetch. The happy
        # path finishes in seconds.
        #
        # Since #776 this is no longer the only backstop either: the script
        # carries its own WATCHDOG_DEADLINE (420s) covering work `timeout`
        # cannot see — including the shell's own string handling, which is what
        # actually hung — and exits green with diagnostics when it trips. Lower
        # this below 7 minutes and the job timeout becomes the binding bound
        # again, which means a red job and no diagnostics.
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

permissions:
  contents: read

jobs:
  rerun:
    name: Re-run failed jobs on infra failure
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Re-run failed jobs and read failed-job logs
      actions: write
      # Read repository context for the tooling checkout
      contents: read

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Literal GitHub bootstrap allowlist (same pattern as the main
          # failure notifier): the tooling checkout and preset resolution run
          # after this step, so an empty caller allowed-endpoints must not
          # leave block-policy egress with an empty allowlist.
          # Carries the same two results-storage hosts as the input default:
          # this bootstrap allowlist is what governs the rerun step when a
          # caller passes its own (empty) allowed-endpoints, and a #794 probe
          # blocked at the network layer produces evidence that reads like an
          # empty endpoint.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            productionresults.blob.core.windows.net:443
            results-receiver.actions.githubusercontent.com:443
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lgtm-hq/lgtm-ci
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || github.workflow_sha }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref }}
          egress-policy: ${{ inputs.egress-policy }}
          egress-preset: ${{ inputs.egress-preset }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
          allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Re-run failed jobs on matched infra signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
          RUN_ATTEMPT: ${{ inputs.run-attempt }}
          MAX_RERUNS: ${{ inputs.max-reruns }}
          SIGNATURES: ${{ inputs.signatures }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/rerun-on-infra-failure.sh
