---
name: Reusable - Auto Re-run on Infra Failure

# Re-runs the failed jobs of a completed workflow run when — and only when —
# the failed-job logs match a known transient-infrastructure signature
# (GitHub-side outages such as "Failed to resolve action download info").
# RUN_ATTEMPT gating caps automation at max-reruns re-run(s) per run so a
# persistent outage can never loop. Runs of protected workflows and runs with
# a failed publish/promote/release/upload job are never re-run (#967): a
# `--failed` re-run repeats irreversible steps. Call from a workflow_run
# consumer gated on a failed conclusion (see
# examples/auto-rerun-on-infra-failure.yml):
#
#   rerun:
#     if: github.event.workflow_run.conclusion == 'failure'
#     uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-auto-rerun-on-infra-failure.yml@<sha>
#     permissions:
#       actions: write
#       checks: read
#       contents: read
#     with:
#       run-id: ${{ github.event.workflow_run.id }}
#       run-attempt: ${{ github.event.workflow_run.run_attempt }}
#       protected-workflows: publish-pypi-on-tag.yml
#       tooling-ref: <sha>

"on":
  workflow_call:
    inputs:
      run-id:
        description: "Workflow run id to inspect and potentially re-run"
        required: true
        type: string
      run-attempt:
        description: "Attempt number of the failed run"
        required: true
        type: string
      max-reruns:
        description: "Maximum automatic re-runs per run"
        required: false
        type: string
        default: "1"
      signatures:
        description: >-
          Extra newline-separated failure-log signatures appended to the
          built-in transient-infra defaults
        required: false
        type: string
        default: ""
      protected-workflows:
        description: >-
          Newline- or comma-separated workflow files (basename or
          .github/workflows path) or workflow names whose runs are never
          re-run automatically because their jobs have irreversible steps
          (publish, promote). Checked before any log is read (#967)
        required: false
        type: string
        default: ""
      protected-job-pattern:
        description: >-
          Case-insensitive extended regex; a failed job whose name matches is
          never re-run automatically, and since `gh run rerun --failed` cannot
          exclude jobs the whole run is left alone. Empty disables the guard
        required: false
        type: string
        default: "publish|promote|release|upload"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-results). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-results"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        # Kept at 10 deliberately (#743). The script now bounds itself:
        # LOG_FETCH_DEADLINE (180s) for the refetch loop, plus one in-flight
        # GH_CMD_TIMEOUT (60s) fetch, plus one bounded `gh run rerun` (60s),
        # is a ~5.5 min worst case, and the harden/checkout steps add well
        # under a minute. 10 leaves this job timeout as an outer backstop for
        # whatever the script cannot bound, rather than the binding constraint
        # it was when it silently killed the safety net mid-fetch. The happy
        # path finishes in seconds.
        #
        # Since #776 this is no longer the only backstop either: the script
        # carries its own WATCHDOG_DEADLINE (420s) covering work `timeout`
        # cannot see — including the shell's own string handling, which is what
        # actually hung — and exits green with diagnostics when it trips. Lower
        # this below 7 minutes and the job timeout becomes the binding bound
        # again, which means a red job and no diagnostics.
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

permissions:
  contents: read

env:
  # Egress presets rendered from scripts/ci/lib/egress/presets.sh by
