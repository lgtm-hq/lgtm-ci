jobs:
  rerun:
    name: Re-run failed jobs on infra failure
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Re-run failed jobs and read failed-job logs
      actions: write
      # Read the check-run annotations of failed jobs for the
      # runner-acquisition signature (#967); the caller must grant it too
      checks: read
      # Read repository context for the tooling checkout
      contents: read

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # github-results carries the results-storage wildcard the #794 probe
          # needs; a probe blocked at the network layer produces evidence that
          # reads like an empty endpoint.
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-results'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-results'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Re-run failed jobs on matched infra signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
          RUN_ATTEMPT: ${{ inputs.run-attempt }}
          MAX_RERUNS: ${{ inputs.max-reruns }}
          SIGNATURES: ${{ inputs.signatures }}
          PROTECTED_WORKFLOWS: ${{ inputs.protected-workflows }}
          PROTECTED_JOB_PATTERN: ${{ inputs.protected-job-pattern }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/rerun-on-infra-failure.sh
