        static.crates.io:443 index.crates.io:443 ghcr.io:443 pkg-containers.githubusercontent.com:443
        docker.io:443 registry-1.docker.io:443 auth.docker.io:443 production.cloudflare.docker.com:443
        production.cloudfront.docker.com:443 archive.ubuntu.com:80 azure.archive.ubuntu.com:80
        security.ubuntu.com:80 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 timestamp.sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443 sigstore-tuf-root.storage.googleapis.com:443",
        "release-recover":"github.com:443 api.github.com:443 uploads.github.com:443
        actions.githubusercontent.com:443 token.actions.githubusercontent.com:443 codeload.github.com:443
        objects.githubusercontent.com:443 raw.githubusercontent.com:443
        release-assets.githubusercontent.com:443 pipelines.actions.githubusercontent.com:443
        *.blob.core.windows.net:443 pypi.org:443 registry.npmjs.org:443 fulcio.sigstore.dev:443
        rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443 oauth2.sigstore.dev:443 ghcr.io:443
        pkg-containers.githubusercontent.com:443",
        "release-version-pr":"github.com:443 api.github.com:443 codeload.github.com:443
        objects.githubusercontent.com:443 raw.githubusercontent.com:443
        release-assets.githubusercontent.com:443 uploads.github.com:443
        pipelines.actions.githubusercontent.com:443 pypi.org:443 files.pythonhosted.org:443
        static.rust-lang.org:443 crates.io:443 static.crates.io:443 index.crates.io:443",
        "external-canary":"github.com:443 api.github.com:443"}
      # lgtm-ci-egress-presets:end
    outputs:
      allowed-endpoints: >-
        ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
        && inputs.allowed-endpoints
        || format('{0} {1}',
        fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'scorecard'],
        inputs.allowed-endpoints) }}
    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'scorecard'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'scorecard'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1

  scorecards:
    name: ${{ inputs.job-name }}
    needs: egress-preset
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed by the egress-preset job: needs outputs are fixed before
          # this job starts, so the pre hook sees them (#1173).
          allowed-endpoints: ${{ needs.egress-preset.outputs.allowed-endpoints }}
      # No local composite steps here: ossf/scorecard-action's publish path
      # only allows checkout, upload-artifact, upload-sarif, scorecard-action,
      # and harden-runner in the calling job — any other step, run: steps
      # included, fails publish with "job has unallowed step" (#518, #1173).
      # Job or workflow env/defaults are rejected too.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          repo_token: ${{ github.token }}
          results_format: ${{ inputs.results-format }}
          results_file: ${{ inputs.results-file }}
          publish_results: ${{ inputs.publish-results }}
      - name: Upload SARIF
        if: inputs.upload-sarif && inputs.results-format == 'sarif'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ inputs.results-file }}
