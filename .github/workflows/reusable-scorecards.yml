---
name: Reusable OpenSSF Scorecard

on:
  workflow_call:
    inputs:
      results-format:
        description: >-
          Scorecard output format (default sarif). When overriding to a non-sarif
          format, also set results-file to a matching path (e.g. results.json).
        required: false
        type: string
        default: "sarif"
      publish-results:
        description: "Publish scorecard results"
        required: false
        type: boolean
        default: true
      upload-sarif:
        description: "Upload SARIF to GitHub Security tab"
        required: false
        type: boolean
        default: true
      results-file:
        description: >-
          Scorecard results output path. Defaults to "results.sarif"; callers
          using a non-sarif results-format should override this to match their
          chosen format (e.g. "results.json").
        required: false
        type: string
        default: "results.sarif"

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default scorecard). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "scorecard"
      job-name:
        description: "GitHub check name for OpenSSF Scorecard"
        required: false
        type: string
        default: "OpenSSF Scorecard"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 30

