---
name: Reusable OpenSSF Scorecard

on:
  workflow_call:
    inputs:
      results-format:
        description: >-
          Scorecard output format (default sarif). When overriding to a non-sarif
          format, also set results-file to a matching path (e.g. results.json).
        required: false
        type: string
        default: "sarif"
      publish-results:
        description: "Publish scorecard results"
        required: false
        type: boolean
        default: true
      upload-sarif:
        description: "Upload SARIF to GitHub Security tab"
        required: false
        type: boolean
        default: true
      results-file:
        description: >-
          Scorecard results output path. Defaults to "results.sarif"; callers
          using a non-sarif results-format should override this to match their
          chosen format (e.g. "results.json").
        required: false
        type: string
        default: "results.sarif"

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default scorecard). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "scorecard"
      job-name:
        description: "GitHub check name for OpenSSF Scorecard"
        required: false
        type: string
        default: "OpenSSF Scorecard"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 30

jobs:
  egress-preset:
    # The Scorecard API re-verifies this workflow before it accepts published
    # results and rejects a workflow-level env, and any step without uses: in
    # the job that calls scorecard-action (#1173, as #535 for composites). The
    # preset map and the unknown-preset guard therefore live in this job; the
    # scorecard job reads the composed allowlist from its output, which is
    # fixed before that job (and its harden-runner pre hook) starts.
    name: Scorecard egress preset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      # Egress presets rendered from scripts/ci/lib/egress/presets.sh by
      # scripts/ci/egress/sync-workflow-presets.sh — do not edit by hand.
      # lgtm-ci-egress-presets:begin
