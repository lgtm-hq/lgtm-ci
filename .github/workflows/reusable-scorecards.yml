        "scorecard":"github.com:443 api.github.com:443 codeload.github.com:443
        objects.githubusercontent.com:443 raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443 gcr.io:443 api.osv.dev:443 api.scorecard.dev:443
