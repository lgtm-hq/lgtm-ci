---
name: Reusable All Checks Gate

# One required check that passes only when every OTHER check on the commit
# finished green. Native auto-merge and the merge queue wait for REQUIRED
# checks only; requiring this gate makes them wait for all of them. The job
# polls the commit's workflow runs, check runs and commit statuses until
# nothing is queued or in progress and the set has been stable for
# settle-seconds, then fails on any conclusion other than success, skipped or
# neutral (scripts/ci/actions/all-checks-gate.sh). Needs no secrets, so it
# works read-only on fork PRs. Call it from its OWN workflow file, and from
# one caller workflow per repository: runs of the calling workflow are
# excluded so a gate never waits on itself, but two different caller files
# would wait on each other until both time out.
#
#   name: All Checks Gate
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#     merge_group:
#   permissions: {}
#   concurrency:
#     group: all-checks-gate-${{ github.event.pull_request.number || github.ref }}
#     cancel-in-progress: true
#   jobs:
#     gate:
#       uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-all-checks-gate.yml@<sha>
#       permissions:
#         actions: read
#         checks: read
#         contents: read
#         statuses: read
#
# Require the context `gate / ✅ All Checks Passed` in the ruleset.

"on":
  workflow_call:
    inputs:
      head-sha:
        description: >-
          Commit to gate. Empty (default) resolves the PR head SHA on
          pull_request, merge_group.head_sha on merge_group, else github.sha
        required: false
        type: string
        default: ""
      settle-seconds:
        description: >-
          Quiet period, with nothing pending and no new or changed check,
          before the verdict; catches late-starting workflows and jobs that
          are still waiting on needs
        required: false
        type: number
        default: 60
      poll-interval-seconds:
        description: >-
          Seconds between API polls. While a workflow run is in progress a
          poll is one request, otherwise three; GITHUB_TOKEN allows 1,000
          requests per hour per repository, shared by every workflow
        required: false
        type: number
        default: 60
      ignore-checks:
        description: >-
          Regex (jq/Oniguruma) of check-run names, commit-status contexts and
          workflow names that are not gated, e.g. bots that never finish.
          Empty gates everything
        required: false
        type: string
        default: ""
      allow-empty:
        description: >-
          Pass when no other check or status exists on the commit. Off by
          default: in a merge queue whose other workflows do not trigger on
          merge_group, a vacuous pass would merge unchecked
        required: false
        type: boolean
        default: false
      fail-on-draft:
        description: >-
          Fail at once on draft PRs, so a draft's result (often all skipped)
          can never be read as a pass in the moments after ready_for_review,
          which re-runs the gate
        required: false
        type: boolean
        default: false
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-results, including Actions log downloads). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-results"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-26.04"
      timeout-minutes:
        description: >-
          Job timeout in minutes; the wait gives up (and fails) three minutes
          earlier so the log names what was still pending. Set above the longest
          dependency path plus setup, queue and settle time; e.g. a 120-minute
          build needs a larger gate budget than the default 60 minutes
        required: false
        type: number
        default: 60

    outputs:
      exit-code:
        description: "0 when every other check passed, 1 otherwise"
        value: ${{ jobs.gate.outputs.exit-code }}
      status:
        description: "passed or failed"
        value: ${{ jobs.gate.outputs.status }}

