jobs:
  gate:
    # Static name: rulesets require `<caller job id> / ✅ All Checks Passed`,
    # and the script excludes this name so the gate never waits on itself.
    name: "✅ All Checks Passed"
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # List the workflow runs on the commit (jobs still waiting on needs)
      actions: read
      # Read the commit's check runs
      checks: read
      # Read repository context for the tooling checkout
      contents: read
      # Read the commit's statuses (CodeRabbit, renovate/stability-days, ...)
      statuses: read
    outputs:
      exit-code: ${{ steps.gate.outputs.exit-code }}
      status: ${{ steps.gate.outputs.status }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-results'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-results'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
      - name: Wait for every other check
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # yamllint disable-line rule:line-length
          HEAD_SHA: ${{ inputs.head-sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          SELF_WORKFLOW_REF: ${{ github.workflow_ref }}
          SELF_RUN_ID: ${{ github.run_id }}
          IGNORE_PATTERN: ${{ inputs.ignore-checks }}
          SETTLE_SECONDS: ${{ inputs.settle-seconds }}
          POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          ALLOW_EMPTY: ${{ inputs.allow-empty }}
          FAIL_ON_DRAFT: ${{ inputs.fail-on-draft }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/all-checks-gate.sh
