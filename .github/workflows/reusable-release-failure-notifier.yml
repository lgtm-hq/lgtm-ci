---
name: Reusable - Release Failure Notifier

# Release-mode failure notifier for tag publish runs (#964).
#
# reusable-main-failure-notifier.yml is keyed to a branch: on a tag-triggered
# publish run GITHUB_REF_NAME is the tag, the branch gate never matches, and a
# failed publish stays silent. This reusable bypasses that gate and dedups by
# tag instead, so a partial release produces exactly one open issue per tag
# with the per-channel state a human needs to pick a recovery tier
# (docs/release-security-policy.md).
#
# Call from a publish workflow after every publish job (all channels in scope):
#
#   release-failure-notifier:
#     name: Report release failure
#     needs: [pypi-build, pypi-upload, github-release]
#     if: always()
#     uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-failure-notifier.yml@<sha>
#     with:
#       workflow-key: publish-python-release
#       tag: ${{ github.ref_name }}
#       channels: ${{ toJson(needs) }}
#     permissions:
#       actions: read
#       contents: read
#       issues: write
#
# Behavior:
#   - every channel success/skipped  → comments on and closes the tag's issue
#   - a channel failed, attempt <= max-reruns and the failed-job logs match an
#     infra signature (same classifier as the auto-rerun safety net) → quiet;
#     an automatic re-run may still fix the run
#   - otherwise → files or updates one deduplicated issue
#     (`release-failure:<workflow-key>:<tag>`) with the channel table
#
# The channels payload accepts `toJson(needs)` directly (object keyed by job
# name); per-job `url` and an optional `probe` (published or not) may be added
# by building the JSON in a pre-step when the caller wants those columns.

"on":
  workflow_call:
    inputs:
      workflow-key:
        description: >-
          Stable key namespacing the dedup marker and issue title
          (e.g. publish-python-release, publish-npm-set)
        required: true
        type: string
      tag:
        description: Release tag whose publish is being reported (e.g. v1.2.3)
        required: true
        type: string
      channels:
        description: >-
          JSON of the caller's publish-job results, either an array of
          {name, result, url, probe} or `toJson(needs)`; unknown shapes are
          reported as a failure so the run stays visible
        required: false
        type: string
        default: "[]"
      max-reruns:
        description: >-
          Automatic re-runs the caller allows for this run. Suppression is
          opt-in: leave 0 unless reusable-auto-rerun-on-infra-failure.yml
          watches this workflow, then match its max-reruns input; attempts
          within budget whose failed-job logs match an infra signature do not
          file yet
        required: false
        type: number
        default: 0
      signatures:
        description: >-
          Extra newline-separated failure-log signatures appended to the
          built-in transient-infra defaults; pass the same value as the
          auto-rerun reusable so the two classifiers cannot disagree
        required: false
        type: string
        default: ""
      failure-issue-labels:
        description: Comma-separated labels for auto-opened failure issues
        required: false
        type: string
        default: "bug,ci,release,automation,infrastructure"
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: Timeout for the notifier job
        required: false
        type: number
        default: 10
      egress-policy:
        description: Egress policy for harden-runner (audit or block)
        required: false
        type: string
        default: block
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false
    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false

permissions:
  contents: read

