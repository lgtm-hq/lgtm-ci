  # lgtm-ci-egress-presets:end

jobs:
  notify:
    name: Report release tag publish outcome
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # always(): the job both files on failure and closes on success, so the
    # caller wires one call with needs covering every publish job and never
    # gates it on outcome.
    if: always()
    # GitHub neither enforces unique issue titles nor makes issue creation
    # idempotent: two notifier jobs for the same key+tag overlapping the
    # search-then-create window would file twice. Serialize them.
    concurrency:
      group: release-failure-${{ github.repository }}-${{ inputs.workflow-key }}-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      # Read workflow/job metadata and this run's failed-job logs for the
      # infra-signature classification
      actions: read
      # Read repository context for the issue body
      contents: read
      # Create, comment on, and close failure notification issues
      issues: write

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Fixed preset from the literal map in env (not caller-selectable).
          allowed-endpoints: ${{ fromJSON(env.LGTM_CI_EGRESS_PRESETS)['github-minimal'] }}
      # harden-runner cannot enforce block mode on GitHub-hosted Windows/macOS
      # (audit-only per docs/workflow-contract.md). The later steps run with
      # GH_TOKEN and issues: write, so a block request that cannot be honored
      # fails here, right after the (skipped) harden step and before the
      # tooling checkout and every tokenized step, instead of running
      # unprotected. harden-runner itself must stay the first step (validator).
      - name: Refuse block egress on runners that cannot enforce it
        if: >-
          inputs.egress-policy == 'block' &&
          runner.os != 'Linux' &&
          runner.environment != 'self-hosted'
        shell: bash
        run: |
          echo "::error::egress-policy 'block' cannot be enforced on GitHub-hosted ${RUNNER_OS};" \
            "use a GitHub-hosted Linux runner-image, a self-hosted runner, or egress-policy 'audit'"
          exit 1
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
            scripts/ci/
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Warn on explicit tooling-ref override
        # hashFiles guards callers that pin a tooling-ref predating the script.
        if: >-
          inputs.tooling-ref != ''
          && hashFiles('.lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh') != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh
      - name: Refuse a diverging tooling-ref
        # Inline bootstrap: the guard comes from the override tree itself, so a
        # tooling-ref older than the script cannot run it. On GitHub.com that
        # absence is divergence from job.workflow_sha; GHES (empty SHA) skips.
        if: inputs.tooling-ref != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ALLOW_DIVERGENCE: ${{ inputs.tooling-ref-allow-divergence }}
        run: |
          guard=.lgtm-ci-tooling/.github/actions/checkout-and-harden/check-tooling-ref-divergence.sh
          if [[ -f "$guard" ]]; then
            exec bash "$guard"
          fi
          [[ -n "$WORKFLOW_SHA" ]] || exit 0
          msg="tooling-ref ${TOOLING_REF_OVERRIDE} predates the divergence guard (#1368)"
          msg+=" and cannot match workflow ${WORKFLOW_SHA}; remove tooling-ref (#995)"
          if [[ "$ALLOW_DIVERGENCE" == "true" ]]; then
            echo "::warning title=tooling-ref divergence::${msg}"
          else
            echo "::error title=tooling-ref divergence::${msg}"
            exit 1
          fi
      - name: Classify tag publish outcome
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_KEY: ${{ inputs.workflow-key }}
          RELEASE_TAG: ${{ inputs.tag }}
          CHANNELS_JSON: ${{ inputs.channels }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MAX_RERUNS: ${{ inputs.max-reruns }}
          INFRA_SIGNATURES: ${{ inputs.signatures }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/report-release-failure.sh
          classify_release_failure
      - name: Write release trigger summary
        if: steps.classify.outputs.verdict != 'success'
        shell: bash
        env:
          WORKFLOW_KEY: ${{ inputs.workflow-key }}
          RELEASE_TAG: ${{ inputs.tag }}
          FAILURE_HEADING_LABEL: Release Publish
          PRIMARY_JOB_FAILED: "true"
          FAILURE_VERDICT: ${{ steps.classify.outputs.verdict }}
          FAILURE_REASON: ${{ steps.classify.outputs.reason }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/report-release-failure.sh
          write_trigger_summary
      - name: File or update release failure issue
        if: steps.classify.outputs.verdict == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_KEY: ${{ inputs.workflow-key }}
          RELEASE_TAG: ${{ inputs.tag }}
          CHANNELS_JSON: ${{ inputs.channels }}
          FAILURE_ISSUE_LABELS: ${{ inputs.failure-issue-labels }}
          # The issue summary is worded from the classify reason, so it never
          # claims "retries exhausted" for a first-attempt non-infra failure.
          FAILURE_REASON: ${{ steps.classify.outputs.reason }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MAX_RERUNS: ${{ inputs.max-reruns }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/report-release-failure.sh
          notify_release_failure
      - name: Close release failure issue
        if: steps.classify.outputs.verdict == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_KEY: ${{ inputs.workflow-key }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/report-release-failure.sh
          close_release_failure
