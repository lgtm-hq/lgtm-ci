---
# Build with a caller-provided command and upload an artifact for handoff.
# Matrix legs keep a static inner job name so GitHub appends the version suffix
# (e.g. "🏗️ Build & Quality Checks (20)"), matching org ruleset contexts:
# `{caller_job_id} / {job-name} ({node-version})`.
#
# Toolchain-agnostic (#760): `toolchain` selects a vetted, digest-pinned setup
# action, `matrix` generalises `node-version-matrix`, and `runner-map` routes
# matrix entries to runners the same way reusable-docker does. A caller that
# sets none of those keeps exactly today's Node behaviour, including job names.
name: Reusable Build Artifact Workflow

on:
  workflow_call:
    inputs:
      job-name:
        description: "GitHub check name for the build job (matrix suffix appended)"
        required: false
        type: string
        default: "Build"
      build-command:
        description: >-
          Shell command to build artifacts (e.g. ./scripts/build.sh --quick or
          bun run build). Runs in working-directory.
        required: true
        type: string
      toolchain:
        description: >-
          Toolchain to install before build-command: node | rust | python |
          none. Each value maps to a digest-pinned setup action inside lgtm-ci
          (enum rather than a free-form action ref so pinning stays centralised
          and validate-action-pinning keeps covering it).
        required: false
        type: string
        default: "node"
      toolchain-version:
        description: >-
          Version for the selected toolchain (node-version / python-version /
          rust-toolchain). Alias of node-version when toolchain is node.
          Defaults: rust stable, python 3.12. For node with no version input
          and no matrix, see node-version for the resolution order. Ignored
          when toolchain is none.
        required: false
        type: string
        default: ""
      matrix:
        description: >-
          Arbitrary JSON build matrix: an array of objects, or an object with an
          "include" array. Generalises node-version-matrix, e.g.
          '[{"target":"x86_64-apple-darwin"},{"target":"x86_64-unknown-linux-musl"}]'.
          Mutually exclusive with node-version and node-version-matrix.
        required: false
        type: string
        default: ""
      runner-map:
        description: >-
          JSON object mapping a matrix value to a runner label, mirroring
          reusable-docker. Matrix values with no mapping fall back to
          runner-image. Example: {"x86_64-apple-darwin":"macos-15"}
        required: false
        type: string
        default: "{}"
      runner-map-key:
        description: >-
          Matrix field used as the runner-map lookup key. Empty auto-detects
          when matrix entries have exactly one field; required when they have
          more than one.
        required: false
        type: string
        default: ""
      node-version:
        description: >-
          Single Node.js version. Mutually exclusive with node-version-matrix.
          Equivalent to toolchain-version with toolchain: node. When this,
          toolchain-version, node-version-matrix and matrix are all empty, the
          version is resolved from the caller checkout (working-directory):
          .nvmrc, then .node-version, then package.json engines.node (a range
          is reduced to its lowest major), then lts/*.
        required: false
        type: string
        default: ""
      node-version-matrix:
        description: >-
          DEPRECATED (use matrix). JSON array of Node.js versions for a matrix
          (e.g. '["20","22"]'). Mutually exclusive with node-version. Legs keep
          a static inner name; GitHub appends the version suffix.
        required: false
        type: string
        default: ""
      artifact-name:
        description: >-
          Artifact name for upload. Matrix mode appends the leg's matrix values
          (-<node-version>, -<target>, ...) so legs do not collide. The
          runner-map-injected runner is excluded from the suffix.
        required: true
        type: string
      artifact-path:
        description: "File or directory to upload after a successful build"
        required: true
        type: string
      retention-days:
        description: "Days to retain the uploaded artifact"
        required: false
        type: number
        default: 7
      post-build-test-command:
        description: >-
          Optional shell command after build-command (e.g. bun test). Empty
          skips. Covers build+test combos such as holy-grail Build & Test.
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory for build and post-build commands"
        required: false
        type: string
        default: "."
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false

      egress-policy:
        description: "harden-runner egress policy (block only; audit rejected)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh.
          Accepted presets: build-artifact. Any other name fails (#1623)
          (default build-artifact). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "build-artifact"
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: "Timeout for build jobs in minutes"
        required: false
        type: number
        default: 30

    outputs:
      artifact-name:
        description: >-
          Uploaded artifact name (matrix legs append their matrix values). For
          multi-leg matrices this reflects one completed leg; prefer the
          documented naming convention for downloads.
        value: ${{ jobs.build.outputs.artifact-name }}
      artifact-id:
        description: "actions/upload-artifact artifact-id from the build job"
        value: ${{ jobs.build.outputs.artifact-id }}
      artifact-url:
        description: "actions/upload-artifact artifact-url from the build job"
        value: ${{ jobs.build.outputs.artifact-url }}
    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false
      LGTM_CI_TOOLING_APP_CLIENT_ID:
        description: >-
          Optional client ID of a GitHub App installed on the lgtm-ci tooling
          repository only, with contents: read. Together with the App's
          private key, each job mints a short-lived token used only by the
          tooling checkouts, in place of the stored tooling token. Pass both
          App secrets or neither (#1622).
        required: false
      LGTM_CI_TOOLING_APP_PRIVATE_KEY:
        description: >-
          Optional private key of the tooling GitHub App. Pass it together
          with the App's client ID (#1622).
        required: false

env:
  # Egress presets rendered from scripts/ci/lib/egress/presets.sh by
  # scripts/ci/egress/sync-workflow-presets.sh — do not edit by hand. Every
  # harden-runner step below indexes this map by expression: the
  # step-security pre hook installs the agent before any step runs, so the
  # allowlist must be composed from literals and inputs only (#412/#420/#913).
  # lgtm-ci-egress-accepts: build-artifact
  # lgtm-ci-egress-presets:begin
  LGTM_CI_EGRESS_PRESETS: >-
    {"build-artifact":"github.com:443 api.github.com:443 codeload.github.com:443
    release-assets.githubusercontent.com:443 objects.githubusercontent.com:443
    raw.githubusercontent.com:443 pipelines.actions.githubusercontent.com:443
    github-releases.githubusercontent.com:443 bun.sh:443 nodejs.org:443 registry.npmjs.org:443
    pypi.org:443 files.pythonhosted.org:443 astral.sh:443 releases.astral.sh:443
    static.rust-lang.org:443 sh.rustup.rs:443 crates.io:443 static.crates.io:443 index.crates.io:443"}
  # lgtm-ci-egress-presets:end

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    # Independent short cap: the caller's timeout-minutes bounds the build job.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      matrix-mode: ${{ steps.validate.outputs.matrix-mode }}
      # Validated and trimmed; the setup steps gate on this rather than on the
      # raw input so a padded toolchain value cannot skip its setup step.
      toolchain: ${{ steps.validate.outputs.toolchain }}

    env:
      # lgtm-ci-inline:begin tooling-app-flags
      # Generated from scripts/ci/bootstrap/tooling-app-flags.yml by
      # sync_inline_blocks.py: edit the source, not this copy. Inline because job
      # env: entries cannot call a script.
      # Tooling App secrets present? A step `if:` cannot read secrets (#1622).
      LGTM_CI_TOOLING_APP_ID_SET: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' }}
      LGTM_CI_TOOLING_APP_KEY_SET: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '' }}
      # lgtm-ci-inline:end tooling-app-flags

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'build-artifact'],
            inputs.allowed-endpoints) }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT: ${{ vars.LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # Generated from scripts/ci/bootstrap/verify-harden-runner-agent.sh by
          # sync_inline_blocks.py: edit the source, not this copy. Inline because it
          # runs after harden-runner, before any checkout.
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # No exemption for GitHub Enterprise Server (owner decision): a public
              # repository there must be made internal or private to run.
              if [[ "${REPOSITORY_PRIVATE:-}" == false ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input), or make the" \
                  "repository internal or private"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          # Print the agent's own start-up errors (#1669); never changes the verdict.
          agent_errors() (
            export LC_ALL=C
            set +e +o pipefail
            if [[ ! -e "$agent_log" ]]; then
              echo "agent.log is missing; no agent start-up error to show"
              exit 0
            fi
            if [[ ! -f "$agent_log" || ! -r "$agent_log" ]]; then
              echo "agent.log is not a readable file; no agent start-up error to show"
              exit 0
            fi
            unsafe='[^[:alnum:] .,:;_=/@()+-]'
            shown=0
            while IFS= read -r line; do
              line="${line:0:512}"
              printf 'verify-harden-runner-agent: agent.log: %s\n' "${line//$unsafe/?}"
              shown=$((shown + 1))
            done < <(head -c 1048576 -- "$agent_log" 2> /dev/null |
              grep -aE -m 20 "^${stamp}(Error .*|Reverted changes)\$") 2> /dev/null
            if ((shown == 0)); then
              echo "agent.log has no agent start-up error line"
            fi
          )
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              agent_errors || true
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            agent_errors || true
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Only the standard agent is trusted (#1668): refuse harden-runner's eBPF
          # fallback agent, then require the standard agent's build info. grep exit 2
          # (unreadable log) fails closed here and below.
          if [[ ! -e "$agent_log" ]]; then
            echo "${failed}/home/agent/agent.log is missing; the agent build is unproven"
            exit 1
          fi
          agent=standard
          grep_status=0
          grep -qE "^${stamp}\[buildInfo\] name=AgentAlpha( |\$)" "$agent_log" ||
            grep_status=$?
          case "$grep_status" in
            0)
              # Opt-in (#1668): only the exact value true accepts the eBPF agent, and
              # only with its own evidence of block mode below.
              if [[ "${LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT:-}" != true ]]; then
                echo "::error title=harden-runner agent refused::harden-runner installed its" \
                  "eBPF fallback agent; only the standard agent is trusted"
                exit 1
              fi
              agent=ebpf
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          standard="^${stamp}\[buildInfo\] tag=v[0-9][^ ]* commit=[0-9a-f]{40} branch=[^ ]+ ?\$"
          ebpf="^${stamp}\[buildInfo\] name=AgentAlpha branch=[^ ]+ tag=v[0-9][^ ]*"
          ebpf+=" commit=[0-9a-f]{40}\$"
          build="$standard"
          [[ "$agent" == standard ]] || build="$ebpf"
          grep_status=0
          builds="$(grep -E "^${stamp}\[buildInfo\]" "$agent_log")" || grep_status=$?
          if ((grep_status > 1)); then
            echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
            exit 1
          fi
          if [[ -z "$builds" ]] || grep -qvE "$build" <<< "$builds"; then
            echo "${failed}agent.log does not identify the ${agent} agent; egress" \
              "enforcement is unproven"
            exit 1
          fi
          # One agent start only: exactly one build record, and it is the log's first
          # record. A log that spans two starts could lend the first start's evidence
          # to the agent now running.
          first="$(grep -m 1 -E "^${stamp}" "$agent_log")" || first=""
          if [[ "$builds" == *$'\n'* || "$builds" != "$first" ]]; then
            echo "${failed}agent.log does not start with exactly one build record of the" \
              "${agent} agent; egress enforcement is unproven"
            exit 1
          fi
          if [[ "$agent" == ebpf ]]; then
            # The eBPF agent's own evidence of block mode replaces resolved.conf, which
            # it never changes: every feature-flag line it logs has NetMode:ebpf, and
            # its tracer logs "block-policy applied", which can follow Initialized by
            # a second (fixture run 44396392356), so wait for it within 30s. Any other
            # policy line of its tracer (the v1.9.5 binary also has "deny-list
            # applied" and "failed to apply ..."), a missing piece or an unreadable log
            # fails, and the policy lines are read again after the last is-active.
            modes="$(grep -E "^${stamp}.*NetMode:" "$agent_log")" || modes=""
            if [[ -z "$modes" ]] || grep -qvE 'NetMode:ebpf[ }]' <<< "$modes"; then
              echo "${failed}the eBPF agent does not report NetMode:ebpf; egress" \
                "enforcement is unproven"
              exit 1
            fi
            policy_re="^${stamp}\[tracerManager\] ([a-z-]+-policy applied|deny-list"
            policy_re+=" applied|failed to apply )"
            block_re="^${stamp}\[tracerManager\] block-policy applied\$"
            # Print block, other, none or unreadable.
            ebpf_policy() {
              local lines status=0
              lines="$(grep -E "$policy_re" "$agent_log")" || status=$?
              if ((status > 1)); then
                echo unreadable
              elif [[ -z "$lines" ]]; then
                echo none
              elif grep -qvE "$block_re" <<< "$lines"; then
                echo other
              else
                echo block
              fi
            }
            # Succeed on block; otherwise print why and fail.
            ebpf_policy_ok() {
              case "$1" in
                block) return 0 ;;
                other)
                  echo "${failed}the eBPF agent applied a policy other than block; egress" \
                    "is not enforced"
                  ;;
                none)
                  echo "${failed}the eBPF agent did not log block-policy applied within 30s;" \
                    "egress enforcement is unproven"
                  ;;
                *)
                  echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
                  ;;
              esac
              return 1
            }
            deadline=$(($(date +%s) + 30))
            policy="$(ebpf_policy)"
            while [[ "$policy" == none ]] && (($(date +%s) < deadline)); do
              sleep 1
              policy="$(ebpf_policy)"
            done
            ebpf_policy_ok "$policy" || exit 1
            if ! systemctl is-active --quiet agent.service; then
              agent_errors || true
              echo "${failed}agent.service stopped while the eBPF agent was checked;" \
                "egress is not enforced"
              exit 1
            fi
            # A policy logged during the wait or the is-active check counts too.
            ebpf_policy_ok "$(ebpf_policy)" || exit 1
          fi
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              agent_errors || true
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          if [[ "$agent" == standard ]] &&
            ! grep -qxF 'DNS=127.0.0.1' "$root/etc/systemd/resolved.conf" 2> /dev/null; then
            echo "${failed}resolved.conf does not use the agent's DNS proxy; egress is not enforced"
            exit 1
          fi
          # The recheck steps read which agent was verified from this step's output,
          # which no later step can change.
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            printf 'agent=%s\n' "$agent" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$agent" == ebpf ]]; then
            echo "::warning title=harden-runner eBPF agent accepted::harden-runner's eBPF" \
              "fallback agent was accepted because LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT" \
              "is true; it logged NetMode:ebpf and block-policy applied"
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'build-artifact'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: |
          # lgtm-ci-inline:begin fail-unknown-egress-preset
          # Generated from scripts/ci/bootstrap/fail-unknown-egress-preset.sh by
          # sync_inline_blocks.py: edit the source, not this copy. Inline because it
          # runs after harden-runner, before any checkout.
          echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"
          exit 1
          # lgtm-ci-inline:end fail-unknown-egress-preset
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lgtm-ci-inline:begin tooling-app-mint
      # Generated from scripts/ci/bootstrap/tooling-app-mint.yml by
      # sync_inline_blocks.py: edit the source, not this copy. Inline because they
      # mint the token the tooling checkout uses.
      - name: Check tooling App credential
        id: tooling-app-target
        # Only when a tooling consumer will run and an App secret is set (#1622).
        if: >-
          env.LGTM_CI_TOOLING_APP_NEEDED != 'false'
          && (env.LGTM_CI_TOOLING_APP_ID_SET == 'true' || env.LGTM_CI_TOOLING_APP_KEY_SET == 'true')
        shell: bash
        env:
          TOOLING_REPOSITORY: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          SHAPE: ^([A-Za-z0-9][A-Za-z0-9_-]*)/([A-Za-z0-9._-]+)$
          INCOMPLETE: >-
            ::error title=incomplete tooling App credential::pass both
            LGTM_CI_TOOLING_APP_CLIENT_ID and LGTM_CI_TOOLING_APP_PRIVATE_KEY, or neither
          UNREADABLE: >-
            ::error title=unreadable tooling repository::cannot split the tooling
            repository into an owner and a name
        run: |
          [[ "${LGTM_CI_TOOLING_APP_ID_SET}" == "${LGTM_CI_TOOLING_APP_KEY_SET}" ]] || { echo "${INCOMPLETE}"; exit 1; }
          [[ "${TOOLING_REPOSITORY}" =~ ${SHAPE} ]] || { echo "${UNREADABLE}"; exit 1; }
          printf 'owner=%s\nrepository=%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" >> "${GITHUB_OUTPUT}"
      - name: Mint tooling App token
        id: tooling-app-token
        # Tooling repository only, asks for contents: read only (#1622).
        if: steps.tooling-app-target.outputs.repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
          private-key: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
          owner: ${{ steps.tooling-app-target.outputs.owner }}
          repositories: ${{ steps.tooling-app-target.outputs.repository }}
          permission-contents: read
      # lgtm-ci-inline:end tooling-app-mint
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          # App requested: the minted token or a sentinel that cannot
          # authenticate, never a weaker fallback (#1622).
          token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Validate build artifact inputs
        id: validate
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          TOOLCHAIN_VERSION: ${{ inputs.toolchain-version }}
          NODE_VERSION: ${{ inputs.node-version }}
          NODE_VERSION_MATRIX: ${{ inputs.node-version-matrix }}
          MATRIX: ${{ inputs.matrix }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/validate-build-artifact-inputs.sh
      - name: Generate build matrix
        id: matrix
        shell: bash
        env:
          VERSION_KEY: ${{ steps.validate.outputs.version-key }}
          VERSIONS: ${{ steps.validate.outputs.versions }}
          TOOLCHAIN_VERSION: ${{ steps.validate.outputs.toolchain-version }}
          MATRIX: ${{ inputs.matrix }}
          RUNNER_MAP: ${{ inputs.runner-map }}
          RUNNER_MAP_KEY: ${{ inputs.runner-map-key }}
          DEFAULT_RUNNER: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/generate-build-matrix.sh
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT: ${{ vars.LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT }}
          HARDEN_RUNNER_AGENT: ${{ steps.verify-harden-runner.outputs.agent }}
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Generated from scripts/ci/bootstrap/recheck-harden-runner-agent.sh by
          # sync_inline_blocks.py: edit the source, not this copy. Inline because not
          # every job checks the tooling out, and job steps can change it.
          # Recheck of the harden-runner agent, before each irreversible publish
          # step (#1551) and at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # Which agent the verify step proved, from its step output (#1668).
          case "${HARDEN_RUNNER_AGENT:-}" in
            standard) ;;
            ebpf)
              if [[ "${LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT:-}" != true ]]; then
                echo "::error title=harden-runner agent refused::the eBPF fallback agent is" \
                  "running but LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT is not true"
                exit 1
              fi
              # Its block-mode lines must still be there, and no other policy or revert
              # line of its own may have appeared since (the v1.9.5 binary has
              # "deny-list applied", "failed to apply ...", "Reverted changes" and
              # "Error in Initialization"). Any job step can write agent.log by now, so
              # this cannot prove enforcement: a step can only make it fail.
              log="${HARDEN_RUNNER_ROOT:-}/home/agent/agent.log"
              stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
              stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
              for proof in '\[buildInfo\] name=AgentAlpha ' '.*NetMode:ebpf[ }]' \
                '\[tracerManager\] block-policy applied$'; do
                if ! grep -qE -m 1 "^${stamp}${proof}" "$log" 2> /dev/null; then
                  echo "$stopped (agent.log no longer shows the eBPF agent's block mode)"
                  exit 1
                fi
              done
              policy="^${stamp}\[tracerManager\] ([a-z-]+-policy applied|deny-list"
              policy+=" applied|failed to apply )"
              others="$(grep -E "$policy" "$log" 2> /dev/null |
                grep -vE "^${stamp}\[tracerManager\] block-policy applied\$")" || others=""
              if [[ -n "$others" ]]; then
                echo "$stopped (the eBPF agent applied a policy other than block)"
                exit 1
              fi
              if grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
                "$log" 2> /dev/null; then
                echo "$stopped (agent.log reports that the eBPF agent reverted)"
                exit 1
              fi
              echo "harden-runner eBPF agent is still active in block mode (accepted" \
                "because LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT is true)"
              exit 0
              ;;
            *)
              echo "::error title=harden-runner agent unproven::the verify step did not" \
                "record which agent it verified (steps.verify-harden-runner.outputs.agent)"
              exit 1
              ;;
          esac
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS"
          # lgtm-ci-inline:end recheck-harden-runner-agent

  build:
    name: ${{ inputs.job-name }}
    needs: prepare
    # runner-map legs carry their own runner; every other leg (including every
    # legacy Node caller, which never gets a runner field) follows the default
    # runner selection: explicit input, org variable, then GitHub-hosted.
    runs-on: ${{ matrix.runner || inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    outputs:
      artifact-name: ${{ steps.resolve-name.outputs.artifact-name }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}

    env:
      # lgtm-ci-inline:begin tooling-app-flags
      # Generated from scripts/ci/bootstrap/tooling-app-flags.yml by
      # sync_inline_blocks.py: edit the source, not this copy. Inline because job
      # env: entries cannot call a script.
      # Tooling App secrets present? A step `if:` cannot read secrets (#1622).
      LGTM_CI_TOOLING_APP_ID_SET: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' }}
      LGTM_CI_TOOLING_APP_KEY_SET: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '' }}
      # lgtm-ci-inline:end tooling-app-flags

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'build-artifact'],
            inputs.allowed-endpoints) }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT: ${{ vars.LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # Generated from scripts/ci/bootstrap/verify-harden-runner-agent.sh by
          # sync_inline_blocks.py: edit the source, not this copy. Inline because it
          # runs after harden-runner, before any checkout.
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # No exemption for GitHub Enterprise Server (owner decision): a public
              # repository there must be made internal or private to run.
              if [[ "${REPOSITORY_PRIVATE:-}" == false ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input), or make the" \
                  "repository internal or private"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          # Print the agent's own start-up errors (#1669); never changes the verdict.
          agent_errors() (
            export LC_ALL=C
            set +e +o pipefail
            if [[ ! -e "$agent_log" ]]; then
              echo "agent.log is missing; no agent start-up error to show"
              exit 0
            fi
            if [[ ! -f "$agent_log" || ! -r "$agent_log" ]]; then
              echo "agent.log is not a readable file; no agent start-up error to show"
              exit 0
            fi
            unsafe='[^[:alnum:] .,:;_=/@()+-]'
            shown=0
            while IFS= read -r line; do
              line="${line:0:512}"
              printf 'verify-harden-runner-agent: agent.log: %s\n' "${line//$unsafe/?}"
              shown=$((shown + 1))
            done < <(head -c 1048576 -- "$agent_log" 2> /dev/null |
              grep -aE -m 20 "^${stamp}(Error .*|Reverted changes)\$") 2> /dev/null
            if ((shown == 0)); then
              echo "agent.log has no agent start-up error line"
            fi
          )
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              agent_errors || true
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            agent_errors || true
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Only the standard agent is trusted (#1668): refuse harden-runner's eBPF
          # fallback agent, then require the standard agent's build info. grep exit 2
          # (unreadable log) fails closed here and below.
          if [[ ! -e "$agent_log" ]]; then
            echo "${failed}/home/agent/agent.log is missing; the agent build is unproven"
            exit 1
          fi
          agent=standard
          grep_status=0
          grep -qE "^${stamp}\[buildInfo\] name=AgentAlpha( |\$)" "$agent_log" ||
            grep_status=$?
          case "$grep_status" in
            0)
              # Opt-in (#1668): only the exact value true accepts the eBPF agent, and
              # only with its own evidence of block mode below.
              if [[ "${LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT:-}" != true ]]; then
                echo "::error title=harden-runner agent refused::harden-runner installed its" \
                  "eBPF fallback agent; only the standard agent is trusted"
                exit 1
              fi
              agent=ebpf
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          standard="^${stamp}\[buildInfo\] tag=v[0-9][^ ]* commit=[0-9a-f]{40} branch=[^ ]+ ?\$"
          ebpf="^${stamp}\[buildInfo\] name=AgentAlpha branch=[^ ]+ tag=v[0-9][^ ]*"
          ebpf+=" commit=[0-9a-f]{40}\$"
          build="$standard"
          [[ "$agent" == standard ]] || build="$ebpf"
          grep_status=0
          builds="$(grep -E "^${stamp}\[buildInfo\]" "$agent_log")" || grep_status=$?
          if ((grep_status > 1)); then
            echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
            exit 1
          fi
          if [[ -z "$builds" ]] || grep -qvE "$build" <<< "$builds"; then
            echo "${failed}agent.log does not identify the ${agent} agent; egress" \
              "enforcement is unproven"
            exit 1
          fi
          # One agent start only: exactly one build record, and it is the log's first
          # record. A log that spans two starts could lend the first start's evidence
          # to the agent now running.
          first="$(grep -m 1 -E "^${stamp}" "$agent_log")" || first=""
          if [[ "$builds" == *$'\n'* || "$builds" != "$first" ]]; then
            echo "${failed}agent.log does not start with exactly one build record of the" \
              "${agent} agent; egress enforcement is unproven"
            exit 1
          fi
          if [[ "$agent" == ebpf ]]; then
            # The eBPF agent's own evidence of block mode replaces resolved.conf, which
            # it never changes: every feature-flag line it logs has NetMode:ebpf, and
            # its tracer logs "block-policy applied", which can follow Initialized by
            # a second (fixture run 44396392356), so wait for it within 30s. Any other
            # policy line of its tracer (the v1.9.5 binary also has "deny-list
            # applied" and "failed to apply ..."), a missing piece or an unreadable log
            # fails, and the policy lines are read again after the last is-active.
            modes="$(grep -E "^${stamp}.*NetMode:" "$agent_log")" || modes=""
            if [[ -z "$modes" ]] || grep -qvE 'NetMode:ebpf[ }]' <<< "$modes"; then
              echo "${failed}the eBPF agent does not report NetMode:ebpf; egress" \
                "enforcement is unproven"
              exit 1
            fi
            policy_re="^${stamp}\[tracerManager\] ([a-z-]+-policy applied|deny-list"
            policy_re+=" applied|failed to apply )"
            block_re="^${stamp}\[tracerManager\] block-policy applied\$"
            # Print block, other, none or unreadable.
            ebpf_policy() {
              local lines status=0
              lines="$(grep -E "$policy_re" "$agent_log")" || status=$?
              if ((status > 1)); then
                echo unreadable
              elif [[ -z "$lines" ]]; then
                echo none
              elif grep -qvE "$block_re" <<< "$lines"; then
                echo other
              else
                echo block
              fi
            }
            # Succeed on block; otherwise print why and fail.
            ebpf_policy_ok() {
              case "$1" in
                block) return 0 ;;
                other)
                  echo "${failed}the eBPF agent applied a policy other than block; egress" \
                    "is not enforced"
                  ;;
                none)
                  echo "${failed}the eBPF agent did not log block-policy applied within 30s;" \
                    "egress enforcement is unproven"
                  ;;
                *)
                  echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
                  ;;
              esac
              return 1
            }
            deadline=$(($(date +%s) + 30))
            policy="$(ebpf_policy)"
            while [[ "$policy" == none ]] && (($(date +%s) < deadline)); do
              sleep 1
              policy="$(ebpf_policy)"
            done
            ebpf_policy_ok "$policy" || exit 1
            if ! systemctl is-active --quiet agent.service; then
              agent_errors || true
              echo "${failed}agent.service stopped while the eBPF agent was checked;" \
                "egress is not enforced"
              exit 1
            fi
            # A policy logged during the wait or the is-active check counts too.
            ebpf_policy_ok "$(ebpf_policy)" || exit 1
          fi
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              agent_errors || true
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          if [[ "$agent" == standard ]] &&
            ! grep -qxF 'DNS=127.0.0.1' "$root/etc/systemd/resolved.conf" 2> /dev/null; then
            echo "${failed}resolved.conf does not use the agent's DNS proxy; egress is not enforced"
            exit 1
          fi
          # The recheck steps read which agent was verified from this step's output,
          # which no later step can change.
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            printf 'agent=%s\n' "$agent" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$agent" == ebpf ]]; then
            echo "::warning title=harden-runner eBPF agent accepted::harden-runner's eBPF" \
              "fallback agent was accepted because LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT" \
              "is true; it logged NetMode:ebpf and block-policy applied"
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'build-artifact'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: |
          # lgtm-ci-inline:begin fail-unknown-egress-preset
          # Generated from scripts/ci/bootstrap/fail-unknown-egress-preset.sh by
          # sync_inline_blocks.py: edit the source, not this copy. Inline because it
          # runs after harden-runner, before any checkout.
          echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"
          exit 1
          # lgtm-ci-inline:end fail-unknown-egress-preset
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lgtm-ci-inline:begin tooling-app-mint
      # Generated from scripts/ci/bootstrap/tooling-app-mint.yml by
      # sync_inline_blocks.py: edit the source, not this copy. Inline because they
      # mint the token the tooling checkout uses.
      - name: Check tooling App credential
        id: tooling-app-target
        # Only when a tooling consumer will run and an App secret is set (#1622).
        if: >-
          env.LGTM_CI_TOOLING_APP_NEEDED != 'false'
          && (env.LGTM_CI_TOOLING_APP_ID_SET == 'true' || env.LGTM_CI_TOOLING_APP_KEY_SET == 'true')
        shell: bash
        env:
          TOOLING_REPOSITORY: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          SHAPE: ^([A-Za-z0-9][A-Za-z0-9_-]*)/([A-Za-z0-9._-]+)$
          INCOMPLETE: >-
            ::error title=incomplete tooling App credential::pass both
            LGTM_CI_TOOLING_APP_CLIENT_ID and LGTM_CI_TOOLING_APP_PRIVATE_KEY, or neither
          UNREADABLE: >-
            ::error title=unreadable tooling repository::cannot split the tooling
            repository into an owner and a name
        run: |
          [[ "${LGTM_CI_TOOLING_APP_ID_SET}" == "${LGTM_CI_TOOLING_APP_KEY_SET}" ]] || { echo "${INCOMPLETE}"; exit 1; }
          [[ "${TOOLING_REPOSITORY}" =~ ${SHAPE} ]] || { echo "${UNREADABLE}"; exit 1; }
          printf 'owner=%s\nrepository=%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" >> "${GITHUB_OUTPUT}"
      - name: Mint tooling App token
        id: tooling-app-token
        # Tooling repository only, asks for contents: read only (#1622).
        if: steps.tooling-app-target.outputs.repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
          private-key: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
          owner: ${{ steps.tooling-app-target.outputs.owner }}
          repositories: ${{ steps.tooling-app-target.outputs.repository }}
          permission-contents: read
      # lgtm-ci-inline:end tooling-app-mint
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          # App requested: the minted token or a sentinel that cannot
          # authenticate, never a weaker fallback (#1622).
          token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN }}
          sparse-checkout-extra: |
            scripts/ci/
            .github/actions/setup-python
            .github/actions/setup-rust
      - name: Setup Node.js
        if: needs.prepare.outputs.toolchain == 'node'
        # Pinned to SHA for supply chain security
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Python
        if: needs.prepare.outputs.toolchain == 'python'
        # Digest pinning lives inside the composite (astral-sh/setup-uv).
        # Dependency installation stays the caller's build-command.
        uses: ./.lgtm-ci-tooling/.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: ${{ inputs.working-directory }}
          install-dependencies: "false"
      - name: Setup Rust
        if: needs.prepare.outputs.toolchain == 'rust'
        # Digest pinning lives inside the composite (dtolnay/rust-toolchain).
        # A matrix.target field, when present, is installed as a rustup target
        # so cross-compilation matrices work without extra inputs.
        uses: ./.lgtm-ci-tooling/.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          targets: ${{ matrix.target }}
          working-directory: ${{ inputs.working-directory }}
      - name: Resolve artifact name
        id: resolve-name
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          MATRIX_JSON: ${{ toJson(matrix) }}
          NODE_VERSION: ${{ matrix.node-version }}
          MATRIX_MODE: ${{ needs.prepare.outputs.matrix-mode }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/resolve-build-artifact-name.sh
      - name: Build and validate artifact
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          POST_BUILD_TEST_COMMAND: ${{ inputs.post-build-test-command }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          # Exposes the leg as MATRIX_<FIELD> (e.g. MATRIX_TARGET) so an
          # arbitrary matrix can reach the caller's build command.
          MATRIX_JSON: ${{ toJson(matrix) }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-build-artifact.sh
      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.resolve-name.outputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          # The build output is this job's verdict, so no continue-on-error —
          # overwrite only, so a repeated call in one run publishes its latest
          # build instead of 409ing.
          overwrite: true
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT: ${{ vars.LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT }}
          HARDEN_RUNNER_AGENT: ${{ steps.verify-harden-runner.outputs.agent }}
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Generated from scripts/ci/bootstrap/recheck-harden-runner-agent.sh by
          # sync_inline_blocks.py: edit the source, not this copy. Inline because not
          # every job checks the tooling out, and job steps can change it.
          # Recheck of the harden-runner agent, before each irreversible publish
          # step (#1551) and at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # Which agent the verify step proved, from its step output (#1668).
          case "${HARDEN_RUNNER_AGENT:-}" in
            standard) ;;
            ebpf)
              if [[ "${LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT:-}" != true ]]; then
                echo "::error title=harden-runner agent refused::the eBPF fallback agent is" \
                  "running but LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT is not true"
                exit 1
              fi
              # Its block-mode lines must still be there, and no other policy or revert
              # line of its own may have appeared since (the v1.9.5 binary has
              # "deny-list applied", "failed to apply ...", "Reverted changes" and
              # "Error in Initialization"). Any job step can write agent.log by now, so
              # this cannot prove enforcement: a step can only make it fail.
              log="${HARDEN_RUNNER_ROOT:-}/home/agent/agent.log"
              stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
              stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
              for proof in '\[buildInfo\] name=AgentAlpha ' '.*NetMode:ebpf[ }]' \
                '\[tracerManager\] block-policy applied$'; do
                if ! grep -qE -m 1 "^${stamp}${proof}" "$log" 2> /dev/null; then
                  echo "$stopped (agent.log no longer shows the eBPF agent's block mode)"
                  exit 1
                fi
              done
              policy="^${stamp}\[tracerManager\] ([a-z-]+-policy applied|deny-list"
              policy+=" applied|failed to apply )"
              others="$(grep -E "$policy" "$log" 2> /dev/null |
                grep -vE "^${stamp}\[tracerManager\] block-policy applied\$")" || others=""
              if [[ -n "$others" ]]; then
                echo "$stopped (the eBPF agent applied a policy other than block)"
                exit 1
              fi
              if grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
                "$log" 2> /dev/null; then
                echo "$stopped (agent.log reports that the eBPF agent reverted)"
                exit 1
              fi
              echo "harden-runner eBPF agent is still active in block mode (accepted" \
                "because LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT is true)"
              exit 0
              ;;
            *)
              echo "::error title=harden-runner agent unproven::the verify step did not" \
                "record which agent it verified (steps.verify-harden-runner.outputs.agent)"
              exit 1
              ;;
          esac
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS"
          # lgtm-ci-inline:end recheck-harden-runner-agent
