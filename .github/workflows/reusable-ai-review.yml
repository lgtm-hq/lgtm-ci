---
name: Reusable AI Review

# Org-wide AI code review. Installs a pinned lintro[ai] from a *published
# PyPI release* (never from the reviewed repo), runs `lintro review --post`,
# and publishes a sticky PR comment as lintro-review[bot].
#
# Trust model — why pull_request (not pull_request_target):
#   The reviewer binary comes from a pinned PyPI release. The consuming PR
#   cannot control that code, so the pull_request_target / base-ref trusted-
#   install machinery used by py-lintro's dogfood does NOT apply here. The
#   job checks out the default merge ref with persist-credentials: false and
#   never installs or executes the PR's own package (no uv sync, no
#   pip install ., no build hooks). Do not "fix" this to pull_request_target.
#
# Provider-agnostic contract:
#   No baked-in default provider or transport. Inputs map onto LINTRO_AI_*
#   (input → Actions variable → repo lintro config → lintro's own error).
#   Credentials, CLI installs, and extra egress are keyed on the resolved
#   (provider, transport) pair. Adding a provider is one matrix row.
#
# lintro-version floor: 0.130.0 (py-lintro#2159, LINTRO_AI_REVIEW override;
#   supersedes the 0.127.0 floor from py-lintro#2144's provider no-default).
#   Below it, LINTRO_AI_REVIEW is ignored and repos without `ai.review: true`
#   in their lintro config silently produce no review; below 0.127.0 an unset
#   provider silently resolves to anthropic. File-level resume and INCOMPLETE
#   need 0.131.0+ (py-lintro#2154). Persist-on-timeout is 0.131.2+
#   (py-lintro#2167); Renovate can bump when a caller wants it. Artifact
#   steps no-op until that pin lands. Renovate bumps the pin forward; never
#   lower it below the floor, and do not add a workflow fallback to compensate.
#
# Egress:
#   The ai-review preset is GitHub + PyPI/uv only. Provider hosts are
#   appended from the pair visible at harden time (input →
#   vars.LINTRO_AI_*). Repo-config-only resolution cannot expand this list
#   before harden-runner, so under egress-policy `block` the resolve step
#   FAILS the job with guidance when the provider comes only from the repo
#   config — set the input or the Actions variable so the matching hosts are
#   allowlisted (egress-policy `audit` lifts this). A rotated Cursor shard (e.g.
#   repo43.cursor.sh) is named in the failed run's harden-runner summary —
#   add it to egress_ai_review_provider_endpoints and AI_REVIEW_CURSOR_EGRESS
#   together. No wildcards.

on:
  workflow_call:
    inputs:
      provider:
        description: >-
          Inference provider overlay (anthropic, cursor, openai). Empty
          resolves via LINTRO_AI_PROVIDER then the repo lintro config.
        required: false
        type: string
        default: ""
      transport:
        description: >-
          Transport overlay (cli or api). Empty resolves via
          LINTRO_AI_TRANSPORT then the repo lintro config. No default.
        required: false
        type: string
        default: ""
      lintro-version:
        description: "Pinned lintro PyPI version (Renovate-managed centrally)"
        required: false
        type: string
        # renovate: datasource=pypi depName=lintro
        default: "0.131.0"
      python-version:
        description: "CPython version for the scratch venv that installs lintro"
        required: false
        type: string
        default: "3.12"
      model:
        description: >-
          Optional model overlay passed through as LINTRO_AI_MODEL (empty =
          lintro config / provider default)
        required: false
        type: string
        default: ""
      max-cost-usd:
        description: >-
          Optional USD cap overlay passed through as LINTRO_AI_MAX_COST_USD
          (empty = lintro config)
        required: false
        type: string
        default: ""
      blocking:
        description: >-
          When true, a no-review outcome (exit 2) or a changes-requested
          verdict fails the job. Default is non-blocking. INCOMPLETE
          coverage-at-HEAD always reddens the check.
        required: false
        type: boolean
        default: false

      # --- Standard reusable contract inputs -------------------------------
      tooling-ref:
        description: "Git ref for lgtm-ci tooling checkout"
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      egress-preset:
        description: >-
          Named allowlist when allowed-endpoints is empty and egress-policy is
          block (defaults to ai-review: GitHub + PyPI/uv, no provider hosts)
        required: false
        type: string
        default: "ai-review"
      allowed-endpoints:
        description: "Allowed endpoints when egress-policy is block"
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          objects.githubusercontent.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          pipelines.actions.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pypi.org:443
          files.pythonhosted.org:443
          astral.sh:443
          releases.astral.sh:443
      allowed-endpoints-mode:
        description: >-
          replace: non-empty allowed-endpoints overrides egress-preset; append:
          merges preset with allowed-endpoints (deduped, first-seen wins)
        required: false
        type: string
        default: "replace"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 30
      job-name:
        description: "GitHub check name"
        required: false
        type: string
        default: "AI Review"
    secrets:
      LINTRO_REVIEW_APP_ID:
        description: "GitHub App ID for lintro-review[bot] posting"
        required: false
      LINTRO_REVIEW_APP_PRIVATE_KEY:
        description: "GitHub App private key for lintro-review[bot] posting"
        required: false
      ANTHROPIC_API_KEY:
        description: "anthropic + api credential"
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "anthropic + cli credential"
        required: false
      OPENAI_API_KEY:
        description: "openai + api credential"
        required: false
      CODEX_API_KEY:
        description: "openai + cli credential"
        required: false
      CURSOR_API_KEY:
        description: "cursor + cli credential"
        required: false

permissions: {}

concurrency:
  # Per consuming-repo PR so overlapping pushes cancel the superseded
  # HEAD instead of racing on state artifacts (#893).
  group: >-
    ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Checkout the PR merge ref and lgtm-ci tooling.
      contents: read
      # `gh` / lintro fetch the PR diff with the workflow token. Posting uses
      # the App token (lintro-review[bot]), not this permission.
      pull-requests: read
      # Cross-run artifact list/download uses the workflow token (#893).
      # Provenance is the consuming repo's workflow run, not lgtm-ci.
      actions: read
    env:
      # Visible pair for harden-runner extras (input → var only).
      # Must already be lowercase — GitHub expressions cannot fold case, so
      # `Anthropic` would inject a credential and then block provider egress.
      AI_REVIEW_PROVIDER: ${{ inputs.provider || vars.LINTRO_AI_PROVIDER }}
      AI_REVIEW_TRANSPORT: ${{ inputs.transport || vars.LINTRO_AI_TRANSPORT }}
      # Keep in sync with egress_ai_review_provider_endpoints cursor row.
      # yamllint disable-line rule:line-length
      AI_REVIEW_CURSOR_EGRESS: downloads.cursor.com:443 api2.cursor.sh:443 api3.cursor.sh:443 agentn.global.api5.cursor.sh:443 repo42.cursor.sh:443
      # npm/node hosts for anthropic|openai CLI install. Extra on api-only
      # rows is harmless and keeps this expression from reading sibling env.
      # yamllint disable-line rule:line-length
      AI_REVIEW_NPM_EGRESS: ${{ ((inputs.provider || vars.LINTRO_AI_PROVIDER) == 'anthropic' || (inputs.provider || vars.LINTRO_AI_PROVIDER) == 'openai') && 'nodejs.org:443 registry.npmjs.org:443' || '' }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Baseline from the input default (GitHub + PyPI/uv). Provider hosts
          # are gated on the pair visible here — never the union. These inline
          # lists are the production append (no checkout exists yet, so no
          # script can compute them); egress_ai_review_provider_endpoints in
          # scripts/ci/lib/egress/presets.sh is the canonical matrix, and
          # integration bats cross-check these expressions against it — edit
          # them together.
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ env.AI_REVIEW_PROVIDER == 'anthropic' && 'api.anthropic.com:443' || '' }}
            ${{ env.AI_REVIEW_PROVIDER == 'openai' && 'api.openai.com:443' || '' }}
            ${{ env.AI_REVIEW_PROVIDER == 'cursor' && env.AI_REVIEW_CURSOR_EGRESS || '' }}
            ${{ env.AI_REVIEW_NPM_EGRESS }}
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lgtm-hq/lgtm-ci
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || github.workflow_sha }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref }}
          egress-policy: ${{ inputs.egress-policy }}
          egress-preset: ${{ inputs.egress-preset }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
          allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Preflight guards
        id: preflight
        shell: bash
        env:
          STEP: preflight
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .lgtm-ci-tooling/scripts/ci/actions/run-ai-review.sh
      - name: Require lintro-review App credentials
        if: steps.preflight.outputs.should-run == 'true'
        shell: bash
        env:
          APP_ID: ${{ secrets.LINTRO_REVIEW_APP_ID }}
          APP_KEY_PRESENT: ${{ secrets.LINTRO_REVIEW_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ -z "${APP_ID}" || "${APP_KEY_PRESENT}" != "true" ]]; then
            echo "::error::LINTRO_REVIEW_APP_ID and LINTRO_REVIEW_APP_PRIVATE_KEY"
            echo "::error::are required to post as lintro-review[bot]."
            echo "::error::They are org-wide all-repo secrets; pass them with secrets: inherit."
            exit 1
          fi
      - name: Resolve provider matrix
        id: resolve
        if: steps.preflight.outputs.should-run == 'true'
        shell: bash
        env:
          PROVIDER_INPUT: ${{ inputs.provider }}
          TRANSPORT_INPUT: ${{ inputs.transport }}
          VAR_PROVIDER: ${{ vars.LINTRO_AI_PROVIDER }}
          VAR_TRANSPORT: ${{ vars.LINTRO_AI_TRANSPORT }}
          # Egress visibility guard: a provider resolved only from the repo
          # config cannot have reached the harden allowlist above; under
          # `block` the resolve script fails loudly instead of letting a
          # doomed provider call burn spend (see the script header).
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          CONFIG_PATH: .lintro-config.yaml
        run: .lgtm-ci-tooling/scripts/ci/actions/resolve-ai-review-provider.sh
      - name: Set up uv
        if: steps.preflight.outputs.should-run == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Node
        if: >-
          steps.preflight.outputs.should-run == 'true'
          && steps.resolve.outputs.needs-cli == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install provider CLI
        if: >-
          steps.preflight.outputs.should-run == 'true'
          && steps.resolve.outputs.needs-cli == 'true'
        shell: bash
        env:
          PROVIDER: ${{ steps.resolve.outputs.provider }}
          TRANSPORT: ${{ steps.resolve.outputs.transport }}
        run: .lgtm-ci-tooling/scripts/ci/actions/install-ai-review-cli.sh
      - name: Locate prior review-state
        # Newest completed trusted run with a valid artifact. Conclusion is
        # irrelevant (#893). Empty run-id is the no-op (first review, or
        # no valid prior). continue-on-error keeps a locator failure from
        # skipping the review.
        id: prior-state
        if: steps.preflight.outputs.should-run == 'true'
        continue-on-error: true
        shell: bash
        env:
          STEP: locate
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: .lgtm-ci-tooling/scripts/ci/actions/run-ai-review.sh
      - name: Download prior review-state artifacts
        if: >-
          steps.preflight.outputs.should-run == 'true'
          && steps.prior-state.outputs.run-id != ''
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.prior-state.outputs.run-id }}
          pattern: lintro-review-state-pr-${{ github.event.pull_request.number }}-*
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ai-review-state
      - name: Mint lintro-review App token
        id: lintro-review-app
        if: steps.preflight.outputs.should-run == 'true'
        # Repo-scoped installation token. Default current-repo scope — do not
        # pass `owner:` without `repositories:`. Only the review step sees
        # outputs.token; inference credentials stay separate.
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.LINTRO_REVIEW_APP_ID }}
          private-key: ${{ secrets.LINTRO_REVIEW_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: Run AI review
        id: review
        if: steps.preflight.outputs.should-run == 'true'
        shell: bash
        env:
          STEP: run
          # Workflow token fetches the PR diff. App token posts as the bot.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ steps.lintro-review-app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LINTRO_VERSION: ${{ inputs.lintro-version }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          BLOCKING: ${{ inputs.blocking }}
          VENV_DIR: ${{ runner.temp }}/ai-review-venv
          LINTRO_AI_ENABLED: "1"
          # Requires the 0.130.0 floor (py-lintro#2159): forces ai.review on
          # so consuming repos need no ai block in their lintro config.
          LINTRO_AI_REVIEW: "1"
          LINTRO_REVIEW_STATE_DIR: ai-review-state
          LINTRO_AI_PROVIDER: ${{ inputs.provider || vars.LINTRO_AI_PROVIDER }}
          LINTRO_AI_TRANSPORT: ${{ inputs.transport || vars.LINTRO_AI_TRANSPORT }}
          LINTRO_AI_MODEL: ${{ inputs.model }}
          LINTRO_AI_MAX_COST_USD: ${{ inputs.max-cost-usd }}
          # Only the credential for the resolved pair — never the union.
          # yamllint disable-line rule:line-length
          ANTHROPIC_API_KEY: ${{ steps.resolve.outputs.provider == 'anthropic' && steps.resolve.outputs.transport == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          # yamllint disable-line rule:line-length
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.resolve.outputs.provider == 'anthropic' && steps.resolve.outputs.transport == 'cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # yamllint disable-line rule:line-length
          OPENAI_API_KEY: ${{ steps.resolve.outputs.provider == 'openai' && steps.resolve.outputs.transport == 'api' && secrets.OPENAI_API_KEY || '' }}
          # yamllint disable-line rule:line-length
          CODEX_API_KEY: ${{ steps.resolve.outputs.provider == 'openai' && steps.resolve.outputs.transport == 'cli' && secrets.CODEX_API_KEY || '' }}
          # yamllint disable-line rule:line-length
          CURSOR_API_KEY: ${{ steps.resolve.outputs.provider == 'cursor' && steps.resolve.outputs.transport == 'cli' && secrets.CURSOR_API_KEY || '' }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
        run: .lgtm-ci-tooling/scripts/ci/actions/run-ai-review.sh
      - name: Upload review-state artifacts
        # Best-effort final upload. if-no-files-found: ignore so pre-0.131.0
        # pins no-op. Provenance is this consuming-repo run (#893). No
        # *.blob.core.windows.net wildcard — pipelines.actions is already
        # on the default allowlist.
        if: always() && steps.preflight.outputs.should-run == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # yamllint disable-line rule:line-length
          name: lintro-review-state-pr-${{ github.event.pull_request.number }}-attempt-${{ github.run_attempt }}-final
          path: ai-review-state/
          if-no-files-found: ignore
          retention-days: 30
