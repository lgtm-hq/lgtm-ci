jobs:
  ai-review:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Checkout the PR merge ref and lgtm-ci tooling.
      contents: read
      # `gh` / lintro fetch the PR diff with the workflow token. Posting uses
      # the App token (lintro-review[bot]), not this permission.
      pull-requests: read
      # Cross-run artifact list/download uses the workflow token (#893).
      # Provenance is the consuming repo's workflow run, not lgtm-ci.
      actions: read
    env:
      # Visible pair for harden-runner extras (input → var only).
      # Must already be lowercase — GitHub expressions cannot fold case, so
      # `Anthropic` would inject a credential and then block provider egress.
      AI_REVIEW_PROVIDER: ${{ inputs.provider || vars.LINTRO_AI_PROVIDER }}
      AI_REVIEW_TRANSPORT: ${{ inputs.transport || vars.LINTRO_AI_TRANSPORT }}
      # Keep in sync with egress_ai_review_provider_endpoints cursor row.
      # yamllint disable-line rule:line-length
      AI_REVIEW_CURSOR_EGRESS: downloads.cursor.com:443 api2.cursor.sh:443 api3.cursor.sh:443 agentn.global.api5.cursor.sh:443 repo42.cursor.sh:443
      # npm/node hosts for anthropic|openai CLI install. Extra on api-only
      # rows is harmless and keeps this expression from reading sibling env.
      # yamllint disable-line rule:line-length
      AI_REVIEW_NPM_EGRESS: ${{ ((inputs.provider || vars.LINTRO_AI_PROVIDER) == 'anthropic' || (inputs.provider || vars.LINTRO_AI_PROVIDER) == 'openai') && 'nodejs.org:443 registry.npmjs.org:443' || '' }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Baseline composed from inputs and the literal preset map in env
          # (GitHub + PyPI/uv by default), then provider hosts gated on the pair
          # visible here — never the union. These inline lists are the
          # production append (no checkout exists yet, so no script can
          # compute them); egress_ai_review_provider_endpoints in
          # scripts/ci/lib/egress/presets.sh is the canonical matrix, and
          # integration bats cross-check these expressions against it — edit
          # them together.
          allowed-endpoints: >
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'ai-review'],
            inputs.allowed-endpoints) }}
            ${{ env.AI_REVIEW_PROVIDER == 'anthropic' && 'api.anthropic.com:443' || '' }}
            ${{ env.AI_REVIEW_PROVIDER == 'openai' && 'api.openai.com:443' || '' }}
            ${{ env.AI_REVIEW_PROVIDER == 'cursor' && env.AI_REVIEW_CURSOR_EGRESS || '' }}
            ${{ env.AI_REVIEW_NPM_EGRESS }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'ai-review'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Preflight guards
        id: preflight
        shell: bash
        env:
          STEP: preflight
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .lgtm-ci-tooling/scripts/ci/actions/run-ai-review.sh
      - name: Require lintro-review App credentials
        if: steps.preflight.outputs.should-run == 'true'
        shell: bash
        env:
          APP_ID: ${{ secrets.LINTRO_REVIEW_APP_ID }}
          APP_KEY_PRESENT: ${{ secrets.LINTRO_REVIEW_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ -z "${APP_ID}" || "${APP_KEY_PRESENT}" != "true" ]]; then
            echo "::error::LINTRO_REVIEW_APP_ID and LINTRO_REVIEW_APP_PRIVATE_KEY"
            echo "::error::are required to post as lintro-review[bot]."
            echo "::error::They are org-wide all-repo secrets; pass them with secrets: inherit."
            exit 1
          fi
      - name: Resolve provider matrix
        id: resolve
        if: steps.preflight.outputs.should-run == 'true'
        shell: bash
        env:
          PROVIDER_INPUT: ${{ inputs.provider }}
          TRANSPORT_INPUT: ${{ inputs.transport }}
          VAR_PROVIDER: ${{ vars.LINTRO_AI_PROVIDER }}
          VAR_TRANSPORT: ${{ vars.LINTRO_AI_TRANSPORT }}
          # Egress visibility guard: a provider resolved only from the repo
          # config cannot have reached the harden allowlist above; under
          # `block` the resolve script fails loudly instead of letting a
          # doomed provider call burn spend (see the script header).
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          CONFIG_PATH: .lintro-config.yaml
        run: .lgtm-ci-tooling/scripts/ci/actions/resolve-ai-review-provider.sh
      - name: Set up uv
        if: steps.preflight.outputs.should-run == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Node
        if: >-
          steps.preflight.outputs.should-run == 'true'
          && steps.resolve.outputs.needs-cli == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install provider CLI
        if: >-
          steps.preflight.outputs.should-run == 'true'
          && steps.resolve.outputs.needs-cli == 'true'
        shell: bash
        env:
          PROVIDER: ${{ steps.resolve.outputs.provider }}
          TRANSPORT: ${{ steps.resolve.outputs.transport }}
        run: .lgtm-ci-tooling/scripts/ci/actions/install-ai-review-cli.sh
      - name: Locate prior review-state
        # Newest completed trusted run with a valid artifact. Conclusion is
        # irrelevant (#893). Empty run-id is the no-op (first review, or
        # no valid prior). continue-on-error keeps a locator failure from
        # skipping the review.
        id: prior-state
        if: steps.preflight.outputs.should-run == 'true'
        continue-on-error: true
        shell: bash
        env:
          STEP: locate
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: .lgtm-ci-tooling/scripts/ci/actions/run-ai-review.sh
      - name: Download prior review-state artifacts
        if: >-
          steps.preflight.outputs.should-run == 'true'
          && steps.prior-state.outputs.run-id != ''
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.prior-state.outputs.run-id }}
          pattern: lintro-review-state-pr-${{ github.event.pull_request.number }}-*
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ai-review-state
      - name: Mint lintro-review App token
        id: lintro-review-app
        if: steps.preflight.outputs.should-run == 'true'
        # Repo-scoped installation token. Default current-repo scope — do not
        # pass `owner:` without `repositories:`. Only the review step sees
        # outputs.token; inference credentials stay separate.
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.LINTRO_REVIEW_APP_ID }}
          private-key: ${{ secrets.LINTRO_REVIEW_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: Run AI review
        id: review
        if: steps.preflight.outputs.should-run == 'true'
        shell: bash
        env:
          STEP: run
          # Workflow token fetches the PR diff. App token posts as the bot.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ steps.lintro-review-app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LINTRO_VERSION: ${{ inputs.lintro-version }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          BLOCKING: ${{ inputs.blocking }}
          VENV_DIR: ${{ runner.temp }}/ai-review-venv
          LINTRO_AI_ENABLED: "1"
          # Requires the 0.130.0 floor (py-lintro#2159): forces ai.review on
          # so consuming repos need no ai block in their lintro config.
          LINTRO_AI_REVIEW: "1"
          LINTRO_REVIEW_STATE_DIR: ai-review-state
          LINTRO_AI_PROVIDER: ${{ inputs.provider || vars.LINTRO_AI_PROVIDER }}
          LINTRO_AI_TRANSPORT: ${{ inputs.transport || vars.LINTRO_AI_TRANSPORT }}
          LINTRO_AI_MODEL: ${{ inputs.model || vars.LINTRO_AI_MODEL }}
          LINTRO_AI_MAX_COST_USD: ${{ inputs.max-cost-usd || vars.LINTRO_AI_MAX_COST_USD }}
          # Only the credential for the resolved pair — never the union.
          # yamllint disable-line rule:line-length
          ANTHROPIC_API_KEY: ${{ steps.resolve.outputs.provider == 'anthropic' && steps.resolve.outputs.transport == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          # yamllint disable-line rule:line-length
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.resolve.outputs.provider == 'anthropic' && steps.resolve.outputs.transport == 'cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # yamllint disable-line rule:line-length
          OPENAI_API_KEY: ${{ steps.resolve.outputs.provider == 'openai' && steps.resolve.outputs.transport == 'api' && secrets.OPENAI_API_KEY || '' }}
          # yamllint disable-line rule:line-length
          CODEX_API_KEY: ${{ steps.resolve.outputs.provider == 'openai' && steps.resolve.outputs.transport == 'cli' && secrets.CODEX_API_KEY || '' }}
          # yamllint disable-line rule:line-length
          CURSOR_API_KEY: ${{ steps.resolve.outputs.provider == 'cursor' && steps.resolve.outputs.transport == 'cli' && secrets.CURSOR_API_KEY || '' }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
        run: .lgtm-ci-tooling/scripts/ci/actions/run-ai-review.sh
      - name: Upload review-state artifacts
        # Best-effort final upload. if-no-files-found: ignore so pre-0.131.0
        # pins no-op. Provenance is this consuming-repo run (#893). No
        # *.blob.core.windows.net wildcard — pipelines.actions is already
        # on the default allowlist.
        if: always() && steps.preflight.outputs.should-run == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # yamllint disable-line rule:line-length
          name: lintro-review-state-pr-${{ github.event.pull_request.number }}-attempt-${{ github.run_attempt }}-final
          path: ai-review-state/
          if-no-files-found: ignore
          retention-days: 30
          # Same-attempt retry (or a second upload in one run) 409s without
          # overwrite; the latest blob is the authoritative review-state.
          overwrite: true
