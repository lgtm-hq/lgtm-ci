---
name: Reusable Dependency Review

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: "Lowest vulnerability severity that fails the workflow"
        required: false
        type: string
        default: "high"
      deny-licenses:
        description: "Comma-separated SPDX license identifiers to deny"
        required: false
        type: string
        default: ""
      allow-licenses:
        description: "Comma-separated SPDX license identifiers to allow"
        required: false
        type: string
        default: ""
      allow-dependencies-licenses:
        description: >-
          Comma-separated PURLs exempted from license checks regardless of
          allow-licenses/deny-licenses (e.g. lgtm-ci composite actions that
          report Unknown license in the actions ecosystem — see
          docs/workflow-contract.md#dependency-review for canonical PURLs).
        required: false
        type: string
        default: ""

      tooling-ref:
        description: >-
          Optional — pins egress composites only (no scripts/ci checkout).
          Unset tracks the workflow pin (job.workflow_sha, #995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"
      job-name:
        description: "GitHub check name (runs on pull_request and merge_group events)"
        required: false
        type: string
        default: "Dependency Review"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

