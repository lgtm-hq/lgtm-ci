  # lgtm-ci-egress-presets:end

jobs:
  validate-lintro-version:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Checkout repository and lgtm-ci tooling
      contents: read
      # Authenticate to ghcr.io for lintro image access
      packages: read

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Bootstrap lgtm-ci tooling when required scripts are missing
        id: tooling-bootstrap
        if: inputs.tooling-ref-fallback != ''
        shell: bash
        env:
          BOOTSTRAP_SCRIPT: ${{ inputs.tooling-bootstrap-script }}
        run: bash "$BOOTSTRAP_SCRIPT"
      - name: Checkout lgtm-ci tooling (fallback)
        if: >-
          inputs.tooling-ref-fallback != '' &&
          steps.tooling-bootstrap.outputs.needs-fallback == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref-fallback }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve lintro image reference
        id: lintro-image
        shell: bash
        env:
          INPUT_LINTRO_IMAGE: ${{ inputs.lintro-image }}
        run: .lgtm-ci-tooling/scripts/ci/quality/resolve-lintro-image.sh
      - name: Validate lintro version consistency
        shell: bash
        env:
          LINTRO_IMAGE: ${{ steps.lintro-image.outputs.image }}
          PYPROJECT: ${{ inputs.pyproject }}
        run: .lgtm-ci-tooling/scripts/ci/quality/validate-lintro-version.sh
