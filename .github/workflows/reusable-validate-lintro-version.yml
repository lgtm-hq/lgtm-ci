---
name: Reusable Validate Lintro Version

on:
  workflow_call:
    inputs:
      lintro-image:
        description: >-
          Pinned ghcr.io/lgtm-hq/py-lintro image. When empty, resolves the digest
          from reusable-quality-lint.yml and run-quality/action.yml in the repo.
        required: false
        type: string
        default: ""
      pyproject:
        description: "Path to pyproject.toml"
        required: false
        type: string
        default: "pyproject.toml"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha). Pairs with tooling-ref-fallback for bootstrap.
        required: false
        type: string
        default: ""
      tooling-ref-fallback:
        description: >-
          Fallback lgtm-ci tooling ref when required scripts are missing at
          tooling-ref (for example PR head SHA during bootstrap)
        required: false
        type: string
        default: ""
      tooling-bootstrap-script:
        description: >-
          Path to check-lintro-tooling-bootstrap.sh (repo or tooling checkout)
        required: false
        type: string
        default: ".lgtm-ci-tooling/scripts/ci/quality/check-lintro-tooling-bootstrap.sh"
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default quality). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "quality"
      job-name:
        description: "GitHub check name"
        required: false
        type: string
        default: "Validate Lintro Version"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

