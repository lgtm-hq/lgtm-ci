---
name: Reusable Validate Lintro Version

on:
  workflow_call:
    inputs:
      lintro-image:
        description: >-
          Pinned ghcr.io/lgtm-hq/py-lintro image. When empty, resolves the digest
          from reusable-quality-lint.yml and run-quality/action.yml in the repo.
        required: false
        type: string
        default: ""
      pyproject:
        description: "Path to pyproject.toml"
        required: false
        type: string
        default: "pyproject.toml"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha). Pairs with tooling-ref-fallback for bootstrap.
        required: false
        type: string
        default: ""
      tooling-ref-fallback:
        description: >-
          Fallback lgtm-ci tooling ref when required scripts are missing at
          tooling-ref (for example PR head SHA during bootstrap)
        required: false
        type: string
        default: ""
      tooling-bootstrap-script:
        description: >-
          Path to check-lintro-tooling-bootstrap.sh (repo or tooling checkout)
        required: false
        type: string
        default: ".lgtm-ci-tooling/scripts/ci/quality/check-lintro-tooling-bootstrap.sh"
      egress-policy:
        description: "harden-runner egress policy (block only; audit rejected)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh, one of the
          presets this workflow embeds; any other name fails (#1623)
          (default quality). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "quality"
      job-name:
        description: "GitHub check name"
        required: false
        type: string
        default: "Validate Lintro Version"

      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10
    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false
      LGTM_CI_TOOLING_APP_CLIENT_ID:
        description: >-
          Optional client ID of a GitHub App installed on the lgtm-ci tooling
          repository only, with contents: read. Together with the App's
          private key, each job mints a short-lived token used only by the
          tooling checkouts, in place of the stored tooling token. Pass both
          App secrets or neither (#1622).
        required: false
      LGTM_CI_TOOLING_APP_PRIVATE_KEY:
        description: >-
          Optional private key of the tooling GitHub App. Pass it together
          with the App's client ID (#1622).
        required: false

env:
  # Egress presets rendered from scripts/ci/lib/egress/presets.sh by
  # scripts/ci/egress/sync-workflow-presets.sh — do not edit by hand. Every
  # harden-runner step below indexes this map by expression: the
  # step-security pre hook installs the agent before any step runs, so the
  # allowlist must be composed from literals and inputs only (#412/#420/#913).
  # lgtm-ci-egress-presets:begin
  LGTM_CI_EGRESS_PRESETS: >-
    {"quality":"github.com:443 api.github.com:443 codeload.github.com:443
    release-assets.githubusercontent.com:443 objects.githubusercontent.com:443
    raw.githubusercontent.com:443 pipelines.actions.githubusercontent.com:443
    github-releases.githubusercontent.com:443 ghcr.io:443 pkg-containers.githubusercontent.com:443
    docker.io:443 registry-1.docker.io:443 auth.docker.io:443 production.cloudflare.docker.com:443
    production.cloudfront.docker.com:443 docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
    pypi.org:443 files.pythonhosted.org:443 static.rust-lang.org:443 bun.sh:443 astral.sh:443
    releases.astral.sh:443 sh.rustup.rs:443 deb.debian.org:80 registry.npmjs.org:443 crates.io:443
    static.crates.io:443 index.crates.io:443 semgrep.dev:443 metrics.semgrep.dev:443 api.osv.dev:443
    api.deps.dev:443"}
  # lgtm-ci-egress-presets:end

jobs:
  validate-lintro-version:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Checkout repository and lgtm-ci tooling
      contents: read
      # Authenticate to ghcr.io for lintro image access
      packages: read

    env:
      # lgtm-ci-inline:begin tooling-app-flags
      # Tooling App secrets present? A step `if:` cannot read secrets (#1622).
      LGTM_CI_TOOLING_APP_ID_SET: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' }}
      LGTM_CI_TOOLING_APP_KEY_SET: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '' }}
      # lgtm-ci-inline:end tooling-app-flags

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # No exemption for GitHub Enterprise Server (owner decision): a public
              # repository there must be made internal or private to run.
              if [[ "${REPOSITORY_PRIVATE:-}" == false ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input), or make the" \
                  "repository internal or private"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet. grep exit 2 (unreadable log) fails closed.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lgtm-ci-inline:begin tooling-app-mint
      - name: Check tooling App credential
        id: tooling-app-target
        # Only when a tooling consumer will run and an App secret is set (#1622).
        if: >-
          env.LGTM_CI_TOOLING_APP_NEEDED != 'false'
          && (env.LGTM_CI_TOOLING_APP_ID_SET == 'true' || env.LGTM_CI_TOOLING_APP_KEY_SET == 'true')
        shell: bash
        env:
          TOOLING_REPOSITORY: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          SHAPE: ^([A-Za-z0-9][A-Za-z0-9_-]*)/([A-Za-z0-9._-]+)$
          INCOMPLETE: >-
            ::error title=incomplete tooling App credential::pass both
            LGTM_CI_TOOLING_APP_CLIENT_ID and LGTM_CI_TOOLING_APP_PRIVATE_KEY, or neither
          UNREADABLE: >-
            ::error title=unreadable tooling repository::cannot split the tooling
            repository into an owner and a name
        run: |
          [[ "${LGTM_CI_TOOLING_APP_ID_SET}" == "${LGTM_CI_TOOLING_APP_KEY_SET}" ]] || { echo "${INCOMPLETE}"; exit 1; }
          [[ "${TOOLING_REPOSITORY}" =~ ${SHAPE} ]] || { echo "${UNREADABLE}"; exit 1; }
          printf 'owner=%s\nrepository=%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" >> "${GITHUB_OUTPUT}"
      - name: Mint tooling App token
        id: tooling-app-token
        # Tooling repository only, asks for contents: read only (#1622).
        if: steps.tooling-app-target.outputs.repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
          private-key: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
          owner: ${{ steps.tooling-app-target.outputs.owner }}
          repositories: ${{ steps.tooling-app-target.outputs.repository }}
          permission-contents: read
      # lgtm-ci-inline:end tooling-app-mint
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          # App requested: the minted token or a sentinel that cannot
          # authenticate, never a weaker fallback (#1622).
          token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Bootstrap lgtm-ci tooling when required scripts are missing
        id: tooling-bootstrap
        if: inputs.tooling-ref-fallback != ''
        shell: bash
        env:
          BOOTSTRAP_SCRIPT: ${{ inputs.tooling-bootstrap-script }}
        run: bash "$BOOTSTRAP_SCRIPT"
      - name: Checkout lgtm-ci tooling (fallback)
        if: >-
          inputs.tooling-ref-fallback != '' &&
          steps.tooling-bootstrap.outputs.needs-fallback == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref-fallback }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          # App requested: the minted token or a sentinel that cannot
          # authenticate, never a weaker fallback (#1622).
          token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve lintro image reference
        id: lintro-image
        shell: bash
        env:
          INPUT_LINTRO_IMAGE: ${{ inputs.lintro-image }}
        run: .lgtm-ci-tooling/scripts/ci/quality/resolve-lintro-image.sh
      - name: Validate lintro version consistency
        shell: bash
        env:
          LINTRO_IMAGE: ${{ steps.lintro-image.outputs.image }}
          PYPROJECT: ${{ inputs.pyproject }}
        run: .lgtm-ci-tooling/scripts/ci/quality/validate-lintro-version.sh
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Recheck of the harden-runner agent, before each irreversible publish
          # step (#1551) and at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS"
          # lgtm-ci-inline:end recheck-harden-runner-agent
