---
name: Reusable Coverage Workflow

on:
  workflow_call:
    inputs:
      coverage-files:
        description: "Glob pattern or comma-separated list of coverage files"
        required: false
        type: string
        default: ""
      format:
        description: "Coverage format: auto, istanbul, coverage-py, lcov"
        required: false
        type: string
        default: "auto"
      threshold:
        description: "Minimum coverage percentage to pass"
        required: false
        type: number
        default: 0
      generate-badge:
        description: "Generate coverage badge"
        required: false
        type: boolean
        default: true
      publish-pages:
        description: >-
          DEPRECATED (#770), accepted but inert. Pages publishing moved to
          reusable-publish-test-results-pages.yml, which the caller invokes in
          its own job; keeping the publish job here forced pages/id-token/
          actions:write onto every caller, publishing or not. Setting this to
          true warns and does nothing. Removal is planned a release or two out.
        required: false
        type: boolean
        default: false
      working-directory:
        description: "Working directory"
        required: false
        type: string
        default: "."

      tooling-ref:
        description: "Git ref to use when checking out lgtm-ci tooling scripts"
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: "Allowed endpoints when egress-policy is block"
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          objects.githubusercontent.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          pipelines.actions.githubusercontent.com:443
      allowed-endpoints-mode:
        description: >-
          replace: non-empty allowed-endpoints overrides egress-preset; append:
          merges preset with allowed-endpoints (deduped, first-seen wins)
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named allowlist when allowed-endpoints is empty and egress-policy is
          block (github-minimal, github-pages, github-tooling, docker, playwright, pypi,
          rubygems, npm-publish, quality, sbom, scorecard)
        required: false
        type: string
        default: "github-tooling"
      job-name:
        description: "GitHub check name for the coverage job"
        required: false
        type: string
        default: "Coverage"
      publish-test-summary:
        description: >-
          Publish or update the coverage test summary comment for this
          workflow run
        required: false
        type: boolean
        default: true
      coverage-artifact-name:
        description: >-
          Name of the coverage-report artifact handed to the summary comment
          job and to a caller's Pages publisher call (#770).
          Override it when one workflow run calls this workflow more than once
          (for example per working directory): overwrite makes the last upload
          of a shared name authoritative, so distinct calls need distinct names
          to keep their handoffs isolated.
        required: false
        type: string
        default: "coverage-report"
      comment-marker:
        description: "Upsert marker for the coverage test summary comment"
        required: false
        type: string
        default: "coverage-report"
      comment-title:
        description: "Heading for the coverage test summary comment"
        required: false
        type: string
        default: "Coverage Report"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 30

    outputs:
      coverage-percent:
        description: "Overall coverage percentage"
        value: ${{ jobs.coverage.outputs.coverage-percent }}
      badge-url:
        description: "URL to coverage badge"
        value: ${{ jobs.coverage.outputs.badge-url }}
      pages-url:
        description: >-
          DEPRECATED (#770), always empty. Kept so callers referencing it keep
          parsing; read the pages-url output of
          reusable-publish-test-results-pages.yml instead.
        value: ${{ '' }}
      passed:
        description: "Whether coverage meets threshold"
        value: ${{ jobs.coverage.outputs.passed }}

jobs:
  coverage:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    outputs:
      coverage-percent: ${{ steps.collect.outputs.coverage-percent }}
      merged-coverage-file: ${{ steps.collect.outputs.merged-coverage-file }}
      badge-url: ${{ steps.badge.outputs.badge-url }}
      passed: ${{ steps.threshold.outputs.passed }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lgtm-hq/lgtm-ci
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || github.workflow_sha }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref }}
          egress-policy: ${{ inputs.egress-policy }}
          egress-preset: ${{ inputs.egress-preset }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
          allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
          sparse-checkout-extra: |
            .github/actions/
            scripts/ci/
      - name: Warn on deprecated publish-pages
        shell: bash
        env:
          INPUT_NAME: publish-pages
          INPUT_VALUE: ${{ inputs.publish-pages }}
          DEFAULT_VALUE: "false"
          REPLACEMENT: >-
            Add a job calling
            lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-test-results-pages.yml
            with artifact-name matching this call's coverage-artifact-name and
            pages-target-dir 'coverage', and move the pages/id-token/
            actions:write grant onto that job. See the migration section of
            docs/pages-publishing.md for the coverage-path/badge-path values,
            which depend on working-directory.
        run: .lgtm-ci-tooling/scripts/ci/actions/warn-deprecated-workflow-input.sh
      - name: Download coverage artifacts
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-coverage"
          path: coverage-artifacts
          merge-multiple: true
      - name: Collect coverage
        id: collect
        uses: ./.lgtm-ci-tooling/.github/actions/collect-coverage
        with:
          coverage-files: ${{ inputs.coverage-files }}
          input-format: ${{ inputs.format }}
          output-format: json
          working-directory: ${{ inputs.working-directory }}
      - name: Check coverage threshold
        id: threshold
        uses: ./.lgtm-ci-tooling/.github/actions/check-coverage-threshold
        with:
          coverage-percent: ${{ steps.collect.outputs.coverage-percent }}
          threshold: ${{ inputs.threshold }}
      - name: Generate badge
        id: badge
        if: inputs.generate-badge
        uses: ./.lgtm-ci-tooling/.github/actions/generate-coverage-badge
        with:
          coverage-percent: ${{ steps.collect.outputs.coverage-percent }}
          format: svg
          output-path: coverage/badge.svg
          working-directory: ${{ inputs.working-directory }}
      - name: Upload coverage report
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: |
            ${{ inputs.working-directory }}/${{ steps.collect.outputs.merged-coverage-file }}
            ${{ inputs.working-directory }}/coverage/
          retention-days: 30
          if-no-files-found: ignore
          # reusable-publish-test-results-pages.yml downloads this without a
          # tolerance guard, so the upload is part of that leg's verdict — no
          # continue-on-error here. Overwrite only, so a repeated call in one
          # run publishes its latest coverage instead of 409ing.
          overwrite: true
  publish-test-summary:
    name: Publish test summary
    needs: coverage
    if: >-
      always()
      && inputs.publish-test-summary
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-publish-test-summary.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      test-suite-name: ${{ inputs.comment-title }}
      comment-marker: ${{ inputs.comment-marker }}
      coverage-percent: ${{ needs.coverage.outputs.coverage-percent }}
      coverage-enabled: true
      coverage-threshold: ${{ inputs.threshold }}
      job-result: ${{ needs.coverage.outputs.passed == 'true' && 'success' || 'failure' }}
      rich-coverage-comment: true
      coverage-artifact-name: ${{ inputs.coverage-artifact-name }}
      coverage-file: ${{ needs.coverage.outputs.merged-coverage-file }}
      coverage-format: ${{ inputs.format }}
      tooling-ref: ${{ inputs.tooling-ref }}
