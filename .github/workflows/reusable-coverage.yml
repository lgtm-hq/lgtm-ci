  # lgtm-ci-egress-presets:end

jobs:
  coverage:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    outputs:
      # Read back from the results.v1 document this job writes (#1080).
      coverage-percent: ${{ steps.results.outputs.coverage-percent }}
      merged-coverage-file: ${{ steps.collect.outputs.merged-coverage-file }}
      merged-format: ${{ steps.collect.outputs.merged-format }}
      badge-url: ${{ steps.badge.outputs.badge-url }}
      passed: ${{ steps.threshold.outputs.passed }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            .github/actions/
            schemas/
            scripts/ci/
      - name: Warn on deprecated publish-pages
        shell: bash
        env:
          INPUT_NAME: publish-pages
          INPUT_VALUE: ${{ inputs.publish-pages }}
          DEFAULT_VALUE: "false"
          REPLACEMENT: >-
            Add a job calling
            lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-test-results-pages.yml
            with artifact-name matching this call's coverage-artifact-name and
            pages-target-dir 'coverage', and move the pages/id-token/
            actions:write grant onto that job. See the migration section of
            docs/pages-publishing.md for the coverage-path/badge-path values,
            which depend on working-directory.
        run: .lgtm-ci-tooling/scripts/ci/actions/warn-deprecated-workflow-input.sh
      - name: Download coverage artifacts
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-coverage"
          path: coverage-artifacts
          merge-multiple: true
      - name: Collect coverage
        id: collect
        uses: ./.lgtm-ci-tooling/.github/actions/collect-coverage
        with:
          coverage-files: ${{ inputs.coverage-files }}
          input-format: ${{ inputs.format }}
          output-format: ${{ inputs.output-format }}
          working-directory: ${{ inputs.working-directory }}
      - name: Check coverage threshold
        id: threshold
        uses: ./.lgtm-ci-tooling/.github/actions/check-coverage-threshold
        with:
          coverage-percent: ${{ steps.collect.outputs.coverage-percent }}
          threshold: ${{ inputs.threshold }}
      # results/coverage/default/results.json (results.v1, #1080): the merged
      # percentages and the threshold verdict, no test counts.
      - name: Write results
        id: results
        if: always() && steps.collect.outcome == 'success'
        shell: bash
        env:
          COVERAGE_PERCENT: ${{ steps.collect.outputs.coverage-percent }}
          COVERAGE_BRANCHES: ${{ steps.collect.outputs.branches-coverage }}
          COVERAGE_FUNCTIONS: ${{ steps.collect.outputs.functions-coverage }}
          THRESHOLD_PASSED: ${{ steps.threshold.outputs.passed }}
          MERGED_COVERAGE_FILE: ${{ steps.collect.outputs.merged-coverage-file }}
          RESULTS_SOURCE_VERSION: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/write-coverage-results.sh
      - name: Upload results
        if: always() && steps.results.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.coverage-artifact-name }}-results
          path: results/coverage/default/results.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Generate badge
        id: badge
        if: inputs.generate-badge
        uses: ./.lgtm-ci-tooling/.github/actions/generate-coverage-badge
        with:
          coverage-percent: ${{ steps.collect.outputs.coverage-percent }}
          format: svg
          output-path: coverage/badge.svg
          working-directory: ${{ inputs.working-directory }}
      - name: Upload coverage report
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: |
            ${{ inputs.working-directory }}/${{ steps.collect.outputs.merged-coverage-file }}
            ${{ inputs.working-directory }}/coverage/
          retention-days: 30
          if-no-files-found: ignore
          # reusable-publish-test-results-pages.yml downloads this without a
          # tolerance guard, so the upload is part of that leg's verdict — no
          # continue-on-error here. Overwrite only, so a repeated call in one
          # run publishes its latest coverage instead of 409ing.
          overwrite: true
  publish-test-summary:
    name: Publish test summary
    needs: coverage
    if: >-
      always()
      && inputs.publish-test-summary
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-publish-test-summary.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      test-suite-name: ${{ inputs.comment-title }}
      comment-marker: ${{ inputs.comment-marker }}
      # Fallback totals summary (rich comment unavailable) renders from the
      # results.v1 artifact this call wrote (#1080).
      results-artifact-pattern: ${{ inputs.coverage-artifact-name }}-results
      results-expected-count: "1"
      coverage-enabled: true
      coverage-threshold: ${{ inputs.threshold }}
      job-result: ${{ needs.coverage.outputs.passed == 'true' && 'success' || 'failure' }}
      rich-coverage-comment: true
      coverage-artifact-name: ${{ inputs.coverage-artifact-name }}
      coverage-file: ${{ needs.coverage.outputs.merged-coverage-file }}
      # The merged file's actual format, which can differ from inputs.format
      # (a coverage-py label over coverage.xml merges to cobertura)
      coverage-format: ${{ needs.coverage.outputs.merged-format || 'auto' }}
      tooling-ref: ${{ inputs.tooling-ref }}
