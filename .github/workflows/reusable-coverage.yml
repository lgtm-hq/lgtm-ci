---
name: Reusable Coverage Workflow

on:
  workflow_call:
    inputs:
      coverage-files:
        description: "Glob pattern or comma-separated list of coverage files"
        required: false
        type: string
        default: ""
      format:
        description: "Input coverage format: auto, istanbul, coverage-py, lcov"
        required: false
        type: string
        default: "auto"
      output-format:
        description: >-
          Format of the merged report: json, lcov, cobertura. Empty (default)
          keeps the input format, so LCOV stays LCOV end-to-end; a format no
          converter implements fails the job with
          "unsupported coverage conversion: <src> -> <dst>" (#1078).
        required: false
        type: string
        default: ""
      threshold:
        description: "Minimum coverage percentage to pass"
        required: false
        type: number
        default: 0
      generate-badge:
        description: "Generate coverage badge"
        required: false
        type: boolean
        default: true
      publish-pages:
        description: >-
          DEPRECATED (#770), accepted but inert. Pages publishing moved to
          reusable-publish-test-results-pages.yml, which the caller invokes in
          its own job; keeping the publish job here forced pages/id-token/
          actions:write onto every caller, publishing or not. Setting this to
          true warns and does nothing. Removal is planned a release or two out.
        required: false
        type: boolean
        default: false
      working-directory:
        description: "Working directory"
        required: false
        type: string
        default: "."

      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"
      job-name:
        description: "GitHub check name for the coverage job"
        required: false
        type: string
        default: "Coverage"
      publish-test-summary:
        description: >-
          Publish or update the coverage test summary comment for this
          workflow run
        required: false
        type: boolean
        default: true
      coverage-artifact-name:
        description: >-
          Name of the coverage-report artifact handed to the summary comment
          job and to a caller's Pages publisher call (#770).
          Override it when one workflow run calls this workflow more than once
          (for example per working directory): overwrite makes the last upload
          of a shared name authoritative, so distinct calls need distinct names
          to keep their handoffs isolated.
        required: false
        type: string
        default: "coverage-report"
      comment-marker:
        description: "Upsert marker for the coverage test summary comment"
        required: false
        type: string
        default: "coverage-report"
      comment-title:
        description: "Heading for the coverage test summary comment"
        required: false
        type: string
        default: "Coverage Report"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 30

    outputs:
      coverage-percent:
        description: "Overall coverage percentage"
        value: ${{ jobs.coverage.outputs.coverage-percent }}
      badge-url:
        description: "URL to coverage badge"
        value: ${{ jobs.coverage.outputs.badge-url }}
      pages-url:
        description: >-
          DEPRECATED (#770), always empty. Kept so callers referencing it keep
          parsing; read the pages-url output of
          reusable-publish-test-results-pages.yml instead.
        value: ${{ '' }}
      passed:
        description: "Whether coverage meets threshold"
        value: ${{ jobs.coverage.outputs.passed }}

