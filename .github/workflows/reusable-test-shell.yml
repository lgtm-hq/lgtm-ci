        with:
          client-id: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
          private-key: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
          owner: ${{ steps.tooling-app-target.outputs.owner }}
          repositories: ${{ steps.tooling-app-target.outputs.repository }}
          permission-contents: read
      # lgtm-ci-inline:end tooling-app-mint
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          # App requested: the minted token or a sentinel that cannot
          # authenticate, never a weaker fallback (#1622).
          token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      # Runs before any upload in this job uses the prefix (#1091); the
      # uploads below are always()-gated, so they also require this step's
      # success rather than uploading under a rejected prefix.
      - name: Validate artifact prefix
        id: artifact-prefix
        shell: bash
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/validate-artifact-prefix.sh
      # Bounded (#886): a wedged clone or install fails here with logs
      # instead of riding until the runner is killed. git only, no apt.
      - name: Install BATS and helpers
        shell: bash
        timeout-minutes: 10
        env:
          STEP: install-bats
          BATS_VERSION: ${{ inputs.bats-version }}
          BATS_CORE_COMMIT: ${{ inputs.bats-commit }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      # #886: an exact key (kcov version, tag commit, patch digest, build
      # recipe digest, runner image, OS release, architecture) and no
      # restore-keys, so a stage built for anything else is never restored.
      # An empty key skips the cache. install-kcov checks the stage (exact
      # file allowlist, ldd, --version) and builds from source on any doubt.
      # Those checks catch a stale or broken stage, not tampering, so these
      # steps save only on a push to the default branch, decided
      # case-sensitively by default-branch-push.sh (#1659); every other event
      # (pull requests, merge queue, schedules, dispatches) restores only.
      - name: Resolve kcov cache key
        id: kcov-cache-key
        if: inputs.coverage
        shell: bash
        timeout-minutes: 1
        env:
          STEP: kcov-cache-key
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      - name: Restore kcov build cache
        id: kcov-cache-restore
        if: inputs.coverage && steps.kcov-cache-key.outputs.cache-key != ''
        timeout-minutes: 5
        # Cache state never fails the job: a failed restore is a source build.
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.kcov-cache-key.outputs.stage-dir }}
          key: ${{ steps.kcov-cache-key.outputs.cache-key }}
      - name: Install kcov for coverage
        id: install-kcov
        if: inputs.coverage
        shell: bash
        timeout-minutes: 10
        env:
          STEP: install-kcov
          KCOV_STAGE_DIR: ${{ steps.kcov-cache-key.outputs.stage-dir }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      # Case-sensitive (#1659): expression `==` ignores case, so a push to a
      # branch `Main` would pass for a default branch `main`. The default
      # branch reaches the script through env only; empty or unknown gives
      # false.
      - name: Check for a default-branch push
        id: default-branch-push
        if: inputs.coverage && steps.kcov-cache-key.outputs.cache-key != ''
        shell: bash
        timeout-minutes: 1
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/default-branch-push.sh
      - name: Save kcov build cache
        if: >-
          inputs.coverage
          && steps.default-branch-push.outputs.default-branch-push == 'true'
          && steps.kcov-cache-key.outputs.cache-key != ''
          && steps.kcov-cache-restore.outputs.cache-hit != 'true'
          && steps.install-kcov.outputs.stage-ready == 'true'
        timeout-minutes: 5
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.kcov-cache-key.outputs.stage-dir }}
          key: ${{ steps.kcov-cache-key.outputs.cache-key }}
      - name: Run BATS tests
        if: ${{ !inputs.coverage }}
        id: test
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: run-tests
          TEST_PATH: ${{ inputs.test-path }}
          TEST_FILTER: ${{ inputs.test-filter }}
          PARALLEL: ${{ inputs.parallel }}
        run: bash "${GITHUB_WORKSPACE}/.lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh"
      - name: Run BATS tests with coverage
        if: ${{ inputs.coverage }}
        id: coverage-run
