              exit 0
            fi
            if [[ ! -f "$agent_log" || ! -r "$agent_log" ]]; then
              echo "agent.log is not a readable file; no agent start-up error to show"
              exit 0
            fi
            unsafe='[^[:alnum:] .,:;_=/@()+-]'
            shown=0
            while IFS= read -r line; do
              line="${line:0:512}"
