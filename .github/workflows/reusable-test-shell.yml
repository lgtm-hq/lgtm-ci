          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          COMMENT_MARKER: ${{ inputs.comment-marker }}
          # A shard that never uploaded will not appear; do not spend the
          # full budget on it when the shard job already failed.
          WAIT_BUDGET_SECONDS: ${{ needs.test-sharded.result == 'success' && '90' || '10' }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/wait-for-artifacts.sh
          "$EXPECTED_COUNT" "${ARTIFACT_PREFIX}-test-results-${COMMENT_MARKER}-shard-*"
      # Bounded retry (#1562): a transient download error (ECONNRESET on
      # GetSignedArtifactURL, a 5xx) fails one attempt; up to two more run
      # after a short back-off that also empties the download directory, so
      # no attempt mixes its extraction with an earlier one's. The aggregate
      # reads the final outcome and reports a failed download as such, not
      # as shards that did not finish.
      - name: Download shard TAP artifacts
        id: download-taps
        if: always()
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-test-results-${{ inputs.comment-marker }}-shard-*
          path: ${{ runner.temp }}/shard-taps
          merge-multiple: false
      - name: Back off before retrying shard TAP download
        if: always() && steps.download-taps.outcome == 'failure'
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/shard-taps
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/shard-download.sh
          reset "$DOWNLOAD_DIR" 15
      - name: Download shard TAP artifacts (retry 1)
        id: download-taps-retry-1
        if: always() && steps.download-taps.outcome == 'failure'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-test-results-${{ inputs.comment-marker }}-shard-*
          path: ${{ runner.temp }}/shard-taps
          merge-multiple: false
      - name: Back off before retrying shard TAP download again
        if: always() && steps.download-taps-retry-1.outcome == 'failure'
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/shard-taps
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/shard-download.sh
          reset "$DOWNLOAD_DIR" 45
      - name: Download shard TAP artifacts (retry 2)
        id: download-taps-retry-2
        if: always() && steps.download-taps-retry-1.outcome == 'failure'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-test-results-${{ inputs.comment-marker }}-shard-*
          path: ${{ runner.temp }}/shard-taps
          merge-multiple: false
      # One outcome for the three attempts, read by every consumer; a lone
      # artifact extracted at the root (found by its shard-complete.json,
      # not by name) moves into its own directory (#1562).
      - name: Finalize shard TAP download
        id: download-taps-final
        if: always()
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/shard-taps
          DOWNLOAD_OUTCOME: ${{ steps.download-taps.outcome }}
          DOWNLOAD_RETRY_1_OUTCOME: ${{ steps.download-taps-retry-1.outcome }}
          DOWNLOAD_RETRY_2_OUTCOME: ${{ steps.download-taps-retry-2.outcome }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/shard-download.sh
          finalize "$DOWNLOAD_DIR"
      # The coverage artifacts upload after the TAP ones, so a complete TAP
      # listing says nothing about them; wait for them separately so the
      # Cobertura merge and the threshold check see every shard (#803).
      - name: Wait for shard coverage artifacts
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COUNT: ${{ inputs.coverage-shards }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          COMMENT_MARKER: ${{ inputs.comment-marker }}
          # A shard that never uploaded will not appear; do not spend the
          # full budget on it when the shard job already failed.
          WAIT_BUDGET_SECONDS: ${{ needs.test-sharded.result == 'success' && '90' || '10' }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/wait-for-artifacts.sh
          "$EXPECTED_COUNT" "${ARTIFACT_PREFIX}-coverage-${COMMENT_MARKER}-shard-*"
      # Same bounded retry as the TAP download (#1562).
      - name: Download shard coverage artifacts
        id: download-coverage
        if: always()
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.comment-marker }}-shard-*
          path: ${{ runner.temp }}/shard-coverage
          merge-multiple: false
      - name: Back off before retrying shard coverage download
        if: always() && steps.download-coverage.outcome == 'failure'
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/shard-coverage
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/shard-download.sh
          reset "$DOWNLOAD_DIR" 15
      - name: Download shard coverage artifacts (retry 1)
        id: download-coverage-retry-1
        if: always() && steps.download-coverage.outcome == 'failure'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.comment-marker }}-shard-*
          path: ${{ runner.temp }}/shard-coverage
          merge-multiple: false
      - name: Back off before retrying shard coverage download again
        if: always() && steps.download-coverage-retry-1.outcome == 'failure'
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/shard-coverage
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/shard-download.sh
          reset "$DOWNLOAD_DIR" 45
      - name: Download shard coverage artifacts (retry 2)
        id: download-coverage-retry-2
        if: always() && steps.download-coverage-retry-1.outcome == 'failure'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.comment-marker }}-shard-*
          path: ${{ runner.temp }}/shard-coverage
          merge-multiple: false
      # One outcome for the three attempts, read by every consumer; a lone
      # artifact extracted at the root (found by its shard-complete.json,
      # not by name) moves into its own directory (#1562).
      - name: Finalize shard coverage download
        id: download-coverage-final
        if: always()
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/shard-coverage
          DOWNLOAD_OUTCOME: ${{ steps.download-coverage.outcome }}
          DOWNLOAD_RETRY_1_OUTCOME: ${{ steps.download-coverage-retry-1.outcome }}
          DOWNLOAD_RETRY_2_OUTCOME: ${{ steps.download-coverage-retry-2.outcome }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/shard-download.sh
          finalize "$DOWNLOAD_DIR"
      # Shard TAPs -> results/bats/default/results.json (results.v1, #1080);
      # every tests-* output is read back from it.
      - name: Aggregate shard TAP results
        id: results
        if: always()
        shell: bash
        env:
          STEP: aggregate-results
          SHARD_ARTIFACTS_DIR: ${{ runner.temp }}/shard-taps
          EXPECTED_SHARDS: ${{ inputs.coverage-shards }}
          # A shard with no shard-complete.json here did not finish, so the
          # document is marked incomplete instead of a full total (#1531).
          SHARD_MANIFEST_DIR: ${{ runner.temp }}/shard-coverage
          # Final download outcomes after the retries (#1562): a failed
          # download is reported as one, not as shards that did not finish.
          SHARD_ARTIFACTS_DOWNLOAD_OUTCOME: ${{ steps.download-taps-final.outputs.outcome || 'failure' }}
          SHARD_ARTIFACTS_PATTERN: ${{ inputs.artifact-prefix }}-test-results-${{ inputs.comment-marker }}-shard-*
          SHARD_COVERAGE_DOWNLOAD_OUTCOME: ${{ steps.download-coverage-final.outputs.outcome || 'failure' }}
          SHARD_COVERAGE_PATTERN: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.comment-marker }}-shard-*
          EXIT_CODE: ${{ needs.test-sharded.result == 'success' && '0' || '1' }}
          RESULTS_SOURCE_VERSION: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      - name: Merge shard Cobertura reports
        id: merge
        if: always()
        shell: bash
        env:
          STEP: merge-coverage
          SHARD_COVERAGE_DIR: ${{ runner.temp }}/shard-coverage
          # Merge only when every shard wrote its completion manifest (#1531).
          EXPECTED_SHARDS: ${{ inputs.coverage-shards }}
          SHARD_COVERAGE_DOWNLOAD_OUTCOME: ${{ steps.download-coverage-final.outputs.outcome || 'failure' }}
          SHARD_COVERAGE_PATTERN: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.comment-marker }}-shard-*
          MERGED_COVERAGE_FILE: ${{ runner.temp }}/merged-cobertura.xml
          COVERAGE_ON_EMPTY: ${{ inputs.coverage-on-empty }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      - name: Attach coverage to results
        if: always() && steps.results.outcome == 'success' && steps.merge.outcome == 'success'
        shell: bash
        env:
          RESULTS_FILE: ${{ steps.results.outputs.results-json }}
          COVERAGE_LINES: ${{ steps.merge.outputs.coverage-percent }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/results-update.sh
      - name: Check coverage threshold
        id: coverage-gate
        if: always() && inputs.coverage-threshold > 0 && steps.merge.outcome == 'success'
        shell: bash
        env:
          STEP: check-threshold
          COVERAGE_PERCENT: ${{ steps.merge.outputs.coverage-percent }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-bats-tests.sh
      # A failed threshold must reach the document before it is uploaded, or
      # the artifact would carry a false "passed".
      - name: Record gate verdict in results
        if: always() && steps.coverage-gate.outcome == 'failure'
        shell: bash
        env:
          RESULTS_FILE: ${{ steps.results.outputs.results-json }}
          STATUS: failed
        run: bash .lgtm-ci-tooling/scripts/ci/actions/results-update.sh
      - name: Upload results
        if: always() && steps.results.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Same name the single-job path uploads (#1080); the two paths
          # never run in one call.
          name: ${{ inputs.artifact-prefix }}-results
          path: results/bats/default/results.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Upload merged coverage report
        id: upload-merged-coverage
        if: always() && inputs.upload-coverage && steps.merge.outcome == 'success'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Same name the single-job path uploads, namespaced by
          # artifact-prefix (#1091); the two paths never run in one call.
          name: ${{ inputs.artifact-prefix }}-coverage
          path: ${{ runner.temp }}/merged-cobertura.xml
          retention-days: 7
          if-no-files-found: ignore
          # overwrite only, for a rerun of this same call (#728/#752).
          overwrite: true
      - name: Warn on failed merged coverage upload
        if: always() && steps.upload-merged-coverage.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Merged coverage upload failed; the test result is unaffected."
      # #1422: merge the shards' bats-durations-shard.json (inside the TAP
      # artifacts downloaded above) into one bats-durations.json, on pushes
      # to the default branch only. Best effort like the shard step: the
      # script warns and exits 0, and none of these steps can fail the job.
      - name: Merge shard BATS durations
        id: durations
        if: >-
          ${{ always()
          && github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && !github.event.repository.fork }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          SHARD_TAPS_DIR: ${{ runner.temp }}/shard-taps
          SHARD_TOTAL: ${{ inputs.coverage-shards }}
          TEST_PATH: ${{ inputs.test-path }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          DURATIONS_FILE: ${{ runner.temp }}/bats-durations/bats-durations.json
        run: >-
          python3 .lgtm-ci-tooling/scripts/ci/actions/bats-durations.py merge
          --dir "$SHARD_TAPS_DIR" --shard-total "$SHARD_TOTAL"
          --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --test-path "$TEST_PATH" --root "$WORKING_DIRECTORY"
          --path-prefix "$WORKING_DIRECTORY" --output "$DURATIONS_FILE"
      - name: Upload BATS durations
        id: upload-durations
        if: always() && steps.durations.outcome == 'success'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Stable name: duration-based shard assignment reads it from the
          # latest default-branch run. Kept 90 days so a quiet stretch
          # without merges does not leave it with no data; the file is a
          # few kilobytes. No file (the merge found no data and warned)
          # uploads nothing.
          name: ${{ inputs.artifact-prefix }}-bats-durations
          path: ${{ runner.temp }}/bats-durations/bats-durations.json
          retention-days: 90
          if-no-files-found: ignore
          # overwrite only, for a rerun of this same call (#728/#752).
          overwrite: true
      - name: Warn on failed BATS durations upload
        if: always() && steps.upload-durations.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::BATS durations upload failed; the test result is unaffected."
      - name: Fail if TAP aggregation found no tests
        if: always() && steps.results.outputs.tests-ran != 'true'
        shell: bash
        run: |
          echo "::error::Coverage shard TAP aggregation found no tests (lost artifacts or empty shards)."
          exit 1
      - name: Fail if a coverage shard failed
        if: always() && needs.test-sharded.result != 'success'
        shell: bash
        run: |
          echo "::error::One or more coverage shards failed; the required check fails instead of skipping."
          exit 1
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT: ${{ vars.LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT }}
          HARDEN_RUNNER_AGENT: ${{ steps.verify-harden-runner.outputs.agent }}
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Generated from scripts/ci/bootstrap/recheck-harden-runner-agent.sh by
          # sync_inline_blocks.py: edit the source, not this copy. Inline because not
          # every job checks the tooling out, and job steps can change it.
          # Recheck of the harden-runner agent, before each irreversible publish
          # step (#1551) and at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # Which agent the verify step proved, from its step output (#1668).
          case "${HARDEN_RUNNER_AGENT:-}" in
            standard) ;;
            ebpf)
              if [[ "${LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT:-}" != true ]]; then
                echo "::error title=harden-runner agent refused::the eBPF fallback agent is" \
                  "running but LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT is not true"
                exit 1
              fi
              # Its block-mode lines must still be there. Presence only: any job step
              # can write agent.log by now, so a line's absence fails and nothing
              # read here can fail a healthy agent.
              log="${HARDEN_RUNNER_ROOT:-}/home/agent/agent.log"
              stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
              stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
              for proof in '\[buildInfo\] name=AgentAlpha ' '.*NetMode:ebpf[ }]' \
                '\[tracerManager\] block-policy applied$'; do
                if ! grep -qE -m 1 "^${stamp}${proof}" "$log" 2> /dev/null; then
                  echo "$stopped (agent.log no longer shows the eBPF agent's block mode)"
                  exit 1
                fi
              done
              echo "harden-runner eBPF agent is still active in block mode (accepted" \
                "because LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT is true)"
              exit 0
              ;;
            *)
              echo "::error title=harden-runner agent unproven::the verify step did not" \
                "record which agent it verified (steps.verify-harden-runner.outputs.agent)"
              exit 1
              ;;
          esac
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS"
          # lgtm-ci-inline:end recheck-harden-runner-agent
  # lgtm-ci-readonly:omit:begin

  publish-test-summary:
    needs: [test, aggregate]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
      && inputs.publish-test-summary
      && (
        !inputs.draft-pr-skip ||
        github.event.pull_request.draft == false
      )
    uses: ./.github/workflows/reusable-publish-test-summary.yml
    secrets:
      LGTM_CI_TOOLING_TOKEN: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
      LGTM_CI_TOOLING_APP_CLIENT_ID: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
      LGTM_CI_TOOLING_APP_PRIVATE_KEY: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: ${{ inputs.egress-policy }}
      test-suite-name: ${{ inputs.job-name }}
      comment-marker: ${{ inputs.comment-marker }}
      comment-history: ${{ inputs.comment-history }}
      comment-history-limit: ${{ inputs.comment-history-limit }}
      # The comment is rendered from this call's results.v1 artifact (#1080),
      # uploaded by whichever path ran.
      results-artifact-pattern: ${{ format('{0}-results', inputs.artifact-prefix) }}
      results-expected-count: "1"
      coverage-enabled: ${{ inputs.coverage }}
      coverage-threshold: ${{ inputs.coverage-threshold }}
      job-result: >-
        ${{ needs.aggregate.result != 'skipped'
        && needs.aggregate.result
        || needs.test.result }}
      tooling-ref: ${{ inputs.tooling-ref }}
      tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
# lgtm-ci-readonly:omit:end
