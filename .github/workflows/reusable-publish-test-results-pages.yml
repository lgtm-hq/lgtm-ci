---
name: Reusable Publish Test Results To Pages

# Standalone GitHub Pages publisher for a report artifact produced by another
# job (#770). Split out of the `publish` jobs of reusable-coverage.yml and
# reusable-test-e2e-matrix.yml so that callers which never publish stop being
# forced to grant `pages`, `id-token` and `actions: write` — a reusable
# workflow's permission request is validated statically, before any job `if:`,
# so those scopes could not be avoided while the job lived in those files
# (#737).
#
# ONE publisher, not one per producer: both former jobs wrapped the same
# `publish-test-results` composite action with the same three write scopes, the
# same `pages-<repo>-<ref>` concurrency group and the same `github-pages`
# environment. The only thing that differed was which of the action's path
# inputs were populated — a parameter, not a shape. Two near-identical files
# would duplicate the boilerplate and, worse, double the number of places that
# declare the exact grant #737 wants small and auditable.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: >-
          Name of the report artifact to download and publish, as uploaded by
          the producing workflow (for example a reusable-coverage.yml
          coverage-artifact-name, or '<artifact-prefix>-merged-report' from
          reusable-test-e2e-matrix.yml)
        required: true
        type: string
      pages-target-dir:
        description: >-
          Pages subdirectory this report deploys into. Required, not defaulted:
          it is URL-visible, and a silent default would publish a migrating
          caller's report over the site root. Use 'coverage' to reproduce
          reusable-coverage.yml's old path and 'playwright' for
          reusable-test-e2e-matrix.yml's. Relative path, no '..' segments
        required: true
        type: string
      results-path:
        description: >-
          Test-report path INSIDE the downloaded artifact ('.' for its root,
          empty when the artifact holds no test report)
        required: false
        type: string
        default: ""
      coverage-path:
        description: >-
          Coverage-report path INSIDE the downloaded artifact ('.' for its root,
          empty when the artifact holds no coverage report)
        required: false
        type: string
        default: ""
      badge-path:
        description: >-
          Badge path INSIDE the downloaded artifact (empty when there is none)
        required: false
        type: string
        default: ""

      tooling-ref:
        description: "Git ref to use when checking out lgtm-ci tooling scripts"
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      egress-preset:
        description: >-
          Named allowlist when allowed-endpoints is empty and egress-policy is
          block. Defaults to github-pages for the GitHub Pages OIDC deploy.
        required: false
        type: string
        default: "github-pages"
      allowed-endpoints:
        description: "Allowed endpoints when egress-policy is block"
        required: false
        type: string
        default: >
          github.com:443
          api.github.com:443
          actions.githubusercontent.com:443
          codeload.github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pipelines.actions.githubusercontent.com:443
      allowed-endpoints-mode:
        description: >-
          replace: non-empty allowed-endpoints overrides egress-preset; append:
          merges preset with allowed-endpoints (deduped, first-seen wins)
        required: false
        type: string
        default: "replace"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

    outputs:
      pages-url:
        description: "GitHub Pages URL of the published report"
        value: ${{ jobs.publish.outputs.pages-url }}

jobs:
  publish:
    name: Publish Test Results
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Moved here with the job (#770): every Pages publisher in this repo shares
    # one group so a coverage deploy and a report deploy for the same repo+ref
    # cannot race and overwrite each other's site.
    concurrency:
      group: pages-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.pages-url }}
    permissions:
      contents: read
      # actions/deploy-pages@cd2ce8f src/internal/api-client.js:125 —
      # POST /repos/{owner}/{repo}/pages/deployments, authenticated with
      # GITHUB_TOKEN. actions/configure-pages reads the Pages config the same way.
      pages: write
      # actions/deploy-pages@cd2ce8f src/index.js:22 — core.getIDToken(), sent
      # as the deployment's `oidc_token` (src/internal/api-client.js:117).
      id-token: write
      # scripts/ci/actions/delete-run-pages-artifacts.sh:45-46 —
      # `gh api --method DELETE /repos/{}/actions/artifacts/{id}` with
      # GITHUB_TOKEN, to clear stale same-run Pages artifacts on rerun (#415).
      # This is the REST artifact API, not the ACTIONS_RUNTIME_TOKEN path that
      # made the same scope unnecessary in #730, and the script dies on failure.
      actions: write

    outputs:
      pages-url: ${{ steps.publish.outputs.pages-url }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lgtm-hq/lgtm-ci
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || github.workflow_sha }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref }}
          egress-policy: ${{ inputs.egress-policy }}
          egress-preset: ${{ inputs.egress-preset }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
          allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
          sparse-checkout-extra: |
            .github/actions/
            scripts/ci/
      # The deploy destination is caller-controlled and URL-visible, so it is a
      # security control: rejected before anything is downloaded or staged, in
      # the same job that performs the deploy (#754).
      - name: Validate Pages target dir
        shell: bash
        env:
          PAGES_TARGET_DIR: ${{ inputs.pages-target-dir }}
        run: .lgtm-ci-tooling/scripts/ci/actions/validate-pages-target-dir.sh
      - name: Download report artifact
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          # Local extraction directory, deliberately fixed: the caller's path
          # inputs are relative to the artifact root, not to this directory.
          path: publish-input
      - name: Resolve report paths
        id: paths
        shell: bash
        env:
          DOWNLOAD_DIR: publish-input
          RESULTS_PATH: ${{ inputs.results-path }}
          COVERAGE_PATH: ${{ inputs.coverage-path }}
          BADGE_PATH: ${{ inputs.badge-path }}
        run: .lgtm-ci-tooling/scripts/ci/actions/resolve-publish-report-paths.sh
      - name: Publish to GitHub Pages
        id: publish
        uses: ./.lgtm-ci-tooling/.github/actions/publish-test-results
        with:
          results-path: ${{ steps.paths.outputs.results-path }}
          coverage-path: ${{ steps.paths.outputs.coverage-path }}
          badge-path: ${{ steps.paths.outputs.badge-path }}
          target-dir: ${{ inputs.pages-target-dir }}
