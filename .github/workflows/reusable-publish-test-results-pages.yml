---
name: Reusable Publish Test Results To Pages

# Standalone GitHub Pages publisher for a report artifact produced by another
# job (#770). Split out of the `publish` jobs of reusable-coverage.yml and
# reusable-test-e2e-matrix.yml so that callers which never publish stop being
# forced to grant `pages`, `id-token` and `actions: write` — a reusable
# workflow's permission request is validated statically, before any job `if:`,
# so those scopes could not be avoided while the job lived in those files
# (#737).
#
# ONE publisher, not one per producer: both former jobs wrapped the same
# `publish-test-results` composite action with the same three write scopes, the
# same `pages-<repo>-<ref>` concurrency group and the same `github-pages`
# environment. The only thing that differed was which of the action's path
# inputs were populated — a parameter, not a shape. Two near-identical files
# would duplicate the boilerplate and, worse, double the number of places that
# declare the exact grant #737 wants small and auditable.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: >-
          Name of the report artifact to download and publish, as uploaded by
          the producing workflow (for example a reusable-coverage.yml
          coverage-artifact-name, or '<artifact-prefix>-merged-report' from
          reusable-test-e2e-matrix.yml)
        required: true
        type: string
      pages-target-dir:
        description: >-
          Pages subdirectory this report deploys into. Required, not defaulted:
          it is URL-visible, and a silent default would publish a migrating
          caller's report over the site root. Use 'coverage' to reproduce
          reusable-coverage.yml's old path and 'playwright' for
          reusable-test-e2e-matrix.yml's. Relative path, no '..' segments
        required: true
        type: string
      results-path:
        description: >-
          Test-report path INSIDE the downloaded artifact ('.' for its root,
          empty when the artifact holds no test report)
        required: false
        type: string
        default: ""
      coverage-path:
        description: >-
          Coverage-report path INSIDE the downloaded artifact ('.' for its root,
          empty when the artifact holds no coverage report)
        required: false
        type: string
        default: ""
      badge-path:
        description: >-
          Badge path INSIDE the downloaded artifact (empty when there is none)
        required: false
        type: string
        default: ""

      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-pages). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-pages"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

    outputs:
      pages-url:
        description: "GitHub Pages URL of the published report"
        value: ${{ jobs.publish.outputs.pages-url }}

