jobs:
  canary:
    name: "🐤 External Consumer Canary"
    # Always runs so the check always reports; the script decides full vs skip.
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    permissions:
      # Resolve the candidate ref to a SHA and read the canary script.
      contents: read
      # List the pull request's changed files for the run/skip decision.
      pull-requests: read
      # Verify stale refs belong to completed canaries before pruning them.
      actions: read
    steps:
      - name: Harden runner
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
          # Literal map in env only: harden-runner's pre hook runs before any
          # step, so the allowlist cannot come from anything computed later.
          allowed-endpoints: >-
            ${{ fromJSON(env.LGTM_CI_EGRESS_PRESETS)['external-canary'] }}

      - name: Checkout canary scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Create fixture App installation token
        id: fixture-token
        # Fork PRs cannot read the App secrets; the script skips them.
        if: github.event.pull_request.head.repo.fork != true
        # The mint runs before the script's run/skip decision. A failed mint
        # (missing secrets or permissions, API error) must not turn a skip
        # run red; a full run still fails on the empty GH_TOKEN.
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EXTERNAL_FIXTURE_APP_ID }}
          private-key: ${{ secrets.EXTERNAL_FIXTURE_APP_PRIVATE_KEY }}
          # Scoped to the fixture repository only; the token reaches nothing
          # in lgtm-hq (the job's github.token reads lgtm-ci).
          owner: TurboCoder13
          repositories: lgtm-ci-consumer-fixture
          # Dispatch and poll (actions), create and delete the canary branch
          # (contents), write pinned workflow files (workflows).
          permission-actions: write
          permission-contents: write
          permission-workflows: write

      - name: Run external consumer canary
        env:
          GH_TOKEN: ${{ steps.fixture-token.outputs.token }}
          LGTM_CI_TOKEN: ${{ github.token }}
          CANDIDATE_REF: >-
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          CANARY_STATE_DIR: ${{ runner.temp }}/external-canary
          CANARY_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: bash scripts/ci/actions/external-canary.sh "$CANDIDATE_REF"

      - name: Cancel unfinished fixture runs and clean up ref
        if: always() && steps.fixture-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.fixture-token.outputs.token }}
          LGTM_CI_TOKEN: ${{ github.token }}
          CANARY_STATE_DIR: ${{ runner.temp }}/external-canary
        run: bash scripts/ci/actions/external-canary.sh --cleanup
