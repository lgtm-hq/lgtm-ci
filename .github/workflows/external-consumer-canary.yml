jobs:
  canary:
    name: "🐤 External Consumer Canary"
    # Always runs so the check always reports; the script decides full vs skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      # Resolve the candidate ref to a SHA and read the canary script.
      contents: read
      # List the pull request's changed files for the run/skip decision.
      pull-requests: read
    steps:
      - name: Harden runner
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Literal map in env only: harden-runner's pre hook runs before any
          # step, so the allowlist cannot come from anything computed later.
          allowed-endpoints: >-
            ${{ fromJSON(env.LGTM_CI_EGRESS_PRESETS)['external-canary'] }}

      - name: Checkout canary scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Run external consumer canary
        env:
          GH_TOKEN: ${{ secrets.EXTERNAL_FIXTURE_TOKEN }}
          LGTM_CI_TOKEN: ${{ github.token }}
          CANDIDATE_REF: >-
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          CANARY_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: bash scripts/ci/actions/external-canary.sh "$CANDIDATE_REF"
