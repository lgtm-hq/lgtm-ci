# SPDX-License-Identifier: MIT
# For license details, see the repository root LICENSE file.
#
# External consumer canary (#1074). Pins every workflow of the external
# fixture TurboCoder13/lgtm-ci-consumer-fixture to one lgtm-ci candidate SHA
# on a throwaway fixture branch `canary/<sha>-<run-id>-<attempt>`, dispatches the gate and
# informational workflows there, waits with separate queue and execution budgets,
# writes the table, cancels unfinished runs and deletes the ref once settled. The
# fixture's main is never written. Shell logic lives in
# scripts/ci/actions/external-canary.sh.
#
# Re-dispatch a gate once after startup_failure, jobs-API-proven fixture
# setup failure, or a failed step whose check-run annotation is a confirmed
# infrastructure signature (scripts/ci/lib/infra-signatures.sh,
# infra_canary_signatures, #1475), within the existing queue budget and
# in-flight limit. CANARY_RETRY_INFRA=false disables it. Probes and other
# lgtm-ci-step failures are never retried; the table uses the final verdict
# and notes the first run URL.
# Queue expiry and unresolved proven infrastructure failures (including failed
# retry dispatch) are blocking inconclusive results, never passes or product
# failures; the informational override does not turn them green.
# For pull_request events, query the candidate PR state at start and after
# polling: closed/merged PRs exit 0 with ::notice::. API errors fail closed.
#
# Triggers: every pull_request (always-run / fast-skip: the single job always
# starts and reports; it runs the fixture set only when the PR touches
# .github/workflows/**, .github/actions/**, scripts/ci/**, schemas/** or
# examples/**, decided from the PR's file list rather than a `paths:` filter,
# otherwise it exits green with a "skipped" summary; a `labeled` event for a
# label other than the two below is skipped too) and workflow_dispatch
# (input `ref`, default: the dispatched commit, always the full set).
#
# Labels: `needs-external-canary` forces the full set on any PR;
# `canary-informational` (owner-only by convention) reports gate failures as
# warnings. Unresolved dispatch and monitoring failures still block gates.
# Fork PRs skip (they cannot read the App secrets).
#
# Not a required check yet: promotion follows an observation period (#1123).
# The bounded infrastructure retry preserves evidence for that observation.
# Contract: docs/workflow-contract.md "External verification".
#
# Gate workflows (the canary fails when any does not succeed):
#   actions-direct build-python-direct coverage-lcov docker-facade-validate
#   docker-orchestrator docker-publish docker-scan-failure-probe e2e-matrix
#   egress node-bun node-npm node-pnpm perms playwright python python-private-dep
#   readonly-docker readonly-node readonly-rust readonly-shell recover retry
#   rust rust-build-siblings rust-release-build siblings verify-fresh-install
#   vuln-suppression
# Informational workflows (reported against their expected conclusion, never fail the canary):
#   app-token-probe docker-scan-failure perms-negative perms-negative-docker
#   perms-negative-node perms-negative-probe perms-negative-recover
#   perms-negative-rust perms-negative-shell playwright-negative
#   playwright-negative-probe sbom-release-upload verify-negative
#   verify-negative-probe
# A negative-by-design workflow with a `<name>-probe.yml` is dispatched only by
# that probe, which asserts the designed failure and is green when it holds.
#
# Before dispatch every lgtm-ci path a dispatchable fixture workflow references,
# and every input it passes to an lgtm-ci reusable (#1134), is looked up at
# the candidate (#1128): missing there but present at the
# merge base with main fails the canary for any role, informational and
# manual workflows included (`removed_by_candidate`); missing at both but
# present on main is listed `not_applicable` (landed after the candidate
# branched).
# Manual workflows (shared fixture concurrency group and a version PR per run; dispatched only on request):
#   release-benign-hook release-tamper-hook release-version-pr
#
# The fixture token is a GitHub App installation token (#1123) minted per
# run from EXTERNAL_FIXTURE_APP_ID / EXTERNAL_FIXTURE_APP_PRIVATE_KEY (App
# lgtm-ci-fixture-release, installed on the fixture only), scoped to the
# fixture repository with Actions, Contents and Workflows write; it expires
# after one hour. No `secrets: inherit`. On pull_request the script runs from
# the PR head, so a same-repository author with push access can read the
# token; its reach is the fixture only (see the contract section).
---
name: External Consumer Canary

'on':
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          lgtm-ci commit SHA (or branch/tag) to pin the fixture to.
          Empty: the commit this workflow was dispatched on.
        required: false
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

concurrency:
  # An unrelated label's fast-skip must not supersede a full canary.
  group: >-
    external-consumer-canary-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{
    github.event.action == 'labeled' && github.event.label.name != 'needs-external-canary' &&
    github.event.label.name != 'canary-informational' && github.run_id || 'active' }}
  cancel-in-progress: true

