# SPDX-License-Identifier: MIT
#
# Caller permissions:
#   post-failure-comment: true (default) → grant pull-requests: write
#   post-failure-comment: false → pull-requests: read is sufficient
# The reusable job always requests pull-requests: write; comment steps are
# gated by post-failure-comment and callers may cap the grant to read.
---
name: Reusable Semantic PR Title

on:
  workflow_call:
    inputs:
      types:
        description: >-
          Allowed conventional commit types (newline-delimited; legacy
          comma-separated values are normalized automatically). Leave empty
          for the default list.
        required: false
        type: string
        default: ""
      scopes:
        description: >-
          Allowed scopes (newline-delimited; legacy comma-separated values are
          normalized automatically). Empty allows any scope.
        required: false
        type: string
        default: ""
      require-scope:
        description: "Require a scope in the PR title"
        required: false
        type: boolean
        default: false
      max-length:
        description: "Maximum PR title length (0 for no limit)"
        required: false
        type: string
        default: "0"
      post-failure-comment:
        description: "Post or clear a PR comment on validation failure"
        required: false
        type: boolean
        default: true
      comment-marker:
        description: "Upsert marker for the failure comment"
        required: false
        type: string
        default: "semantic-pr-title"
      tooling-ref:
        description: >-
          Optional — pins egress composites and helper scripts under
          scripts/ci/. Unset tracks the workflow pin (job.workflow_sha, #995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-minimal). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-minimal"
      job-name:
        description: "GitHub check name for the semantic title check"
        required: false
        type: string
        default: "Semantic PR Title"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

