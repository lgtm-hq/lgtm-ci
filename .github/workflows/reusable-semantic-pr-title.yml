  # lgtm-ci-egress-presets:end

jobs:
  semantic-title:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Do NOT skip this job on merge_group: GitHub cannot evaluate the dynamic
    # name of a skipped job, so its check would report as "inputs.job-name"
    # and the required context would never arrive (queue timeout). Instead the
    # job always runs and every PR-dependent step no-ops on merge_group — the
    # job succeeds in seconds and satisfies the required check (the title was
    # already validated on the pull_request event).
    permissions:
      contents: read
      # post-pr-comment upserts failure comments on the pull request
      pull-requests: write

    steps:
      - name: Harden runner
        if: github.event_name != 'merge_group'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-minimal'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-minimal'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        if: github.event_name != 'merge_group'
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        if: github.event_name != 'merge_group'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        if: github.event_name != 'merge_group'
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            .github/actions/post-pr-comment
            scripts/ci/
      - name: Prepare semantic PR lists
        id: prepare
        if: github.event_name != 'merge_group'
        env:
          TYPES_INPUT: ${{ inputs.types }}
          SCOPES_INPUT: ${{ inputs.scopes }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/prepare-semantic-pr-lists.sh
      - name: Validate PR title length
        id: length
        if: >-
          github.event_name == 'pull_request'
          && inputs.max-length != ''
          && inputs.max-length != '0'
        continue-on-error: true
        env:
          TITLE: ${{ github.event.pull_request.title }}
          MAX_LENGTH: ${{ inputs.max-length }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/validate-pr-title-length.sh
      - name: Validate semantic PR title
        id: semantic
        if: github.event_name != 'merge_group'
        continue-on-error: true
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ steps.prepare.outputs.types }}
          scopes: ${{ steps.prepare.outputs.scopes }}
          requireScope: ${{ inputs.require-scope }}
      - name: Format semantic PR title failure comment
        id: failure-comment
        if: >-
          always()
          && inputs.post-failure-comment
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
          && (
            steps.length.outputs.error != ''
            || steps.semantic.outputs.error_message != ''
          )
        env:
          LENGTH_ERROR: ${{ steps.length.outputs.error }}
          SEMANTIC_ERROR: ${{ steps.semantic.outputs.error_message }}
          ALLOWED_TYPES: ${{ steps.prepare.outputs.types }}
          COMMENT_FILE: semantic-pr-title-failure.md
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/format-semantic-pr-title-failure-comment.sh
      - name: Post semantic PR title failure comment
        if: >-
          always()
          && inputs.post-failure-comment
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
          && steps.failure-comment.outcome == 'success'
          && (
            steps.length.outputs.error != ''
            || steps.semantic.outputs.error_message != ''
          )
        uses: ./.lgtm-ci-tooling/.github/actions/post-pr-comment
        with:
          file: semantic-pr-title-failure.md
          marker: ${{ inputs.comment-marker }}
      - name: Clear semantic PR title failure comment
        if: >-
          always()
          && inputs.post-failure-comment
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
          && steps.length.outputs.error == ''
          && steps.semantic.outputs.error_message == ''
          && steps.semantic.outcome == 'success'
          && (
            steps.length.outcome == 'success'
            || steps.length.outcome == 'skipped'
          )
        uses: ./.lgtm-ci-tooling/.github/actions/post-pr-comment
        with:
          marker: ${{ inputs.comment-marker }}
          delete-on-empty: "true"
      - name: Fail on invalid PR title
        if: >-
          always()
          && (
            steps.semantic.outcome == 'failure'
            || steps.length.outcome == 'failure'
          )
        env:
          EXIT_CODE: "1"
        run: bash .lgtm-ci-tooling/scripts/ci/actions/fail-with-exit-code.sh
