  # lgtm-ci-egress-presets:end

jobs:
  validate:
    name: Validate
    if: ${{ !inputs.push }}
    uses: ./.github/workflows/reusable-docker-multiplatform-validate.yml
    secrets:
      LGTM_CI_TOOLING_TOKEN: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
    permissions:
      contents: read
    with:
      matrix: ${{ inputs.matrix }}
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      platforms: ${{ inputs.platforms }}
      registry: ${{ inputs.registry }}
      image-name: ${{ inputs.image-name }}
      version: ${{ inputs.version }}
      source-ref: ${{ inputs.source-ref }}
      tag-latest: ${{ inputs.tag-latest }}
      exact-tags: ${{ inputs.exact-tags }}
      scan: ${{ inputs.scan }}
      build-args: ${{ inputs.build-args }}
      target: ${{ inputs.target }}
      smoke-test: ${{ inputs.smoke-test }}
      smoke-test-script: ${{ inputs.smoke-test-script }}
      health-check-cmd: ${{ inputs.health-check-cmd }}
      health-check-port: ${{ inputs.health-check-port }}
      health-check-timeout: ${{ inputs.health-check-timeout }}
      scan-exit-code: ${{ inputs.scan-exit-code }}
      cache-registry-ref: ${{ inputs.cache-registry-ref }}
      no-cache: ${{ inputs.no-cache }}
      free-disk-space: ${{ inputs.free-disk-space }}
      resource-monitor: ${{ inputs.resource-monitor }}
      tooling-ref: ${{ inputs.tooling-ref }}
      tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}
      egress-preset: ${{ inputs.egress-preset }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      validate-on-pr: ${{ inputs.validate-on-pr }}

  # The validate path's Trivy SARIF reaches code scanning here, so the
  # read-only build job never holds security-events: write. Same per-slug
  # upload and category as before the split. Every scanned leg staged an
  # artifact (the SARIF or a no-sarif marker), so a leg whose artifact never
  # appears fails here instead of silently dropping its report; after a
  # cancelled validate run, missing legs are tolerated and finished legs
  # still upload.
  upload-scan-results:
    name: Upload Trivy scan results
    needs: validate
    if: >-
      always() &&
      !inputs.push &&
      inputs.scan &&
      needs.validate.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # actions: read — github/codeql-action/upload-sarif looks up the current
    # workflow run through the Actions API; without it the upload returns 403
    # in private repositories (#1310). Callers must grant it as well.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden runner
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      # upload-sarif attributes the analysis to the checked-out HEAD, so check
      # out the built source as the in-job upload did before #1081.
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # source-ref = build-context (app source); tooling-ref stays separate
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
          sparse-checkout-extra: |
            scripts/ci/
      # Every scanned leg uploaded an artifact, so a download that still
      # fails after one delayed retry (artifact listing lag, #803) fails the
      # job. Only after a cancelled validate run is a missing leg tolerated.
      - name: Fetch Trivy SARIF artifact (${{ matrix.platform }})
        id: fetch
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-trivy-sarif-${{ matrix.slug }}
          path: ${{ runner.temp }}/trivy-sarif
      - name: Wait before retrying the SARIF download
        if: steps.fetch.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Retry Trivy SARIF artifact (${{ matrix.platform }})
        id: retry
        if: steps.fetch.outcome == 'failure'
        continue-on-error: ${{ needs.validate.result == 'cancelled' }}
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-trivy-sarif-${{ matrix.slug }}
          path: ${{ runner.temp }}/trivy-sarif
      - name: Locate Trivy SARIF (${{ matrix.platform }})
        id: locate
        if: steps.fetch.outcome == 'success' || steps.retry.outcome == 'success'
        shell: bash
        env:
          MODE: locate
          SARIF_NAME: trivy-results-${{ matrix.slug }}.sarif
          DOWNLOAD_DIR: ${{ runner.temp }}/trivy-sarif
        run: bash .lgtm-ci-tooling/scripts/ci/actions/docker/trivy-sarif.sh
      - name: Upload Trivy scan results (${{ matrix.platform }})
        if: steps.locate.outputs.found == 'true'
        # Pinned to SHA for supply chain security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.locate.outputs.path }}
          category: "trivy-${{ matrix.slug }}"

  publish:
    name: Publish
    if: ${{ inputs.push }}
    uses: ./.github/workflows/reusable-docker-multiplatform-publish.yml
    permissions:
      # The nested publish scan job uploads SARIF and needs actions: read (#1310).
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    with:
      matrix: ${{ inputs.matrix }}
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      platforms: ${{ inputs.platforms }}
      registry: ${{ inputs.registry }}
      image-name: ${{ inputs.image-name }}
      version: ${{ inputs.version }}
      source-ref: ${{ inputs.source-ref }}
      tag-latest: ${{ inputs.tag-latest }}
      exact-tags: ${{ inputs.exact-tags }}
      scan: ${{ inputs.scan }}
      build-args: ${{ inputs.build-args }}
      target: ${{ inputs.target }}
      smoke-test: ${{ inputs.smoke-test }}
      smoke-test-script: ${{ inputs.smoke-test-script }}
      health-check-cmd: ${{ inputs.health-check-cmd }}
      health-check-port: ${{ inputs.health-check-port }}
      health-check-timeout: ${{ inputs.health-check-timeout }}
      scan-exit-code: ${{ inputs.scan-exit-code }}
      cache-registry-ref: ${{ inputs.cache-registry-ref }}
      no-cache: ${{ inputs.no-cache }}
      free-disk-space: ${{ inputs.free-disk-space }}
