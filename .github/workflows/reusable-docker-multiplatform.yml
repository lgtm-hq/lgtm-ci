---
name: Reusable Docker Build (multi-platform)

# Facade for the split multi-arch path (#1081). reusable-docker.yml calls it
# when the classify job resolves use-split=true and passes the classify
# matrix in `matrix`. The facade keeps this file's inputs, outputs and secrets
# and delegates on `push`:
#   - push: false -> reusable-docker-multiplatform-validate.yml: native
#     per-platform builds without pushing, local smoke test, health check
#     and Trivy scan, validation summary. Read-only (contents: read). The
#     upload-scan-results job here then uploads its Trivy SARIF to code
#     scanning (security-events: write).
#   - push: true -> reusable-docker-multiplatform-publish.yml: staging pushes,
#     smoke-test and health-check gates, manifest merge with verification,
#     provenance and Cosign signing, and the merged-digest scan.
# GitHub checks a reusable's whole permission union before any `if:` runs, so
# a caller of this facade grants the publish scopes even for push: false. A
# caller that only validates can call the validate file directly and grant
# contents: read alone. Nesting adds a segment to the check names, e.g.
# `<job> / Validate / Docker build per platform (linux/amd64)` (#1081 notes).

on:
  workflow_call:
    inputs:
      matrix:
        description: >-
          Per-platform build matrix (JSON array) produced by the classify job
          in the orchestrator. Each entry carries platform, slug, runner, qemu.
        required: true
        type: string
      artifact-prefix:
        description: >-
          Namespace for this call's validate-path Trivy SARIF artifacts
          (<prefix>-trivy-sarif-<slug>); give a second call in the same run
          its own prefix so the two calls' reports never overwrite each other
          (#1081). Must match [A-Za-z0-9_.]+ ('-' separates prefix from the
          rest of the name)
        required: false
        type: string
        default: "docker"
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      file:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        description: "Target platforms (comma-separated, for the summary)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      registry:
        description: "Container registry URL"
        required: false
        type: string
        default: "ghcr.io"
      image-name:
        description: "Image name (default: github.repository)"
        required: false
        type: string
        default: ""
      tags:
        description: "Additional tags (comma-separated)"
        required: false
        type: string
        default: ""
      version:
        description: "Version for semver tags"
        required: false
        type: string
        default: ""
      source-ref:
        description: >-
          Git ref to check out for the build context (app source), independent
          of tooling-ref. Empty uses the triggering ref.
        required: false
        type: string
        default: ""
      tag-latest:
        description: >-
          Also apply the 'latest' tag when version is set. Set false for
          historical backfills so republishing an old version does not move
          'latest' backward.
        required: false
        type: boolean
        default: true
      exact-tags:
        description: >-
          Publish ONLY the pinned version tag (and its immutable by-digest
          sha), suppressing major/minor/latest/branch/sha-<ref> floating tags.
        required: false
        type: boolean
        default: false
      push:
        description: "Push image to registry"
        required: false
        type: boolean
        default: false
      provenance:
        description: "Generate provenance attestation"
        required: false
        type: boolean
        default: true
      sbom:
        description: "Generate SBOM attestation"
        required: false
        type: boolean
        default: true
      scan:
        description: "Run vulnerability scan"
        required: false
        type: boolean
        default: false
      build-args:
        description: "Build arguments (comma-separated key=value)"
        required: false
        type: string
        default: ""
      target:
        description: "Docker build target stage (e.g. 'full', 'base')"
        required: false
        type: string
        default: ""
      smoke-test:
        description: >-
          Shorthand command + args to run inside each per-platform staging
          image. Word-split; values with spaces need smoke-test-script.
          Mutually exclusive with smoke-test-script.
        required: false
        type: string
        default: ""
      smoke-test-script:
        description: >-
          Path (relative to checkout root) to a caller-owned smoke-test script.
          Mutually exclusive with smoke-test.
        required: false
        type: string
        default: ""
      health-check-cmd:
        description: >-
          Optional command run on the runner against each staging image's
          published localhost port before merge. Requires health-check-port.
        required: false
        type: string
        default: ""
      health-check-port:
        description: "Container port to publish for the health check."
        required: false
        type: string
        default: ""
      health-check-timeout:
        description: "Max wait for health-check-port to accept connections."
        required: false
        type: string
        default: "30s"
      validate-on-pr:
        description: >-
          When true AND push is false, build per-platform on native runners
          without pushing staging images (full validation, no QEMU overhead).
        required: false
        type: boolean
        default: false
      scan-exit-code:
        description: >-
          Exit code for Trivy when findings match severity filter. "1" fails on
          CRITICAL/HIGH; "0" is advisory-only SARIF upload.
        required: false
        type: string
        default: "0"
      cache-registry-ref:
        description: >-
          Registry reference for cache fallback. Per-platform scope is appended
          automatically (-amd64, -arm64). GHA cache remains primary.
        required: false
        type: string
        default: ""
      cosign-sign:
        description: >-
          Sign the final image manifest with Sigstore Cosign (keyless OIDC).
          Requires id-token: write. Only runs when push is true.
        required: false
        type: boolean
        default: false
      no-cache:
        description: >-
          Disable build cache entirely. When true, cache-from and cache-to are
          omitted.
        required: false
        type: boolean
        default: false
      free-disk-space:
        description: >-
          Reclaim unused ubuntu-24.04 amd64 toolchains before the build
          (dotnet, Android SDK, ghc, PowerShell, unused toolcache). No-op
          when those paths are absent (e.g. ubuntu-24.04-arm). Runs only
          on github-hosted runners.
        required: false
        type: boolean
        default: false
      resource-monitor:
        description: >-
          Background a 30s memory/disk sampler that tees [resource-monitor]
          lines into the live job log and $RUNNER_TEMP. Dump the tail at
          job end when the runner survives. Start is best-effort and does
          not fail the build.
        required: false
        type: boolean
        default: false
      tooling-ref:
        # yamllint disable-line rule:line-length
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default docker). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "docker"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 60

    outputs:
      tags:
        description: "Generated image tags"
        value: ${{ jobs.publish.outputs.tags }}
      digest:
        description: "Image digest"
        value: ${{ jobs.publish.outputs.digest }}

    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false
      DOCKERHUB_USERNAME:
        required: false
        description: "Docker Hub username (for docker.io registry)"
      DOCKERHUB_TOKEN:
        required: false
        description: "Docker Hub token (for docker.io registry)"

