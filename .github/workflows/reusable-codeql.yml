---
name: Reusable CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: "CodeQL languages, comma-separated"
        required: false
        type: string
        default: ""
      build-mode:
        description: >-
          Default CodeQL build mode when language-build-modes omits a language:
          none, autobuild, or manual
        required: false
        type: string
        default: "none"
      language-build-modes:
        description: >-
          JSON object mapping language to build-mode (e.g.
          {"rust":"autobuild","actions":"none"}). Each language runs in its own
          matrix leg so mixed compiled/interpreted repos can scan without a
          single global build-mode.
        required: false
        type: string
        default: ""
      config-file:
        description: "Optional CodeQL config file path"
        required: false
        type: string
        default: ""
      category:
        description: >-
          SARIF category for results. When empty, each matrix leg uses
          /language:<language>
        required: false
        type: string
        default: ""

      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"
      job-name:
        description: "GitHub check name for CodeQL"
        required: false
        type: string
        default: "CodeQL"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 60

