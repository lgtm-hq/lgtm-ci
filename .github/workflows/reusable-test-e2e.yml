---
name: Reusable E2E Test Workflow

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      project:
        description: "Playwright project to run"
        required: false
        type: string
        default: ""
      browsers:
        description: "Browsers to test: chromium, firefox, webkit, all"
        required: false
        type: string
        default: "chromium"
      shard:
        description: 'Shard configuration (e.g., "1/3" for shard 1 of 3)'
        required: false
        type: string
        default: ""
      reporter:
        description: "Reporter to use: json, html, junit"
        required: false
        type: string
        default: "html"
      upload-report:
        description: "Upload test report as artifact"
        required: false
        type: boolean
        default: true
      report-artifact-name:
        description: >-
          Artifact name for the uploaded report. Empty resolves to
          e2e-report-<run_id>, which is distinct from
          reusable-test-e2e-playwright.yml's playwright-report-<run_id> so a
          caller can run both in one run without colliding.
        required: false
        type: string
        default: ""
      extra-args:
        description: "Additional arguments to pass to Playwright"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory for running tests"
        required: false
        type: string
        default: "."
      package-manager:
        description: "Package manager for dependency install: npm, bun, pnpm"
        required: false
        type: string
        default: "npm"
      bun-version:
        description: >-
          Bun version installed when package-manager is bun. Exact pin,
          Renovate-managed; never a floating tag (#1077).
        required: false
        type: string
        # renovate: datasource=npm depName=bun
        default: "1.4.4"

      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false
      job-name:
        description: "GitHub check name for the E2E test job"
        required: false
        type: string
        default: "E2E Tests"
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""
      draft-pr-skip:
        description: "Skip jobs on draft pull requests"
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 90
      egress-policy:
        description: "harden-runner egress policy (block only; audit rejected)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default playwright). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "playwright"

    outputs:
      tests-passed:
        description: "Number of tests passed"
        value: ${{ jobs.test.outputs.tests-passed }}
      tests-failed:
        description: "Number of tests failed"
        value: ${{ jobs.test.outputs.tests-failed }}
      passed:
        description: "Whether E2E tests passed"
        value: ${{ jobs.test.outputs.passed }}
    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false

