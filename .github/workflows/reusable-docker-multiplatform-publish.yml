---
name: Reusable Docker Build (multi-platform, publish)

# Internal publish path of the split multi-arch build (#1081), called by
# reusable-docker-multiplatform.yml when push is true. Per-platform native
# builds push staging images, then the optional per-platform smoke-test and
# health-check gates run, then the manifest merge with published-manifest
# verification, provenance attestation and Cosign signing, and finally the
# vulnerability scan of the merged digest. The write scopes (packages,
# id-token, attestations, security-events) live only in this file. The
# read-only build path is reusable-docker-multiplatform-validate.yml.
#
# Staging tag scheme (do not change): each per-platform leg pushes
# <registry>/<image>:build-<run_id>-<slug>. These are the merged index's child
# manifests and are intentionally retained; a separate pruner depends on the
# build-<run_id>-<slug> naming.

on:
  workflow_call:
    inputs:
      matrix:
        description: >-
          Per-platform build matrix (JSON array) produced by the classify job
          in the orchestrator. Each entry carries platform, slug, runner, qemu.
        required: true
        type: string
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      file:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        description: "Target platforms (comma-separated, for the summary)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      registry:
        description: "Container registry URL"
        required: false
        type: string
        default: "ghcr.io"
      image-name:
        description: "Image name (default: github.repository)"
        required: false
        type: string
        default: ""
      tags:
        description: "Additional tags (comma-separated)"
        required: false
        type: string
        default: ""
      version:
        description: "Version for semver tags"
        required: false
        type: string
        default: ""
      source-ref:
        description: >-
          Git ref to check out for the build context (app source), independent
          of tooling-ref. Empty uses the triggering ref.
        required: false
        type: string
        default: ""
      tag-latest:
        description: >-
          Also apply the 'latest' tag when version is set. Set false for
          historical backfills so republishing an old version does not move
          'latest' backward.
        required: false
        type: boolean
        default: true
      exact-tags:
        description: >-
          Publish ONLY the pinned version tag (and its immutable by-digest
          sha), suppressing major/minor/latest/branch/sha-<ref> floating tags.
        required: false
        type: boolean
        default: false
      provenance:
        description: "Generate provenance attestation"
        required: false
        type: boolean
        default: true
      sbom:
        description: "Generate SBOM attestation"
        required: false
        type: boolean
        default: true
      scan:
        description: "Run vulnerability scan"
        required: false
        type: boolean
        default: false
      build-args:
        description: "Build arguments (comma-separated key=value)"
        required: false
        type: string
        default: ""
      target:
        description: "Docker build target stage (e.g. 'full', 'base')"
        required: false
        type: string
        default: ""
      smoke-test:
        description: >-
          Shorthand command + args to run inside each per-platform staging
          image. Word-split; values with spaces need smoke-test-script.
          Mutually exclusive with smoke-test-script.
        required: false
        type: string
        default: ""
      smoke-test-script:
        description: >-
          Path (relative to checkout root) to a caller-owned smoke-test script.
          Mutually exclusive with smoke-test.
        required: false
        type: string
        default: ""
      health-check-cmd:
        description: >-
          Optional command run on the runner against each staging image's
          published localhost port before merge. Requires health-check-port.
        required: false
        type: string
        default: ""
      health-check-port:
        description: "Container port to publish for the health check."
        required: false
        type: string
        default: ""
      health-check-timeout:
        description: "Max wait for health-check-port to accept connections."
        required: false
        type: string
        default: "30s"
      scan-exit-code:
        description: >-
          Exit code for Trivy when findings match severity filter. "1" fails on
          CRITICAL/HIGH; "0" is advisory-only SARIF upload.
        required: false
        type: string
        default: "0"
      cache-registry-ref:
        description: >-
          Registry reference for cache fallback. Per-platform scope is appended
          automatically (-amd64, -arm64). GHA cache remains primary.
        required: false
        type: string
        default: ""
      cosign-sign:
        description: >-
          Sign the final image manifest with Sigstore Cosign (keyless OIDC).
          Requires id-token: write. Only runs when push is true.
        required: false
        type: boolean
        default: false
      no-cache:
        description: >-
          Disable build cache entirely. When true, cache-from and cache-to are
          omitted.
        required: false
        type: boolean
        default: false
      free-disk-space:
        description: >-
          Reclaim unused ubuntu-24.04 amd64 toolchains before the build
          (dotnet, Android SDK, ghc, PowerShell, unused toolcache). No-op
          when those paths are absent (e.g. ubuntu-24.04-arm). Runs only
          on github-hosted runners.
        required: false
        type: boolean
        default: false
      resource-monitor:
        description: >-
          Background a 30s memory/disk sampler that tees [resource-monitor]
          lines into the live job log and $RUNNER_TEMP. Dump the tail at
          job end when the runner survives. Start is best-effort and does
          not fail the build.
        required: false
        type: boolean
        default: false
      tooling-ref:
        # yamllint disable-line rule:line-length
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false
      egress-policy:
        description: "harden-runner egress policy (block only; audit rejected)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh.
          Accepted presets: docker. Any other name fails (#1623)
          (default docker). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "docker"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 60

    outputs:
      tags:
        description: "Generated image tags"
        value: ${{ jobs.merge.outputs.tags }}
      digest:
        description: "Image digest"
        value: ${{ jobs.merge.outputs.digest }}

    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false
      LGTM_CI_TOOLING_APP_CLIENT_ID:
        description: >-
          Optional client ID of a GitHub App installed on the lgtm-ci tooling
          repository only, with contents: read. Together with the App's
          private key, each job mints a short-lived token used only by the
          tooling checkouts, in place of the stored tooling token. Pass both
          App secrets or neither (#1622).
        required: false
      LGTM_CI_TOOLING_APP_PRIVATE_KEY:
        description: >-
          Optional private key of the tooling GitHub App. Pass it together
          with the App's client ID (#1622).
        required: false
      DOCKERHUB_USERNAME:
        required: false
        description: "Docker Hub username (for docker.io registry)"
      DOCKERHUB_TOKEN:
        required: false
        description: "Docker Hub token (for docker.io registry)"

env:
  # Egress presets rendered from scripts/ci/lib/egress/presets.sh by
  # scripts/ci/egress/sync-workflow-presets.sh — do not edit by hand. Every
  # harden-runner step below indexes this map by expression: the
  # step-security pre hook installs the agent before any step runs, so the
  # allowlist must be composed from literals and inputs only (#412/#420/#913).
  # lgtm-ci-egress-accepts: docker
  # lgtm-ci-egress-presets:begin
  LGTM_CI_EGRESS_PRESETS: >-
    {"docker":"github.com:443 api.github.com:443 codeload.github.com:443
    objects.githubusercontent.com:443 raw.githubusercontent.com:443
    release-assets.githubusercontent.com:443 github-releases.githubusercontent.com:443
    pipelines.actions.githubusercontent.com:443 token.actions.githubusercontent.com:443 ghcr.io:443
    pkg-containers.githubusercontent.com:443 docker.io:443 registry-1.docker.io:443 auth.docker.io:443
    production.cloudflare.docker.com:443 production.cloudfront.docker.com:443
    docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443 mirror.gcr.io:443
    fulcio.sigstore.dev:443 rekor.sigstore.dev:443 timestamp.sigstore.dev:443
    tuf-repo-cdn.sigstore.dev:443 fulcio.githubapp.com:443 timestamp.githubapp.com:443"}
  # lgtm-ci-egress-presets:end

jobs:
  # Per-platform native build leg. One matrix entry per platform; runner and
  # QEMU config resolved by the orchestrator's classify job.
  build-per-platform:
    name: Docker build per platform
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write

    env:
      # lgtm-ci-inline:begin tooling-app-flags
      # Generated from scripts/ci/bootstrap/tooling-app-flags.yml by
      # sync_inline_blocks.py: edit the source, not this copy. Inline because job
      # env: entries cannot call a script.
      # Tooling App secrets present? A step `if:` cannot read secrets (#1622).
      LGTM_CI_TOOLING_APP_ID_SET: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' }}
      LGTM_CI_TOOLING_APP_KEY_SET: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '' }}
      # lgtm-ci-inline:end tooling-app-flags

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'docker'],
            inputs.allowed-endpoints) }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT: ${{ vars.LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # Generated from scripts/ci/bootstrap/verify-harden-runner-agent.sh by
          # sync_inline_blocks.py: edit the source, not this copy. Inline because it
          # runs after harden-runner, before any checkout.
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # No exemption for GitHub Enterprise Server (owner decision): a public
              # repository there must be made internal or private to run.
              if [[ "${REPOSITORY_PRIVATE:-}" == false ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input), or make the" \
                  "repository internal or private"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          # Print the agent's own start-up errors (#1669); never changes the verdict.
          agent_errors() (
            export LC_ALL=C
            set +e +o pipefail
            if [[ ! -e "$agent_log" ]]; then
              echo "agent.log is missing; no agent start-up error to show"
              exit 0
            fi
            if [[ ! -f "$agent_log" || ! -r "$agent_log" ]]; then
              echo "agent.log is not a readable file; no agent start-up error to show"
              exit 0
            fi
            unsafe='[^[:alnum:] .,:;_=/@()+-]'
            shown=0
            while IFS= read -r line; do
              line="${line:0:512}"
              printf 'verify-harden-runner-agent: agent.log: %s\n' "${line//$unsafe/?}"
              shown=$((shown + 1))
            done < <(head -c 1048576 -- "$agent_log" 2> /dev/null |
              grep -aE -m 20 "^${stamp}(Error .*|Reverted changes)\$") 2> /dev/null
            if ((shown == 0)); then
              echo "agent.log has no agent start-up error line"
            fi
          )
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              agent_errors || true
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            agent_errors || true
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Only the standard agent is trusted (#1668): refuse harden-runner's eBPF
          # fallback agent, then require the standard agent's build info. grep exit 2
          # (unreadable log) fails closed here and below.
          if [[ ! -e "$agent_log" ]]; then
            echo "${failed}/home/agent/agent.log is missing; the agent build is unproven"
            exit 1
          fi
          agent=standard
          grep_status=0
          grep -qE "^${stamp}\[buildInfo\] name=AgentAlpha( |\$)" "$agent_log" ||
            grep_status=$?
          case "$grep_status" in
            0)
              # Opt-in (#1668): only the exact value true accepts the eBPF agent, and
              # only with its own evidence of block mode below.
              if [[ "${LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT:-}" != true ]]; then
                echo "::error title=harden-runner agent refused::harden-runner installed its" \
                  "eBPF fallback agent; only the standard agent is trusted"
                exit 1
              fi
              agent=ebpf
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          standard="^${stamp}\[buildInfo\] tag=v[0-9][^ ]* commit=[0-9a-f]{40} branch=[^ ]+ ?\$"
          ebpf="^${stamp}\[buildInfo\] name=AgentAlpha branch=[^ ]+ tag=v[0-9][^ ]*"
          ebpf+=" commit=[0-9a-f]{40}\$"
          build="$standard"
          [[ "$agent" == standard ]] || build="$ebpf"
          grep_status=0
          builds="$(grep -E "^${stamp}\[buildInfo\]" "$agent_log")" || grep_status=$?
          if ((grep_status > 1)); then
            echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
            exit 1
          fi
          if [[ -z "$builds" ]] || grep -qvE "$build" <<< "$builds"; then
            echo "${failed}agent.log does not identify the ${agent} agent; egress" \
              "enforcement is unproven"
            exit 1
          fi
          # One agent start only: exactly one build record, and it is the log's first
          # record. A log that spans two starts could lend the first start's evidence
          # to the agent now running.
          first="$(grep -m 1 -E "^${stamp}" "$agent_log")" || first=""
          if [[ "$builds" == *$'\n'* || "$builds" != "$first" ]]; then
            echo "${failed}agent.log does not start with exactly one build record of the" \
              "${agent} agent; egress enforcement is unproven"
            exit 1
          fi
          if [[ "$agent" == ebpf ]]; then
            # The eBPF agent's own evidence of block mode replaces resolved.conf, which
            # it never changes: every feature-flag line it logs has NetMode:ebpf, and
            # its tracer logs "block-policy applied", which can follow Initialized by
            # a second (fixture run 44396392356), so wait for it within 30s. Any other
            # policy line of its tracer (the v1.9.5 binary also has "deny-list
            # applied" and "failed to apply ..."), a missing piece or an unreadable log
            # fails, and the policy lines are read again after the last is-active.
            modes="$(grep -E "^${stamp}.*NetMode:" "$agent_log")" || modes=""
            if [[ -z "$modes" ]] || grep -qvE 'NetMode:ebpf[ }]' <<< "$modes"; then
              echo "${failed}the eBPF agent does not report NetMode:ebpf; egress" \
                "enforcement is unproven"
              exit 1
            fi
            policy_re="^${stamp}\[tracerManager\] ([a-z-]+-policy applied|deny-list"
            policy_re+=" applied|failed to apply )"
            block_re="^${stamp}\[tracerManager\] block-policy applied\$"
            # Print block, other, none or unreadable.
            ebpf_policy() {
              local lines status=0
              lines="$(grep -E "$policy_re" "$agent_log")" || status=$?
              if ((status > 1)); then
                echo unreadable
              elif [[ -z "$lines" ]]; then
                echo none
              elif grep -qvE "$block_re" <<< "$lines"; then
                echo other
              else
                echo block
              fi
            }
            # Succeed on block; otherwise print why and fail.
            ebpf_policy_ok() {
              case "$1" in
                block) return 0 ;;
                other)
                  echo "${failed}the eBPF agent applied a policy other than block; egress" \
                    "is not enforced"
                  ;;
                none)
                  echo "${failed}the eBPF agent did not log block-policy applied within 30s;" \
                    "egress enforcement is unproven"
                  ;;
                *)
                  echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
                  ;;
              esac
              return 1
            }
            deadline=$(($(date +%s) + 30))
            policy="$(ebpf_policy)"
            while [[ "$policy" == none ]] && (($(date +%s) < deadline)); do
              sleep 1
              policy="$(ebpf_policy)"
            done
            ebpf_policy_ok "$policy" || exit 1
            if ! systemctl is-active --quiet agent.service; then
              agent_errors || true
              echo "${failed}agent.service stopped while the eBPF agent was checked;" \
                "egress is not enforced"
              exit 1
            fi
            # A policy logged during the wait or the is-active check counts too.
            ebpf_policy_ok "$(ebpf_policy)" || exit 1
          fi
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              agent_errors || true
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          if [[ "$agent" == standard ]] &&
            ! grep -qxF 'DNS=127.0.0.1' "$root/etc/systemd/resolved.conf" 2> /dev/null; then
            echo "${failed}resolved.conf does not use the agent's DNS proxy; egress is not enforced"
            exit 1
          fi
          # The recheck steps read which agent was verified from this step's output,
          # which no later step can change.
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            printf 'agent=%s\n' "$agent" >> "$GITHUB_OUTPUT"
          fi
