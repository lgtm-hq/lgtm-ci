                exit 1
              fi
              agent=ebpf
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          standard="^${stamp}\[buildInfo\] tag=v[0-9][^ ]* commit=[0-9a-f]{40} branch=[^ ]+ ?\$"
          ebpf="^${stamp}\[buildInfo\] name=AgentAlpha branch=[^ ]+ tag=v[0-9][^ ]*"
