---
name: Reusable Node.js Custom Test Workflow

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      node-versions:
        description: "Comma-separated Node.js versions for a test matrix"
        required: false
        type: string
        default: ""
      test-command:
        description: >-
          Shell command to run after dependency install (e.g. bun run
          test:coverage). Runs in working-directory.
        required: true
        type: string
      coverage:
        description: "Whether the custom command produces coverage output"
        required: false
        type: boolean
        default: false
      upload-pages-coverage-html:
        description: "Upload flat HTML coverage artifact for Model B Pages bundling"
        required: false
        type: boolean
        default: false
      artifact-prefix:
        description: >-
          Namespace for this call's artifacts (<prefix>-coverage); give a
          second call in the same run its own prefix so the two calls'
          coverage payloads do not overwrite each other (#1091). Defaults to
          node_custom rather than node so a caller that also runs
          reusable-test-node.yml in the same run does not collide with it
          ('-' is the reserved separator, hence the underscore). Must match
          [A-Za-z0-9_.]+
        required: false
        type: string
        default: "node_custom"
      coverage-artifact-name:
        description: >-
          Artifact name for the coverage payload handed to the test-summary
          comment. Empty (the default) resolves to <artifact-prefix>-coverage,
          so a caller running this workflow more than once in a single run
          isolates it by artifact-prefix alone; set it only to pick a name
          outside that scheme. An explicitly empty value no longer suppresses
          the rich coverage comment (#1091): use coverage: false for that.
        required: false
        type: string
        default: ""
      pages-coverage-artifact-name:
        description: >-
          Artifact name for flat Node HTML coverage upload. The default matches
          reusable-test-node.yml; a caller that enables Pages coverage on both
          in one run must override one of them.
        required: false
        type: string
        default: "coverage-html"
      pages-coverage-upload-on:
        description: "When to upload flat Node HTML coverage (v1: push-main only)"
        required: false
        type: string
        default: "push-main"
      pages-coverage-source-subpath:
        description: >-
          Coverage HTML directory relative to working-directory for flat Pages
          artifact staging
        required: false
        type: string
        default: "coverage"
      working-directory:
        description: "Working directory for running tests"
        required: false
        type: string
        default: "."
      package-manager:
        description: "Package manager for dependency install: npm, bun, pnpm"
        required: false
        type: string
        default: "npm"
      pre-test-command:
        description: "Optional command to run after dependency install and before tests"
        required: false
        type: string
        default: ""
      publish-test-summary:
        description: >-
          Publish or update the test summary comment on the pull request for this workflow run (rich
          coverage table per matrix cell when coverage is enabled)
        required: false
        type: boolean
        default: true
      comment-marker:
        description: "Unique marker for upserting this workflow's test summary comment"
        required: false
        type: string
        default: "node-coverage-report"
      job-name:
        description: "GitHub check name for the test job"
        required: false
        type: string
        default: "Node.js Tests"
      coverage-summary-file:
        description: >-
          Coverage summary path relative to working-directory for the coverage test summary
          comments (Istanbul JSON)
        required: false
        type: string
        default: "coverage/coverage-summary.json"
      draft-pr-skip:
        description: "Skip jobs on draft pull requests"
        required: false
        type: boolean
        default: true
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default quality). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "quality"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Timeout for test jobs in minutes"
        required: false
        type: number
        default: 60

    outputs:
      passed:
        description: "Whether every matrix test leg succeeded"
        value: ${{ jobs.aggregate-tests.outputs.passed == 'true' }}
      pages-coverage-artifact-name:
        description: "Resolved flat HTML coverage artifact name"
        value: ${{ inputs.pages-coverage-artifact-name }}
      pages-coverage-uploaded:
        description: "Whether flat HTML coverage artifact was uploaded this run"
        value: ${{ jobs.pages-coverage-status.outputs.pages-coverage-uploaded || 'false' }}

