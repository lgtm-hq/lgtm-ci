---
name: Reusable - Main Failure Notifier

# Surfaces main-branch workflow failures as deduplicated GitHub issues so
# they stay visible without a human watching Actions between auto-merges.
# Call from a failure-gated job in any main-branch workflow:
#
#   notify-failure:
#     needs: [build]
#     if: failure() && github.ref == 'refs/heads/main'
#     uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@<sha>
#     with:
#       workflow-key: docker-publish
#     permissions:
#       actions: read
#       contents: read
#       issues: write
#
# Same dedup'd-issue mechanism as the release workflows (one open issue per
# workflow key + branch; repeat failures comment on it). Companion convention:
# main red = disarm pending auto-merges until a fix-forward PR lands.

"on":
  workflow_call:
    inputs:
      workflow-key:
        description: >-
          Stable key namespacing the dedup marker and issue title
          (e.g. docker-publish, pages-deploy, dogfood-lint)
        required: true
        type: string
      failure-issue-labels:
        description: Comma-separated labels for auto-opened failure issues
        required: false
        type: string
        default: "bug,ci,automation"
      failure-target-branch:
        description: >-
          Branch name for failure notifications. Empty uses the repository
          default branch.
        required: false
        type: string
        default: ""
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: Timeout for the notifier job
        required: false
        type: number
        default: 10
      egress-policy:
        description: Egress policy for harden-runner (audit or block)
        required: false
        type: string
        default: block
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false
    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false

permissions:
  contents: read

