        with:
          client-id: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
          private-key: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
          owner: ${{ steps.tooling-app-target.outputs.owner }}
          repositories: ${{ steps.tooling-app-target.outputs.repository }}
          permission-contents: read
