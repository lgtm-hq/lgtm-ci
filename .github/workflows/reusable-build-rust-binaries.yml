  # lgtm-ci-egress-presets:end

jobs:
  build:
    name: "Rust binaries (${{ matrix.target }})"
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Read repository contents for checkout and build
      contents: read
      # OIDC token issuance for Sigstore authentication during attestation
      id-token: write
      # Publish build provenance attestations (Attest build provenance step)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{
            fromJson(
              inputs.targets != '' && inputs.targets ||
              '[
                {"target":"x86_64-unknown-linux-musl","builder":"native","archive":"tar.gz"},
                {"target":"aarch64-unknown-linux-gnu","builder":"cross","archive":"tar.gz"},
                {"target":"x86_64-pc-windows-msvc","builder":"xwin","archive":"zip"}
              ]'
            )
          }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'rust-release'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'rust-release'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Warn on explicit tooling-ref override
        # hashFiles guards callers that pin a tooling-ref predating the script.
        if: >-
          inputs.tooling-ref != ''
          && hashFiles('.lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh') != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh
      - name: Validate runner policy
        id: policy
        uses: ./.lgtm-ci-tooling/.github/actions/validate-runner-policy
        with:
          tier: strict
          egress-policy: ${{ inputs.egress-policy }}
          runner-environment: ${{ runner.environment }}
          runner-os: ${{ runner.os }}
      - name: Setup Rust
        uses: ./.lgtm-ci-tooling/.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          # cargo-xwin needs llvm-tools for assembly-heavy dependencies.
          components: ${{ matrix.builder == 'xwin' && 'llvm-tools' || '' }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        # The legacy key may arrive as the boolean true or the string "true".
        if: matrix.builder == 'cross' || (!matrix.builder && (matrix.cross == true || matrix.cross == 'true'))
        shell: bash
        run: bash .lgtm-ci-tooling/scripts/ci/release/install-cross.sh
      - name: Install cargo-xwin
        id: xwin
        if: matrix.builder == 'xwin'
        shell: bash
        run: bash .lgtm-ci-tooling/scripts/ci/release/install-cargo-xwin.sh
      - name: Cache the xwin Windows SDK and CRT
        # Keyed on the cargo-xwin pin alone, so unrelated versions.env bumps
        # keep the SDK cache. cargo-xwin never writes here at install time.
        if: matrix.builder == 'xwin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-${{ matrix.target }}-${{ steps.xwin.outputs.version }}
      - name: Build release binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PACKAGES: ${{ inputs.packages }}
          BUILDER: ${{ matrix.builder }}
          # Legacy signal for caller build-script overrides: true whenever the
          # effective builder is cross, whichever key selected it.
          # yamllint disable-line rule:line-length
          USE_CROSS: ${{ matrix.builder == 'cross' || (!matrix.builder && (matrix.cross == true || matrix.cross == 'true')) }}
          RAW_SCRIPT_PATH: ${{ inputs.build-script }}
          DEFAULT_SCRIPT_PATH: .lgtm-ci-tooling/scripts/ci/release/build-rust-binary.sh
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-caller-script.sh
      - name: Read Cargo version
        id: version
        shell: bash
        env:
          VERSION_FILE: ${{ inputs.version-file }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/read-cargo-version.sh
      - name: Package release binaries
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          PACKAGES: ${{ inputs.packages }}
          BINARY_NAMES: ${{ inputs.binary-names }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
          RAW_SCRIPT_PATH: ${{ inputs.package-script }}
          DEFAULT_SCRIPT_PATH: .lgtm-ci-tooling/scripts/ci/release/package-rust-binary.sh
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-caller-script.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *.tar.gz
            *.zip
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            ${{ inputs.artifact-prefix != '' && inputs.artifact-prefix ||
            github.event.repository.name }}-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          # Release binaries are this job's verdict, so no continue-on-error —
          # overwrite only, so a repeated call in one run publishes its latest
          # build instead of 409ing.
          overwrite: true
