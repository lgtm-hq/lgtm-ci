# SPDX-License-Identifier: MIT
---
name: Reusable Rust Binary Build Workflow

on:
  workflow_call:
    inputs:
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        default: ""
        type: string
      packages:
        description: "Comma-separated Cargo package names to build"
        required: true
        type: string
      binary-names:
        description: >-
          Optional comma-separated binary names parallel to packages (defaults
          via cargo metadata)
        required: false
        type: string
        default: ""
      targets:
        description: >-
          JSON matrix override: array of {target, builder, archive} objects
          where builder is native (cargo), cross, or xwin (cargo-xwin, MSVC
          targets only); the legacy cross:true key still selects cross.
          cross with an *-msvc target is rejected before the build (#1076).
          Defaults to Linux musl (native) + aarch64 gnu (cross) + Windows MSVC (xwin).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (block only; audit rejected)"
        required: false
        type: string
        default: "block"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default rust-release). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "rust-release"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          append (default): egress-preset plus allowed-endpoints; replace:
          non-empty allowed-endpoints is used instead of egress-preset
        required: false
        type: string
        default: "append"
      build-script:
        description: "Override path to build script"
        required: false
        type: string
        default: ""
      package-script:
        description: "Override path to packaging script"
        required: false
        type: string
        default: ""
      artifact-prefix:
        description: "Artifact name prefix (defaults to repository name)"
        required: false
        type: string
        default: ""
      retention-days:
        description: >-
          Days to retain build artifacts. Defaults to the 90-day recovery
          window from the release-security policy so a tier-2 resume stays
          possible without caller action.
        required: false
        type: number
        default: 90
      runner-image:
        description: "GitHub-hosted runner image (Linux only for strict tier)"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 45
      version-file:
        description: "Cargo.toml path for version reads"
        required: false
        type: string
        default: "Cargo.toml"
      concurrency-scope:
        description: >-
          Optional suffix for the concurrency group. The group is namespaced
          by callee, caller repository, caller workflow and ref, so two caller
          workflows on one ref never cancel each other (#1076, #108 history);
          set this when one caller workflow invokes this reusable twice.
        required: false
        type: string
        default: ""

    outputs:
      version:
        description: "Cargo workspace version"
        value: ${{ jobs.build.outputs.version }}

# Queued, never cancelled: release legs must finish. Namespaced by callee,
# caller repository and caller workflow as well as the ref (#1076).
# yamllint disable rule:line-length
concurrency:
  group: >-
    lgtm-ci-rust-binaries-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ inputs.concurrency-scope || 'default' }}
  cancel-in-progress: false
# yamllint enable rule:line-length

