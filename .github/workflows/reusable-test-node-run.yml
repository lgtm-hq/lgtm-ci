jobs:
  prepare:
    name: Prepare Node Matrix
    runs-on: ${{ inputs.runner-image }}
    # Independent short cap: the caller's timeout-minutes bounds the main
    # test job; this coordinator leg keeps its own fixed cap.
    timeout-minutes: 10
    if: >-
      !inputs.draft-pr-skip ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      matrix-count: ${{ steps.matrix.outputs.matrix-count }}
      pages-coverage-node-version: ${{ steps.matrix.outputs.pages-coverage-node-version }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      - name: Validate compat/coverage contract
        shell: bash
        env:
          MULTI_VERSIONS: ${{ inputs.node-versions }}
          COVERAGE: ${{ inputs.coverage }}
          PLATFORM: Node.js
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/validate-test-compat-coverage-contract.sh
      # Every job below depends on prepare, so an invalid prefix fails before
      # any upload or download glob uses it (#1091).
      - name: Validate artifact prefix
        shell: bash
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/validate-artifact-prefix.sh
      - name: Generate Node.js matrix
        id: matrix
        shell: bash
        env:
          MATRIX_KEY: node-version
          MATRIX_LABEL: Node.js
          DEFAULT_VERSION: ${{ inputs.node-version || '22' }}
          VERSIONS_INPUT: ${{ inputs.node-versions }}
          FIRST_VERSION_OUTPUT: pages-coverage-node-version
        run: bash .lgtm-ci-tooling/scripts/ci/actions/generate-version-matrix.sh
  test-vitest:
    name: ${{ inputs.job-name }}
    needs: prepare
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: >-
      !inputs.draft-pr-skip ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    outputs:
      tests-passed: ${{ steps.parse.outputs.tests-passed }}
      tests-failed: ${{ steps.parse.outputs.tests-failed }}
      tests-total: ${{ steps.parse.outputs.tests-total }}
      coverage-percent: ${{ steps.parse.outputs.coverage-percent }}
      passed: ${{ steps.run.outputs.exit-code == '0' }}
      pages-upload-outcome: ${{ steps.record-pages-upload-outcome.outputs.outcome }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            .github/actions/
            schemas/
            scripts/ci/
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.2"
      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The pnpm version comes from the project's `packageManager` field;
          # the action reads the repo-root package.json unless told otherwise.
          package_json_file: >-
            ${{ format('{0}/package.json', inputs.working-directory) }}
      - name: Get bun cache directory
        if: inputs.package-manager == 'bun'
        id: bun-cache
        shell: bash
        env:
          STEP: bun-cache
        run: bash .lgtm-ci-tooling/scripts/ci/actions/setup-node.sh
      - name: Cache bun dependencies
        if: inputs.package-manager == 'bun'
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.bun-cache.outputs.dir }}
            ${{ inputs.working-directory }}/node_modules
          # yamllint disable-line rule:line-length
          key: bun-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ matrix.node-version }}-
            bun-${{ runner.os }}-
      - name: Install dependencies
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          FROZEN_LOCKFILE: "true"
        run: bash .lgtm-ci-tooling/scripts/ci/actions/setup-package-manager.sh
      - name: Run pre-test command
        if: inputs.pre-test-command != ''
        shell: bash
        env:
          COMMAND: ${{ inputs.pre-test-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-command.sh
      - name: Upload build artifact
        if: inputs.upload-build-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Namespaced by artifact-prefix (#1091); the version suffix
          # separates matrix legs.
          name: ${{ inputs.artifact-prefix }}-build-${{ matrix.node-version }}
          path: ${{ inputs.working-directory }}/${{ inputs.build-artifact-path }}
          retention-days: 7
          if-no-files-found: error
          # Build output is part of the job verdict, so no continue-on-error —
          # overwrite only, so a rerun of this same call's leg replaces its
          # earlier build instead of 409ing. Isolation between calls comes
          # from artifact-prefix, never from overwrite (#728/#752).
          overwrite: true
      - name: Setup vitest
        shell: bash
        env:
          STEP: setup
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          COVERAGE: ${{ inputs.coverage }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-vitest.sh
      - name: Run vitest
        id: run
        shell: bash
        env:
          STEP: run
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          TEST_PATH: ${{ inputs.test-path }}
          COVERAGE: ${{ inputs.coverage }}
          COVERAGE_FORMAT: ${{ inputs.coverage-format }}
          EXTRA_ARGS: ${{ inputs.extra-args }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-vitest.sh
        continue-on-error: true
      - name: Run post-test command
        id: post-test
        if: inputs.post-test-command != ''
        shell: bash
        env:
          COMMAND: ${{ inputs.post-test-command }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-command.sh
      # Native report -> results/vitest/<version>/results.json (results.v1,
      # #1080); every tests-* / coverage-percent output is read back from it.
      - name: Parse results
        id: parse
        if: always()
        shell: bash
        env:
          STEP: parse
          RESULTS_FILE: ${{ inputs.working-directory }}/vitest-results.json
          COVERAGE_FILE: ${{ inputs.working-directory }}/coverage/coverage-summary.json
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
          MATRIX_KEY: node-version
          MATRIX_VALUE: ${{ matrix.node-version }}
          RESULTS_SOURCE_VERSION: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-vitest.sh
      - name: Generate summary
        if: always()
        shell: bash
        env:
          STEP: summary
          RESULTS_FILE: ${{ steps.parse.outputs.results-json }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-vitest.sh
      - name: Check coverage threshold
        id: coverage-gate
        if: inputs.coverage && inputs.coverage-threshold > 0
        uses: ./.lgtm-ci-tooling/.github/actions/check-coverage-threshold
        with:
          coverage-percent: ${{ steps.parse.outputs.coverage-percent }}
          threshold: ${{ inputs.coverage-threshold }}
      # A gate that fails after the parser wrote the document must reach the
      # document too, or the uploaded artifact would carry a false "passed".
      - name: Record gate verdict in results
        if: always() && (steps.coverage-gate.outcome == 'failure' || steps.post-test.outcome == 'failure')
        shell: bash
        env:
          RESULTS_FILE: ${{ steps.parse.outputs.results-json }}
          STATUS: failed
        run: bash .lgtm-ci-tooling/scripts/ci/actions/results-update.sh
      - name: Upload matrix test summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Namespaced by artifact-prefix so two calls in one run keep their
          # own summaries (#1091); the version suffix separates matrix legs.
          name: ${{ inputs.artifact-prefix }}-results-${{ matrix.node-version }}
          path: results/vitest/${{ matrix.node-version }}/results.json
          retention-days: 7
          if-no-files-found: error
          # The aggregate job's verdict reads this summary, so no
          # continue-on-error — overwrite only, so a rerun of this same
          # call's leg replaces its earlier attempt. Isolation between calls
          # comes from artifact-prefix, never from overwrite (#728/#752).
          overwrite: true
      - name: Stage coverage for test summary
        if: >-
          always()
          && inputs.coverage
          && inputs.publish-test-summary
          && inputs.node-versions == ''
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          COVERAGE_SUMMARY_FILE: ${{ inputs.coverage-summary-file }}
          COVERAGE: ${{ inputs.coverage }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/stage-node-coverage-test-summary.sh
      # Convenience payload for the test-summary comment, never the test
      # verdict — the publisher downloads it with continue-on-error and skips
      # the rich comment when it is absent.
      - name: Upload coverage for test summary
        id: upload-summary-coverage
        if: >-
          always()
          && inputs.coverage
          && inputs.publish-test-summary
          && inputs.node-versions == ''
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Explicit coverage-artifact-name, else <artifact-prefix>-coverage;
          # the facade's publish-test-summary job resolves the same expression (#1091).
          name: >-
            ${{ inputs.coverage-artifact-name != '' && inputs.coverage-artifact-name
            || format('{0}-coverage', inputs.artifact-prefix) }}
          path: node-coverage-staged/
          retention-days: 7
          if-no-files-found: ignore
          # overwrite only covers a rerun of this same call replacing its
          # earlier attempt. Isolation between calls comes from
          # artifact-prefix, never from overwrite (#728/#752).
          overwrite: true
      - name: Warn on failed summary coverage upload
        if: always() && steps.upload-summary-coverage.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Summary coverage upload failed; the test result is unaffected."
      - name: Stage coverage report
        if: always() && inputs.upload-coverage && inputs.coverage
        shell: bash
        env:
          NODE_VERSION: ${{ matrix.node-version }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/stage-node-coverage.sh
      - name: Upload coverage report
        if: always() && inputs.upload-coverage && inputs.coverage
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Namespaced by artifact-prefix (#1091); the version suffix
          # separates matrix legs.
          name: ${{ inputs.artifact-prefix }}-coverage-${{ matrix.node-version }}
          path: node-coverage-${{ matrix.node-version }}/
          retention-days: 7
          if-no-files-found: ignore
          # Feeds the coverage publish path (pattern <artifact-prefix>-coverage-*),
          # so no continue-on-error — overwrite only, for a rerun of this same
          # call's leg. Isolation between calls comes from artifact-prefix,
          # never from overwrite (#728/#752).
          overwrite: true
      - name: Evaluate pages coverage upload gate
        id: pages-upload-gate
        if: always() && inputs.upload-pages-coverage-html && inputs.coverage
        shell: bash
        env:
          PAGES_COVERAGE_UPLOAD_ON: ${{ inputs.pages-coverage-upload-on }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/pages-coverage-upload-gate.sh
      - name: Stage pages coverage HTML
        id: stage-pages-coverage
        if: >-
          always()
          && inputs.upload-pages-coverage-html
          && inputs.coverage
          && matrix.node-version == needs.prepare.outputs.pages-coverage-node-version
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PAGES_COVERAGE_SOURCE_SUBPATH: ${{ inputs.pages-coverage-source-subpath }}
          PAGES_COVERAGE_STAGING_DIR: ${{ inputs.pages-coverage-artifact-name }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/stage-node-pages-coverage.sh
      - name: Upload pages coverage HTML artifact
        id: pages-upload
        if: >-
          always()
          && inputs.upload-pages-coverage-html
          && inputs.coverage
          && matrix.node-version == needs.prepare.outputs.pages-coverage-node-version
          && steps.pages-upload-gate.outputs.should-upload == 'true'
          && steps.stage-pages-coverage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.pages-coverage-artifact-name }}
          path: ${{ inputs.pages-coverage-artifact-name }}/
          retention-days: 7
          if-no-files-found: error
          # This upload's outcome is recorded and gates the Pages bundle, so it
          # keeps its own failure semantics — overwrite only.
          overwrite: true
      - name: Record pages upload outcome
        if: >-
          always()
          && matrix.node-version == needs.prepare.outputs.pages-coverage-node-version
        id: record-pages-upload-outcome
        shell: bash
        env:
          PAGES_UPLOAD_OUTCOME: ${{ steps.pages-upload.outcome }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/record-pages-upload-outcome.sh
      - name: Fail on vitest errors
        if: >-
          steps.run.outputs.exit-code != ''
          && steps.run.outputs.exit-code != '0'
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/fail-with-exit-code.sh
  pages-coverage-status:
    name: Pages coverage upload status
    needs:
      - prepare
      - test-vitest
    if: >-
      always()
      && inputs.upload-pages-coverage-html
      && inputs.coverage
    runs-on: ${{ inputs.runner-image }}
    # Independent short cap: the caller's timeout-minutes bounds the main
    # test job; this coordinator leg keeps its own fixed cap.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pages-coverage-uploaded: ${{ steps.record.outputs.uploaded }}
    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      - name: Download pages coverage artifact
        id: download-pages-coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.pages-coverage-artifact-name }}
          path: pages-coverage-html
      - name: Record pages coverage upload status
        id: record
        shell: bash
        env:
          UPLOAD_PAGES_COVERAGE_HTML: ${{ inputs.upload-pages-coverage-html }}
          COVERAGE: ${{ inputs.coverage }}
          PAGES_COVERAGE_ARTIFACT_DIR: pages-coverage-html
          PAGES_UPLOAD_OUTCOME: ${{ needs.test-vitest.outputs.pages-upload-outcome }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/record-pages-coverage-upload-status.sh
  aggregate-tests:
    name: Aggregate Node.js Results
    needs:
      - prepare
      - test-vitest
    if: >-
      always()
      && (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ${{ inputs.runner-image }}
    # Independent short cap: the caller's timeout-minutes bounds the main
    # test job; this coordinator leg keeps its own fixed cap.
    timeout-minutes: 10
    permissions:
      # `actions: read` is the one scope the REST artifact listing accepts
      # from GITHUB_TOKEN. The pre-aggregation availability wait (#803) polls
      # `GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts` so a leg
      # whose upload succeeded but is not yet listed does not fail the
      # aggregate. A reusable workflow's request is validated statically, so
      # every caller must grant `actions: read` on this call (documented in
      # docs/reusable-workflows.md); it was deliberately absent before #803
      # (#730), when the job only used the runtime-token download action.
      actions: read
      contents: read
    outputs:
      tests-passed: ${{ steps.aggregate.outputs.tests-passed }}
      tests-failed: ${{ steps.aggregate.outputs.tests-failed }}
      tests-total: ${{ steps.aggregate.outputs.tests-total }}
      coverage-percent: ${{ steps.aggregate.outputs.coverage-percent }}
      passed: ${{ needs.test-vitest.result == 'success' && steps.aggregate.outputs.passed == 'true' }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'quality'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Fail if matrix preparation did not succeed
        # A failed or cancelled prepare skips the matrix; failing here keeps
        # the required check from reporting a skip, which rulesets treat as a pass.
        if: needs.prepare.result != 'success'
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          echo "::error::Matrix preparation concluded '${PREPARE_RESULT}'; failing the check."
          exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            schemas/
            scripts/ci/
      # Bounded availability wait, then download (#803): the artifact listing
      # is eventually consistent, so a one-shot download can miss a leg whose
      # upload already succeeded. Only under-counts and 404s on a listed id are
      # retried; an over-count fails at once as sibling contamination (#752).
      - name: Wait for and download matrix results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_DIR: node-results
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          MATRIX_KEY: node-version
          EXPECTED_COUNT: ${{ needs.prepare.outputs.matrix-count }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          # A leg that was cancelled or crashed before uploading never shows
          # up; the aggregate still fails closed, so do not spend the full
          # budget waiting for it.
          WAIT_BUDGET_SECONDS: ${{ needs.test-vitest.result == 'success' && '90' || '10' }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/wait-for-artifacts.sh
          "$EXPECTED_COUNT" "${ARTIFACT_PREFIX}-results-*"
      - name: Aggregate matrix results
        id: aggregate
        shell: bash
        env:
          RESULTS_DIR: node-results
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/aggregate-results.sh
      - name: Fail if any matrix leg failed
        # Fail closed (#1058): rulesets require this context directly, so a
        # failing matrix leg must fail the job, not just set `passed=false`.
        if: >-
          always()
          && (needs.test-vitest.result != 'success' || steps.aggregate.outputs.passed != 'true')
        shell: bash
        run: |
          echo "::error::A matrix test leg failed or its results could not be aggregated; failing the check."
          exit 1
