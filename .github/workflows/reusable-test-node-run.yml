# GENERATED by scripts/ci/workflows/sync-readonly-variants.sh from
# reusable-test-node.yml — do not edit. Edit the facade, then re-run the script.
#
# Read-only variant (#1081): the facade's jobs without its mutation jobs, so
# the permission union a caller must grant holds no write scope. Job ids and
# names match the facade, so check names under the caller's job id do too.
# Results stay in this call's artifacts (results.v1, #1080); see
# docs/reusable-workflows.md "Read-only variants" to publish them separately.
---
name: Reusable Node.js Vitest Test Workflow (read-only)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      node-versions:
        description: "Comma-separated Node.js versions for a test matrix"
        required: false
        type: string
        default: ""
      test-path:
        description: "Path to test files or directory"
        required: false
        type: string
        default: "."
      coverage:
        description: "Whether to collect coverage"
        required: false
        type: boolean
        default: false
      coverage-format:
        description: "Coverage output format: json, lcov, html"
        required: false
        type: string
        default: "json"
      coverage-threshold:
        description: "Minimum coverage percentage to pass"
        required: false
        type: number
        default: 0
      upload-coverage:
        description: "Upload coverage report as artifact"
        required: false
        type: boolean
        default: false
      upload-pages-coverage-html:
        description: "Upload flat HTML coverage artifact for Model B Pages bundling"
        required: false
        type: boolean
        default: false
      artifact-prefix:
        description: >-
          Namespace for this call's artifacts (<prefix>-coverage,
          <prefix>-coverage-<version>, <prefix>-results-<version>,
          <prefix>-build-<version>); give a second call in the same run its
          own prefix so the two calls' coverage and result summaries do not
          overwrite each other (#1091). Must match [A-Za-z0-9_.]+ ('-'
          separates prefix from the rest of the name)
        required: false
        type: string
        default: "node"
      coverage-artifact-name:
        description: >-
          Artifact name for the coverage payload handed to the test-summary
          comment. Empty (the default) resolves to <artifact-prefix>-coverage,
          so a caller running this workflow more than once in a single run
          isolates it by artifact-prefix alone; set it only to pick a name
          outside that scheme. An explicitly empty value no longer suppresses
          the rich coverage comment (#1091): use coverage: false for that.
        required: false
        type: string
        default: ""
      pages-coverage-artifact-name:
        description: >-
          Artifact name for flat Node HTML coverage upload. The default matches
          reusable-test-node-custom.yml; a caller that enables Pages coverage
          on both in one run must override one of them.
        required: false
        type: string
        default: "coverage-html"
      pages-coverage-upload-on:
        description: "When to upload flat Node HTML coverage (v1: push-main only)"
        required: false
        type: string
        default: "push-main"
      pages-coverage-source-subpath:
        description: >-
          Coverage HTML directory relative to working-directory for flat Pages
          artifact staging
        required: false
        type: string
        default: "coverage"
      extra-args:
        description: "Additional arguments to pass to vitest"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory for running tests"
        required: false
        type: string
        default: "."
      package-manager:
        description: "Package manager for dependency install: npm, bun, pnpm"
        required: false
        type: string
        default: "npm"
      pre-test-command:
        description: "Optional command to run after dependency install and before tests"
        required: false
        type: string
        default: ""
      post-test-command:
        description: >-
          Optional command to run in working-directory right after vitest,
          before results are parsed; runs whether or not the tests passed, and
          a non-zero exit fails the job (e.g. a clean-tree assertion, #1077).
        required: false
        type: string
        default: ""
      upload-build-artifact:
        description: "Upload a build artifact after the pre-test command"
        required: false
        type: boolean
        default: false
      build-artifact-path:
        description: "Path to upload when upload-build-artifact is true"
        required: false
        type: string
        default: "dist"
      publish-test-summary:
        description: >-
          Stage the PR test summary's coverage payload (pull_request runs,
          single-version, coverage on) and, in reusable-test-node.yml, publish
          or update the comment (rich coverage table when coverage is
          enabled). The read-only variant has no publish job and does not
          reject a node-versions matrix for this input.
        required: false
        type: boolean
        default: true
      job-name:
        description: "GitHub check name for the test job"
        required: false
        type: string
        default: "Node.js Tests"
      coverage-summary-file:
        description: >-
          Coverage summary path relative to working-directory for the coverage test summary
          comments (Istanbul JSON)
        required: false
        type: string
        default: "coverage/coverage-summary.json"
      draft-pr-skip:
        description: "Skip jobs on draft pull requests"
        required: false
        type: boolean
        default: true
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default quality). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "quality"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Timeout for test jobs in minutes"
        required: false
        type: number
        default: 60

    outputs:
      tests-passed:
        description: "Number of tests passed"
        value: ${{ jobs.aggregate-tests.outputs.tests-passed }}
      tests-failed:
        description: "Number of tests failed"
        value: ${{ jobs.aggregate-tests.outputs.tests-failed }}
      tests-total:
        description: "Total number of tests"
        value: ${{ jobs.aggregate-tests.outputs.tests-total }}
      coverage-percent:
        description: "Coverage percentage"
        value: ${{ jobs.aggregate-tests.outputs.coverage-percent }}
      passed:
        description: "Whether all tests passed"
        value: ${{ jobs.aggregate-tests.outputs.passed }}
      pages-coverage-artifact-name:
        description: "Resolved flat HTML coverage artifact name"
        value: ${{ inputs.pages-coverage-artifact-name }}
      pages-coverage-uploaded:
        description: "Whether flat HTML coverage artifact was uploaded this run"
        value: ${{ jobs.pages-coverage-status.outputs.pages-coverage-uploaded || 'false' }}

