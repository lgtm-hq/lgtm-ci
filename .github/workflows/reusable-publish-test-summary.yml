  # lgtm-ci-egress-presets:end

jobs:
  publish-test-summary:
    name: Publish test summary
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-minimal'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-minimal'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
          sparse-checkout-extra: |
            .github/actions/generate-coverage-comment
            schemas/
            scripts/ci/
      - name: Validate rich coverage inputs
        if: >-
          inputs.rich-coverage-comment && inputs.prebuilt-test-summary-file == ''
          && inputs.coverage-artifact-name != ''
        shell: bash
        env:
          COVERAGE_FILE: ${{ inputs.coverage-file }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/validate-rich-coverage-inputs.sh
      - name: Download coverage artifact
        id: download-coverage
        if: >-
          inputs.coverage-artifact-name != '' && inputs.prebuilt-test-summary-file == ''
          && inputs.rich-coverage-comment
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: coverage-test-summary
      - name: Generate rich coverage summary
        id: rich-coverage
        if: >-
          inputs.prebuilt-test-summary-file == '' && inputs.rich-coverage-comment &&
          inputs.coverage-file != '' && inputs.coverage-artifact-name != '' &&
          steps.download-coverage.conclusion == 'success'
        uses: ./.lgtm-ci-tooling/.github/actions/generate-coverage-comment
        with:
          coverage-file: >-
            ${{ format('coverage-test-summary/{0}', inputs.coverage-file) }}
          format: ${{ inputs.coverage-format }}
          threshold-lines: "0"
          threshold-branches: "0"
          threshold-functions: "0"
          test-suite-name: ${{ inputs.test-suite-name }}
      # results.v1 documents (#1080): the only test data the totals summary
      # reads when results-artifact-pattern is set. A missing or malformed
      # document fails this job instead of posting an empty comment.
      - name: Download results documents
        if: >-
          inputs.results-artifact-pattern != '' && inputs.prebuilt-test-summary-file == '' && (
          !inputs.rich-coverage-comment || inputs.coverage-artifact-name == '' ||
          steps.download-coverage.conclusion != 'success')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.results-artifact-pattern }}
          path: results-download
          merge-multiple: false
      - name: Generate test run summary
        id: generate-test-summary
        if: >-
          inputs.prebuilt-test-summary-file == '' && (
          !inputs.rich-coverage-comment || inputs.coverage-artifact-name == '' ||
          steps.download-coverage.conclusion != 'success')
        shell: bash
        env:
          RESULTS_DIR: ${{ inputs.results-artifact-pattern != '' && 'results-download' || '' }}
          EXPECTED_COUNT: ${{ inputs.results-expected-count }}
          TESTS_TOTAL_EXCLUDES_SKIPPED: ${{ inputs.tests-total-excludes-skipped }}
          TEST_SUITE_NAME: ${{ inputs.test-suite-name }}
          TESTS_PASSED: ${{ inputs.tests-passed }}
          TESTS_FAILED: ${{ inputs.tests-failed }}
          TESTS_TOTAL: ${{ inputs.tests-total }}
          COVERAGE_ENABLED: ${{ inputs.coverage-enabled }}
          COVERAGE_PERCENT: ${{ inputs.coverage-percent }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          JOB_RESULT: ${{ inputs.job-result }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          COMMENT_OUTPUT: test-summary.md
        run: bash .lgtm-ci-tooling/scripts/ci/actions/render-test-summary.sh
      - name: Detect PR number
        id: pr
        shell: bash
        env:
          STEP: pr-number
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ""
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/post-pr-comment.sh
      - name: Load test summary body
        id: read
        if: >-
          inputs.prebuilt-test-summary-file != '' ||
          steps.generate-test-summary.outcome == 'success'
        shell: bash
        env:
          STEP: read-file
          COMMENT_FILE: >-
            ${{ inputs.prebuilt-test-summary-file != '' && inputs.prebuilt-test-summary-file
            || 'test-summary.md' }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/post-pr-comment.sh
      - name: Publish test summary from file
        if: >-
          inputs.prebuilt-test-summary-file != '' ||
          steps.generate-test-summary.outcome == 'success'
        shell: bash
        env:
          STEP: post
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MARKER: ${{ inputs.comment-marker }}
          MODE: upsert
          DELETE_ON_EMPTY: "false"
          FILE_PROVIDED: ${{ steps.read.outputs.file_provided }}
          BODY_FROM_FILE: ${{ steps.read.outputs.body }}
          BODY_FROM_INPUT: ""
          HISTORY: ${{ inputs.comment-history }}
          HISTORY_LIMIT: ${{ inputs.comment-history-limit }}
          HISTORY_SUMMARY: ${{ steps.generate-test-summary.outputs.history-summary }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/post-pr-comment.sh
      - name: Publish test summary from coverage table
        if: steps.rich-coverage.outcome == 'success'
        shell: bash
        env:
          STEP: post
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MARKER: ${{ inputs.comment-marker }}
          MODE: upsert
          DELETE_ON_EMPTY: "false"
          FILE_PROVIDED: "false"
          BODY_FROM_FILE: ""
          BODY_FROM_INPUT: ${{ steps.rich-coverage.outputs.comment-body }}
          HISTORY: ${{ inputs.comment-history }}
          HISTORY_LIMIT: ${{ inputs.comment-history-limit }}
          HISTORY_SUMMARY: >-
            ${{ steps.rich-coverage.outputs.lines-coverage != ''
            && format('{0}% line coverage', steps.rich-coverage.outputs.lines-coverage) || '' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/post-pr-comment.sh
