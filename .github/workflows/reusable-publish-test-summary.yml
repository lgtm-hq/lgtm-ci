---
name: Reusable Publish Test Summary Workflow

on:
  workflow_call:
    inputs:
      test-suite-name:
        description: "Display name for the test suite report"
        required: true
        type: string
      comment-marker:
        description: "Unique marker for upserting this workflow's test summary comment"
        required: true
        type: string
      tests-passed:
        description: "Number of tests passed"
        required: false
        type: string
        default: "0"
      tests-failed:
        description: "Number of tests failed"
        required: false
        type: string
        default: "0"
      tests-total:
        description: "Total number of tests"
        required: false
        type: string
        default: "0"
      coverage-percent:
        description: "Coverage percentage (test-summary fallback)"
        required: false
        type: string
        default: ""
      results-artifact-pattern:
        description: >-
          Artifact name or glob of the results.v1 documents (#1080) to render
          the summary from, e.g. <artifact-prefix>-results-*. When set, the
          tests-passed / tests-failed / tests-total / coverage-percent inputs
          are ignored and the comment is rendered from results.json alone.
        required: false
        type: string
        default: ""
      results-expected-count:
        description: >-
          Number of results.v1 legs results-artifact-pattern must yield
          (empty: any non-zero number)
        required: false
        type: string
        default: ""
      tests-total-excludes-skipped:
        description: >-
          Render the Total Tests row and pass rate from passed + failed
          instead of counts.total (Rust has always excluded skipped tests)
        required: false
        type: boolean
        default: false
      coverage-enabled:
        description: >-
          Whether coverage was requested for this run. When false (default),
          omit coverage sections from the totals summary. Direct callers that
          pass coverage-percent must set this to true or coverage will be omitted.
        required: false
        type: boolean
        default: false
      coverage-threshold:
        description: "Minimum coverage percentage threshold"
        required: false
        type: string
        default: "0"
      job-result:
        description: "Result of the upstream test job (success, failure, etc.)"
        required: false
        type: string
        default: "unknown"
      rich-coverage-comment:
        description: >-
          Generate a rich coverage table (istanbul, coverage-py, or lcov) instead
          of the pass/fail test summary
        required: false
        type: boolean
        default: false
      coverage-file:
        description: "Path to coverage summary file for rich-coverage-comment"
        required: false
        type: string
        default: ""
      coverage-format:
        description: "Coverage format: istanbul, coverage-py, lcov, or auto"
        required: false
        type: string
        default: "auto"
      coverage-artifact-name:
        description: >-
          Download this workflow artifact before generating a rich coverage
          summary (file path is coverage-file relative to the download directory)
        required: false
        type: string
        default: ""
      prebuilt-test-summary-file:
        description: >-
          Post this file as the test summary body (skips generation; used for matrix
          coverage artifacts)
        required: false
        type: string
        default: ""
      comment-history:
        description: >-
          Keep earlier runs of the test summary comment in a collapsible "Previous
          runs" archive under the latest result (#1346); false overwrites it on
          every run
        required: false
        type: boolean
        default: false
      comment-history-limit:
        description: >-
          Earlier runs the archive keeps when comment-history is true (0 =
          unlimited within the 60,000-byte comment budget)
        required: false
        type: number
        default: 3
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-minimal). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-minimal"
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10
    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false

