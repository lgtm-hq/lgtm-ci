---
name: Reusable GitHub Release Workflow

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Artifact to download and attach to the release"
        required: false
        type: string
        default: "python-dist"
      artifact-path:
        description: "Directory to extract the artifact into"
        required: false
        type: string
        default: "dist"
      tag-name:
        description: "Release tag (defaults to github.ref_name)"
        required: false
        type: string
        default: ""
      release-name:
        description: "Release title (defaults to tag name)"
        required: false
        type: string
        default: ""
      generate-release-notes:
        description: "Use GitHub auto-generated release notes"
        required: false
        type: boolean
        default: true
      files:
        description: >-
          Newline-separated asset globs attached to the release.
          Defaults to "{artifact-path}/*" when empty.
        required: false
        type: string
        default: ""
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
      tag-prefix:
        description: "Prefix of the version tags the generated notes range from"
        required: false
        type: string
        default: "v"
      checksums:
        description: >-
          Attach a SHA256SUMS manifest of the release assets. A manifest
          shipped inside the artifact is attached as is; otherwise one is
          written from the assets (release-security policy, section 1).
        required: false
        type: boolean
        default: true
      immutable-assets:
        description: >-
          On a rerun, never overwrite a published asset whose bytes differ
          from the local file: an identical digest is a no-op, a different or
          unverifiable digest fails the job with the recovery rule
          (release-security policy, section 4).
        required: false
        type: boolean
        default: true
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      job-name:
        description: "GitHub check name for the release job"
        required: false
        type: string
        default: "Create GitHub Release"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 15

    outputs:
      release-url:
        description: "URL of the created GitHub release"
        value: ${{ jobs.release.outputs.release-url }}
      release-id:
        description: "ID of the created GitHub release"
        value: ${{ jobs.release.outputs.release-id }}

