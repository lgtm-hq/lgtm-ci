---
name: Reusable Deploy Site With Reports Workflow

on:
  workflow_call:
    inputs:
      site-root:
        description: "Path to static site content to deploy"
        required: false
        type: string
        default: "dist"
      build-command:
        description: "Optional build command to run before deployment"
        required: false
        type: string
        default: ""
      bundle-manifest:
        description: "Inline JSON manifest or path to a manifest file in the caller repo"
        required: false
        type: string
        default: ""
      bundle-after-build:
        description: "Run bundle step after optional site build"
        required: false
        type: boolean
        default: true
      commit-sha:
        description: "Commit SHA for checkout and artifact resolution (workflow_run callers)"
        required: false
        type: string
        default: ""
      fallback-ref:
        description: "Optional branch ref for fallback artifact lookup (e.g. main)"
        required: false
        type: string
        default: ""
      strict-bundle:
        description: "Fail when any manifest entry cannot be resolved"
        required: false
        type: boolean
        default: false
      node-version:
        description: "Node.js version for build step"
        required: false
        type: string
        default: "20"
      package-manager:
        description: "Package manager for dependency install: npm, bun, pnpm (empty = skip)"
        required: false
        type: string
        default: "npm"
      working-directory:
        description: "Working directory for dependency installation"
        required: false
        type: string
        default: "."
      frozen-lockfile:
        description: "Use lockfile enforcement during dependency installation"
        required: false
        type: boolean
        default: true
      environment:
        description: "GitHub environment name for deployment"
        required: false
        type: string
        default: "github-pages"
      artifact-name:
        description: "Name for the pages artifact"
        required: false
        type: string
        default: "github-pages"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner in both jobs when the per-job allowed-endpoints-build /
          allowed-endpoints-deploy are empty. replace mode: a non-empty list is
          used alone; append mode: merged with the job's preset. Composed at
          job start, so it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      allowed-endpoints-build:
        description: >-
          allowed-endpoints for the build job only (same replace/append
          semantics against egress-build-preset). Falls back to
          allowed-endpoints when empty.
        required: false
        type: string
        default: ""
      allowed-endpoints-deploy:
        description: >-
          allowed-endpoints for the deploy job only (same replace/append
          semantics against egress-deploy-preset). Falls back to
          allowed-endpoints when empty.
        required: false
        type: string
        default: ""
      egress-build-preset:
        description: >-
          Named baseline allowlist for the build job from
          scripts/ci/lib/egress/presets.sh (default playwright: npm build and
          artifact download). Enforced at job start (#913).
        required: false
        type: string
        default: "playwright"
      egress-deploy-preset:
        description: >-
          Named baseline allowlist for the deploy job from
          scripts/ci/lib/egress/presets.sh (default github-pages: GitHub Pages
          OIDC deploy). Enforced at job start (#913).
        required: false
        type: string
        default: "github-pages"
      build-job-name:
        description: "GitHub check name for the build job"
        required: false
        type: string
        default: "Build site and bundle reports"
      deploy-job-name:
        description: "GitHub check name for the deploy job"
        required: false
        type: string
        default: "Deploy to GitHub Pages"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

    outputs:
      page-url:
        description: "URL of the deployed GitHub Pages site"
        value: ${{ jobs.deploy.outputs.page-url }}

concurrency:
  group: pages-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

