    codeload.github.com:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443
    rubygems.org:443 api.rubygems.org:443 index.rubygems.org:443",
    "npm-publish":"github.com:443 api.github.com:443 actions.githubusercontent.com:443
    token.actions.githubusercontent.com:443 codeload.github.com:443 objects.githubusercontent.com:443
    raw.githubusercontent.com:443 pipelines.actions.githubusercontent.com:443
    *.blob.core.windows.net:443 registry.npmjs.org:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443
    tuf-repo-cdn.sigstore.dev:443 oauth2.sigstore.dev:443",
    "quality":"github.com:443 api.github.com:443 codeload.github.com:443
    release-assets.githubusercontent.com:443 objects.githubusercontent.com:443
    raw.githubusercontent.com:443 pipelines.actions.githubusercontent.com:443
    github-releases.githubusercontent.com:443 ghcr.io:443 pkg-containers.githubusercontent.com:443
    docker.io:443 registry-1.docker.io:443 auth.docker.io:443 production.cloudflare.docker.com:443
    production.cloudfront.docker.com:443 pypi.org:443 files.pythonhosted.org:443
    static.rust-lang.org:443 bun.sh:443 astral.sh:443 releases.astral.sh:443 sh.rustup.rs:443
    deb.debian.org:80 registry.npmjs.org:443 crates.io:443 static.crates.io:443 index.crates.io:443
    semgrep.dev:443 metrics.semgrep.dev:443 api.osv.dev:443 api.deps.dev:443",
    "build-artifact":"github.com:443 api.github.com:443 codeload.github.com:443
    release-assets.githubusercontent.com:443 objects.githubusercontent.com:443
    raw.githubusercontent.com:443 pipelines.actions.githubusercontent.com:443
    github-releases.githubusercontent.com:443 bun.sh:443 nodejs.org:443 registry.npmjs.org:443
