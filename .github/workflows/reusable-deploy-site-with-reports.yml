  # lgtm-ci-egress-presets:end

jobs:
  build:
    name: ${{ inputs.build-job-name }}
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      # write (not read) so delete-run-pages-artifacts.sh can self-heal reruns (#415)
      actions: write # resolve/download workflow artifacts for bundling + prune stale Pages artifacts

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          # The build job's explicit list is allowed-endpoints-build, falling
          # back to allowed-endpoints; its preset is egress-build-preset.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append'
            && (inputs.allowed-endpoints-build != '' || inputs.allowed-endpoints != ''))
            && (inputs.allowed-endpoints-build != '' && inputs.allowed-endpoints-build || inputs.allowed-endpoints)
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-build-preset || 'playwright'],
            (inputs.allowed-endpoints-build != '' && inputs.allowed-endpoints-build || inputs.allowed-endpoints)) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append'
          || (inputs.allowed-endpoints-build == '' && inputs.allowed-endpoints == ''))
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-build-preset || 'playwright'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-build-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ inputs.commit-sha != '' && inputs.commit-sha || github.sha }}
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
          sparse-checkout-extra: |
            .github/actions/
            scripts/ci/
      - name: Setup Node.js
        if: inputs.build-command != '' && inputs.package-manager != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Setup Bun
        if: inputs.build-command != '' && inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.4"
      - name: Setup pnpm
        if: inputs.build-command != '' && inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install dependencies
        if: inputs.build-command != '' && inputs.package-manager != ''
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/setup-package-manager.sh
      - name: Build site
        if: inputs.build-command != ''
        shell: bash
        env:
          STEP: prepare
          SOURCE_PATH: ${{ inputs.site-root }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/deploy-pages.sh
      - name: Bundle workflow artifacts
        if: inputs.bundle-after-build && inputs.bundle-manifest != ''
        uses: ./.lgtm-ci-tooling/.github/actions/bundle-workflow-artifacts
        with:
          commit-sha: >-
            ${{ inputs.commit-sha != '' && inputs.commit-sha || github.sha }}
          site-root: ${{ inputs.site-root }}
          bundle-manifest: ${{ inputs.bundle-manifest }}
          fallback-ref: ${{ inputs.fallback-ref }}
          strict: ${{ inputs.strict-bundle }}
      - name: Prepare and upload artifact
        uses: ./.lgtm-ci-tooling/.github/actions/deploy-pages
        with:
          source-path: ${{ inputs.site-root }}
          artifact-name: ${{ inputs.artifact-name }}
  deploy:
    name: ${{ inputs.deploy-job-name }}
    needs: build
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          # The deploy job's explicit list is allowed-endpoints-deploy, falling
          # back to allowed-endpoints; its preset is egress-deploy-preset.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append'
            && (inputs.allowed-endpoints-deploy != '' || inputs.allowed-endpoints != ''))
            && (inputs.allowed-endpoints-deploy != '' && inputs.allowed-endpoints-deploy || inputs.allowed-endpoints)
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-deploy-preset || 'github-pages'],
            (inputs.allowed-endpoints-deploy != '' && inputs.allowed-endpoints-deploy || inputs.allowed-endpoints)) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append'
          || (inputs.allowed-endpoints-deploy == '' && inputs.allowed-endpoints == ''))
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-deploy-preset || 'github-pages'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-deploy-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
      - name: Configure Pages
        # Runs here, not in build: it calls GET /repos/{owner}/{repo}/pages,
        # which needs Pages access on a private repository (#1447).
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ inputs.artifact-name }}
