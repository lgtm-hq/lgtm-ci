---
name: Reusable E2E Matrix Test Workflow

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      package-manager:
        description: "Package manager for dependency install: npm, bun, pnpm"
        required: false
        type: string
        default: "npm"
      bun-version:
        description: >-
          Bun version installed when package-manager is bun. Exact pin,
          Renovate-managed; never a floating tag (#1077).
        required: false
        type: string
        # renovate: datasource=npm depName=bun
        default: "1.4.2"
      test-suites:
        description: 'Comma-separated test suites to run (e.g., "smoke,visual,a11y")'
        required: false
        type: string
        default: "smoke"
      browsers:
        description: 'Comma-separated browsers to test (e.g., "chromium,firefox")'
        required: false
        type: string
        default: "chromium"
      tag-prefix:
        description: 'Tag prefix for filtering (e.g., "@" for @smoke, @visual)'
        required: false
        type: string
        default: "@"
      shards:
        description: "Number of shards per suite (0 to disable sharding)"
        required: false
        type: number
        default: 1
      reporter:
        description: "Reporter to use: json, html, blob"
        required: false
        type: string
        default: "html"
      upload-report:
        description: "Upload test reports as artifacts"
        required: false
        type: boolean
        default: true
      publish-results:
        description: >-
          DEPRECATED (#770), accepted but inert. Pages publishing moved to
          reusable-publish-test-results-pages.yml, which the caller invokes in
          its own job; keeping the publish job here forced pages/id-token/
          actions:write onto every caller, publishing or not. Setting this to
          true warns and does nothing. Removal is planned a release or two out.
        required: false
        type: boolean
        default: false
      working-directory:
        description: "Working directory for running tests"
        required: false
        type: string
        default: "."
      timeout-minutes:
        description: "Timeout for each test job in minutes"
        required: false
        type: number
        default: 30
      artifact-prefix:
        description: >-
          Namespace for this call's artifacts; give a second call in the same
          run its own prefix so its shards are not merged into this one's
          report. Must match [A-Za-z0-9_.]+ ('-' separates prefix from shard)
        required: false
        type: string
        default: "playwright"
      pages-target-dir:
        description: >-
          DEPRECATED (#770), accepted but inert. It moved verbatim, name and
          validator included, to the pages-target-dir input of
          reusable-publish-test-results-pages.yml, which now owns the deploy.
          Setting it here warns and does nothing. Removal is planned a release
          or two out.
        required: false
        type: string
        default: "playwright"

      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default playwright). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "playwright"
      publish-egress-preset:
        description: >-
          DEPRECATED (#770), accepted but inert. The publish job moved to
          reusable-publish-test-results-pages.yml; set its egress-preset
          instead. Removal is planned a release or two out.
        required: false
        type: string
        default: "github-pages"
      publish-allowed-endpoints:
        description: >-
          DEPRECATED (#770), accepted but inert. The publish job moved to
          reusable-publish-test-results-pages.yml; set its allowed-endpoints
          instead. Removal is planned a release or two out.
        required: false
        type: string
        default: ""
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"

    outputs:
      total-passed:
        description: "Total tests passed across all matrix jobs"
        value: ${{ jobs.merge.outputs.total-passed }}
      total-failed:
        description: "Total tests failed across all matrix jobs"
        value: ${{ jobs.merge.outputs.total-failed }}
      report-url:
        description: >-
          DEPRECATED (#770), always empty. Kept so callers referencing it keep
          parsing; read the pages-url output of
          reusable-publish-test-results-pages.yml instead.
        value: ${{ '' }}

