  # lgtm-ci-egress-presets:end

jobs:
  # Generate matrix from inputs
  setup:
    name: Setup Matrix
    runs-on: ${{ inputs.runner-image }}
    # Independent short cap: the caller's timeout-minutes bounds the main
    # test job; this coordinator leg keeps its own fixed cap.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'playwright'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'playwright'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout for scripts
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            .github/actions/
            scripts/ci/
      - name: Validate artifact prefix
        shell: bash
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: .lgtm-ci-tooling/scripts/ci/actions/validate-artifact-prefix.sh
      - name: Warn on deprecated publish-results
        shell: bash
        env:
          INPUT_NAME: publish-results
          INPUT_VALUE: ${{ inputs.publish-results }}
          DEFAULT_VALUE: "false"
          REPLACEMENT: >-
            Add a job calling
            lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-test-results-pages.yml
            with artifact-name '<artifact-prefix>-merged-report',
            results-path '.' and the pages-target-dir this call used, and move
            the pages/id-token/actions:write grant onto that job.
        run: .lgtm-ci-tooling/scripts/ci/actions/warn-deprecated-workflow-input.sh
      - name: Warn on deprecated pages-target-dir
        shell: bash
        env:
          INPUT_NAME: pages-target-dir
          INPUT_VALUE: ${{ inputs.pages-target-dir }}
          DEFAULT_VALUE: "playwright"
          REPLACEMENT: >-
            Pass the same value as the pages-target-dir input of
            reusable-publish-test-results-pages.yml, which validates it with
            the same scripts/ci/actions/validate-pages-target-dir.sh and now
            owns the deploy.
        run: .lgtm-ci-tooling/scripts/ci/actions/warn-deprecated-workflow-input.sh
      - name: Warn on deprecated publish-egress-preset
        shell: bash
        env:
          INPUT_NAME: publish-egress-preset
          INPUT_VALUE: ${{ inputs.publish-egress-preset }}
          DEFAULT_VALUE: "github-pages"
          REPLACEMENT: >-
            Set egress-preset on the
            reusable-publish-test-results-pages.yml job instead.
        run: .lgtm-ci-tooling/scripts/ci/actions/warn-deprecated-workflow-input.sh
      - name: Warn on deprecated publish-allowed-endpoints
        shell: bash
        env:
          INPUT_NAME: publish-allowed-endpoints
          INPUT_VALUE: ${{ inputs.publish-allowed-endpoints }}
          DEFAULT_VALUE: ""
          REPLACEMENT: >-
            Set allowed-endpoints on the
            reusable-publish-test-results-pages.yml job instead.
        run: .lgtm-ci-tooling/scripts/ci/actions/warn-deprecated-workflow-input.sh
      - name: Generate matrix
        id: matrix
        shell: bash
        env:
          STEP: e2e-matrix
          SUITES: ${{ inputs.test-suites }}
          BROWSERS: ${{ inputs.browsers }}
          SHARDS: ${{ inputs.shards }}
        run: .lgtm-ci-tooling/scripts/ci/actions/generate-matrix.sh
  test:
    # Static name per issue #168; GitHub appends matrix (suite/browser) to each leg.
    name: E2E tests
    needs: setup
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'playwright'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'playwright'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            .github/actions/
            scripts/ci/
      - name: Cache Playwright browsers
        # Pinned to SHA for supply chain security
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('**/bun.lock',
            '**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ matrix.browser }}-
      - name: Build shard config
        id: shard
        shell: bash
        env:
          STEP: shard-config
          TOTAL_SHARDS: ${{ matrix.total_shards }}
          SHARD: ${{ matrix.shard }}
        run: .lgtm-ci-tooling/scripts/ci/actions/generate-matrix.sh
      - name: Run Playwright
        id: test
        uses: ./.lgtm-ci-tooling/.github/actions/run-playwright
        with:
          package-manager: ${{ inputs.package-manager }}
          node-version: ${{ inputs.node-version }}
          bun-version: ${{ inputs.bun-version }}
          browser: ${{ matrix.browser }}
          reporter: ${{ inputs.reporter }}
          shard: ${{ steps.shard.outputs.config }}
          extra-args: --grep ${{ inputs.tag-prefix }}${{ matrix.suite }}
          working-directory: ${{ inputs.working-directory }}
      - name: Upload report
        if: inputs.upload-report && always()
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # yamllint disable-line rule:line-length
          name: ${{ inputs.artifact-prefix }}-${{ matrix.suite }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ${{ inputs.working-directory }}/playwright-report/
            ${{ inputs.working-directory }}/playwright-results.json
            ${{ inputs.working-directory }}/blob-report/
          retention-days: 30
          if-no-files-found: ignore
          # The merge job consumes these shards, so no continue-on-error —
          # overwrite only, so a repeated call in one run hands the merge its
          # latest shard instead of 409ing.
          overwrite: true
  merge:
    name: Merge Reports
    # `setup` is in `needs` only to gate on it: `always()` would otherwise let
    # this job run after a failed prefix validation and glob with the very
    # prefix that was rejected (#739). The `test` dependency stays loose on
    # purpose — a report is still wanted when tests fail.
    needs: [setup, test]
    if: always() && inputs.upload-report && needs.setup.result == 'success'
    runs-on: ${{ inputs.runner-image }}
    # Independent short cap: the caller's timeout-minutes bounds the main
    # test job; this coordinator leg keeps its own fixed cap.
    timeout-minutes: 10
    permissions:
      contents: read

    outputs:
      total-passed: ${{ steps.merge.outputs.total-passed }}
      total-failed: ${{ steps.merge.outputs.total-failed }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'playwright'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'playwright'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            .github/actions/
            scripts/ci/
      - name: Download all reports
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Namespaced per call (#739): a bare playwright-* also matched the
          # shards of a sibling call of this same reusable in the run.
          pattern: ${{ inputs.artifact-prefix }}-*
          path: playwright-reports
          merge-multiple: true
      - name: Merge reports
        id: merge
        uses: ./.lgtm-ci-tooling/.github/actions/merge-playwright-reports
        with:
          input-dir: playwright-reports
          output-dir: merged-report
          # Map 'blob' reporter to 'html' for merging (blob is intermediate format)
          report-format: ${{ inputs.reporter == 'blob' && 'html' || inputs.reporter }}
      - name: Upload merged report
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-merged-report
          path: merged-report
          retention-days: 30
          if-no-files-found: ignore
          # reusable-publish-test-results-pages.yml downloads this without a
          # tolerance guard, so the upload is part of that leg's verdict — no
          # continue-on-error here. Overwrite only, so a repeated call in one
          # run publishes its latest merged report instead of 409ing.
          overwrite: true
