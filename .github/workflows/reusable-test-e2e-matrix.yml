            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'playwright'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ job.workflow_sha || inputs.tooling-ref || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          token: ${{ secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
          workflow-sha: ${{ job.workflow_sha }}
          tooling-token: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
          sparse-checkout-extra: |
            .github/actions/
            schemas/
            scripts/ci/
      - name: Download all reports
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Namespaced per call (#739): a bare playwright-* also matched the
          # shards of a sibling call of this same reusable in the run.
          pattern: ${{ inputs.artifact-prefix }}-*
          path: playwright-reports
          # One directory per shard (#1474): every shard uploads the same
          # playwright-results.json, so merging the artifacts into one
          # directory kept only the last shard's report.
          merge-multiple: false
      - name: Merge reports
        id: merge
        uses: ./.lgtm-ci-tooling/.github/actions/merge-playwright-reports
        with:
          input-dir: playwright-reports
          output-dir: merged-report
          # Already normalised: blob runs as json, so no blob mapping is needed.
          report-format: ${{ needs.setup.outputs.reporter }}
          # Every leg must deliver exactly one JSON results file (#1474). The
          # junit reporter writes none, so it keeps the unchecked merge.
          # yamllint disable-line rule:line-length
          expected-matrix: ${{ needs.setup.outputs.json-results == 'true' && needs.setup.outputs.matrix || '' }}
          artifact-prefix: ${{ inputs.artifact-prefix }}
          # A failed or cancelled test job already explains a missing shard
          # report: the merge then warns per shard and fails without an
          # ::error:: of its own, so the failure points at the leg.
          test-result: ${{ needs.test.result }}
      - name: Upload merged report
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-merged-report
          path: merged-report
          retention-days: 30
          if-no-files-found: ignore
          # reusable-publish-test-results-pages.yml downloads this without a
          # tolerance guard, so the upload is part of that leg's verdict — no
          # continue-on-error here. Overwrite only, so a repeated call in one
          # run publishes its latest merged report instead of 409ing.
          overwrite: true
      - name: Recheck harden-runner agent
        # Last step (#1203): fails the job if the agent stopped enforcing mid-job.
        if: ${{ !cancelled() && steps.verify-harden-runner.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          # lgtm-ci-inline:begin recheck-harden-runner-agent
          # Recheck of the harden-runner agent, before each irreversible publish
          # step (#1551) and at job end (#1203). Source:
          # scripts/ci/bootstrap/recheck-harden-runner-agent.sh
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?* | github-hosted/?*) exit 0 ;; # Reported by the startup step.
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS"
          # lgtm-ci-inline:end recheck-harden-runner-agent
