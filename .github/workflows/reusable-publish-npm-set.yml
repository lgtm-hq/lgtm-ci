  # step-security pre hook installs the agent before any step runs, so the
  # allowlist must be composed from literals and inputs only (#412/#420/#913).
  # lgtm-ci-egress-accepts: npm-publish
  # lgtm-ci-egress-presets:begin
  LGTM_CI_EGRESS_PRESETS: >-
    {"npm-publish":"github.com:443 api.github.com:443 token.actions.githubusercontent.com:443
    codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443
