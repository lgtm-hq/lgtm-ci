  # lgtm-ci-egress-presets:end

jobs:
  publish:
    name: ${{ inputs.job-name }}
    # GitHub-hosted runner only: provenance attestation requires it.
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # An empty name is "no environment"; a `uses:` caller cannot set this
    # key itself, so it is the only way to keep an approval gate on the
    # publish job.
    environment: ${{ inputs.environment }}
    permissions:
      # Read repository context (checkout of the consumer repo)
      contents: read
      # OIDC trusted publishing: npm registry exchanges this token
      id-token: write
      # Tarball provenance attestation upload
      attestations: write

    outputs:
      published: ${{ steps.publish.outputs.published }}
      dist-tag-drift: ${{ steps.publish.outputs.dist_tag_drift }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'npm-publish'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'npm-publish'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            .github/actions/
            scripts/ci/
      - name: Set up Node.js
        # Node 24 ships npm >= 11.5.1 (required for OIDC trusted publishing).
        # Do not run `npm install -g npm`: in-place self-upgrade corrupts the
        # toolcache and breaks `npm publish --provenance` (missing sigstore).
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Assert entry workflow is allowlisted
        shell: bash
        env:
          ALLOWED_ENTRY_WORKFLOWS: ${{ inputs.entry-workflows }}
          LIVE: ${{ inputs.dry-run == false && '1' || '0' }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/actions/npm/assert-entry-workflow.sh
      # Live publishes fail closed here: hosted runner, checksums manifest and
      # signer inputs are mandatory before anything is downloaded or packed.
      - name: Assert live-publish preconditions
        shell: bash
        env:
          LIVE: ${{ inputs.dry-run == false && '1' || '0' }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
          SIGNER_REPO: ${{ inputs.signer-repo }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          ACCESS: ${{ inputs.access }}
          PROVENANCE: ${{ inputs.provenance == true && '1' || '0' }}
          POST_PUBLISH_VERIFY: ${{ inputs.post-publish-verify == true && '1' || '0' }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/actions/npm/assert-live-publish-inputs.sh
      # Jobs have isolated filesystems: a package set staged by another job
      # arrives as a workflow artifact and lands in packages-dir here.
      - name: Download staged package set
        if: inputs.artifact-name != ''
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.packages-dir }}
      # Contract step 1 of 3: verify BEFORE anything is packed or written.
      # Verifies every file npm would pack (npm pack --dry-run) plus
      # files-to-verify; a packed file the manifest does not list fails.
      - name: Verify artifacts
        if: inputs.checksums-file != ''
        shell: bash
        env:
          PACKAGES_DIR: ${{ inputs.packages-dir }}
          ORDER: ${{ inputs.order }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
          FILES: ${{ inputs.files-to-verify }}
          SIGNER_REPO: ${{ inputs.signer-repo }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/actions/npm/verify-artifacts.sh
      # Contract step 2 of 3: the ONLY step that writes to the registry.
      - name: Publish package set
        id: publish
        shell: bash
        env:
          PACKAGES_DIR: ${{ inputs.packages-dir }}
          ORDER: ${{ inputs.order }}
          DIST_TAG: ${{ inputs.dist-tag }}
          LIVE: ${{ inputs.dry-run == false && '1' || '0' }}
          PROVENANCE: ${{ inputs.provenance == true && '1' || '0' }}
          ACCESS: ${{ inputs.access }}
          MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/actions/npm/publish-set.sh
      # Contract step 3 of 3: read-only verification, always last.
      - name: Verify published packages
        if: inputs.post-publish-verify
        shell: bash
        env:
          PACKAGES_DIR: ${{ inputs.packages-dir }}
          ORDER: ${{ inputs.order }}
          DIST_TAG: ${{ inputs.dist-tag }}
