---
name: Reusable npm Package-Set Publishing

# Ordered, idempotent, provenance-aware publish of a SET of npm packages
# (#965): platform packages first, meta package last, pre-publish artifact
# verification, and post-publish registry verification. Ported from the
# audited py-lintro publish loop (scripts/ci/npm/publish_packages.sh as
# corrected by py-lintro#2637); #966's npm-channel resume calls this same
# reusable so the resume path and the tag path cannot drift.
#
# Consumer contract (enforced by the step order below and asserted by the
# bats wiring test):
#   1. verify-artifacts (optional but required for releases per policy):
#      sha256 + provenance attestation on the artifacts, BEFORE any npm pack.
#   2. publish-set: the ONLY step that writes to the registry.
#   3. verify-published: read-only registry verification, LAST.
#
# The entry-workflow guard matters because npm trusted publishing checks the
# ENTRY workflow file of the run — the consumer's top-level workflow, not
# this reusable — so calling this reusable keeps the consumer's registration
# valid. Name the entry file via the `entry-workflows` input so the guard can
# enforce it.
#
# A job that calls a reusable (`uses:`) cannot declare `environment`, so the
# `environment` input binds THIS job to the caller's deployment environment
# (approval gate, and the environment claim npm's trusted publisher can be
# registered against). Empty (the default) runs without an environment, in
# which case the trusted publisher must be registered WITHOUT an environment
# name. npm trusted publishing needs OIDC only — no NODE_AUTH_TOKEN. Do not
# self-upgrade npm in-place (`npm install -g npm` corrupts the toolcache and
# breaks --provenance).
#
# Workflow artifacts drop file modes (every file lands as 0644), so
# publish-set.sh restores +x on bin/* and package.json "bin" targets before
# npm pack records the modes into the tarball.
#
# Live publishes fail closed before anything is downloaded or packed unless
# entry-workflows, checksums-file, signer-repo and signer-workflow are set
# and the runner is GitHub-hosted; dry-runs stay permissive.

"on":
  workflow_call:
    inputs:
      packages-dir:
        description: >-
          Directory containing one subdirectory per package. When
          artifact-name is set, the artifact is downloaded into this
          directory before verification.
        required: true
        type: string
      order:
        description: >-
          Subdirectory names in publish order (JSON array or comma-separated),
          meta package last
        required: true
        type: string
      dist-tag:
        description: npm dist-tag (latest, beta, next, backfill, …)
        required: false
        type: string
        default: latest
      dry-run:
        description: >-
          Pack only, do not publish; skips registry verification. Defaults to
          true so a caller must opt in to writing to the registry; a live
          publish additionally requires entry-workflows, checksums-file,
          signer-repo and signer-workflow.
        required: false
        type: boolean
        default: true
      provenance:
        description: Pass --provenance on publish (under OIDC it is also automatic)
        required: false
        type: boolean
        default: true
      access:
        description: >-
          npm access level. A live publish with any value other than public
          is refused while provenance or post-publish-verify is on: npm
          issues automatic provenance only for public packages from public
          repositories, and post-publish verification reads the registry
          unauthenticated.
        required: false
        type: string
        default: public
      max-attempts:
        description: Bounded attempts per package on transient registry errors
        required: false
        type: number
        default: 3
      artifact-name:
        description: >-
          Workflow artifact (actions/upload-artifact) holding the staged
          package set, downloaded into packages-dir before verification.
          Jobs have isolated filesystems, so a caller that stages the
          packages in another job must hand them over this way. Empty
          expects packages-dir to already exist in the checkout.
        required: false
        type: string
        default: ""
      entry-workflows:
        description: >-
          Allowlisted consumer entry workflow path(s) for npm trusted
          publishing, e.g. .github/workflows/publish-npm.yml. Required for a
          live publish (the job fails before publishing when empty); a
          dry-run only warns.
        required: false
        type: string
        default: ""
      checksums-file:
        description: >-
          SHA256SUMS manifest for pre-publish artifact verification. The
          path is relative to the workspace (e.g. npm-dist/SHA256SUMS; a
          packages-dir-relative path is accepted as a fallback); the entries
          inside the manifest are relative to packages-dir. Requires
          signer-repo and signer-workflow. Required for a live publish (the
          job fails before publishing when empty); a dry-run may leave it
          empty to skip verification.
        required: false
        type: string
        default: ""
      files-to-verify:
        description: >-
          JSON array of additional artifact globs (relative to packages-dir)
          to verify against checksums-file, on top of every file npm would
          pack (always verified). Empty array also verifies every file the
          manifest lists.
        required: false
        type: string
        default: "[]"
      signer-repo:
        description: >-
          Repository the artifact attestations must come from (e.g.
          owner/repo). Required for a live publish and whenever
          checksums-file is set.
        required: false
        type: string
        default: ""
      signer-workflow:
        description: >-
          Workflow the artifact attestations must come from: a path inside
          signer-repo (e.g. .github/workflows/build.yml, qualified with
          signer-repo for gh) or a fully qualified
          owner/repo/.github/workflows/build.yml. Required for a live
          publish and whenever checksums-file is set.
        required: false
        type: string
        default: ""
      post-publish-verify:
        description: Read-only registry verification after the publish
        required: false
        type: boolean
        default: true
      propagation-attempts:
        description: >-
          Registry propagation polls before post-publish verification gives
          up. Every package in the set is polled together; a fresh publish
          is routinely invisible for one to six minutes (platform packages
          lag the meta package; the 0.160.3rc1 checkpoint took about eight
          minutes). With propagation-delay 30 the default budget is about
          fifteen minutes.
        required: false
        type: number
        default: 30
      propagation-delay:
        description: >-
          Cap in seconds between propagation polls; the wait starts at 5 s
          and doubles up to this cap.
        required: false
        type: number
        default: 30
      smoke-command:
        description: Optional command run in a scratch install of the meta package
        required: false
        type: string
        default: ""
      node-version:
        description: >-
          Node version for publish. Trusted publishing needs npm >= 11.5.1;
          Node 24 ships a compatible npm. Do not self-upgrade npm in-place.
        required: false
        type: string
        default: "24"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: harden-runner egress policy (audit or block)
        required: false
        type: string
        default: block
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: replace
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default npm-publish). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "npm-publish"
      job-name:
        description: GitHub check name for the publish job
        required: false
        type: string
        default: Publish npm package set
      environment:
        description: >-
          GitHub deployment environment to bind the publish job to (approval
          gate; also the environment claim in the OIDC token, so an npm
          trusted publisher registered with an environment name keeps
          matching). Empty runs the job without an environment.
        required: false
        type: string
        default: ""
      runner-image:
        description: >-
          GitHub-hosted runner image label. Must stay GitHub-hosted: npm
          trusted publishing and provenance are not available on self-hosted
          runners, and a live publish refuses to run on one.
        required: false
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: >-
          Job timeout in minutes. Leave room for the propagation wait
          (propagation-attempts x propagation-delay) on top of the publish.
        required: false
        type: number
        default: 30

    outputs:
      published:
        description: >-
          JSON array of {name, version, status: published|skipped|dry-run,
          integrity} per package (dry-run: the rehearsal packed the package
          and wrote nothing)
        value: ${{ jobs.publish.outputs.published }}
      dist-tag-drift:
        description: Whether any dist-tag could not be reconciled (OIDC write rejection)
        value: ${{ jobs.publish.outputs.dist-tag-drift }}

permissions:
  contents: read

