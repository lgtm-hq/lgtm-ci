---
name: Reusable Publish File Breakdown Workflow

on:
  workflow_call:
    inputs:
      comment-marker:
        description: "Upsert marker for the file breakdown PR comment"
        required: false
        type: string
        default: "file-breakdown"
      max-rows:
        description: "Maximum per-file rows rendered in the collapsible details"
        required: false
        type: number
        default: 50
      job-name:
        description: "Display name for the file breakdown publish job"
        required: false
        type: string
        default: "Publish file breakdown"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-minimal). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-minimal"
      config-path:
        description: >-
          Path to category config file relative to repo root
          (default: .github/file-breakdown.yml)
        required: false
        type: string
        default: ""
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

