jobs:
  publish-file-breakdown:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      # Post/update file breakdown PR comments via post-pr-comment
      pull-requests: write

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-minimal'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-minimal'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            .github/actions/post-pr-comment
            scripts/ci/
      - name: Detect PR number
        id: pr
        shell: bash
        env:
          STEP: pr-number
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ""
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/post-pr-comment.sh
      - name: Fetch PR changed files
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          STEP: fetch
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_FILES_JSON: pr-files.json
        run: bash .lgtm-ci-tooling/scripts/ci/actions/generate-file-breakdown.sh
      - name: Generate file breakdown
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          STEP: generate
          PR_FILES_JSON: pr-files.json
          MAX_ROWS: ${{ inputs.max-rows }}
          COMMENT_OUTPUT: file-breakdown.md
          FILE_BREAKDOWN_CONFIG: ${{ inputs.config-path }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/generate-file-breakdown.sh
      - name: Publish file breakdown
        if: steps.pr.outputs.number != ''
        uses: ./.lgtm-ci-tooling/.github/actions/post-pr-comment
        with:
          file: file-breakdown.md
          marker: ${{ inputs.comment-marker }}
          pr-number: ${{ steps.pr.outputs.number }}
