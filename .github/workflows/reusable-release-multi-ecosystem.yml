    pipelines.actions.githubusercontent.com:443 pypi.org:443 files.pythonhosted.org:443
    test.pypi.org:443 upload.pypi.org:443 upload.test.pypi.org:443 fulcio.sigstore.dev:443
    rekor.sigstore.dev:443 timestamp.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
    sigstore-tuf-root.storage.googleapis.com:443 oauth2.sigstore.dev:443",
    "rubygems":"github.com:443 api.github.com:443 actions.githubusercontent.com:443
    codeload.github.com:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443
    rubygems.org:443 api.rubygems.org:443 index.rubygems.org:443",
    "npm-publish":"github.com:443 api.github.com:443 actions.githubusercontent.com:443
    token.actions.githubusercontent.com:443 codeload.github.com:443 objects.githubusercontent.com:443
