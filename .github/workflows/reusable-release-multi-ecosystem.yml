---
name: "Reusable: Release Multi-Ecosystem Version PR"

"on":
  workflow_call:
    inputs:
      manifests:
        # yamllint disable-line rule:line-length
        description: >-
          JSON object mapping file path → kind (npm|raw|gemspec|pep621).
          Example: {"package.json":"npm","VERSION":"raw",
          "python/pyproject.toml":"pep621","my.gemspec":"gemspec"}.
          Kind pep621 installs tomlkit from PyPI when missing; the default
          egress-preset (release-version-pr) allows pypi.org:443 and
          files.pythonhosted.org:443, so no caller allowlist is needed (#1093).
        required: true
        type: string
      bump:
        description: >-
          Version resolution: auto-from-commits (conventional commits) or
          explicit (use version input)
        required: false
        type: string
        default: "auto-from-commits"
      version:
        description: >-
          Explicit semver when bump=explicit (optional v prefix). Ignored for
          auto-from-commits.
        required: false
        type: string
        default: ""
      prerelease-tag:
        description: >-
          Optional prerelease identifier appended as -<tag> (e.g. rc.1 →
          1.2.3-rc.1). Empty skips.
        required: false
        type: string
        default: ""
      changelog:
        description: "Generate and update CHANGELOG.md in the version PR"
        required: false
        type: boolean
        default: true
      job-name:
        description: "GitHub check name for the version-PR job"
        required: false
        type: string
        default: "Create Version PR"
      max-bump:
        description: "Maximum semver bump when bump=auto-from-commits"
        required: false
        type: string
        default: "minor"
      tag-prefix:
        description: "Prefix for version tags"
        required: false
        type: string
        default: "v"
      pr-labels:
        description: "Comma-separated labels for the version PR"
        required: false
        type: string
        default: "release-bump"
      codeowners-path:
        description: "Path to CODEOWNERS file"
        required: false
        type: string
        default: ".github/CODEOWNERS"
      auto-merge:
        description: "Enable auto-merge (squash) on the created PR"
        required: false
        type: boolean
        default: false
      auto-merge-patch-only:
        description: >-
          When auto-merge is true, only enable auto-merge for patch bumps
        required: false
        type: boolean
        default: false
      release-branch-prefix:
        description: "Prefix for the release PR branch (e.g. release/)"
        required: false
        type: string
        default: "release/"
      version-update-script:
        # yamllint disable-line rule:line-length
        description: >-
          Optional repo-specific script for additional version file updates
          beyond manifests. Runs in its own job with no token or secrets
          (#849), after manifest updaters, before PR creation. Receives
          NEXT_VERSION and RELEASE_METADATA_PATH (read-only JSON: latest
          release, container digest). Only changes to this repository's
          files outside .github/workflows/ are carried into the version PR.
        required: false
        type: string
        default: ""
      release-metadata-container-package:
        # yamllint disable-line rule:line-length
        description: >-
          GitHub Packages container (same owner) whose newest release-tagged
          digest is recorded in release-metadata.json for the
          version-update-script. Needs Packages: read on the release App.
          Empty skips the lookup.
        required: false
        type: string
        default: ""
      skip-patterns:
        description: >-
          Comma-separated commit title patterns that skip version PR creation.
        required: false
        type: string
        default: "^chore\\(release\\):"
      tooling-ref:
        # yamllint disable-line rule:line-length
        description: >-
          Optional override for the lgtm-ci tooling checkout. Unset tracks
          the workflow pin automatically (job.workflow_sha); setting it emits
          a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default release-version-pr, shared with
          reusable-release-version-pr: github-tooling plus PyPI for the
          pep621 tomlkit install and the rustup/crates.io hosts the rust
          ecosystem bump needs there, #1093). Selected at job start inside
          every harden-runner step, so it is enforced (#913).
        required: false
        type: string
        default: "release-version-pr"
      report-failures:
        description: >-
          When true, open or update a deduplicated GitHub issue when the release
          job fails on the target branch
        required: false
        type: boolean
        default: true
      failure-issue-labels:
        description: Comma-separated labels for auto-opened release failure issues
        required: false
        type: string
        default: "bug,ci,release,automation,infrastructure"
      failure-target-branch:
        description: >-
          Branch name for failure notifications. Empty uses the repository default
          branch.
        required: false
        type: string
        default: ""

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 20

    secrets:
      RELEASE_APP_ID:
        description: "GitHub App ID for creating release tokens"
        required: true
      RELEASE_APP_PRIVATE_KEY:
        description: "GitHub App private key for creating release tokens"
        required: true

