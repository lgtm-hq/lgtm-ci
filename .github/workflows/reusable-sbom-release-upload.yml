jobs:
  upload-release-assets:
    name: Upload SBOM release assets
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # `gh release upload --clobber` in
      # scripts/ci/actions/upload-sbom-release-assets.sh:33 authenticates with
      # GITHUB_TOKEN (GH_TOKEN below) and writes a release asset, which the REST
      # release API gates on `contents: write`. Unlike #730's `actions: write`,
      # there is no runtime-token code path to fall back on — which is exactly
      # why this job now lives in a workflow a caller invokes only when it does
      # attach assets to a release.
      contents: write

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Warn on explicit tooling-ref override
        # hashFiles guards callers that pin a tooling-ref predating the script.
        if: >-
          inputs.tooling-ref != ''
          && hashFiles('.lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh') != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh
      - name: Download SBOM artifact
        # Pinned to SHA for supply chain security
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: sbom-artifact
      - name: Upload SBOM to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the caller (#796), so there is no git
          # remote for gh to infer the target repository from; without GH_REPO
          # `gh release upload` fails with "not a git repository" (#935).
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref_name }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          SBOM_ARTIFACT_DIR: sbom-artifact
        run: bash .lgtm-ci-tooling/scripts/ci/actions/upload-sbom-release-assets.sh
