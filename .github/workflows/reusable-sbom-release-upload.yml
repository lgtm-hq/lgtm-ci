---
name: Reusable SBOM Release Upload

# Standalone `gh release upload` for SBOM files that another job produced and
# uploaded as a workflow artifact (#770). Split out of reusable-sbom.yml's
# `upload-release-assets` and `release-assets` jobs so that scan-mode callers
# stop being forced to grant `contents: write` — a reusable workflow's
# permission request is validated statically, before any job `if:`, so that
# scope could not be avoided while an upload job lived in that file (#737).
#
# This is the ONLY workflow in the SBOM path that requests `contents: write`.
# Generation, scanning, attestation and cosign signing all stay `contents: read`
# in reusable-sbom.yml and hand their output over as an artifact.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: >-
          Name of the SBOM artifact to download. Must match the artifact-name
          passed to reusable-sbom.yml.
        required: false
        type: string
        default: "sbom"
      release-tag:
        description: >-
          Release tag to attach the SBOM files to. Defaults to github.ref_name
          when empty, which is correct for a tag-triggered release run.
        required: false
        type: string
        default: ""

      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"

      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 20

