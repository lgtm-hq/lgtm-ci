---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # The test jobs skip drafts. Without ready_for_review, a draft marked
    # ready keeps the skipped results and the gate can pass with no tests
    # run (#1471).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

# Replace only superseded PR work. Each non-PR run/attempt needs its own group:
# cancel-in-progress: false alone still allows pending runs to be replaced.
# Keep concurrency caller-owned; callees must not reacquire this group (#108).
concurrency:
  group: >-
    ci-caller-${{ github.workflow_ref }}-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-${{
    github.event_name == 'pull_request' && 'pr' || github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  quality:
    uses: ./.github/workflows/reusable-quality-lint.yml
    with:
      job-name: "🛠️ Lintro Code Quality"
    permissions:
      contents: read
      packages: read

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-publish-quality-summary.yml
    with:
      # Gated by reusable-quality-lint.yml: a job that went red after lintro
      # passed (e.g. the harden-runner recheck) exports 1, not 0 (#1203).
      exit-code: ${{ needs.quality.outputs.exit-code }}
    permissions:
      contents: read
      pull-requests: write

  shell-tests:
    uses: ./.github/workflows/reusable-test-shell.yml
    permissions:
      # actions: read — the sharded aggregate's artifact-availability wait (#803)
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "🐚 Shell Tests"
      test-path: tests/bats
      coverage: true
      coverage-threshold: 84
      # The shell library plus the scripts extracted from workflow and action
      # YAML (#1450), so they count toward the floor.
      coverage-include-path: scripts/ci/lib,scripts/ci/bootstrap,.github/actions/checkout-and-harden
      coverage-shards: 8
      upload-coverage: true
      # Keep earlier runs of the test summary under the latest one (#1346).
      comment-history: true
    secrets:
      # Self-test of the optional tooling token (#1451) through a nested
      # call: the job's own token travels to every tooling checkout here
      # and in reusable-publish-test-summary.yml. This token carries the
      # caller's scopes, wider than the contents-read token a mirror should
      # store; same-repository runs only, so nothing is exposed that the
      # job did not already hold.
      LGTM_CI_TOOLING_TOKEN: ${{ github.token }}

  python-tests:
    uses: ./.github/workflows/reusable-test-python.yml
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "🐍 Python Tests"
      test-path: tests/python
      extras: test
      # Floor over scripts/ci ([tool.coverage] in pyproject.toml), a ratchet
      # at the measured total rounded down (#1450).
      coverage: true
      coverage-threshold: 74
      upload-coverage: true
      publish-test-summary: false

  caller-permissions:
    uses: ./.github/workflows/reusable-validate.yml
    with:
      job-name: "📜 Caller Permissions"
      script: scripts/ci/docs/validate-caller-permissions.py
      publish-validation-report: true
      comment-marker: caller-permissions
    permissions:
      contents: read
      pull-requests: write

  support-catalog:
    uses: ./.github/workflows/reusable-validate.yml
    with:
      job-name: "📚 Support Catalog"
      script: scripts/ci/catalog/validate.py
      # Stable evidence commits must be on origin/main and in HEAD's history
      # (#1079). The checkout is shallow and has no origin/main ref, so fetch
      # main and the full history; --unshallow errors on a complete clone.
      setup-commands: >-
        main=+refs/heads/main:refs/remotes/origin/main;
        if [ "$(git rev-parse --is-shallow-repository)" = true ];
        then git fetch --quiet --no-tags --unshallow origin "$main";
        else git fetch --quiet --no-tags origin "$main"; fi
      publish-validation-report: true
      comment-marker: support-catalog
    permissions:
      contents: read
      pull-requests: write

  deprecation-gate:
    uses: ./.github/workflows/reusable-validate.yml
    with:
      job-name: "🧭 Deprecation Gate"
      script: scripts/ci/catalog/check-deprecations.sh
      # The gate compares the checkout with its first parent, HEAD^1 (#1082):
      # for a PR that is the main commit its merge commit was built on.
      # Removed inputs, outputs, secrets and entry points need known-consumer
      # evidence or an exception. The checkout is shallow; fetch one parent.
      setup-commands: >-
        if [ "$(git rev-parse --is-shallow-repository)" = true ];
        then git fetch --quiet --no-tags --depth=2 origin "$(git rev-parse HEAD)"; fi
      publish-validation-report: true
      comment-marker: deprecation-gate
    permissions:
      contents: read
      pull-requests: write

  doc-pins:
    uses: ./.github/workflows/reusable-validate.yml
    with:
      job-name: "📌 Doc Pins"
      script: scripts/ci/docs/validate-doc-pins.py
      publish-validation-report: true
      comment-marker: doc-pins
    permissions:
      contents: read
      pull-requests: write

  file-breakdown:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-publish-file-breakdown.yml
    permissions:
      contents: read
      pull-requests: write

  notify-failure:
    # yamllint disable-line rule:line-length
    needs: [quality, shell-tests, python-tests, caller-permissions, support-catalog, deprecation-gate, doc-pins]
    if: failure() && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-main-failure-notifier.yml
    with:
      workflow-key: ci
    permissions:
      actions: read
      contents: read
      issues: write
