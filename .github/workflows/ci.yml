---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  packages: read

jobs:
  quality:
    uses: ./.github/workflows/reusable-quality-lint.yml
    with:
      job-name: "🛠️ Lintro Code Quality"
    permissions:
      contents: read
      packages: read

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-publish-quality-summary.yml
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
    permissions:
      contents: read
      pull-requests: write

  shell-tests:
    uses: ./.github/workflows/reusable-test-shell.yml
    permissions:
      # actions: read — the sharded aggregate's artifact-availability wait (#803)
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "🐚 Shell Tests"
      test-path: tests/bats
      coverage: true
      coverage-threshold: 84
      coverage-shards: 4
      upload-coverage: true

  python-tests:
    uses: ./.github/workflows/reusable-test-python.yml
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "🐍 Python Tests"
      test-path: tests/python
      extras: test
      coverage: false
      publish-test-summary: false

  caller-permissions:
    uses: ./.github/workflows/reusable-validate.yml
    with:
      job-name: "📜 Caller Permissions"
      script: scripts/ci/docs/validate-caller-permissions.py
      publish-validation-report: true
      comment-marker: caller-permissions
    permissions:
      contents: read
      pull-requests: write

  support-catalog:
    uses: ./.github/workflows/reusable-validate.yml
    with:
      job-name: "📚 Support Catalog"
      script: scripts/ci/catalog/validate.py
      # Stable evidence commits must be on origin/main and in HEAD's history
      # (#1079). The checkout is shallow and has no origin/main ref, so fetch
      # main and the full history; --unshallow errors on a complete clone.
      setup-commands: >-
        main=+refs/heads/main:refs/remotes/origin/main;
        if [ "$(git rev-parse --is-shallow-repository)" = true ];
        then git fetch --quiet --no-tags --unshallow origin "$main";
        else git fetch --quiet --no-tags origin "$main"; fi
      publish-validation-report: true
      comment-marker: support-catalog
    permissions:
      contents: read
      pull-requests: write

  file-breakdown:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-publish-file-breakdown.yml
    permissions:
      contents: read
      pull-requests: write

  notify-failure:
    needs: [quality, shell-tests, python-tests, caller-permissions, support-catalog]
    if: failure() && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-main-failure-notifier.yml
    with:
      workflow-key: ci
    permissions:
      actions: read
      contents: read
      issues: write
