    azure.archive.ubuntu.com:80 security.ubuntu.com:80 fulcio.sigstore.dev:443 rekor.sigstore.dev:443
    timestamp.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
    sigstore-tuf-root.storage.googleapis.com:443",
