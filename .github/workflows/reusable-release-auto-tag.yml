---
name: "Reusable: Release Auto Tag"

"on":
  workflow_call:
    inputs:
      version:
        description: >-
          Version override (e.g., 1.2.3). Leave empty to detect from the
          configured version-source (commit or cargo).
        required: false
        type: string
        default: ""
      version-source:
        description: >-
          Version detection source: commit (default) reads chore(release): from
          HEAD; cargo reads [package] or [workspace.package] from version-file
        required: false
        type: string
        default: "commit"
      version-file:
        description: "Cargo.toml path when version-source is cargo"
        required: false
        type: string
        default: "Cargo.toml"
      skip-if-unchanged:
        description: >-
          Skip tagging when the resolved version matches the latest tag version
        required: false
        type: boolean
        default: false
      tag-prefix:
        description: "Prefix for the release tag"
        required: false
        type: string
        default: "v"
      create-release:
        description: "Create a GitHub Release after tagging"
        required: false
        type: boolean
        default: true
      tooling-ref:
        # yamllint disable-line rule:line-length
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false
      egress-policy:
        description: "harden-runner egress policy (block only; audit rejected)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh.
          Accepted presets: github-minimal, github-tooling. Any other name fails (#1623)
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"
      job-name:
        description: "GitHub check name for the release job"
        required: false
        type: string
        default: "Create Release"
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 20
      report-failures:
        description: >-
          When true, open or update a deduplicated GitHub issue when the release
          job fails on the target branch
        required: false
        type: boolean
        default: true
      failure-issue-labels:
        description: Comma-separated labels for auto-opened release failure issues
        required: false
        type: string
        default: "bug,ci,release,automation,infrastructure"
      failure-target-branch:
        description: >-
          Branch name for failure notifications. Empty uses the repository default
          branch.
        required: false
        type: string
        default: ""

    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false
      LGTM_CI_TOOLING_APP_CLIENT_ID:
        description: >-
          Optional client ID of a GitHub App installed on the lgtm-ci tooling
          repository only, with contents: read. Together with the App's
          private key, each job mints a short-lived token used only by the
          tooling checkouts, in place of the stored tooling token. Pass both
          App secrets or neither (#1622).
        required: false
      LGTM_CI_TOOLING_APP_PRIVATE_KEY:
        description: >-
          Optional private key of the tooling GitHub App. Pass it together
          with the App's client ID (#1622).
        required: false
      RELEASE_APP_ID:
        description: >-
          GitHub App ID for creating release tokens. Set RELEASE_APP_CLIENT_ID
          or RELEASE_APP_ID; the client ID is preferred when both are set.
        required: false
      RELEASE_APP_CLIENT_ID:
        description: >-
          GitHub App client ID (preferred over RELEASE_APP_ID when both are
          set).
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: "GitHub App private key for creating release tokens"
        required: true

env:
  # Egress presets rendered from scripts/ci/lib/egress/presets.sh by
  # scripts/ci/egress/sync-workflow-presets.sh — do not edit by hand. Every
  # harden-runner step below indexes this map by expression: the
  # step-security pre hook installs the agent before any step runs, so the
  # allowlist must be composed from literals and inputs only (#412/#420/#913).
  # lgtm-ci-egress-accepts: github-minimal,github-tooling
  # lgtm-ci-egress-presets:begin
  LGTM_CI_EGRESS_PRESETS: >-
    {"github-minimal":"github.com:443 api.github.com:443 codeload.github.com:443
    objects.githubusercontent.com:443 pipelines.actions.githubusercontent.com:443",
    "github-tooling":"github.com:443 api.github.com:443 codeload.github.com:443
    objects.githubusercontent.com:443 raw.githubusercontent.com:443
    release-assets.githubusercontent.com:443 uploads.github.com:443
    pipelines.actions.githubusercontent.com:443"}
  # lgtm-ci-egress-presets:end

jobs:
  auto-tag:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      # Distinct from the caller's workflow-level group to avoid
      # a self-deadlock when a same-repo caller also serializes on
      # "release-auto-tag-${repo}".
      group: reusable-release-auto-tag-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write

    env:
      # lgtm-ci-inline:begin tooling-app-flags
      # Tooling App secrets present? A step `if:` cannot read secrets (#1622).
      LGTM_CI_TOOLING_APP_ID_SET: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' }}
      LGTM_CI_TOOLING_APP_KEY_SET: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '' }}
      # lgtm-ci-inline:end tooling-app-flags

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'],
            inputs.allowed-endpoints) }}
      - name: Verify harden-runner agent
        id: verify-harden-runner
        # Every runner (#1203): rejects non-block egress; checks the agent on hosted Linux.
        shell: bash
        env:
          EGRESS_POLICY: ${{ inputs.egress-policy }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # lgtm-ci-inline:begin verify-harden-runner-agent
          # harden-runner exits 0 when its agent fails to start (#1203). Source:
          # scripts/ci/bootstrap/verify-harden-runner-agent.sh
          if [[ "${EGRESS_POLICY:-}" != block ]]; then
            printf '::error title=egress-policy rejected::egress-policy %q is not accepted. ' \
              "${EGRESS_POLICY:-}"
            echo "Set egress-policy: block with an allow-list (egress-preset/allowed-endpoints)"
            exit 1
          fi
          case "${RUNNER_ENVIRONMENT:-}/${RUNNER_OS:-}" in
            github-hosted/Linux) ;;
            self-hosted/?*)
              # A public repository on a self-hosted runner is never intended (#1552):
              # fork pull requests could run there. Empty (no payload) is not public.
              # No exemption for GitHub Enterprise Server (owner decision): a public
              # repository there must be made internal or private to run.
              if [[ "${REPOSITORY_PRIVATE:-}" == false ]]; then
                echo "::error title=public repository on self-hosted runner::a public" \
                  "repository must not run on a self-hosted runner (RUNNER_OS=${RUNNER_OS}):" \
                  "fork pull requests could run code there. Use a GitHub-hosted runner" \
                  "(check the runner variable or runner-image input), or make the" \
                  "repository internal or private"
                exit 1
              fi
              line="harden-runner egress enforcement not verified; this job may run"
              line+=" without enforcement (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT},"
              line+=" RUNNER_OS=${RUNNER_OS})"
              echo "::warning title=hardening not verified::$line"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
              ;;
            github-hosted/?*)
              echo "::notice title=hardening not verified::harden-runner is not verified on" \
                "this runner (${RUNNER_ENVIRONMENT} ${RUNNER_OS}); no egress enforcement claimed"
              exit 0
              ;;
            *)
              echo "::error title=unknown runner::RUNNER_ENVIRONMENT and RUNNER_OS are required"
              exit 1
              ;;
          esac
          root="${HARDEN_RUNNER_ROOT:-}"
          failed="::error title=harden-runner agent failed::"
          reason=""
          if [[ -e "$root/.dockerenv" || -e "$root/run/.containerenv" ]]; then
            reason="container job"
          elif [[ -z "${USER:-}" ]]; then
            reason="no USER, e.g. ubuntu-slim"
          elif ! command -v systemctl > /dev/null; then
            reason="no systemd"
          elif [[ ! -e "$root/etc/systemd/system/agent.service" ]]; then
            reason="agent not installed (API 409 unavailable, skip-harden-runner property,"
            reason+=" or install error)"
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=harden-runner unavailable::harden-runner agent unavailable" \
              "on this runner ($reason): use a supported GitHub-hosted Linux runner"
            exit 1
          fi
          status_file="$root/home/agent/agent.status"
          deadline=$(($(date +%s) + 60))
          while true; do
            if ! systemctl is-active --quiet agent.service; then
              echo "${failed}agent.service is not active; egress is not enforced"
              exit 1
            fi
            status=""
            if [[ -e "$status_file" ]] && ! status="$(< "$status_file")"; then
              echo "${failed}cannot read /home/agent/agent.status"
              exit 1
            fi
            case "$status" in
              Initialized) break ;;
              "") ;; # Not written yet: file creation can precede the status write.
              *)
                printf '%sunexpected agent status %q\n' "$failed" "$status"
                exit 1
                ;;
            esac
            if (($(date +%s) >= deadline)); then
              echo "${failed}agent.status is not Initialized after 60s"
              exit 1
            fi
            sleep 1
          done
          # The agent writes Initialized before it reads its setup error channel, so a
          # setup error can revert it just after: settle, then look again.
          sleep "${HARDEN_RUNNER_SETTLE_SECONDS:-3}"
          if ! systemctl is-active --quiet agent.service; then
            echo "${failed}agent.service stopped just after Initialized; egress is not enforced"
            exit 1
          fi
          # Match only the agent's own messages: WriteLog prefixes each line with
          # "Mon, 02 Jan 2006 15:04:05 GMT:", and root-process arguments it logs must
          # not match. An argument with a newline could still forge a line, but no job
          # step has run yet. grep exit 2 (unreadable log) fails closed.
          agent_log="$root/home/agent/agent.log"
          stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
          stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
          grep_status=1
          if [[ -e "$agent_log" ]]; then
            grep_status=0
            grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
              "$agent_log" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "${failed}agent.log reports a reverted initialization; egress is not enforced"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/agent.log; egress enforcement is unproven"
              exit 1
              ;;
          esac
          # Without a subscription the agent turns a private repository's block into
          # audit, notes it in annotation.log and still reports Initialized.
          annotations="$root/home/agent/annotation.log"
          grep_status=1
          if [[ -e "$annotations" ]]; then
            grep_status=0
            grep -q 'subscription is required' "$annotations" || grep_status=$?
          fi
          case "$grep_status" in
            0)
              echo "::error title=StepSecurity subscription required::private repository" \
                "without a StepSecurity subscription: the agent downgraded block to audit." \
                "Resolve the repository's StepSecurity subscription or enrollment;" \
                "another runner will not help"
              exit 1
              ;;
            1) ;;
            *)
              echo "${failed}cannot read /home/agent/annotation.log; egress-policy is unproven"
              exit 1
              ;;
          esac
          agent_json="$root/home/agent/agent.json"
          if [[ ! -e "$agent_json" ]]; then
            echo "${failed}/home/agent/agent.json is missing; egress-policy block is unproven"
            exit 1
          fi
          if ! grep -q '"egress_policy":"block"' "$agent_json"; then
            echo "${failed}the agent configuration does not carry egress_policy block"
            exit 1
          fi
          echo "harden-runner agent is active and initialized with egress-policy block"
          # lgtm-ci-inline:end verify-harden-runner-agent
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lgtm-ci-inline:begin tooling-app-mint
      - name: Check tooling App credential
        id: tooling-app-target
        # Only when a tooling consumer will run and an App secret is set (#1622).
        if: >-
          env.LGTM_CI_TOOLING_APP_NEEDED != 'false'
          && (env.LGTM_CI_TOOLING_APP_ID_SET == 'true' || env.LGTM_CI_TOOLING_APP_KEY_SET == 'true')
        shell: bash
        env:
          TOOLING_REPOSITORY: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          SHAPE: ^([A-Za-z0-9][A-Za-z0-9_-]*)/([A-Za-z0-9._-]+)$
          INCOMPLETE: >-
            ::error title=incomplete tooling App credential::pass both
            LGTM_CI_TOOLING_APP_CLIENT_ID and LGTM_CI_TOOLING_APP_PRIVATE_KEY, or neither
          UNREADABLE: >-
            ::error title=unreadable tooling repository::cannot split the tooling
            repository into an owner and a name
        run: |
          [[ "${LGTM_CI_TOOLING_APP_ID_SET}" == "${LGTM_CI_TOOLING_APP_KEY_SET}" ]] || { echo "${INCOMPLETE}"; exit 1; }
          [[ "${TOOLING_REPOSITORY}" =~ ${SHAPE} ]] || { echo "${UNREADABLE}"; exit 1; }
          printf 'owner=%s\nrepository=%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" >> "${GITHUB_OUTPUT}"
      - name: Mint tooling App token
        id: tooling-app-token
        # Tooling repository only, asks for contents: read only (#1622).
        if: steps.tooling-app-target.outputs.repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
          private-key: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
          owner: ${{ steps.tooling-app-target.outputs.owner }}
          repositories: ${{ steps.tooling-app-target.outputs.repository }}
          permission-contents: read
      # lgtm-ci-inline:end tooling-app-mint
      - name: Checkout lgtm-ci bootstrap tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
            scripts/ci/
          sparse-checkout-cone-mode: true
          # App requested: the minted token or a sentinel that cannot
          # authenticate, never a weaker fallback (#1622).
          token: >-
            ${{ (secrets.LGTM_CI_TOOLING_APP_CLIENT_ID != '' || secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY != '')
            && (steps.tooling-app-token.outputs.token || 'no-tooling-app-token')
            || secrets.LGTM_CI_TOOLING_TOKEN || github.token }}
          persist-credentials: false
      - name: Warn on explicit tooling-ref override
        # hashFiles guards callers that pin a tooling-ref predating the script.
        if: >-
          inputs.tooling-ref != ''
          && hashFiles('.lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh') != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh
      - name: Refuse a diverging tooling-ref
        # Workflow-owned: generated from check-tooling-ref-divergence.sh by
        # sync_inline_blocks.py, so the override tree never judges itself (#1450).
        # GHES (empty job.workflow_sha) skips with a notice.
        if: inputs.tooling-ref != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ALLOW_DIVERGENCE: ${{ inputs.tooling-ref-allow-divergence }}
        run: |
          # lgtm-ci-inline:begin refuse-diverging-tooling-ref
          # Workflow-owned: the tooling tree under judgment never supplies this guard.
          set -euo pipefail

          override="${TOOLING_REF_OVERRIDE:-}"
          if [[ -z "${override}" ]]; then
            exit 0
          fi

          workflow_sha="${WORKFLOW_SHA:-}"
          if [[ -z "${workflow_sha}" ]]; then
            notice="job.workflow_sha is unavailable on this platform;"
            notice+=" skipping the divergence check for tooling-ref ${override}"
            echo "::notice title=tooling-ref divergence::${notice}"
            exit 0
          fi

          tooling_dir="${TOOLING_DIR:-.lgtm-ci-tooling}"
          if ! tooling_sha="$(git -C "${tooling_dir}" rev-parse HEAD 2> /dev/null)"; then
            echo "::error title=tooling-ref divergence::could not resolve HEAD" \
              "of the tooling checkout at ${tooling_dir}"
            exit 1
          fi

          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          if [[ "$(lower "${tooling_sha}")" == "$(lower "${workflow_sha}")" ]]; then
            exit 0
          fi

          detail="tooling-ref ${override} resolved to ${tooling_sha},"
          detail+=" but this workflow runs at ${workflow_sha} (job.workflow_sha)"
          if [[ "${ALLOW_DIVERGENCE:-}" == "true" ]]; then
            echo "::warning title=tooling-ref divergence::${detail};" \
              "continuing because tooling-ref-allow-divergence is true (GHES/mirror escape hatch)"
            exit 0
          fi

          echo "::error title=tooling-ref divergence::${detail}." \
            "Workflow YAML at one commit would run scripts from another." \
            "tooling-ref is deprecated (#995): remove tooling-ref so tooling follows the workflow pin." \
            "GHES or mirror callers that must diverge can set tooling-ref-allow-divergence: true."
          exit 1
          # lgtm-ci-inline:end refuse-diverging-tooling-ref
      - name: Resolve tooling ref
        id: tooling
        shell: bash
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          # On GHES job.workflow_sha is empty; the explicit override must
          # still satisfy older resolver scripts that require WORKFLOW_SHA.
          WORKFLOW_SHA: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/release/resolve-tooling-ref.sh
      - name: Select GitHub App credential
        id: app-cred
        shell: bash
        # At least one of RELEASE_APP_CLIENT_ID / RELEASE_APP_ID must be set;
        # the client ID wins when both are (e.g. `secrets: inherit` callers).
        # The choice is written to step outputs so the mint step never needs
        # `secrets.*` in an `if:`. The action treats an empty sibling input as
        # absent (`client-id || app-id`).
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
        run: |
          # lgtm-ci-inline:begin select-app-credential
          if [[ -z "${APP_ID}" && -z "${APP_CLIENT_ID}" ]]; then
            echo "::error title=missing App credential::set RELEASE_APP_CLIENT_ID or RELEASE_APP_ID"
            exit 1
          fi
          if [[ -n "${APP_CLIENT_ID}" ]]; then
            if [[ -n "${APP_ID}" ]]; then
              echo "::notice title=RELEASE_APP_ID ignored::both are set; using RELEASE_APP_CLIENT_ID"
            fi
            APP_ID=""
          fi
          {
            echo "app-id=${APP_ID}"
            echo "client-id=${APP_CLIENT_ID}"
          } >> "${GITHUB_OUTPUT}"
          # lgtm-ci-inline:end select-app-credential
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.app-cred.outputs.app-id }}
          client-id: ${{ steps.app-cred.outputs.client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to the calling repository (#849): tags, releases and the
          # floating tag are all written here. A cross-repository write
          # (e.g. a Homebrew tap dispatch) belongs to an explicit input, not
          # to a wider default.
          repositories: ${{ github.event.repository.name }}
          # Scopes are declared explicitly so the token's reach is visible
          # here rather than silently tracking the App's configuration.
          # `workflows` is required by "Update floating tag": moving `v0`
          # onto a commit whose range touches `.github/workflows/**` is
          # rejected as a workflow update without it (see #698).
          # NOTE: create-github-app-token errors when asked for a permission
          # the installation does not hold — the App must be granted
          # `Workflows: Read and write` before this merges.
          permission-contents: write
          permission-workflows: write
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the commit that triggered this run: an unpinned checkout
          # floats to the branch tip, so a commit landing in the trigger→
          # checkout window makes guard-release-commit read the wrong commit
          # and permanently skip the tag (observed: lgtm-hq/Rustume v0.29.1,
          # three release PRs merged with no tag cut).
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
