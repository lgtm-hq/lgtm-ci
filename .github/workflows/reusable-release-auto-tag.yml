  # lgtm-ci-egress-presets:end

jobs:
  auto-tag:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      # Distinct from the caller's workflow-level group to avoid
      # a self-deadlock when a same-repo caller also serializes on
      # "release-auto-tag-${repo}".
      group: reusable-release-auto-tag-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'github-tooling'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci bootstrap tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Warn on explicit tooling-ref override
        # hashFiles guards callers that pin a tooling-ref predating the script.
        if: >-
          inputs.tooling-ref != ''
          && hashFiles('.lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh') != ''
        shell: bash
        env:
          TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh
      - name: Resolve tooling ref
        id: tooling
        shell: bash
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          # On GHES job.workflow_sha is empty; the explicit override must
          # still satisfy older resolver scripts that require WORKFLOW_SHA.
          WORKFLOW_SHA: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/release/resolve-tooling-ref.sh
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to the calling repository (#849): tags, releases and the
          # floating tag are all written here. A cross-repository write
          # (e.g. a Homebrew tap dispatch) belongs to an explicit input, not
          # to a wider default.
          repositories: ${{ github.event.repository.name }}
          # Scopes are declared explicitly so the token's reach is visible
          # here rather than silently tracking the App's configuration.
          # `workflows` is required by "Update floating tag": moving `v0`
          # onto a commit whose range touches `.github/workflows/**` is
          # rejected as a workflow update without it (see #698).
          # NOTE: create-github-app-token errors when asked for a permission
          # the installation does not hold — the App must be granted
          # `Workflows: Read and write` before this merges.
          permission-contents: write
          permission-workflows: write
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the commit that triggered this run: an unpinned checkout
          # floats to the branch tip, so a commit landing in the trigger→
          # checkout window makes guard-release-commit read the wrong commit
          # and permanently skip the tag (observed: lgtm-hq/Rustume v0.29.1,
          # three release PRs merged with no tag cut).
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ steps.tooling.outputs.ref }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Guard release commit
        id: guard
        shell: bash
        run: .lgtm-ci-tooling/scripts/ci/release/guard-release-commit.sh
      - name: Resolve version
        # yamllint disable-line rule:line-length
        if: steps.guard.outputs.is-release-commit == 'true' || inputs.version != ''
        id: version
        shell: bash
        env:
          VERSION_SOURCE: >-
            ${{ inputs.version != '' && 'commit' || inputs.version-source }}
          VERSION_FILE: ${{ inputs.version-file }}
          COMMIT_MESSAGE: >-
            ${{ inputs.version != ''
                && format('chore(release): version {0}', inputs.version)
                || '' }}
        run: .lgtm-ci-tooling/scripts/ci/release/resolve-auto-tag-version.sh
      - name: Detect previous tag version
        if: >-
          steps.version.outputs.found == 'true' &&
          inputs.skip-if-unchanged
        id: previous-version
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: .lgtm-ci-tooling/scripts/ci/release/detect-previous-tag-version.sh
      - name: Check version unchanged
        if: >-
          steps.version.outputs.found == 'true' &&
          inputs.skip-if-unchanged
        id: unchanged
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.previous-version.outputs.version }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: .lgtm-ci-tooling/scripts/ci/release/check-version-unchanged.sh
      - name: Configure git with app token
        # yamllint disable-line rule:line-length
        if: >-
          steps.version.outputs.found == 'true' &&
          (inputs.skip-if-unchanged != true ||
          steps.unchanged.outputs.should-tag == 'true')
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: .lgtm-ci-tooling/scripts/ci/release/configure-git-remote.sh
      - name: Create release tag
        if: >-
          steps.version.outputs.found == 'true' &&
          (inputs.skip-if-unchanged != true ||
          steps.unchanged.outputs.should-tag == 'true')
        id: tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          PUSH: "true"
        run: .lgtm-ci-tooling/scripts/ci/release/create-tag.sh
      - name: Create GitHub release
        if: >-
          steps.version.outputs.found == 'true' &&
          (inputs.skip-if-unchanged != true ||
          steps.unchanged.outputs.should-tag == 'true') &&
          inputs.create-release
        id: github-release
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag-name }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .lgtm-ci-tooling/scripts/ci/release/create-github-release.sh
      - name: Update floating tag
        if: >-
          steps.version.outputs.found == 'true' &&
          (inputs.skip-if-unchanged != true ||
          steps.unchanged.outputs.should-tag == 'true')
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag-name }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          PUSH: "true"
        run: .lgtm-ci-tooling/scripts/ci/release/update-floating-tag.sh
      - name: Release summary
        if: >-
          steps.version.outputs.found == 'true' &&
          (inputs.skip-if-unchanged != true ||
          steps.unchanged.outputs.should-tag == 'true')
        shell: bash
        env:
          SUMMARY_TYPE: release
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.tag.outputs.tag-name }}
          RELEASE_URL: ${{ steps.github-release.outputs.release-url }}
        run: .lgtm-ci-tooling/scripts/ci/release/write-release-summary.sh
      - name: Skip summary
        # yamllint disable-line rule:line-length
        if: >-
          always() &&
          (
            steps.version.outputs.found != 'true' ||
            (inputs.skip-if-unchanged &&
            steps.unchanged.outputs.should-tag == 'false')
          )
        shell: bash
        env:
          IS_RELEASE: ${{ steps.guard.outputs.is-release-commit }}
          VERSION_FOUND: ${{ steps.version.outputs.found }}
          VERSION_UNCHANGED: ${{ steps.unchanged.outputs.unchanged }}
          TAG_EXISTS: ${{ steps.unchanged.outputs.tag-exists }}
        run: .lgtm-ci-tooling/scripts/ci/release/write-skip-summary.sh
  report-release-failure:
    name: Report release automation failure
    needs: [auto-tag]
    if: >-
      always() &&
      inputs.report-failures &&
      needs.auto-tag.result == 'failure'
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: 10
    permissions:
      # Read workflow/job metadata to generate failure context
      actions: read
      # Read repository context for issue body
      contents: read
      # Create or update failure notification issues
      issues: write

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Fixed preset from the literal map in env (not caller-selectable).
          allowed-endpoints: ${{ fromJSON(env.LGTM_CI_EGRESS_PRESETS)['github-minimal'] }}
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Write failure trigger summary
        shell: bash
        env:
          RELEASE_WORKFLOW_KEY: release-auto-tag
          PRIMARY_JOB_FAILED: "true"
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/report-release-failure.sh
          write_trigger_summary
      - name: Notify release failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW_KEY: release-auto-tag
          FAILURE_ISSUE_LABELS: ${{ inputs.failure-issue-labels }}
          FAILURE_TARGET_BRANCH: ${{ inputs.failure-target-branch }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/report-release-failure.sh
          notify_failure
