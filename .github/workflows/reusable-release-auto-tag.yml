            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS"
          # lgtm-ci-inline:end recheck-harden-runner-agent
      - name: Create GitHub release
        if: >-
          steps.version.outputs.found == 'true' &&
          (inputs.skip-if-unchanged != true ||
          steps.unchanged.outputs.should-tag == 'true') &&
          inputs.create-release
        id: github-release
        shell: bash
        env:
