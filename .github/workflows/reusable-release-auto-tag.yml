    "quality":"github.com:443 api.github.com:443 codeload.github.com:443
    release-assets.githubusercontent.com:443 objects.githubusercontent.com:443
    raw.githubusercontent.com:443 pipelines.actions.githubusercontent.com:443
    github-releases.githubusercontent.com:443 ghcr.io:443 pkg-containers.githubusercontent.com:443
    docker.io:443 registry-1.docker.io:443 auth.docker.io:443 production.cloudflare.docker.com:443
