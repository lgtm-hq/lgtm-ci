---
name: "Reusable: Release Auto Tag"

"on":
  workflow_call:
    inputs:
      version:
        description: >-
          Version override (e.g., 1.2.3). Leave empty to detect from the
          configured version-source (commit or cargo).
        required: false
        type: string
        default: ""
      version-source:
        description: >-
          Version detection source: commit (default) reads chore(release): from
          HEAD; cargo reads [package] or [workspace.package] from version-file
        required: false
        type: string
        default: "commit"
      version-file:
        description: "Cargo.toml path when version-source is cargo"
        required: false
        type: string
        default: "Cargo.toml"
      skip-if-unchanged:
        description: >-
          Skip tagging when the resolved version matches the latest tag version
        required: false
        type: boolean
        default: false
      tag-prefix:
        description: "Prefix for the release tag"
        required: false
        type: string
        default: "v"
      create-release:
        description: "Create a GitHub Release after tagging"
        required: false
        type: boolean
        default: true
      tooling-ref:
        # yamllint disable-line rule:line-length
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default github-tooling). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "github-tooling"
      job-name:
        description: "GitHub check name for the release job"
        required: false
        type: string
        default: "Create Release"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 20
      report-failures:
        description: >-
          When true, open or update a deduplicated GitHub issue when the release
          job fails on the target branch
        required: false
        type: boolean
        default: true
      failure-issue-labels:
        description: Comma-separated labels for auto-opened release failure issues
        required: false
        type: string
        default: "bug,ci,release,automation,infrastructure"
      failure-target-branch:
        description: >-
          Branch name for failure notifications. Empty uses the repository default
          branch.
        required: false
        type: string
        default: ""

    secrets:
      RELEASE_APP_ID:
        description: "GitHub App ID for creating release tokens"
        required: true
      RELEASE_APP_PRIVATE_KEY:
        description: "GitHub App private key for creating release tokens"
        required: true

env:
