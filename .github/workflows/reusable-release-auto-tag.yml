        run: .lgtm-ci-tooling/scripts/ci/release/create-github-release.sh
      - name: Recheck harden-runner agent before Update floating tag
        # Pre-publish tripwire (#1551): a stopped agent skips the next step.
        if: >-
          ${{ success() && steps.verify-harden-runner.outcome == 'success' &&
