        shell: bash
        env:
          STEP: cleanup
          GIT_DEPS_HOST: ${{ inputs.git-deps-host }}
          GIT_DEPS_USERNAME: ${{ inputs.git-deps-username }}
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/configure-git-deps-auth.sh"
      - name: Setup pytest
        if: needs.prepare.outputs.pipeline-skip != 'true'
        shell: bash
        env:
          STEP: setup
          COVERAGE: ${{ inputs.coverage }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-pytest.sh
      - name: Run pytest
        if: needs.prepare.outputs.pipeline-skip != 'true'
        id: run
        shell: bash
        env:
          STEP: run
          TEST_PATH: ${{ inputs.test-path }}
          COVERAGE: ${{ inputs.coverage }}
          COVERAGE_FORMAT: ${{ inputs.coverage-format }}
          MARKERS: ${{ inputs.markers }}
          EXTRA_ARGS: ${{ inputs.extra-args }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-pytest.sh
        continue-on-error: true
      # Native report -> results/pytest/<version>/results.json (results.v1,
      # #1080); every tests-* / coverage-percent output is read back from it.
      - name: Parse results
        id: parse
        if: always() && needs.prepare.outputs.pipeline-skip != 'true'
        shell: bash
        env:
          STEP: parse
          RESULTS_FILE: ${{ inputs.working-directory }}/pytest-results.json
          COVERAGE_FILE: >-
            ${{ steps.run.outputs.coverage-file != '' &&
            format('{0}/{1}', inputs.working-directory, steps.run.outputs.coverage-file)
            || '' }}
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
          MATRIX_KEY: python-version
          MATRIX_VALUE: ${{ matrix.python-version }}
          RESULTS_SOURCE_VERSION: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-pytest.sh
      - name: Generate summary
        if: always() && needs.prepare.outputs.pipeline-skip != 'true'
        shell: bash
        env:
          STEP: summary
          RESULTS_FILE: ${{ steps.parse.outputs.results-json }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-pytest.sh
      - name: Check coverage threshold
        id: coverage-gate
        if: inputs.coverage && inputs.coverage-threshold > 0 && needs.prepare.outputs.pipeline-skip != 'true'
        uses: ./.lgtm-ci-tooling/.github/actions/check-coverage-threshold
        with:
          coverage-percent: ${{ steps.parse.outputs.coverage-percent }}
          threshold: ${{ inputs.coverage-threshold }}
      # A gate that fails after the parser wrote the document must reach the
      # document too, or the uploaded artifact would carry a false "passed".
      - name: Record gate verdict in results
        if: always() && (steps.coverage-gate.outcome == 'failure') && needs.prepare.outputs.pipeline-skip != 'true'
        shell: bash
        env:
          RESULTS_FILE: ${{ steps.parse.outputs.results-json }}
          STATUS: failed
        run: bash .lgtm-ci-tooling/scripts/ci/actions/results-update.sh
      - name: Upload matrix test summary
        if: always() && needs.prepare.outputs.pipeline-skip != 'true'
