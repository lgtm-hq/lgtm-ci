  # lgtm-ci-egress-presets:end

jobs:
  prepare:
    name: Prepare Python Matrix
    runs-on: ${{ inputs.runner-image }}
    # Independent short cap: the caller's timeout-minutes bounds the main
    # test job; this coordinator leg keeps its own fixed cap.
    timeout-minutes: 10
    if: >-
      !inputs.pipeline-skip &&
      (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      matrix-count: ${{ steps.matrix.outputs.matrix-count }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'pypi'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'pypi'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Validate compat/coverage contract
        shell: bash
        env:
          MULTI_VERSIONS: ${{ inputs.python-versions }}
          COVERAGE: ${{ inputs.coverage }}
          PUBLISH_TEST_SUMMARY: ${{ inputs.publish-test-summary }}
          PLATFORM: Python
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/validate-test-compat-coverage-contract.sh
      # Every job below depends on prepare, so an invalid prefix fails before
      # any upload or download glob uses it (#1091).
      - name: Validate artifact prefix
        shell: bash
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/validate-artifact-prefix.sh
      - name: Generate Python matrix
        id: matrix
        shell: bash
        env:
          MATRIX_KEY: python-version
          MATRIX_LABEL: Python
          DEFAULT_VERSION: ${{ inputs.python-version || '3.12' }}
          VERSIONS_INPUT: ${{ inputs.python-versions }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/generate-version-matrix.sh
  test:
    name: ${{ inputs.job-name }}
    needs: prepare
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # The secrets context is not available in a step `if`; the opt-in
      # private-dependency auth steps (#1021) gate on this job-level flag.
      GIT_DEPS_TOKEN_PRESENT: ${{ secrets.GIT_DEPS_TOKEN != '' }}
    if: >-
      !inputs.pipeline-skip &&
      (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    outputs:
      tests-passed: ${{ steps.parse.outputs.tests-passed }}
      tests-failed: ${{ steps.parse.outputs.tests-failed }}
      tests-total: ${{ steps.parse.outputs.tests-total }}
      coverage-percent: ${{ steps.parse.outputs.coverage-percent }}
      passed: ${{ steps.run.outputs.exit-code == '0' }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'pypi'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'pypi'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            .github/actions/
            scripts/ci/
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest
          enable-cache: false
      - name: Setup Python
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: python-install
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/setup-python.sh"
      - name: Cache uv dependencies
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ${{ inputs.working-directory }}/.venv
          # yamllint disable-line rule:line-length
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-
            uv-${{ runner.os }}-
      - name: Configure git auth for private dependencies
        # Opt-in (#1021): runs only when the caller passed GIT_DEPS_TOKEN.
        # Host-scoped insteadOf rewrite so uv's git fetches of locked private
        # sources authenticate; removed again right after the install step.
        if: env.GIT_DEPS_TOKEN_PRESENT == 'true'
        shell: bash
        env:
          STEP: configure
          GIT_DEPS_TOKEN: ${{ secrets.GIT_DEPS_TOKEN }}
          GIT_DEPS_HOST: ${{ inputs.git-deps-host }}
          GIT_DEPS_USERNAME: ${{ inputs.git-deps-username }}
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/configure-git-deps-auth.sh"
      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: deps
          EXTRAS: ${{ inputs.extras }}
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/setup-python.sh"
      - name: Remove git auth for private dependencies
        if: always() && env.GIT_DEPS_TOKEN_PRESENT == 'true'
        shell: bash
        env:
          STEP: cleanup
          GIT_DEPS_HOST: ${{ inputs.git-deps-host }}
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/configure-git-deps-auth.sh"
      - name: Setup pytest
        shell: bash
        env:
          STEP: setup
          COVERAGE: ${{ inputs.coverage }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-pytest.sh
      - name: Run pytest
        id: run
        shell: bash
        env:
          STEP: run
          TEST_PATH: ${{ inputs.test-path }}
          COVERAGE: ${{ inputs.coverage }}
          COVERAGE_FORMAT: ${{ inputs.coverage-format }}
          MARKERS: ${{ inputs.markers }}
          EXTRA_ARGS: ${{ inputs.extra-args }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-pytest.sh
        continue-on-error: true
      - name: Parse results
        id: parse
        if: always()
        shell: bash
        env:
          STEP: parse
          RESULTS_FILE: ${{ inputs.working-directory }}/pytest-results.json
          COVERAGE_FILE: >-
            ${{ steps.run.outputs.coverage-file != '' &&
            format('{0}/{1}', inputs.working-directory, steps.run.outputs.coverage-file)
            || '' }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-pytest.sh
      - name: Generate summary
        if: always()
        shell: bash
        env:
          STEP: summary
          TESTS_PASSED: ${{ steps.parse.outputs.tests-passed }}
          TESTS_FAILED: ${{ steps.parse.outputs.tests-failed }}
          TESTS_SKIPPED: ${{ steps.parse.outputs.tests-skipped }}
          TESTS_TOTAL: ${{ steps.parse.outputs.tests-total }}
          COVERAGE_PERCENT: ${{ steps.parse.outputs.coverage-percent }}
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-pytest.sh
      - name: Check coverage threshold
        id: coverage-gate
        if: inputs.coverage && inputs.coverage-threshold > 0
        uses: ./.lgtm-ci-tooling/.github/actions/check-coverage-threshold
        with:
          coverage-percent: ${{ steps.parse.outputs.coverage-percent }}
          threshold: ${{ inputs.coverage-threshold }}
      - name: Write matrix test summary
        if: always()
        shell: bash
        env:
          MATRIX_KEY: python-version
          MATRIX_VALUE: ${{ matrix.python-version }}
          TESTS_PASSED: ${{ steps.parse.outputs.tests-passed }}
          TESTS_FAILED: ${{ steps.parse.outputs.tests-failed }}
          TESTS_TOTAL: ${{ steps.parse.outputs.tests-total }}
          COVERAGE_PERCENT: ${{ steps.parse.outputs.coverage-percent }}
          PASSED: >-
            ${{
              steps.run.outputs.exit-code == '0'
              && (
                steps.coverage-gate.outcome == 'success'
                || steps.coverage-gate.outcome == 'skipped'
              )
            }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/write-test-summary.sh
      - name: Upload matrix test summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Namespaced by artifact-prefix so two calls in one run keep their
          # own summaries (#1091); the version suffix separates matrix legs.
          name: ${{ inputs.artifact-prefix }}-results-${{ matrix.python-version }}
          path: python-result-${{ matrix.python-version }}/summary.json
          retention-days: 7
          if-no-files-found: error
          # The aggregate job's verdict reads this summary, so no
          # continue-on-error — overwrite only, so a rerun of this same
          # call's leg replaces its earlier attempt. Isolation between calls
          # comes from artifact-prefix, never from overwrite (#728/#752).
          overwrite: true
      - name: Upload coverage report
        if: >-
          always()
          && inputs.upload-coverage
          && inputs.coverage
          && steps.run.outputs.coverage-file != ''
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # No version suffix: this step needs `coverage: true`, and the
          # compat/coverage contract (#345) rejects that with a non-empty
          # `python-versions`, so one call produces exactly one coverage
          # artifact (#756). Two calls in one run are kept apart by
          # artifact-prefix (#1091); the publish job downloads this name.
          name: ${{ inputs.artifact-prefix }}-coverage
          path: |
            ${{ inputs.working-directory }}/${{ steps.run.outputs.coverage-file }}
            ${{ inputs.working-directory }}/pytest-results.json
          retention-days: 7
          if-no-files-found: ignore
          # Feeds the coverage publish path, so no continue-on-error —
          # overwrite only, so a rerun of this same call replaces its earlier
          # attempt. Isolation between calls comes from artifact-prefix,
          # never from overwrite (#728/#752).
          overwrite: true
      - name: Fail on pytest errors
        if: steps.run.outputs.exit-code != '' && steps.run.outputs.exit-code != '0'
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/fail-with-exit-code.sh
  aggregate:
    name: Aggregate Python Results
    needs:
      - prepare
      - test
    if: >-
      always()
      && !inputs.pipeline-skip
      && (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ${{ inputs.runner-image }}
    # Independent short cap: the caller's timeout-minutes bounds the main
    # test job; this coordinator leg keeps its own fixed cap.
    timeout-minutes: 10
    permissions:
      # `actions: read` is the one scope the REST artifact listing accepts
      # from GITHUB_TOKEN. The pre-aggregation availability wait (#803) polls
      # `GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts` so a leg
      # whose upload succeeded but is not yet listed does not fail the
      # aggregate. A reusable workflow's request is validated statically, so
      # every caller must grant `actions: read` on this call (documented in
      # docs/reusable-workflows.md); it was deliberately absent before #803
      # (#730), when the job only used the runtime-token download action.
      actions: read
      contents: read
    outputs:
      tests-passed: ${{ steps.aggregate.outputs.tests-passed }}
      tests-failed: ${{ steps.aggregate.outputs.tests-failed }}
      tests-total: ${{ steps.aggregate.outputs.tests-total }}
      coverage-percent: ${{ steps.aggregate.outputs.coverage-percent }}
      passed: >-
        ${{ needs.test.result == 'success'
        && (inputs.python-versions == '' || steps.aggregate.outputs.passed == 'true') }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'pypi'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'pypi'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Fail if matrix preparation did not succeed
        # A failed or cancelled prepare skips the matrix; failing here keeps
        # the required check from reporting a skip, which rulesets treat as a pass.
        if: needs.prepare.result != 'success'
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          echo "::error::Matrix preparation concluded '${PREPARE_RESULT}'; failing the check."
          exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            scripts/ci/
      # Single-version calls (empty `python-versions`) gate on the test job
      # result alone and skip the download: a cost optimisation only, since
      # the glob below is namespaced by artifact-prefix (#1091). That isolates
      # calls that were given distinct prefixes; two calls that both keep the
      # default still share names, and the availability wait keeps the newest
      # artifact per name, so it cannot detect that case.
      # Bounded availability wait, then download (#803): the artifact listing
      # is eventually consistent, so a one-shot download can miss a leg whose
      # upload already succeeded. Only under-counts and 404s on a listed id are
      # retried; an over-count fails at once as sibling contamination (#752).
      - name: Wait for and download matrix test summaries
        if: inputs.python-versions != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_DIR: python-results
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          MATRIX_KEY: python-version
          EXPECTED_COUNT: ${{ needs.prepare.outputs.matrix-count }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          # A leg that was cancelled or crashed before uploading never shows
          # up; the aggregate still fails closed, so do not spend the full
          # budget waiting for it.
          WAIT_BUDGET_SECONDS: ${{ needs.test.result == 'success' && '90' || '10' }}
        run: >-
          bash .lgtm-ci-tooling/scripts/ci/actions/wait-for-artifacts.sh
          "$EXPECTED_COUNT" "${ARTIFACT_PREFIX}-results-*"
      - name: Aggregate matrix test summaries
        id: aggregate
        if: inputs.python-versions != ''
        shell: bash
        env:
          RESULTS_DIR: python-results
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/aggregate-results.sh
      - name: Fail if any matrix leg failed
        # Fail closed (#1058): rulesets require this context directly, so a
        # failing matrix leg must fail the job, not just set `passed=false`.
        if: >-
          always()
          && (
            needs.test.result != 'success'
            || (inputs.python-versions != '' && steps.aggregate.outputs.passed != 'true')
          )
        shell: bash
        run: |
          echo "::error::A matrix test leg failed or its results could not be aggregated; failing the check."
          exit 1
  publish-test-summary:
    needs:
      - test
      - aggregate
    if: >-
      always()
      && (
        needs.aggregate.result == 'success'
        || needs.aggregate.result == 'failure'
        || needs.aggregate.result == 'skipped'
      )
      && (
        needs.test.result == 'success'
        || needs.test.result == 'failure'
      )
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
      && inputs.publish-test-summary
      && !inputs.pipeline-skip
      && (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    uses: ./.github/workflows/reusable-publish-test-summary.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      test-suite-name: ${{ inputs.job-name }}
      comment-marker: ${{ inputs.comment-marker }}
      tests-passed: >-
        ${{ inputs.python-versions != '' && needs.aggregate.outputs.tests-passed ||
        needs.test.outputs.tests-passed }}
      tests-failed: >-
        ${{ inputs.python-versions != '' && needs.aggregate.outputs.tests-failed ||
        needs.test.outputs.tests-failed }}
      tests-total: >-
        ${{ inputs.python-versions != '' && needs.aggregate.outputs.tests-total ||
        needs.test.outputs.tests-total }}
      coverage-percent: >-
        ${{ inputs.python-versions != '' && needs.aggregate.outputs.coverage-percent ||
        needs.test.outputs.coverage-percent }}
      coverage-enabled: ${{ inputs.coverage }}
      coverage-threshold: ${{ inputs.coverage-threshold }}
      job-result: >-
        ${{ inputs.python-versions != '' &&
        (needs.aggregate.outputs.passed == 'true' && 'success' || 'failure') ||
        needs.test.result }}
      rich-coverage-comment: ${{ inputs.coverage }}
      # Same name the test job uploaded (#1091): the rich coverage comment
      # must read this call's coverage, not a sibling call's.
      coverage-artifact-name: >-
        ${{ inputs.coverage && inputs.upload-coverage
        && format('{0}-coverage', inputs.artifact-prefix) || '' }}
      coverage-file: >-
        ${{ inputs.coverage-format == 'xml' && 'coverage.xml' ||
        (inputs.coverage-format == 'lcov' && 'coverage.lcov' || 'coverage.json') }}
      coverage-format: >-
        ${{ inputs.coverage-format == 'lcov' && 'lcov' ||
        (inputs.coverage-format == 'xml' && 'cobertura' ||
        'coverage-py') }}
      tooling-ref: ${{ inputs.tooling-ref }}
