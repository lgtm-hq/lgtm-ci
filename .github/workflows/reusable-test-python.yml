---
name: Reusable Python Test Workflow

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"
      python-versions:
        description: "Comma-separated Python versions for a test matrix"
        required: false
        type: string
        default: ""
      test-path:
        description: "Path to test files or directory"
        required: false
        type: string
        default: "tests"
      coverage:
        description: "Whether to collect coverage"
        required: false
        type: boolean
        default: false
      coverage-format:
        description: "Coverage output format: xml, json, lcov"
        required: false
        type: string
        default: "json"
      coverage-threshold:
        description: "Minimum coverage percentage to pass"
        required: false
        type: number
        default: 0
      upload-coverage:
        description: "Upload coverage report as artifact"
        required: false
        type: boolean
        default: false
      markers:
        description: "pytest markers to filter tests"
        required: false
        type: string
        default: ""
      extra-args:
        description: "Additional arguments to pass to pytest"
        required: false
        type: string
        default: ""
      extras:
        description: "Comma-separated uv sync extras (e.g. dev,full)"
        required: false
        type: string
        default: ""
      git-deps-host:
        description: >-
          Host the optional GIT_DEPS_TOKEN secret authenticates against for
          private git dependencies (#1021). Only this host's https:// URLs are
          rewritten; the host must also be reachable under the job's egress
          allowlist (github.com is in the pypi preset).
        required: false
        type: string
        default: "github.com"
      git-deps-username:
        description: >-
          Username paired with GIT_DEPS_TOKEN in the rewritten URL. GitHub App
          installation tokens and fine-grained PATs use x-access-token.
        required: false
        type: string
        default: "x-access-token"
      working-directory:
        description: "Working directory for running tests"
        required: false
        type: string
        default: "."
      publish-test-summary:
        description: >-
          Publish or update the test summary comment on the pull request for this workflow run (rich
          coverage table when coverage is enabled, otherwise test pass/fail totals)
        required: false
        type: boolean
        default: true
      comment-marker:
        description: "Upsert marker for the Python test summary comment"
        required: false
        type: string
        default: "python-test-results"
      comment-history:
        description: >-
          Keep earlier runs of the test summary comment in a collapsible "Previous
          runs" archive under the latest result (#1346); false overwrites it on
          every run
        required: false
        type: boolean
        default: false
      comment-history-limit:
        description: >-
          Earlier runs the archive keeps when comment-history is true (0 =
          unlimited within the 60,000-byte comment budget)
        required: false
        type: number
        default: 3
      artifact-prefix:
        description: >-
          Namespace for this call's artifacts (<prefix>-coverage,
          <prefix>-results-<version>); give a second call in the same run
          its own prefix so the two calls' coverage and result summaries do
          not overwrite each other (#1091). Must match [A-Za-z0-9_.]+ ('-'
          separates prefix from the rest of the name)
        required: false
        type: string
        default: "python"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""
      tooling-ref-allow-divergence:
        description: >-
          GHES/mirror escape hatch only. By default a tooling-ref that checks
          out a commit other than job.workflow_sha fails the job (#1368); set
          true to downgrade that failure to a warning. Removing tooling-ref
          is the real fix (#995).
        required: false
        type: boolean
        default: false

      egress-policy:
        description: "harden-runner egress policy (block only; audit rejected)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default pypi). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "pypi"
      job-name:
        description: "GitHub check name for the test job"
        required: false
        type: string
        default: "Python Tests"
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
        required: false
        type: string
        default: ""
      draft-pr-skip:
        description: "Skip jobs on draft pull requests"
        required: false
        type: boolean
        default: true
      pipeline-skip:
        description: >-
          Opt in to lightweight test jobs for pipeline-irrelevant pull requests
          (e.g. docs-only). Matrix jobs run with their normal check names, without
          installing dependencies or running tests. Other events, including main
          pushes and merge_group, always run full tests. Unknown changes must
          leave this false. Keep the reusable caller running to retain contexts.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 60
    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false
      GIT_DEPS_TOKEN:
        description: >-
          Optional token for private git dependencies (#1021). When set, a
          host-scoped git `url.<...>.insteadOf` rewrite embedding the token
          for `git-deps-host` is configured immediately before
          `uv sync --frozen` and removed right after. Pass it explicitly; this
          workflow never uses `secrets: inherit`.
        required: false

    outputs:
      # Every value below is read from this call's results.v1 documents by
      # the aggregate job (#1080): the same numbers the matrix legs wrote,
      # for a single version and a matrix alike.
      tests-passed:
        description: "Number of tests passed"
        value: ${{ jobs.prepare.outputs.pipeline-skip == 'true' && '0' || jobs.aggregate.outputs.tests-passed }}
      tests-failed:
        description: "Number of tests failed"
        value: ${{ jobs.prepare.outputs.pipeline-skip == 'true' && '0' || jobs.aggregate.outputs.tests-failed }}
      tests-total:
        description: "Total number of tests"
        value: ${{ jobs.prepare.outputs.pipeline-skip == 'true' && '0' || jobs.aggregate.outputs.tests-total }}
      coverage-percent:
        description: "Coverage percentage"
        value: ${{ jobs.prepare.outputs.pipeline-skip == 'true' && '0' || jobs.aggregate.outputs.coverage-percent }}
      passed:
        description: >-
          Whether all tests passed, or all lightweight PR test jobs succeeded.
        value: >-
          ${{ jobs.aggregate.result != 'success' && jobs.aggregate.outputs.passed == 'true' && 'false'
          || jobs.aggregate.outputs.passed }}

