      # Harden-runner and preset validation still execute on this cheap path.
      - name: Pipeline skip
        if: needs.prepare.outputs.pipeline-skip == 'true'
        shell: bash
        run: echo "Pipeline-irrelevant pull request; dependency installation and tests skipped."
      - name: Checkout repository
        if: needs.prepare.outputs.pipeline-skip != 'true'
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        if: needs.prepare.outputs.pipeline-skip != 'true'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
