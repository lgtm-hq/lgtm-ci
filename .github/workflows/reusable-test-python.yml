---
name: Reusable Python Test Workflow

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"
      python-versions:
        description: "Comma-separated Python versions for a test matrix"
        required: false
        type: string
        default: ""
      test-path:
        description: "Path to test files or directory"
        required: false
        type: string
        default: "tests"
      coverage:
        description: "Whether to collect coverage"
        required: false
        type: boolean
        default: false
      coverage-format:
        description: "Coverage output format: xml, json, lcov"
        required: false
        type: string
        default: "json"
      coverage-threshold:
        description: "Minimum coverage percentage to pass"
        required: false
        type: number
        default: 0
      upload-coverage:
        description: "Upload coverage report as artifact"
        required: false
        type: boolean
        default: false
      markers:
        description: "pytest markers to filter tests"
        required: false
        type: string
        default: ""
      extra-args:
        description: "Additional arguments to pass to pytest"
        required: false
        type: string
        default: ""
      extras:
        description: "Comma-separated uv sync extras (e.g. dev,full)"
        required: false
        type: string
        default: ""
      git-deps-host:
        description: >-
          Host the optional GIT_DEPS_TOKEN secret authenticates against for
          private git dependencies (#1021). Only this host's https:// URLs are
          rewritten; the host must also be reachable under the job's egress
          allowlist (github.com is in the pypi preset).
        required: false
        type: string
        default: "github.com"
      git-deps-username:
        description: >-
          Username paired with GIT_DEPS_TOKEN in the rewritten URL. GitHub App
          installation tokens and fine-grained PATs use x-access-token.
        required: false
        type: string
        default: "x-access-token"
      working-directory:
        description: "Working directory for running tests"
        required: false
        type: string
        default: "."
      publish-test-summary:
        description: >-
          Publish or update the test summary comment on the pull request for this workflow run (rich
          coverage table when coverage is enabled, otherwise test pass/fail totals)
        required: false
        type: boolean
        default: true
      comment-marker:
        description: "Upsert marker for the Python test summary comment"
        required: false
        type: string
        default: "python-test-results"
      artifact-prefix:
        description: >-
          Namespace for this call's artifacts (<prefix>-coverage,
          <prefix>-results-<version>); give a second call in the same run
          its own prefix so the two calls' coverage and result summaries do
          not overwrite each other (#1091). Must match [A-Za-z0-9_.]+ ('-'
          separates prefix from the rest of the name)
        required: false
        type: string
        default: "python"
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default pypi). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "pypi"
      job-name:
        description: "GitHub check name for the test job"
        required: false
        type: string
        default: "Python Tests"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      draft-pr-skip:
        description: "Skip jobs on draft pull requests"
        required: false
        type: boolean
        default: true
      pipeline-skip:
        description: >-
          Skip test jobs when the caller determined the diff is pipeline-irrelevant
          (e.g. docs-only). Jobs skipped inside a running reusable still report
          their required nested check contexts as skipped — unlike skipping the
          reusable caller itself, which collapses nested contexts and deadlocks
          merges (py-lintro#1359).
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 60
    secrets:
      GIT_DEPS_TOKEN:
        description: >-
          Optional token for private git dependencies (#1021). When set, a
          host-scoped `url.<https://user:token@host/>.insteadOf` rewrite is
          configured for `git-deps-host` immediately before `uv sync --frozen`
          and removed right after. Pass it explicitly; this workflow never
          uses `secrets: inherit`.
        required: false

    outputs:
      tests-passed:
        description: "Number of tests passed"
        value: >-
          ${{ inputs.pipeline-skip && '0' ||
          inputs.python-versions != '' && jobs.aggregate.outputs.tests-passed ||
          jobs.test.outputs.tests-passed }}
      tests-failed:
        description: "Number of tests failed"
        value: >-
          ${{ inputs.pipeline-skip && '0' ||
          inputs.python-versions != '' && jobs.aggregate.outputs.tests-failed ||
          jobs.test.outputs.tests-failed }}
      tests-total:
        description: "Total number of tests"
        value: >-
          ${{ inputs.pipeline-skip && '0' ||
          inputs.python-versions != '' && jobs.aggregate.outputs.tests-total ||
          jobs.test.outputs.tests-total }}
      coverage-percent:
        description: "Coverage percentage"
        value: >-
          ${{ inputs.pipeline-skip && '0' ||
          inputs.python-versions != '' && jobs.aggregate.outputs.coverage-percent ||
          jobs.test.outputs.coverage-percent }}
      passed:
        description: >-
          Whether all tests passed. Reports 'true' when pipeline-skip is set so
          callers gating on this output treat a skipped pipeline as green.
        value: >-
          ${{ inputs.pipeline-skip && 'true' ||
          inputs.python-versions != '' && jobs.aggregate.outputs.passed ||
          jobs.test.outputs.passed }}

