              ;;
          esac
          stopped="::error title=harden-runner agent stopped::harden-runner agent stopped"
          stopped+=" enforcing mid-job; steps after it ran unhardened"
          if ! systemctl is-active --quiet agent.service; then
            # Detail only: the verdict above is is-active. systemctl show failing
            # leaves the detail empty.
            unit="$(systemctl show agent.service \
              -p ActiveState,SubState,Result,ExecMainStatus 2> /dev/null)" || unit=""
            unit="${unit//$'\n'/ }"
            echo "$stopped (agent.service is not active${unit:+: $unit})"
            exit 1
          fi
          # Which agent the verify step proved, from its step output (#1668).
          case "${HARDEN_RUNNER_AGENT:-}" in
            standard) ;;
            ebpf)
              if [[ "${LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT:-}" != true ]]; then
                echo "::error title=harden-runner agent refused::the eBPF fallback agent is" \
                  "running but LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT is not true"
                exit 1
              fi
              # Its block-mode lines must still be there, and no other policy or revert
              # line of its own may have appeared since (the v1.9.5 binary has
              # "deny-list applied", "failed to apply ...", "Reverted changes" and
              # "Error in Initialization"). Any job step can write agent.log by now, so
              # this cannot prove enforcement: a step can only make it fail.
              log="${HARDEN_RUNNER_ROOT:-}/home/agent/agent.log"
              stamp='[A-Z][a-z]{2}, [0-9]{2} [A-Z][a-z]{2} [0-9]{4} '
              stamp+='[0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]+:'
              for proof in '\[buildInfo\] name=AgentAlpha ' '.*NetMode:ebpf[ }]' \
                '\[tracerManager\] block-policy applied$'; do
                if ! grep -qE -m 1 "^${stamp}${proof}" "$log" 2> /dev/null; then
                  echo "$stopped (agent.log no longer shows the eBPF agent's block mode)"
                  exit 1
                fi
              done
              policy="^${stamp}\[tracerManager\] ([a-z-]+-policy applied|deny-list"
              policy+=" applied|failed to apply )"
              others="$(grep -E "$policy" "$log" 2> /dev/null |
                grep -vE "^${stamp}\[tracerManager\] block-policy applied\$")" || others=""
              if [[ -n "$others" ]]; then
                echo "$stopped (the eBPF agent applied a policy other than block)"
                exit 1
              fi
              if grep -qE "^${stamp}(Reverted changes|Error in Initialization( .*)?)\$" \
                "$log" 2> /dev/null; then
                echo "$stopped (agent.log reports that the eBPF agent reverted)"
                exit 1
              fi
              echo "harden-runner eBPF agent is still active in block mode (accepted" \
                "because LGTM_CI_ALLOW_HARDEN_RUNNER_EBPF_AGENT is true)"
              exit 0
              ;;
            *)
              echo "::error title=harden-runner agent unproven::the verify step did not" \
                "record which agent it verified (steps.verify-harden-runner.outputs.agent)"
              exit 1
              ;;
          esac
          # A revert in progress leaves the unit active but has already restored DNS.
          resolved="${HARDEN_RUNNER_ROOT:-}/etc/systemd/resolved.conf"
          if ! grep -qxF 'DNS=127.0.0.1' "$resolved" 2> /dev/null; then
            echo "$stopped (resolved.conf no longer uses the agent's DNS proxy: revert" \
              "in progress or DNS changed by a step)"
            exit 1
          fi
          echo "harden-runner agent is still active and enforcing DNS"
          # lgtm-ci-inline:end recheck-harden-runner-agent
  publish-test-summary:
    needs:
      - prepare
      - test
      - aggregate
    if: >-
      always()
      && (
        needs.aggregate.result == 'success'
        || needs.aggregate.result == 'failure'
        || needs.aggregate.result == 'skipped'
      )
      && (
        needs.test.result == 'success'
        || needs.test.result == 'failure'
      )
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
      && inputs.publish-test-summary
      && needs.prepare.outputs.pipeline-skip != 'true'
      && (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    uses: ./.github/workflows/reusable-publish-test-summary.yml
    secrets:
      LGTM_CI_TOOLING_TOKEN: ${{ secrets.LGTM_CI_TOOLING_TOKEN }}
      LGTM_CI_TOOLING_APP_CLIENT_ID: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
      LGTM_CI_TOOLING_APP_PRIVATE_KEY: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: ${{ inputs.egress-policy }}
      test-suite-name: ${{ inputs.job-name }}
      comment-marker: ${{ inputs.comment-marker }}
      comment-history: ${{ inputs.comment-history }}
      comment-history-limit: ${{ inputs.comment-history-limit }}
      comment-fields: ${{ inputs.comment-fields }}
      # The comment is rendered from this call's results.v1 artifacts, the
      # same ones the aggregate verdict read (#1080): single version by exact
      # name, matrix by prefix glob.
      results-artifact-pattern: >-
        ${{ inputs.python-versions != '' && format('{0}-results-*', inputs.artifact-prefix)
        || format('{0}-results-{1}', inputs.artifact-prefix, inputs.python-version || '3.12') }}
      results-expected-count: ${{ needs.prepare.outputs.matrix-count }}
      coverage-enabled: ${{ inputs.coverage }}
      coverage-threshold: ${{ inputs.coverage-threshold }}
      job-result: >-
        ${{ needs.aggregate.result == 'success'
        && needs.aggregate.outputs.passed == 'true'
        && 'success' || 'failure' }}
      rich-coverage-comment: ${{ inputs.coverage }}
      # Same name the test job uploaded (#1091): the rich coverage comment
      # must read this call's coverage, not a sibling call's.
      coverage-artifact-name: >-
        ${{ inputs.coverage && inputs.upload-coverage
        && format('{0}-coverage', inputs.artifact-prefix) || '' }}
      coverage-file: >-
        ${{ inputs.coverage-format == 'xml' && 'coverage.xml' ||
        (inputs.coverage-format == 'lcov' && 'coverage.lcov' || 'coverage.json') }}
      coverage-format: >-
        ${{ inputs.coverage-format == 'lcov' && 'lcov' ||
        (inputs.coverage-format == 'xml' && 'cobertura' ||
        'coverage-py') }}
      tooling-ref: ${{ inputs.tooling-ref }}
      tooling-ref-allow-divergence: ${{ inputs.tooling-ref-allow-divergence }}
