          version: latest
          enable-cache: false
      - name: Setup Python
        if: needs.prepare.outputs.pipeline-skip != 'true'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: python-install
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: bash "${{ github.workspace }}/.lgtm-ci-tooling/scripts/ci/actions/setup-python.sh"
      - name: Cache uv dependencies
        if: needs.prepare.outputs.pipeline-skip != 'true'
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ${{ inputs.working-directory }}/.venv
