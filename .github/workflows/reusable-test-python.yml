          # lgtm-ci-inline:end recheck-harden-runner-agent
  aggregate:
    name: Aggregate Python Results
    needs:
      - prepare
      - test
    if: >-
      always()
      && (
        !inputs.draft-pr-skip ||
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    runs-on: ${{ inputs.runner-image || vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    # Independent short cap: the caller's timeout-minutes bounds the main
    # test job; this coordinator leg keeps its own fixed cap.
    timeout-minutes: 10
    permissions:
      # `actions: read` is the one scope the REST artifact listing accepts
      # from GITHUB_TOKEN. The pre-aggregation availability wait (#803) polls
      # `GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts` so a leg
      # whose upload succeeded but is not yet listed does not fail the
      # aggregate. A reusable workflow's request is validated statically, so
      # every caller must grant `actions: read` on this call (documented in
      # docs/reusable-workflows.md); it was deliberately absent before #803
      # (#730), when the job only used the runtime-token download action.
      actions: read
      contents: read
    outputs:
      tests-passed: ${{ steps.aggregate.outputs.tests-passed }}
      tests-failed: ${{ steps.aggregate.outputs.tests-failed }}
      tests-total: ${{ steps.aggregate.outputs.tests-total }}
      tests-xfailed: ${{ steps.aggregate.outputs.tests-xfailed }}
      tests-xpassed: ${{ steps.aggregate.outputs.tests-xpassed }}
      coverage-percent: ${{ steps.aggregate.outputs.coverage-percent }}
      passed: >-
        ${{ job.status == 'success' && needs.prepare.result == 'success' && needs.test.result == 'success'
        && (needs.prepare.outputs.pipeline-skip == 'true' || steps.aggregate.outputs.passed == 'true') }}

    env:
      # Every tooling consumer below runs only when the pipeline is not
      # skipped, so the App token is minted only then (#1622). Must be exactly
      # the Boolean of the consumers' conditions; validate-tooling-token.sh
      # checks it.
      LGTM_CI_TOOLING_APP_NEEDED: ${{ (needs.prepare.outputs.pipeline-skip != 'true') && 'true' || 'false' }}
      # lgtm-ci-inline:begin tooling-app-flags
      # Generated from scripts/ci/bootstrap/tooling-app-flags.yml by
      # sync_inline_blocks.py: edit the source, not this copy. Inline because job
