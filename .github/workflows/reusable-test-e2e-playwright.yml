---
name: Reusable Playwright E2E Test Workflow

on:
  workflow_call:
    inputs:
      job-name:
        description: "GitHub check name for the Playwright E2E job"
        required: true
        type: string
      test-command:
        description: >-
          Base Playwright CLI command (filters project/grep are appended).
          Default: npx playwright test
        required: false
        type: string
        default: "npx playwright test"
      project:
        description: "Playwright --project filter (e.g. chromium, smoke)"
        required: false
        type: string
        default: ""
      grep:
        description: "Playwright --grep filter (e.g. @smoke, @a11y)"
        required: false
        type: string
        default: ""
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      browsers:
        description: >-
          Browsers for playwright install --with-deps (chromium, firefox,
          webkit, space-separated list, or all)
        required: false
        type: string
        default: "chromium"
      upload-report:
        description: "Upload HTML/blob Playwright report artifacts on failure"
        required: false
        type: boolean
        default: true
      report-artifact-name:
        description: >-
          Artifact name for the uploaded Playwright report. Empty resolves to
          playwright-report-<run_id>. Override when a caller runs this workflow
          more than once in a single run, so the sibling calls do not collide
          on one artifact name.
        required: false
        type: string
        default: ""
      base-url:
        description: >-
          Passthrough base URL (exported as BASE_URL and PLAYWRIGHT_BASE_URL)
        required: false
        type: string
        default: ""
      web-server:
        description: >-
          Passthrough web-server hint (exported as PLAYWRIGHT_WEB_SERVER for
          consumer playwright.config)
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory for install and tests"
        required: false
        type: string
        default: "."
      package-manager:
        description: "Package manager for dependency install: npm, bun, pnpm"
        required: false
        type: string
        default: "npm"
      publish-test-summary:
        description: >-
          Publish or update the test summary comment on the pull request for
          this workflow run
        required: false
        type: boolean
        default: true
      comment-marker:
        description: "Unique marker for upserting this workflow's test summary"
        required: false
        type: string
        default: "playwright-e2e-results"
      draft-pr-skip:
        description: "Skip jobs on draft pull requests"
        required: false
        type: boolean
        default: true
      tooling-ref:
        description: >-
          Optional lgtm-ci tooling override; unset tracks the workflow pin
          (job.workflow_sha), set emits a deprecation warning (#995).
        required: false
        type: string
        default: ""

      egress-policy:
        description: "harden-runner egress policy (audit or block)"
        required: false
        type: string
        default: "block"
      # Folded scalar (>-): space-separated host:port for harden-runner pre-hook.
      # Non-empty replace overrides egress-preset — keep in sync with playwright
      # preset (scripts/ci/lib/egress/presets.sh); see #512.
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"

      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default playwright). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "playwright"
      runner-image:
        description: "GitHub-hosted runner image label"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 60

    outputs:
      tests-passed:
        description: "Number of tests passed"
        value: ${{ jobs.test.outputs.tests-passed }}
      tests-failed:
        description: "Number of tests failed"
        value: ${{ jobs.test.outputs.tests-failed }}
      tests-total:
        description: "Total number of tests"
        value: ${{ jobs.test.outputs.tests-total }}
      passed:
        description: "Whether Playwright E2E tests passed"
        value: ${{ jobs.test.outputs.passed }}

env:
