  # lgtm-ci-egress-presets:end

jobs:
  test:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: >-
      !inputs.draft-pr-skip ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    permissions:
      contents: read

    outputs:
      tests-passed: ${{ steps.parse.outputs.tests-passed }}
      tests-failed: ${{ steps.parse.outputs.tests-failed }}
      tests-total: ${{ steps.parse.outputs.tests-total }}
      passed: ${{ steps.run.outputs.exit-code == '0' }}

    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # Pinned to SHA for supply chain security
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'playwright'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'playwright'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha || 'tooling-ref-required' }}
          sparse-checkout: |
            .github/actions/checkout-and-harden
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout and harden
        id: egress
        uses: ./.lgtm-ci-tooling/.github/actions/checkout-and-harden
        with:
          tooling-ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || job.workflow_sha }}
          tooling-repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          tooling-ref-override: ${{ inputs.tooling-ref }}
          sparse-checkout-extra: |
            scripts/ci/
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.2"
      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The pnpm version comes from the project's `packageManager` field;
          # the action reads the repo-root package.json unless told otherwise.
          package_json_file: >-
            ${{ format('{0}/package.json', inputs.working-directory) }}
      - name: Install dependencies
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          FROZEN_LOCKFILE: "true"
        run: bash .lgtm-ci-tooling/scripts/ci/actions/setup-package-manager.sh
      - name: Resolve Playwright cache key
        id: playwright-cache
        shell: bash
        env:
          STEP: cache-key
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          BROWSERS: ${{ inputs.browsers }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-playwright-tests.sh
      - name: Cache Playwright browsers
        # Pinned to SHA for supply chain security
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright-cache.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        shell: bash
        env:
          STEP: install-browsers
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          BROWSERS: ${{ inputs.browsers }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-playwright-tests.sh
      - name: Run Playwright
        id: run
        shell: bash
        env:
          STEP: run
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          TEST_COMMAND: ${{ inputs.test-command }}
          PROJECT: ${{ inputs.project }}
          GREP: ${{ inputs.grep }}
          BASE_URL: ${{ inputs.base-url }}
          WEB_SERVER: ${{ inputs.web-server }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-playwright-tests.sh
        continue-on-error: true
      - name: Parse results
        id: parse
        if: always()
        shell: bash
        env:
          STEP: parse
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          REPORT_PATH: ${{ inputs.working-directory }}/playwright-results.json
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-playwright-tests.sh
      - name: Generate summary
        if: always()
        shell: bash
        env:
          STEP: summary
          TESTS_PASSED: ${{ steps.parse.outputs.tests-passed }}
          TESTS_FAILED: ${{ steps.parse.outputs.tests-failed }}
          TESTS_SKIPPED: ${{ steps.parse.outputs.tests-skipped }}
          TESTS_TOTAL: ${{ steps.parse.outputs.tests-total }}
          BROWSERS: ${{ inputs.browsers }}
          PROJECT: ${{ inputs.project }}
          GREP: ${{ inputs.grep }}
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-playwright-tests.sh
      - name: Evaluate report upload gate
        id: upload-gate
        if: always()
        shell: bash
        env:
          STEP: upload-gate
          UPLOAD_REPORT: ${{ inputs.upload-report }}
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/run-playwright-tests.sh
      # Debug convenience only: nothing downloads this report, and the "Fail on
      # Playwright errors" step below owns the job verdict.
      - name: Upload Playwright report
        id: upload-report
        if: >-
          always()
          && steps.upload-gate.outputs.should-upload == 'true'
        continue-on-error: true
        # Pinned to SHA for supply chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            ${{ inputs.report-artifact-name != '' && inputs.report-artifact-name
            || format('playwright-report-{0}', github.run_id) }}
          path: |
            ${{ inputs.working-directory }}/playwright-report/
            ${{ inputs.working-directory }}/playwright-results.json
            ${{ inputs.working-directory }}/blob-report/
            ${{ inputs.working-directory }}/test-results/
          retention-days: 30
          if-no-files-found: ignore
          # run_id is stable across a rerun of the same run, so a repeated call
          # would 409 without this; the later attempt is authoritative.
          overwrite: true
      - name: Warn on failed report upload
        if: always() && steps.upload-report.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Playwright report upload failed; the test result is unaffected."
      - name: Fail on Playwright errors
        # always(): re-raise even if a prior always() step (report upload) failed
        if: >-
          always()
          && steps.run.outputs.exit-code != ''
          && steps.run.outputs.exit-code != '0'
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/fail-with-exit-code.sh

  publish-test-summary:
    needs: test
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
      && inputs.publish-test-summary
      && (
        !inputs.draft-pr-skip ||
        github.event.pull_request.draft == false
      )
    uses: ./.github/workflows/reusable-publish-test-summary.yml
    permissions:
      contents: read
      # Scoped to upserting the PR test-summary comment only.
      pull-requests: write
    with:
      test-suite-name: ${{ inputs.job-name }}
      comment-marker: ${{ inputs.comment-marker }}
      tests-passed: ${{ needs.test.outputs.tests-passed }}
      tests-failed: ${{ needs.test.outputs.tests-failed }}
      tests-total: ${{ needs.test.outputs.tests-total }}
      job-result: ${{ needs.test.outputs.passed == 'true' && 'success' || 'failure' }}
      tooling-ref: ${{ inputs.tooling-ref }}
