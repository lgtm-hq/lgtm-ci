jobs:
  # Resume npm through the SAME scripts the tag path uses (#965's guard,
  # verify-artifacts, publish-set and verify-published), from the verified
  # original artifacts, under the same live preconditions. A regular job
  # (not a nested `uses:` call) because the recovery artifacts live on the
  # SOURCE run; the scripts, not the wiring, are the shared surface that
  # prevents drift.
  resume-npm:
    name: Resume npm channel
    if: >-
      !inputs.dry-run &&
      inputs.resolve-result == 'success' &&
      inputs.npm-artifact-name != '' &&
      inputs.npm-order != '' &&
      contains(fromJSON(inputs.missing), 'npm')
    runs-on: ${{ inputs.runner-image }}
    # Publish plus the post-publish propagation wait (up to fifteen minutes).
    timeout-minutes: 35
    environment: npm # the caller's approval gate, same as the tag path
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-recover'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-recover'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Set up Node.js
        # Node 24 ships npm >= 11.5.1 (OIDC trusted publishing); never
        # self-upgrade npm in place.
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # The recovery is always a live publish: the same guards the tag path
      # applies fail closed here before anything is downloaded or packed.
      - name: Assert entry workflow is allowlisted
        shell: bash
        env:
          ALLOWED_ENTRY_WORKFLOWS: ${{ inputs.npm-entry-workflows }}
          LIVE: "1"
        run: >-
          .lgtm-ci-tooling/scripts/ci/actions/npm/assert-entry-workflow.sh
      - name: Assert live-publish preconditions
        shell: bash
        env:
          LIVE: "1"
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CHECKSUMS_FILE: ${{ inputs.npm-checksums-file }}
          SIGNER_REPO: ${{ inputs.signer-repo }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          ACCESS: ${{ inputs.npm-access }}
          PROVENANCE: ${{ inputs.npm-provenance == true && '1' || '0' }}
          POST_PUBLISH_VERIFY: "1"
        run: >-
          .lgtm-ci-tooling/scripts/ci/actions/npm/assert-live-publish-inputs.sh
      - name: Download the original npm artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          NPM_ARTIFACT: ${{ inputs.npm-artifact-name }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/recover/download-artifacts.sh
      # Contract step 1 of 3 (same script as the tag path): every file npm
      # would pack must match the manifest and carry an attestation.
      - name: Verify artifacts
        shell: bash
        env:
          PACKAGES_DIR: recovery-artifacts/npm/${{ inputs.npm-packages-dir }}
          ORDER: ${{ inputs.npm-order }}
          CHECKSUMS_FILE: ${{ inputs.npm-checksums-file }}
          FILES: ${{ inputs.npm-files-to-verify }}
          SIGNER_REPO: ${{ inputs.signer-repo }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/actions/npm/verify-artifacts.sh
      # Contract step 2 of 3: the ONLY step that writes to the registry.
      # Already-published packages are skipped (status: skipped) and only the
      # missing ones publish (status: published) — the idempotent set loop.
      - name: Publish package set
        id: publish
        shell: bash
        env:
          PACKAGES_DIR: recovery-artifacts/npm/${{ inputs.npm-packages-dir }}
          ORDER: ${{ inputs.npm-order }}
          DIST_TAG: ${{ inputs.npm-dist-tag }}
          LIVE: "1"
          PROVENANCE: ${{ inputs.npm-provenance == true && '1' || '0' }}
          ACCESS: ${{ inputs.npm-access }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/actions/npm/publish-set.sh
      # Contract step 3 of 3: read-only registry verification, last.
      - name: Verify published packages
        shell: bash
        env:
          PACKAGES_DIR: recovery-artifacts/npm/${{ inputs.npm-packages-dir }}
          ORDER: ${{ inputs.npm-order }}
          DIST_TAG: ${{ inputs.npm-dist-tag }}
          PROVENANCE: ${{ inputs.npm-provenance == true && '1' || '0' }}
          DRY_RUN: "0"
        run: >-
          .lgtm-ci-tooling/scripts/ci/actions/npm/verify-published.sh

  # Resume the GitHub Release through the SAME script the tag path uses;
  # IMMUTABLE_ASSETS=true skips already-published assets with the same digest
  # and fails on a different one, so only the missing assets upload.
  resume-github-release:
    name: Resume GitHub Release channel
    if: >-
      !inputs.dry-run &&
      inputs.resolve-result == 'success' &&
      inputs.release-artifact-name != '' &&
      contains(fromJSON(inputs.missing), 'github-release')
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-recover'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-recover'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Download the original release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          RELEASE_ARTIFACT: ${{ inputs.release-artifact-name }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/recover/download-artifacts.sh
      - name: Verify the original release artifacts against published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARTIFACTS_DIR: recovery-artifacts/release
          CHECKSUMS_FILE: ${{ inputs.release-checksums-file }}
          SIGNER_REPO: ${{ inputs.signer-repo }}
          SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/recover/verify-recovery-artifacts.sh
      - name: Create the release and upload only missing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.tag }}
          GENERATE_NOTES: "true"
          FILE_PATTERNS: "recovery-artifacts/release/*"
          ARTIFACT_PATH: recovery-artifacts/release
          REPO: ${{ github.repository }}
          CHECKSUMS: "true"
          IMMUTABLE_ASSETS: "true"
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/create-github-release.sh

  # Re-send the Homebrew cross-repo dispatch ONLY when the tap lacks the
  # version (the detection probe already proved it).
  resume-homebrew:
    name: Re-dispatch Homebrew
    if: >-
      !inputs.dry-run &&
      inputs.resolve-result == 'success' &&
      inputs.homebrew-dispatch-repo != '' &&
      contains(fromJSON(inputs.missing), 'homebrew')
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-recover'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-recover'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Re-dispatch the tap update workflow
        shell: bash
        env:
          # Cross-repository dispatch needs a credential for the target repo.
          GH_TOKEN: ${{ secrets.homebrew-dispatch-token }}
          REPO: ${{ inputs.homebrew-dispatch-repo }}
          WORKFLOW: ${{ inputs.homebrew-dispatch-workflow }}
          REF: ${{ inputs.homebrew-dispatch-ref }}
          TAG: ${{ inputs.tag }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/recover/redispatch-homebrew.sh

  # Always(): a failed recovery is exactly what the issue must show, and a
  # successful one closes it.
  record:
    name: Record recovery outcome
    needs: [resume-npm, resume-github-release, resume-homebrew]
    if: always()
    runs-on: ${{ inputs.runner-image }}
    timeout-minutes: 10
    permissions:
      # Read run metadata for the run link
      actions: read
      # Read repo context
      contents: read
      # Comment on and close the release-failure issue
      issues: write
    steps:
      - name: Harden runner
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          # Composed from inputs and the literal map in env only: harden-runner's
          # pre hook runs before any step, so nothing computed later can reach it.
          allowed-endpoints: >-
            ${{ (inputs.allowed-endpoints-mode != 'append' && inputs.allowed-endpoints != '')
            && inputs.allowed-endpoints
            || format('{0} {1}',
            fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-recover'],
            inputs.allowed-endpoints) }}
      - name: Fail on unknown egress-preset
        # harden-runner's pre hook already ran with whatever the selector
        # resolved; an unknown name yields an empty baseline, which would
        # surface later as an opaque network error. Fail here by name (#913).
        if: >-
          inputs.egress-policy != 'audit'
          && (inputs.allowed-endpoints-mode == 'append' || inputs.allowed-endpoints == '')
          && fromJSON(env.LGTM_CI_EGRESS_PRESETS)[inputs.egress-preset || 'release-recover'] == null
        shell: bash
        env:
          EGRESS_PRESET: ${{ inputs.egress-preset }}
        run: echo "::error title=unknown egress-preset::not a preset - '${EGRESS_PRESET}'"; exit 1
      - name: Checkout lgtm-ci tooling
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'lgtm-hq/lgtm-ci' }}
          path: .lgtm-ci-tooling
          ref: ${{ inputs.tooling-ref }}
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Record outcome on the release-failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          WORKFLOW_KEY: ${{ inputs.recovery-issue-workflow-key }}
          NPM_RESULT: ${{ needs.resume-npm.result }}
          RELEASE_RESULT: ${{ needs.resume-github-release.result }}
          HOMEBREW_RESULT: ${{ needs.resume-homebrew.result }}
          MISSING_SET: ${{ inputs.missing }}
          UNRESUMABLE_SET: ${{ inputs.unresumable }}
          RESOLVE_RESULT: ${{ inputs.resolve-result }}
          DRY_RUN: ${{ inputs.dry-run == true && '1' || '0' }}
        run: >-
          .lgtm-ci-tooling/scripts/ci/release/recover/record-recovery.sh
