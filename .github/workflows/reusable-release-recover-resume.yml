# Internal resume stage of the release recovery (#1081), called by
# reusable-release-recover.yml after its plan stage: one job per channel the
# plan detected as missing (npm, GitHub Release, Homebrew), each gated on a
# live run, a successful plan and membership in the missing set, and the
# always() record job that comments on (and closes) the release-failure
# issue. All write scopes and the Homebrew token live here. Call the facade,
# not this file: this stage trusts the plan inputs it is given (`missing`,
# `unresumable`, `resolve-result`) and does not repeat the plan's tag and
# source-run gates; it does re-verify the artifacts before publishing. Each job
# keeps its own fixed timeout (the npm resume includes a propagation wait), so
# there is no timeout-minutes input here.
---
name: Reusable Release Recovery (resume)

"on":
  workflow_call:
    inputs:
      missing:
        description: Plan stage's missing set (JSON array)
        required: true
        type: string
      unresumable:
        description: Plan stage's unresumable set (JSON array)
        required: true
        type: string
      resolve-result:
        description: Result of the plan stage (success, failure, cancelled, skipped)
        required: true
        type: string
      tag:
        description: The release tag to recover (e.g. v1.2.3)
        required: true
        type: string
      source-run-id:
        description: Original publish run whose artifacts are the recovery source
        required: true
        type: string
      dry-run:
        description: Detect and summarize only; resume nothing
        required: false
        type: boolean
        default: true
      # --- channel configuration (a channel without config is not applicable)
      npm-artifact-name:
        description: >-
          Source-run artifact holding the staged npm package set (the
          artifact publish-npm-set uploaded from its packages directory)
        required: false
        type: string
        default: ""
      npm-packages-dir:
        description: >-
          Directory INSIDE the artifact containing one subdirectory per
          package. "." when the artifact was uploaded from the packages
          directory itself (the examples/publish-npm-set.yml layout).
        required: false
        type: string
        default: "."
      npm-order:
        description: Package order for the npm resume (meta last), as publish-npm-set takes it
        required: false
        type: string
        default: ""
      npm-dist-tag:
        description: Dist-tag for the npm resume
        required: false
        type: string
        default: latest
      npm-checksums-file:
        description: >-
          SHA256SUMS manifest for the npm artifacts, relative to the npm
          packages directory; entries inside it are relative to that
          directory too
        required: false
        type: string
        default: SHA256SUMS
      npm-files-to-verify:
        description: >-
          Additional artifact globs (relative to the packages directory) to
          verify on top of every file npm would pack
        required: false
        type: string
        default: "[]"
      npm-entry-workflows:
        description: >-
          Allowlisted entry workflow path(s) for npm trusted publishing —
          the consumer's recovery dispatch workflow (e.g.
          .github/workflows/release-recover.yml). Required for a live npm
          resume; the guard fails closed without it.
        required: false
        type: string
        default: ""
      npm-access:
        description: >-
          npm access level; must stay public (provenance and post-publish
          verification need a public package)
        required: false
        type: string
        default: public
      npm-provenance:
        description: Pass --provenance on the npm resume (also automatic under OIDC)
        required: false
        type: boolean
        default: true
      release-artifact-name:
        description: Source-run artifact for the GitHub Release resume
        required: false
        type: string
        default: ""
      release-checksums-file:
        description: >-
          SHA256SUMS manifest inside the release artifact (written by
          reusable-build-python-dist.yml); used to verify the downloaded
          assets and to compare them with any already-published asset
        required: false
        type: string
        default: SHA256SUMS
      homebrew-dispatch-repo:
        description: Repository whose release workflow is re-dispatched when the tap lacks the version
        required: false
        type: string
        default: ""
      homebrew-dispatch-workflow:
        description: Workflow file name (e.g. dispatch-homebrew.yml) to re-dispatch
        required: false
        type: string
        default: ""
      homebrew-dispatch-ref:
        description: Git ref for the re-dispatch (usually the default branch)
        required: false
        type: string
        default: main
      signer-repo:
        description: Repository the artifact attestations must come from (owner/repo)
        required: false
        type: string
        default: ""
      signer-workflow:
        description: >-
          Workflow the artifact attestations must come from: a path inside
          signer-repo (e.g. .github/workflows/build.yml) or fully qualified
        required: false
        type: string
        default: ""
      recovery-issue-workflow-key:
        description: >-
          The notifier workflow-key the release-failure issue was filed
          under, so the recovery outcome lands on that issue
        required: false
        type: string
        default: release-publish
      runner-image:
        description: >-
          Runner label override. Empty (default) resolves to the org variable
          LGTM_CI_RUNNER, else the standard GitHub-hosted label.
          npm trusted publishing and provenance require a GitHub-hosted runner;
          pin runner-image when the org variable selects a self-hosted runner.
        required: false
        type: string
        default: ""
      egress-policy:
        description: harden-runner egress policy (block only; audit rejected)
        required: false
        type: string
        default: block
      allowed-endpoints:
        description: >-
          Extra or replacement host:port list (whitespace-separated) for
          harden-runner. replace mode: a non-empty list is used alone;
          append mode: merged with egress-preset. Composed at job start, so
          it is enforced (#913).
        required: false
        type: string
        default: ""
      allowed-endpoints-mode:
        description: >-
          replace (default): non-empty allowed-endpoints is used instead of
          egress-preset; append: egress-preset plus allowed-endpoints
        required: false
        type: string
        default: "replace"
      egress-preset:
        description: >-
          Named baseline allowlist from scripts/ci/lib/egress/presets.sh
          (default release-recover). Selected at job start inside every harden-runner
          step, so it is enforced (#913).
        required: false
        type: string
        default: "release-recover"
      tooling-ref:
        description: >-
          lgtm-ci commit SHA for the tooling checkout; pin it to the same SHA
          as the `uses:` reference. Kept required here so the tooling an
          operator runs against an older release is an explicit choice
          (other reusables default to job.workflow_sha, #995). Never the
          release tag.
        required: true
        type: string

    secrets:
      LGTM_CI_TOOLING_TOKEN:
        description: >-
          Optional read-only token (contents: read) for the lgtm-ci tooling
          repository, used only by the tooling checkout. Needed when this
          workflow is called from a private mirror; unset uses github.token
          (#1451).
        required: false
      homebrew-dispatch-token:
        description: >-
          Token with `actions: write` on homebrew-dispatch-repo (a GitHub App
          token or fine-grained PAT) for the cross-repository Homebrew
          re-dispatch; github.token cannot dispatch workflows in another
          repository. Required when homebrew-dispatch-repo is set.
        required: false

permissions:
  contents: read


