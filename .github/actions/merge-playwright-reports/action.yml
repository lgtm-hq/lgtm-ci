---
name: "Merge Playwright Reports"
description: "Merge multiple Playwright reports from sharded or matrix test runs"
author: "lgtm-hq"

inputs:
  input-dir:
    description: >-
      Directory containing report artifacts to merge, one subdirectory per
      shard (download-artifact with merge-multiple: false)
    required: false
    default: "playwright-reports"
  output-dir:
    description: "Directory for merged report output"
    required: false
    default: "merged-report"
  report-format:
    description: "Output format: json, html"
    required: false
    default: "html"
  expected-matrix:
    description: >-
      Matrix JSON the shards ran ({"suite": [...], "browser": [...],
      "shard": [...]}). When set, the JSON merge fails unless every
      <artifact-prefix>-<suite>-<browser>-<shard> directory holds exactly one
      results file. Empty skips that check with a warning.
    required: false
    default: ""
  artifact-prefix:
    description: "Shard artifact name prefix, used with expected-matrix"
    required: false
    default: "playwright"
  test-result:
    description: >-
      Result of the job that ran the shards (needs.<job>.result). When it is
      not success, the expected-matrix check reports missing or invalid shard
      reports as warnings and the merge still fails, but without an ::error::
      annotation of its own: the failed test job is the cause.
    required: false
    default: "success"

outputs:
  merged-path:
    description: "Path to merged report"
    value: ${{ steps.merge.outputs.merged-path }}
  report-count:
    description: "Number of reports merged"
    value: ${{ steps.collect.outputs.report-count }}
  total-passed:
    description: "Total tests passed across all reports"
    value: ${{ steps.parse.outputs.total-passed }}
  total-failed:
    description: "Total tests failed across all reports"
    value: ${{ steps.parse.outputs.total-failed }}
  total-skipped:
    description: "Total tests skipped across all reports"
    value: ${{ steps.parse.outputs.total-skipped }}
  shard-counts:
    description: >-
      JSON array of per-report counts from the JSON merge
      ([{"report", "passed", "failed", "skipped"}]); empty after a blob merge
    value: ${{ steps.merge.outputs.shard-counts }}

runs:
  using: "composite"
  steps:
    - name: Resolve scripts directory
      shell: bash
      run: |
        SCRIPTS_DIR="$(cd "${GITHUB_ACTION_PATH}/../../../scripts" && pwd)"
        echo "SCRIPTS_DIR=${SCRIPTS_DIR}" >> "$GITHUB_ENV"

    - name: Collect reports
      id: collect
      shell: bash
      env:
        STEP: collect
        INPUT_DIR: ${{ inputs.input-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: $SCRIPTS_DIR/ci/actions/merge-playwright-reports.sh

    - name: Merge reports
      id: merge
      # With an expected matrix, zero reports is a failure the merge reports,
      # not a reason to skip it.
      if: steps.collect.outputs.report-count != '0' || inputs.expected-matrix != ''
      shell: bash
      env:
        STEP: merge
        INPUT_DIR: ${{ inputs.input-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        REPORT_FORMAT: ${{ inputs.report-format }}
        EXPECTED_MATRIX: ${{ inputs.expected-matrix }}
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        TEST_RESULT: ${{ inputs.test-result }}
      run: $SCRIPTS_DIR/ci/actions/merge-playwright-reports.sh

    - name: Parse merged results
      id: parse
      if: steps.merge.outputs.merged-path != ''
      shell: bash
      env:
        STEP: parse-merged
        MERGED_PATH: ${{ steps.merge.outputs.merged-path }}
      run: |
        $SCRIPTS_DIR/ci/actions/merge-playwright-reports.sh

    - name: Generate summary
      if: steps.collect.outputs.report-count != '0'
      shell: bash
      env:
        STEP: summary
        TOTAL_PASSED: ${{ steps.parse.outputs.total-passed }}
        TOTAL_FAILED: ${{ steps.parse.outputs.total-failed }}
        TOTAL_SKIPPED: ${{ steps.parse.outputs.total-skipped }}
        REPORT_COUNT: ${{ steps.collect.outputs.report-count }}
        UNPARSEABLE_COUNT: ${{ steps.merge.outputs.unparseable-count }}
      run: $SCRIPTS_DIR/ci/actions/merge-playwright-reports.sh

branding:
  icon: "layers"
  color: "green"
