---
name: "Run pytest"
description: "Run Python tests using pytest with coverage support"
author: "lgtm-hq"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"
  test-path:
    description: "Path to test files or directory"
    required: false
    default: "tests"
  coverage:
    description: "Whether to collect coverage (true/false)"
    required: false
    default: "false"
  coverage-format:
    description: "Coverage output format: xml, json, lcov"
    required: false
    default: "json"
  markers:
    description: 'pytest markers to filter tests (e.g., "not slow")'
    required: false
    default: ""
  extra-args:
    description: "Additional arguments to pass to pytest"
    required: false
    default: ""
  working-directory:
    description: "Working directory for running tests"
    required: false
    default: "."

outputs:
  exit-code:
    description: "Exit code from pytest"
    value: ${{ steps.run.outputs.exit-code }}
  tests-passed:
    description: "Number of tests passed"
    value: ${{ steps.parse.outputs.tests-passed }}
  tests-failed:
    description: "Number of tests failed"
    value: ${{ steps.parse.outputs.tests-failed }}
  tests-skipped:
    description: "Number of tests skipped"
    value: ${{ steps.parse.outputs.tests-skipped }}
  tests-total:
    description: "Total number of tests"
    value: ${{ steps.parse.outputs.tests-total }}
  coverage-file:
    description: "Path to coverage file"
    value: ${{ steps.run.outputs.coverage-file }}
  coverage-percent:
    description: "Coverage percentage"
    value: ${{ steps.parse.outputs.coverage-percent }}

runs:
  using: "composite"
  steps:
    # The steps below are setup-python's steps at its defaults, inlined
    # (#1469). A nested sibling needs either a self-repository ref
    # (unavailable on GHES and on self-hosted runners older than 2.336.0) or a
    # `./` ref (resolves against the caller's workspace, #1075). The logic
    # stays in setup-python.sh, reached through this action's own path.
    - name: Install uv
      # Pinned to SHA for supply chain security
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # Same pin as setup-python's uv-version default (test_tool_pins.bats).
        # renovate: datasource=pypi depName=uv
        version: "0.13.8"
        enable-cache: false

    - name: Get uv version
      id: uv-version
      shell: bash
      env:
        STEP: uv-version
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/setup-python.sh"

    - name: Setup Python
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: python-install
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/setup-python.sh"

    - name: Get Python version
      id: python-version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: python-version
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/setup-python.sh"

    - name: Cache uv dependencies
      id: cache
      # Pinned to SHA for supply chain security
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/uv
          ${{ inputs.working-directory }}/.venv
        # Same key as setup-python with its default cache-dependency-path
        # yamllint disable-line rule:line-length
        key: uv-${{ runner.os }}-${{ inputs.python-version }}-${{
          hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ inputs.python-version }}-
          uv-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: deps
        EXTRAS: ""
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/setup-python.sh"

    - name: Setup pytest
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: setup
        COVERAGE: ${{ inputs.coverage }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/run-pytest.sh"

    - name: Run pytest
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: run
        TEST_PATH: ${{ inputs.test-path }}
        COVERAGE: ${{ inputs.coverage }}
        COVERAGE_FORMAT: ${{ inputs.coverage-format }}
        MARKERS: ${{ inputs.markers }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/run-pytest.sh"
      continue-on-error: true

    - name: Parse results
      id: parse
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: parse
        RESULTS_FILE: pytest-results.json
        COVERAGE_FILE: ${{ steps.run.outputs.coverage-file }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/run-pytest.sh"

    - name: Generate summary
      shell: bash
      env:
        STEP: summary
        TESTS_PASSED: ${{ steps.parse.outputs.tests-passed }}
        TESTS_FAILED: ${{ steps.parse.outputs.tests-failed }}
        TESTS_SKIPPED: ${{ steps.parse.outputs.tests-skipped }}
        TESTS_TOTAL: ${{ steps.parse.outputs.tests-total }}
        COVERAGE_PERCENT: ${{ steps.parse.outputs.coverage-percent }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/run-pytest.sh"

    - name: Check test result
      if: steps.run.outputs.exit-code != '' && steps.run.outputs.exit-code != '0'
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/fail-with-exit-code.sh"

branding:
  icon: "check-circle"
  color: "yellow"
