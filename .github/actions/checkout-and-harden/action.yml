---
name: "Checkout and harden"
description: >-
  Shared reusable-workflow preamble: sparse-checkout lgtm-ci tooling into
  .lgtm-ci-tooling. This composite plays no part in egress enforcement: the
  direct step-security/harden-runner@<pinned SHA> step runs FIRST in the job
  and composes its allowlist from inputs and the workflow's literal preset
  map (#412/#420/#913); nothing a composite step produces can reach the
  action's pre hook. The repository checkout stays a separate workflow step
  before this action; a bootstrap sparse checkout of
  .github/actions/checkout-and-harden must precede it because the composite
  lives in lgtm-ci.
author: "lgtm-hq"

inputs:
  tooling-ref:
    description: >-
      Git ref (commit SHA) for the lgtm-ci tooling checkout. The calling
      reusable workflow resolves it as
      `inputs.tooling-ref || job.workflow_sha`; this composite never infers
      it from caller-owned context (#995).
    required: true
  tooling-repository:
    description: >-
      owner/repo of the lgtm-ci tooling source. The calling reusable
      workflow passes `job.workflow_repository`.
    required: false
    default: "lgtm-hq/lgtm-ci"
  tooling-ref-override:
    description: >-
      The caller's raw `inputs.tooling-ref`, passed through only so a
      non-empty value is warned about (#995); the value itself is already
      folded into `tooling-ref`.
    required: false
    default: ""
  tooling-ref-allow-divergence:
    description: >-
      GHES/mirror escape hatch only. By default a non-empty
      `tooling-ref-override` that checks out a commit other than
      `workflow-sha` fails the job (#1368); "true" downgrades that to a
      warning. Removing tooling-ref is the real fix (#995).
    required: false
    default: "false"
  workflow-sha:
    description: >-
      The calling reusable workflow's `job.workflow_sha`, compared with the
      checked-out tooling HEAD when `tooling-ref-override` is set (#1368).
      Empty (GHES) skips the comparison.
    required: false
    default: ""
  sparse-checkout-extra:
    description: >-
      Additional sparse-checkout paths (multiline) appended to the base egress
      tooling paths, e.g. scripts/ci/ or extra .github/actions/ composites.
    required: false
    default: ""
  persist-credentials:
    description: >-
      Ignored since #1451: the tooling checkout never persists its
      credential, so a tooling token cannot stay behind in the git config.
      Kept so existing callers that pass it still load.
    required: false
    default: "false"
  tooling-token:
    description: >-
      Read-only token for the tooling repository, used only for the tooling
      checkout. Empty (default) uses the job's github.token, which is enough
      unless the tooling repository is a private mirror (#1451).
    required: false
    default: ""

outputs:
  scripts-dir:
    description: "Absolute path to the checked-out lgtm-ci scripts directory"
    value: ${{ steps.paths.outputs['scripts-dir'] }}

runs:
  using: "composite"
  steps:
    # Required inputs still accept an empty string; an empty ref would make
    # actions/checkout take the tooling default branch (unpinned tooling, the
    # GHES-without-override case). Fail before any checkout instead.
    - name: Require a resolved tooling ref
      if: inputs.tooling-ref == ''
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/require-tooling-ref.sh"

    - name: Stage the tooling-ref divergence guard
      # On GHES the bootstrap checkout falls back to the override ref itself,
      # which may predate this script; an absent script skips the guard with a
      # notice instead of failing on an opaque cp error (#1368). The script
      # comes from the same bootstrap checkout as this file.
      id: stage-guard
      if: inputs.tooling-ref-override != ''
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/stage-tooling-ref-guard.sh"
      env:
        TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref-override }}

    # Re-checkout tooling with the full sparse set. The bootstrap workflow
    # checkout only materialises this action's directory; this step adds
    # scripts/ci/actions (and any sparse-checkout-extra paths) at the same ref.
    - name: Checkout lgtm-ci tooling
      # Pinned to SHA for supply chain security
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.tooling-repository }}
        path: .lgtm-ci-tooling
        ref: ${{ inputs.tooling-ref }}
        sparse-checkout: |
          .github/actions/checkout-and-harden
          scripts/ci/actions
          ${{ inputs.sparse-checkout-extra }}
        sparse-checkout-cone-mode: true
        # The only reader of the tooling token, and never persisted whatever
        # the other inputs say (validate-tooling-token.sh, #1451).
        token: ${{ inputs.tooling-token || github.token }}
        persist-credentials: false

    - name: Refuse a diverging tooling-ref
      # Runs the copy staged before the checkout: the checkout above rewrites
      # this composite's own directory to the override ref, which may predate
      # the script (#1368). The staging step decides whether a copy exists.
      if: inputs.tooling-ref-override != '' && steps.stage-guard.outputs.staged == 'true'
      shell: bash
      env:
        TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref-override }}
        WORKFLOW_SHA: ${{ inputs.workflow-sha }}
        ALLOW_DIVERGENCE: ${{ inputs.tooling-ref-allow-divergence }}
      run: bash "${RUNNER_TEMP}/check-tooling-ref-divergence.sh"

    - name: Warn on explicit tooling-ref override
      # A pre-#995 tooling-ref checks out the old composite (no warn step), so
      # this guard is defensive; it keeps the composite consistent with the
      # inline warn steps in the reusables that do not use it.
      if: >-
        inputs.tooling-ref-override != ''
        && hashFiles('.lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh') != ''
      shell: bash
      env:
        TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref-override }}
      run: bash .lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh

    - name: Resolve scripts directory
      id: paths
      shell: bash
      run: |
        echo "scripts-dir=${GITHUB_WORKSPACE}/.lgtm-ci-tooling/scripts" >>"${GITHUB_OUTPUT}"

branding:
  icon: "shield"
  color: "blue"
