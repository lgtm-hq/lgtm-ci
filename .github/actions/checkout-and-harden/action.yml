---
name: "Checkout and harden"
description: >-
  Shared reusable-workflow preamble: sparse-checkout lgtm-ci tooling into
  .lgtm-ci-tooling and resolve the egress allowlist. Callers must invoke
  step-security/harden-runner@<pinned SHA> as the next workflow step so the
  action's pre hook installs the egress agent (#412/#420). The repository
  checkout stays a separate workflow step before this action; a bootstrap
  sparse checkout of .github/actions/checkout-and-harden must precede it
  because the composite lives in lgtm-ci.
author: "lgtm-hq"

inputs:
  tooling-ref:
    description: >-
      Git ref (commit SHA) for the lgtm-ci tooling checkout. The calling
      reusable workflow resolves it as
      `inputs.tooling-ref || job.workflow_sha`; this composite never infers
      it from caller-owned context (#995).
    required: true
  tooling-repository:
    description: >-
      owner/repo of the lgtm-ci tooling source. The calling reusable
      workflow passes `job.workflow_repository`.
    required: false
    default: "lgtm-hq/lgtm-ci"
  tooling-ref-override:
    description: >-
      The caller's raw `inputs.tooling-ref`. Non-empty emits a deprecation
      warning; the value itself is already folded into `tooling-ref`.
    required: false
    default: ""
  egress-policy:
    description: "Egress policy: audit (log) or block (enforce allowlist)"
    required: false
    default: "block"
  egress-preset:
    description: >-
      Named baseline allowlist for block policy (github-minimal, github-pages,
      github-tooling, docker, playwright, pypi, rubygems, npm-publish, quality,
      osv-scanner, rust-release, sbom, scorecard)
    required: false
    default: ""
  allowed-endpoints:
    description: >-
      Host:port list (multiline). replace mode: overrides preset when
      non-empty; append mode: merged with preset (deduped)
    required: false
    default: ""
  allowed-endpoints-mode:
    description: "replace (override preset) or append (merge with preset, deduped)"
    required: false
    default: "replace"
  sparse-checkout-extra:
    description: >-
      Additional sparse-checkout paths (multiline) appended to the base egress
      tooling paths, e.g. scripts/ci/ or extra .github/actions/ composites.
    required: false
    default: ""
  persist-credentials:
    description: "Persist credentials on the tooling checkout"
    required: false
    default: "false"

outputs:
  allowed-endpoints:
    description: "Resolved allowlist for the following step-security/harden-runner step"
    value: ${{ steps.egress.outputs['allowed-endpoints'] }}
  scripts-dir:
    description: "Absolute path to the checked-out lgtm-ci scripts directory"
    value: ${{ steps.paths.outputs['scripts-dir'] }}

runs:
  using: "composite"
  steps:
    # Required inputs still accept an empty string; an empty ref would make
    # actions/checkout take the tooling default branch (unpinned tooling, the
    # GHES-without-override case). Fail before any checkout instead.
    - name: Require a resolved tooling ref
      if: inputs.tooling-ref == ''
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/require-tooling-ref.sh"

    # Re-checkout tooling with the full sparse set. The bootstrap workflow
    # checkout only materialises this action's directory; this step adds the
    # egress composites (and any sparse-checkout-extra paths) at the same ref.
    # harden-runner/ remains in the sparse set because resolve-egress-allowlist
    # loads resolve-egress-endpoints.sh from that sibling directory.
    - name: Checkout lgtm-ci tooling
      # Pinned to SHA for supply chain security
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.tooling-repository }}
        path: .lgtm-ci-tooling
        ref: ${{ inputs.tooling-ref }}
        sparse-checkout: |
          .github/actions/checkout-and-harden
          .github/actions/harden-runner
          .github/actions/resolve-egress-allowlist
          scripts/ci/actions
          ${{ inputs.sparse-checkout-extra }}
        sparse-checkout-cone-mode: true
        persist-credentials: ${{ inputs.persist-credentials }}

    - name: Warn on explicit tooling-ref override
      # A pre-#995 tooling-ref checks out the old composite (no warn step), so
      # this guard is defensive; it keeps the composite consistent with the
      # inline warn steps in the reusables that do not use it.
      if: >-
        inputs.tooling-ref-override != ''
        && hashFiles('.lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh') != ''
      shell: bash
      env:
        TOOLING_REF_OVERRIDE: ${{ inputs.tooling-ref-override }}
      run: bash .lgtm-ci-tooling/scripts/ci/actions/warn-tooling-ref-override.sh

    - name: Resolve egress allowlist
      id: egress
      uses: ./.lgtm-ci-tooling/.github/actions/resolve-egress-allowlist
      with:
        egress-policy: ${{ inputs.egress-policy }}
        egress-preset: ${{ inputs.egress-preset }}
        allowed-endpoints: ${{ inputs.allowed-endpoints }}
        allowed-endpoints-mode: ${{ inputs.allowed-endpoints-mode }}

    - name: Resolve scripts directory
      id: paths
      shell: bash
      run: |
        echo "scripts-dir=${GITHUB_WORKSPACE}/.lgtm-ci-tooling/scripts" >>"${GITHUB_OUTPUT}"

branding:
  icon: "shield"
  color: "blue"
