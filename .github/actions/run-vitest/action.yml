---
name: "Run vitest"
description: "Run JavaScript/TypeScript tests using vitest with coverage support"
author: "lgtm-hq"

inputs:
  package-manager:
    description: >-
      Package manager that owns the project: bun, npm, or pnpm. Required and
      never inferred from lockfiles (#181); it selects the toolchain setup,
      the frozen-lockfile install, and how vitest is executed (#1077).
    required: true
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  bun-version:
    description: "Bun version to install when package-manager is bun"
    required: false
    # renovate: datasource=npm depName=bun
    default: "1.4.2"
  install-dependencies:
    description: >-
      Run a frozen-lockfile install with the selected package manager before
      the tests (true/false). Set false when the caller already installed.
    required: false
    default: "true"
  test-path:
    description: "Path to test files or directory"
    required: false
    default: "."
  coverage:
    description: "Whether to collect coverage (true/false)"
    required: false
    default: "false"
  coverage-format:
    description: "Coverage output format: json, lcov, html"
    required: false
    default: "json"
  extra-args:
    description: "Additional arguments to pass to vitest"
    required: false
    default: ""
  working-directory:
    description: "Working directory for running tests"
    required: false
    default: "."

outputs:
  exit-code:
    description: "Exit code from vitest"
    value: ${{ steps.run.outputs.exit-code }}
  tests-passed:
    description: "Number of tests passed"
    value: ${{ steps.parse.outputs.tests-passed }}
  tests-failed:
    description: "Number of tests failed"
    value: ${{ steps.parse.outputs.tests-failed }}
  tests-skipped:
    description: "Number of tests skipped"
    value: ${{ steps.parse.outputs.tests-skipped }}
  tests-total:
    description: "Total number of tests"
    value: ${{ steps.parse.outputs.tests-total }}
  coverage-file:
    description: "Path to coverage file"
    value: ${{ steps.run.outputs.coverage-file }}
  coverage-percent:
    description: "Coverage percentage"
    value: ${{ steps.parse.outputs.coverage-percent }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      # Pinned to SHA for supply chain security
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      if: inputs.package-manager == 'bun'
      # Pinned to SHA for supply chain security
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup pnpm
      if: inputs.package-manager == 'pnpm'
      # Pinned to SHA for supply chain security. Reads the pnpm version from
      # the project's package.json `packageManager` field.
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FROZEN_LOCKFILE: "true"
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/setup-package-manager.sh"

    - name: Setup vitest
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: setup
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        COVERAGE: ${{ inputs.coverage }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/run-vitest.sh"

    - name: Run vitest
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: run
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        TEST_PATH: ${{ inputs.test-path }}
        COVERAGE: ${{ inputs.coverage }}
        COVERAGE_FORMAT: ${{ inputs.coverage-format }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/run-vitest.sh"
      continue-on-error: true

    - name: Parse results
      id: parse
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: parse
        RESULTS_FILE: vitest-results.json
        COVERAGE_FILE: ${{ steps.run.outputs.coverage-file }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/run-vitest.sh"

    - name: Generate summary
      shell: bash
      env:
        STEP: summary
        TESTS_PASSED: ${{ steps.parse.outputs.tests-passed }}
        TESTS_FAILED: ${{ steps.parse.outputs.tests-failed }}
        TESTS_SKIPPED: ${{ steps.parse.outputs.tests-skipped }}
        TESTS_TOTAL: ${{ steps.parse.outputs.tests-total }}
        COVERAGE_PERCENT: ${{ steps.parse.outputs.coverage-percent }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/run-vitest.sh"

    - name: Check test result
      if: steps.run.outputs.exit-code != '' && steps.run.outputs.exit-code != '0'
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/fail-with-exit-code.sh"

branding:
  icon: "check-circle"
  color: "green"
