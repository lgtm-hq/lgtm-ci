---
name: "Lintro Quality Checks"
description: "Run lintro via full ghcr.io/lgtm-hq/py-lintro image (all bundled tools)"
author: "lgtm-hq"

inputs:
  lintro-image:
    description: "Pinned ghcr.io/lgtm-hq/py-lintro image (digest strongly recommended)"
    required: true
    default: "ghcr.io/lgtm-hq/py-lintro@sha256:7dee215853bbd015ea0d1fc7622356f1abda259bf7b84031cc7872d5ef7f8b98"
  tools:
    description: "Comma-separated list of lintro tools to run (empty = all)"
    required: false
    default: ""
  mode:
    description: "Mode: check (lint only) or format (auto-fix)"
    required: false
    default: "check"
  fail-on-error:
    description: "Fail if linting errors found"
    required: false
    default: "true"
  working-directory:
    description: "Working directory for linting"
    required: false
    default: "."

outputs:
  exit-code:
    description: "Exit code from lintro"
    value: ${{ steps.lint.outputs.exit-code }}
  status:
    description: "Status: passed or failed"
    value: ${{ steps.lint.outputs.status }}
  timeout-flake:
    description: >-
      'true' only when this run's own report shows >=1 tool timed out and zero
      genuine issues anywhere. Fails closed: a missing or malformed report, a
      non-timeout tool failure, or any issue yields 'false'. Describes THIS run
      only — never use it to excuse another job's failure.
    value: ${{ steps.classify-timeout.outputs.timeout-flake }}
  timed-out-tools:
    description: "Comma-separated names of tools that timed out, '' when none"
    value: ${{ steps.classify-timeout.outputs.timed-out-tools }}

runs:
  using: "composite"
  steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Run lintro quality checks
      id: lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: ${{ inputs.mode }}
        TOOLS: ${{ inputs.tools }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        LINTRO_IMAGE: ${{ inputs.lintro-image }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/quality/run-lintro-docker.sh"

    # Classify THIS run's own report. Runs on failure too (always()) because a
    # timeout is exactly the case where the lint step exited non-zero. The
    # verdict is strictly advisory, so a missing report or an unexpected
    # classifier fault leaves the outputs empty — which every consumer
    # comparison (== 'true') already treats as fail-closed — rather than
    # changing the lint result. A composite action cannot use
    # continue-on-error, so the invocation absorbs its own failure instead.
    - name: Classify lint timeout
      id: classify-timeout
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT: .lintro/artifacts/json/results.json
      run: |
        python3 \
          "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/classify-lint-timeout.py" \
          --report "$REPORT" || echo "::warning::lint timeout classification failed"

branding:
  icon: "check-circle"
  color: "green"
