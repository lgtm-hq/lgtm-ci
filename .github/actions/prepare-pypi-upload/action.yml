---
name: "Prepare Python distribution for PyPI upload"
description: >-
  Download a workflow artifact, optionally validate with twine, and expose dist
  metadata for a caller-level pypa/gh-action-pypi-publish step. Run only from a
  job in the caller repository workflow (not from a cross-repo reusable
  workflow) with environment and id-token: write set on that job.
author: "lgtm-hq"
inputs:
  artifact-name:
    description: "Workflow artifact containing dist/"
    required: false
    default: "python-dist"
  working-directory:
    description: "Directory where dist/ is downloaded"
    required: false
    default: "."
  validate:
    description: "Run twine check before uploading"
    required: false
    default: "true"
  python-version:
    description: "Python version for twine validation (setup-python)"
    required: false
    default: "3.12"
  tooling-ref:
    description: >-
      lgtm-ci ref for setup-python (defaults to the ref of this action)
    required: false
    default: ""
  require-attestation:
    description: >-
      Verify a GitHub build-provenance attestation from the calling
      repository for every distribution file before exposing dist-path
      (release-security policy, section 2). The caller's upload step must
      be the last step of its job and must follow this action.
    required: false
    default: "true"
  signer-workflow:
    description: >-
      Optional workflow identity the attestation must have been signed by
      (`gh attestation verify --signer-workflow`), e.g.
      owner/repo/.github/workflows/publish.yml. Empty accepts any workflow
      of the calling repository.
    required: false
    default: ""

outputs:
  dist-path:
    description: "Directory containing distribution files (for packages-dir)"
    value: ${{ inputs.working-directory }}/dist
  validated:
    description: >-
      `true` when twine check passed, `skipped` when validate is disabled;
      validation failures abort the action before this output is set
    value: ${{ steps.set-validated.outputs.validated }}
  package-name:
    description: "Package name extracted from dist/ or pyproject.toml"
    value: ${{ steps.extract-metadata.outputs.name }}
  package-version:
    description: "Package version extracted from dist/ or pyproject.toml"
    value: ${{ steps.extract-metadata.outputs.version }}
  checksums-path:
    description: >-
      Workspace-relative path of the SHA256SUMS manifest, staged into
      <working-directory>/.lgtm-ci-sidecars/ (empty when the artifact
      carried none); never inside dist-path
    value: ${{ steps.stage-sidecars.outputs.checksums-path }}
  attestations-verified:
    description: >-
      Number of distribution files whose attestation verified, or empty when
      require-attestation is false
    value: ${{ steps.verify-attestations.outputs.attestations-verified }}

runs:
  using: "composite"
  steps:
    - name: Checkout lgtm-ci tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: lgtm-hq/lgtm-ci
        path: .lgtm-ci-tooling
        ref: ${{ inputs.tooling-ref != '' && inputs.tooling-ref || github.action_ref }}
        sparse-checkout: |
          .github/actions/
          scripts/ci/
        sparse-checkout-cone-mode: true
        persist-credentials: false

    - name: Resolve scripts directory
      shell: bash
      run: echo "SCRIPTS_DIR=${GITHUB_WORKSPACE}/.lgtm-ci-tooling/scripts" >> "$GITHUB_ENV"

    - name: Download Python distribution
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/dist

    - name: Stage sidecar files out of dist/
      id: stage-sidecars
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: stage-sidecars
        OUTPUT_PREFIX: ${{ inputs.working-directory }}
      run: "$SCRIPTS_DIR/ci/actions/python-dist.sh"

    - name: Setup Python
      uses: ./.lgtm-ci-tooling/.github/actions/setup-python
      with:
        python-version: ${{ inputs.python-version }}
        working-directory: ${{ inputs.working-directory }}
        install-dependencies: "false"

    - name: Validate distribution
      if: inputs.validate == 'true'
      shell: bash
      env:
        STEP: validate-dist
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        VALIDATE_STRICT: "true"
      run: "$SCRIPTS_DIR/ci/actions/python-dist.sh"

    - name: Set validated output
      id: set-validated
      shell: bash
      env:
        OUTPUT_NAME: validated
        CONDITION_VALUE: ${{ inputs.validate }}
        MATCH_VALUE: "true"
        TRUE_VALUE: "true"
        FALSE_VALUE: skipped
      run: "$SCRIPTS_DIR/ci/actions/set-conditional-output.sh"

    - name: Verify build attestations
      id: verify-attestations
      if: inputs.require-attestation == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
        STEP: verify-attestations
        SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
      run: "$SCRIPTS_DIR/ci/actions/python-dist.sh"

    - name: Extract package metadata
      id: extract-metadata
      shell: bash
      env:
        STEP: extract-dist-metadata
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: "$SCRIPTS_DIR/ci/actions/python-dist.sh"

branding:
  icon: "package"
  color: "blue"
