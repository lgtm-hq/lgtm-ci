---
name: "Run Playwright"
description: "Run E2E tests using Playwright"
author: "lgtm-hq"

inputs:
  package-manager:
    description: >-
      Package manager that owns the project: bun, npm, or pnpm. Required and
      never inferred from lockfiles (#181); it selects the toolchain setup,
      the frozen-lockfile install, and how Playwright is executed (#1077).
    required: true
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  bun-version:
    description: "Bun version to install when package-manager is bun"
    required: false
    # renovate: datasource=npm depName=bun
    default: "1.4.4"
  install-dependencies:
    description: >-
      Run a frozen-lockfile install with the selected package manager before
      the tests (true/false). Set false when the caller already installed.
    required: false
    default: "true"
  project:
    description: "Playwright project to run"
    required: false
    default: ""
  browser:
    description: "Browser to use: chromium, firefox, webkit, all"
    required: false
    default: "chromium"
  reporter:
    description: "Reporter to use: json, html, junit"
    required: false
    default: "json"
  shard:
    description: 'Shard configuration (e.g., "1/3" for shard 1 of 3)'
    required: false
    default: ""
  extra-args:
    description: "Additional arguments to pass to Playwright"
    required: false
    default: ""
  working-directory:
    description: "Working directory for running tests"
    required: false
    default: "."
  cache-browsers:
    description: >-
      Cache the Playwright browsers (true/false). The key carries the OS and
      its release, the architecture, the exact installed Playwright version,
      browser-install-mode and the browsers; there is no restore-keys
      fallback. On an exact hit the browser download is skipped (#1433).
      Every event restores; only a push to the default branch saves, and
      only browsers that pass the completeness check (#1659).
    required: false
    default: "true"
  system-deps:
    description: >-
      When to install the browsers' Linux system packages: if-missing (only
      when ldd reports a missing shared library of the installed browsers,
      or cannot tell) or always (every run, the default). ldd checks
      shared libraries only (not fonts or xvfb) and never vouches for WebKit; pick always when tests need
      Playwright's font packages. Ignored off Linux.
    required: false
    default: "always"
  browser-install-mode:
    description: >-
      full (default) installs the full browsers; headless-shell installs
      chromium's headless shell only (playwright install --only-shell,
      Playwright 1.49 or newer), which headed chromium runs cannot use.
    required: false
    default: "full"

outputs:
  exit-code:
    description: "Exit code from Playwright"
    value: ${{ steps.run.outputs.exit-code }}
  tests-passed:
    description: "Number of tests passed"
    value: ${{ steps.parse.outputs.tests-passed }}
  tests-failed:
    description: "Number of tests failed"
    value: ${{ steps.parse.outputs.tests-failed }}
  tests-skipped:
    description: "Number of tests skipped"
    value: ${{ steps.parse.outputs.tests-skipped }}
  tests-total:
    description: "Total number of tests"
    value: ${{ steps.parse.outputs.tests-total }}
  report-path:
    description: "Path to test report"
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Resolve scripts directory
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../../../scripts/ci/actions/export-action-scripts-dir.sh"

    - name: Setup Node.js
      # Pinned to SHA for supply chain security
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      if: inputs.package-manager == 'bun'
      # Pinned to SHA for supply chain security
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup pnpm
      if: inputs.package-manager == 'pnpm'
      # Pinned to SHA for supply chain security. Reads the pnpm version from
      # the project's package.json `packageManager` field.
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FROZEN_LOCKFILE: "true"
      run: $SCRIPTS_DIR/ci/actions/setup-package-manager.sh

    - name: Resolve Playwright browser cache key
      id: browser-cache-key
      if: inputs.cache-browsers == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: cache-key
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
        BROWSER_INSTALL_MODE: ${{ inputs.browser-install-mode }}
      run: $SCRIPTS_DIR/ci/actions/run-playwright.sh

    # Restore on every event, save only from a push to the default branch
    # (#1659). A composite step cannot carry timeout-minutes (the runner's
    # action schema has no such key); the caller's step that uses this action
    # (or its job) bounds both cache steps. A failed restore does not fail
    # the job, and the save never runs after it.
    - name: Restore Playwright browsers
      id: browser-cache
      if: steps.browser-cache-key.outputs.cache-key != ''
      continue-on-error: true
      # Pinned to SHA for supply chain security. Exact key only: a
      # restore-keys prefix could restore another version's browsers.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.browser-cache-key.outputs.cache-path }}
        key: ${{ steps.browser-cache-key.outputs.cache-key }}

    - name: Setup Playwright
      id: setup
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: setup
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
        BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        BROWSER_CACHE_PATH: ${{ steps.browser-cache-key.outputs.cache-path }}
        BROWSER_SYSTEM_DEPS: ${{ inputs.system-deps }}
        BROWSER_INSTALL_MODE: ${{ inputs.browser-install-mode }}
      run: $SCRIPTS_DIR/ci/actions/run-playwright.sh

    # Case-sensitive (#1659): expression `==` ignores case, so a push to a
    # branch `Main` would pass for a default branch `main`. The default
    # branch (the caller's push payload) reaches the script through env only;
    # empty or unknown gives false.
    - name: Check for a default-branch push
      id: default-branch-push
      if: steps.browser-cache-key.outputs.cache-key != ''
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: $SCRIPTS_DIR/ci/actions/default-branch-push.sh

    # Right after the install, before the tests, so a failing test still
    # saves good browsers. Only when the restore ran cleanly and missed, and
    # the install's completeness check passed on a directory that started
    # clean (browsers-ready). A failed save (another leg saved the same key
    # first) must not stop the tests.
    - name: Save Playwright browsers
      if: >-
        steps.default-branch-push.outputs.default-branch-push == 'true'
        && steps.browser-cache-key.outputs.cache-key != ''
        && steps.browser-cache.outcome == 'success'
        && steps.browser-cache.outputs.cache-hit != 'true'
        && steps.setup.outputs.browsers-ready == 'true'
      continue-on-error: true
      # Pinned to SHA for supply chain security
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.browser-cache-key.outputs.cache-path }}
        key: ${{ steps.browser-cache-key.outputs.cache-key }}

    - name: Run Playwright
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: run
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        PROJECT: ${{ inputs.project }}
        PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
        REPORTER: ${{ inputs.reporter }}
        SHARD: ${{ inputs.shard }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: $SCRIPTS_DIR/ci/actions/run-playwright.sh
      continue-on-error: true

    - name: Parse results
      id: parse
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: parse
        REPORT_PATH: ${{ steps.run.outputs.report-path }}
        REPORTER: ${{ inputs.reporter }}
      run: $SCRIPTS_DIR/ci/actions/run-playwright.sh

    - name: Generate summary
      shell: bash
      env:
        STEP: summary
        TESTS_PASSED: ${{ steps.parse.outputs.tests-passed }}
        TESTS_FAILED: ${{ steps.parse.outputs.tests-failed }}
        TESTS_SKIPPED: ${{ steps.parse.outputs.tests-skipped }}
        TESTS_TOTAL: ${{ steps.parse.outputs.tests-total }}
        PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
        SHARD: ${{ inputs.shard }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: $SCRIPTS_DIR/ci/actions/run-playwright.sh

    - name: Upload report
      # The run step's normalised reporter: ' HTML ' runs the HTML reporter.
      if: steps.run.outputs.reporter == 'html' && always()
      # Pinned to SHA for supply chain security
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report
        path: ${{ inputs.working-directory }}/playwright-report
        retention-days: 30

    - name: Check test result
      if: steps.run.outputs.exit-code != '' && steps.run.outputs.exit-code != '0'
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/actions/fail-with-exit-code.sh"

branding:
  icon: "monitor"
  color: "purple"
