---
name: "Run Playwright"
description: "Run E2E tests using Playwright"
author: "lgtm-hq"

inputs:
  package-manager:
    description: >-
      Package manager that owns the project: bun, npm, or pnpm. Required and
      never inferred from lockfiles (#181); it selects the toolchain setup,
      the frozen-lockfile install, and how Playwright is executed (#1077).
    required: true
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  bun-version:
    description: "Bun version to install when package-manager is bun"
    required: false
    # renovate: datasource=npm depName=bun
    default: "1.4.2"
  install-dependencies:
    description: >-
      Run a frozen-lockfile install with the selected package manager before
      the tests (true/false). Set false when the caller already installed.
    required: false
    default: "true"
  project:
    description: "Playwright project to run"
    required: false
    default: ""
  browser:
    description: "Browser to use: chromium, firefox, webkit, all"
    required: false
    default: "chromium"
  reporter:
    description: "Reporter to use: json, html, junit"
    required: false
    default: "json"
  shard:
    description: 'Shard configuration (e.g., "1/3" for shard 1 of 3)'
    required: false
    default: ""
  extra-args:
    description: "Additional arguments to pass to Playwright"
    required: false
    default: ""
  working-directory:
    description: "Working directory for running tests"
    required: false
    default: "."

outputs:
  exit-code:
    description: "Exit code from Playwright"
    value: ${{ steps.run.outputs.exit-code }}
  tests-passed:
    description: "Number of tests passed"
    value: ${{ steps.parse.outputs.tests-passed }}
  tests-failed:
    description: "Number of tests failed"
    value: ${{ steps.parse.outputs.tests-failed }}
  tests-skipped:
    description: "Number of tests skipped"
    value: ${{ steps.parse.outputs.tests-skipped }}
  tests-total:
    description: "Total number of tests"
    value: ${{ steps.parse.outputs.tests-total }}
  report-path:
    description: "Path to test report"
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Resolve scripts directory
      shell: bash
      run: |
        SCRIPTS_DIR="$(cd "${GITHUB_ACTION_PATH}/../../../scripts" && pwd)"
        echo "SCRIPTS_DIR=${SCRIPTS_DIR}" >> "$GITHUB_ENV"

    - name: Setup Node.js
      # Pinned to SHA for supply chain security
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      if: inputs.package-manager == 'bun'
      # Pinned to SHA for supply chain security
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup pnpm
      if: inputs.package-manager == 'pnpm'
      # Pinned to SHA for supply chain security. Reads the pnpm version from
      # the project's package.json `packageManager` field.
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FROZEN_LOCKFILE: "true"
      run: $SCRIPTS_DIR/ci/actions/setup-package-manager.sh

    - name: Setup Playwright
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: setup
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        BROWSER: ${{ inputs.browser }}
      run: $SCRIPTS_DIR/ci/actions/run-playwright.sh

    - name: Run Playwright
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: run
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        PROJECT: ${{ inputs.project }}
        BROWSER: ${{ inputs.browser }}
        REPORTER: ${{ inputs.reporter }}
        SHARD: ${{ inputs.shard }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: $SCRIPTS_DIR/ci/actions/run-playwright.sh
      continue-on-error: true

    - name: Parse results
      id: parse
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: parse
        REPORT_PATH: ${{ steps.run.outputs.report-path }}
        REPORTER: ${{ inputs.reporter }}
      run: $SCRIPTS_DIR/ci/actions/run-playwright.sh

    - name: Generate summary
      shell: bash
      env:
        STEP: summary
        TESTS_PASSED: ${{ steps.parse.outputs.tests-passed }}
        TESTS_FAILED: ${{ steps.parse.outputs.tests-failed }}
        TESTS_SKIPPED: ${{ steps.parse.outputs.tests-skipped }}
        TESTS_TOTAL: ${{ steps.parse.outputs.tests-total }}
        BROWSER: ${{ inputs.browser }}
        SHARD: ${{ inputs.shard }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: $SCRIPTS_DIR/ci/actions/run-playwright.sh

    - name: Upload report
      if: inputs.reporter == 'html' && always()
      # Pinned to SHA for supply chain security
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report
        path: ${{ inputs.working-directory }}/playwright-report
        retention-days: 30

    - name: Check test result
      if: steps.run.outputs.exit-code != '' && steps.run.outputs.exit-code != '0'
      shell: bash
      run: exit ${{ steps.run.outputs.exit-code }}

branding:
  icon: "monitor"
  color: "purple"
