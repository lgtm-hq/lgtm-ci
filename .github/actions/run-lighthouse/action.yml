---
name: "Run Lighthouse"
description: "Run Lighthouse CI audits with configurable thresholds"
author: "lgtm-hq"

inputs:
  url:
    description: "URL to audit"
    required: true
  package-manager:
    description: >-
      Package manager that owns the project: bun, npm, or pnpm. Required and
      never inferred from lockfiles (#181); it selects the toolchain setup,
      the frozen-lockfile install, and how @lhci/cli is executed (#1077).
    required: true
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  bun-version:
    description: "Bun version to install when package-manager is bun"
    required: false
    # renovate: datasource=npm depName=bun
    default: "1.4.2"
  install-dependencies:
    description: >-
      Run a frozen-lockfile install with the selected package manager before
      the audit (true/false). Set false when the caller already installed.
    required: false
    default: "true"
  config-path:
    description: "Path to lighthouserc.json config file"
    required: false
    default: ""
  output-dir:
    description: "Directory for Lighthouse results"
    required: false
    default: "lighthouse-reports"
  threshold-performance:
    description: "Minimum performance score (0-100)"
    required: false
    default: "80"
  threshold-accessibility:
    description: "Minimum accessibility score (0-100, error level)"
    required: false
    default: "90"
  threshold-best-practices:
    description: "Minimum best practices score (0-100)"
    required: false
    default: "80"
  threshold-seo:
    description: "Minimum SEO score (0-100)"
    required: false
    default: "80"
  extra-args:
    description: "Additional arguments to pass to LHCI"
    required: false
    default: ""
  working-directory:
    description: >-
      Project directory that holds @lhci/cli in its installed tree; output-dir
      and config-path are relative to it.
    required: false
    default: "."

outputs:
  performance:
    description: "Performance score (0-100)"
    value: ${{ steps.parse.outputs.performance }}
  accessibility:
    description: "Accessibility score (0-100)"
    value: ${{ steps.parse.outputs.accessibility }}
  best-practices:
    description: "Best practices score (0-100)"
    value: ${{ steps.parse.outputs.best-practices }}
  seo:
    description: "SEO score (0-100)"
    value: ${{ steps.parse.outputs.seo }}
  passed:
    description: "Whether all scores meet thresholds"
    value: ${{ steps.parse.outputs.passed }}
  failed-categories:
    description: "Comma-separated list of failed categories"
    value: ${{ steps.parse.outputs.failed-categories }}
  # The run step writes both paths relative to working-directory, so a
  # relative value is re-based here for callers that resolve it from the
  # workspace root; an absolute output-dir passes through untouched.
  results-path:
    description: "Path to results JSON file (workspace-relative, or absolute as given)"
    value: >-
      ${{ inputs.working-directory != '.' && steps.run.outputs.results-path != ''
      && !startsWith(steps.run.outputs.results-path, '/')
      && format('{0}/{1}', inputs.working-directory, steps.run.outputs.results-path)
      || steps.run.outputs.results-path }}
  output-dir:
    description: "Directory containing all results (workspace-relative, or absolute as given)"
    value: >-
      ${{ inputs.working-directory != '.' && steps.run.outputs.output-dir != ''
      && !startsWith(steps.run.outputs.output-dir, '/')
      && format('{0}/{1}', inputs.working-directory, steps.run.outputs.output-dir)
      || steps.run.outputs.output-dir }}

runs:
  using: "composite"
  steps:
    - name: Resolve scripts directory
      shell: bash
      run: |
        SCRIPTS_DIR="$(cd "${GITHUB_ACTION_PATH}/../../../scripts" && pwd)"
        echo "SCRIPTS_DIR=${SCRIPTS_DIR}" >> "$GITHUB_ENV"

    - name: Setup Node.js
      # Pinned to SHA for supply chain security
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      if: inputs.package-manager == 'bun'
      # Pinned to SHA for supply chain security
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup pnpm
      if: inputs.package-manager == 'pnpm'
      # Pinned to SHA for supply chain security. Reads the pnpm version from
      # the project's package.json `packageManager` field.
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FROZEN_LOCKFILE: "true"
      run: $SCRIPTS_DIR/ci/actions/setup-package-manager.sh

    - name: Setup Lighthouse CI
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: setup
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: $SCRIPTS_DIR/ci/actions/run-lighthouse.sh

    - name: Run Lighthouse
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: run
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        URL: ${{ inputs.url }}
        CONFIG_PATH: ${{ inputs.config-path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: $SCRIPTS_DIR/ci/actions/run-lighthouse.sh
      continue-on-error: true

    - name: Parse results
      id: parse
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STEP: parse
        RESULTS_PATH: ${{ steps.run.outputs.results-path }}
        RUN_MARKER: ${{ steps.run.outputs.run-marker }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        THRESHOLD_PERFORMANCE: ${{ inputs.threshold-performance }}
        THRESHOLD_ACCESSIBILITY: ${{ inputs.threshold-accessibility }}
        THRESHOLD_BEST_PRACTICES: ${{ inputs.threshold-best-practices }}
        THRESHOLD_SEO: ${{ inputs.threshold-seo }}
      run: $SCRIPTS_DIR/ci/actions/run-lighthouse.sh

    - name: Generate summary
      shell: bash
      env:
        STEP: summary
        PERFORMANCE: ${{ steps.parse.outputs.performance }}
        ACCESSIBILITY: ${{ steps.parse.outputs.accessibility }}
        BEST_PRACTICES: ${{ steps.parse.outputs.best-practices }}
        SEO: ${{ steps.parse.outputs.seo }}
        PASSED: ${{ steps.parse.outputs.passed }}
        THRESHOLD_PERFORMANCE: ${{ inputs.threshold-performance }}
        THRESHOLD_ACCESSIBILITY: ${{ inputs.threshold-accessibility }}
        THRESHOLD_BEST_PRACTICES: ${{ inputs.threshold-best-practices }}
        THRESHOLD_SEO: ${{ inputs.threshold-seo }}
      run: $SCRIPTS_DIR/ci/actions/run-lighthouse.sh

    - name: Upload results
      if: always()
      # Pinned to SHA for supply chain security
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lighthouse-reports
        path: >-
          ${{ startsWith(inputs.output-dir, '/') && inputs.output-dir
          || format('{0}/{1}', inputs.working-directory, inputs.output-dir) }}
        retention-days: 30
        if-no-files-found: ignore

    - name: Check result
      # Thresholds below target, no fresh report, or a non-zero lhci exit
      # (e.g. a failed assertion in the consumer's lighthouserc) all fail.
      if: >-
        steps.parse.outputs.passed == 'false'
        || (steps.run.outputs.exit-code != '' && steps.run.outputs.exit-code != '0')
      shell: bash
      env:
        FAILED_CATS: ${{ steps.parse.outputs.failed-categories }}
        LHCI_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        PASSED: ${{ steps.parse.outputs.passed }}
      run: |
        if [[ "$PASSED" == "false" ]]; then
          echo "::error::Lighthouse audit failed. Categories below threshold: $FAILED_CATS"
        fi
        if [[ -n "$LHCI_EXIT_CODE" && "$LHCI_EXIT_CODE" != "0" ]]; then
          echo "::error::Lighthouse CI exited with code $LHCI_EXIT_CODE"
        fi
        exit 1

branding:
  icon: "zap"
  color: "orange"
