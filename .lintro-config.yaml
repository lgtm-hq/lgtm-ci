---
# lgtm-ci Lintro Configuration
# See: https://github.com/lgtm-hq/py-lintro

# Execution settings
execution:
  enabled_tools: [] # empty = all tools
  tool_order: "priority"
  fail_fast: false
  parallel: true
  max_workers: 4
  exclude:
    - ".lintro/"
    - ".venv/"
    - "node_modules/"

# Cross-cutting enforcement settings
enforce:
  line_length: 100

# Default configurations for tools without native config files
defaults:
  # Lintro < 0.173.4 hid a prettier execution error (conflicting --no-config
  # and --config flags), so these defaults were never applied and the tree was
  # formatted with Prettier's own defaults (#1361). They now apply for real:
  # the repo has no JS/TS, so semi/singleQuote only reached YAML, where
  # singleQuote would requote every value that the Renovate regex managers and
  # contract tests match in double quotes; and markdown is hand-wrapped to
  # markdownlint's 100 columns, so prose is preserved rather than rewrapped.
  prettier:
    tabWidth: 2
    proseWrap: "preserve"

  yamllint:
    extends: "default"
    rules:
      line-length:
        max: 120
        level: warning
      document-start: disable
      truthy:
        allowed-values: ["true", "false", "on", "off", "yes", "no"]
      comments:
        min-spaces-from-content: 1

  hadolint:
    ignored: []
    trusted_registries:
      - docker.io
      - ghcr.io

# All tools enabled by default
tools:
  actionlint:
    enabled: true
  hadolint:
    enabled: true
  yamllint:
    enabled: true
  markdownlint:
    enabled: true
  prettier:
    enabled: true
  shellcheck:
    enabled: true
  shfmt:
    enabled: true
  ruff:
    enabled: true
  black:
    enabled: true
  bandit:
    enabled: true
  mypy:
    enabled: true
  pytest:
    enabled: false
  bats:
    enabled: true
    path: "tests/bats"
