---
# lgtm-ci Lintro Configuration
# See: https://github.com/lgtm-hq/py-lintro

# Execution settings
execution:
  enabled_tools: [] # empty = all tools
  tool_order: "priority"
  fail_fast: false
  parallel: true
  max_workers: 4
  exclude:
    - ".lintro/"
    - ".venv/"
    - "node_modules/"

# Cross-cutting enforcement settings
enforce:
  line_length: 100

# Default configurations for tools without native config files
defaults:
  prettier:
    semi: false
    singleQuote: true
    tabWidth: 2
    proseWrap: "always"

  yamllint:
    extends: "default"
    rules:
      line-length:
        max: 120
        level: warning
      document-start: disable
      truthy:
        allowed-values: ["true", "false", "on", "off", "yes", "no"]
      comments:
        min-spaces-from-content: 1

  hadolint:
    ignored: []
    trusted_registries:
      - docker.io
      - ghcr.io

# All tools enabled by default
tools:
  actionlint:
    enabled: true
  hadolint:
    enabled: true
  yamllint:
    enabled: true
  markdownlint:
    enabled: true
  prettier:
    enabled: true
  shellcheck:
    enabled: true
  shfmt:
    enabled: true
  ruff:
    enabled: true
  black:
    enabled: true
  bandit:
    enabled: true
  mypy:
    enabled: true
  pytest:
    enabled: false
  bats:
    enabled: true
    path: "tests/bats"

# AI review (#888 pilot): the reusable ai-review workflow forces ai.enabled
# via LINTRO_AI_ENABLED, but ai.review has no env override in lintro's
# LINTRO_AI_* surface, so it must be enabled here. Provider/transport come
# from the LINTRO_AI_PROVIDER / LINTRO_AI_TRANSPORT Actions variables.
ai:
  review: true
