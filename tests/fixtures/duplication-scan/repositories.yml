# SPDX-License-Identifier: MIT
# In-memory fixture repositories: never contacted through GitHub.
# Use known data commands for parameter-only copies; API operations stay opaque.
repositories:
  - full_name: lgtm-hq/alpha
    private: false
    files:
      .github/workflows/ci.yml: |
        jobs:
          publish:
            runs-on: ubuntu-26.04
            steps:
              - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # pin
              - uses: actions/setup-python@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                with:
                  python-version: '3.13'
              - run: echo build --outdir dist/alpha --image ghcr.io/lgtm-hq/alpha:1.0
          local:
            runs-on: ubuntu-26.04
            steps:
              - run: theme-sync --product-special
      scripts/sweep.sh: |
        #!/usr/bin/env bash
        # A tiny shared maintenance script still qualifies.
        set -eu
        cat ./reports/alpha/packages.json
  - full_name: lgtm-hq/beta
    private: false
    files:
      .github/workflows/release.yaml: |
        jobs:
          ship:
            runs-on: ubuntu-26.04
            steps:
              - uses: actions/checkout@cccccccccccccccccccccccccccccccccccccccc
              - uses: actions/setup-python@dddddddddddddddddddddddddddddddddddddddd
                with:
                  python-version: '3.14'
              - run: echo build --outdir dist/beta --image ghcr.io/lgtm-hq/beta:2.0
      .github/scripts/cleanup.sh: |
        #!/usr/bin/env bash
        set -eu
        cat ./reports/beta/packages.json
  - full_name: lgtm-hq/private-project
    private: true
    files:
      .github/workflows/internal.yml: |
        jobs:
          SECRET_JOB_CANARY:
            runs-on: ubuntu-26.04
            steps:
              - uses: actions/checkout@eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
              - uses: actions/setup-python@ffffffffffffffffffffffffffffffffffffffff
                with:
                  python-version: SECRET_INPUT_CANARY
              - run: echo build --outdir secret/SECRET_SOURCE_CANARY --image ghcr.io/lgtm-hq/private-project:3.0
