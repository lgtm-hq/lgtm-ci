<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Playwright Test Report</title>
  </head>
  <body>
    <!--
      Stand-in for the single-file HTML report Playwright writes to
      playwright-report/index.html (the real file inlines ~500 KB of assets).
      lgtm-ci never parses this file: metrics come from the JSON sidecar next
      to this directory, and the run step only asserts the directory exists.
    -->
    <h1>Playwright Test Report</h1>
    <p>2 tests: 1 passed, 1 skipped.</p>
  </body>
</html>
